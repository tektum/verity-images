name: Publish image
description: Scan, test, sign, attest, and promote one container image.

inputs:
  image-name:
    description: Published image name.
    required: true
  track:
    description: Image track, wolfi or patched.
    required: true
  candidate-image:
    description: Local daemon image before the architecture suffix.
    required: true
  upstream-image:
    description: Local upstream image before the architecture suffix for patched-track deltas.
    default: ""
  target-repository:
    description: Fully qualified GHCR repository.
    required: true
  platforms:
    description: Comma-separated target platforms.
    required: true
  version:
    description: Version tag to publish.
    required: true
  application-version:
    description: Upstream application version expected by the smoke test.
    required: true
  tag-version:
    description: Flavor-qualified version used in reports and artifacts.
    required: true
  flavor:
    description: Build flavor; plain has no tag suffix.
    default: plain
  major:
    description: Optional major-version tag.
    default: ""
  publish-latest:
    description: Move the latest tag when true.
    default: "false"
  context:
    description: Image source directory.
    required: true
  build-directory:
    description: Directory containing build evidence and generated packages.
    required: true
  sbom-directory:
    description: Directory containing native SPDX JSON files.
    required: true
  evidence-file:
    description: Exact resolved build input used for the candidate.
    required: true
  publish:
    description: Push, sign, attest, and tag when true.
    default: "false"
  registry-username:
    description: GHCR username.
    default: ""
  registry-password:
    description: GITHUB_TOKEN supplied by the caller.
    default: ""

outputs:
  digest:
    description: Published multi-architecture digest.
    value: ${{ steps.result.outputs.digest }}
  tags:
    description: Published tags separated by commas.
    value: ${{ steps.result.outputs.tags }}
  scan-summary:
    description: Vulnerability counts by severity as compact JSON.
    value: ${{ steps.gate.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Scan amd64 candidate
      shell: bash
      env:
        IMAGE: ${{ inputs.candidate-image }}-amd64
      run: grype "docker:${IMAGE}" --output json --file scan-${{ inputs.image-name }}-amd64.json

    - name: Scan arm64 candidate
      shell: bash
      env:
        IMAGE: ${{ inputs.candidate-image }}-arm64
      run: grype "docker:${IMAGE}" --output json --file scan-${{ inputs.image-name }}-arm64.json

    - name: Scan amd64 upstream
      if: inputs.track == 'patched'
      shell: bash
      env:
        IMAGE: ${{ inputs.upstream-image }}-amd64
      run: grype "docker:${IMAGE}" --output json --file scan-${{ inputs.image-name }}-upstream-amd64.json

    - name: Scan arm64 upstream
      if: inputs.track == 'patched'
      shell: bash
      env:
        IMAGE: ${{ inputs.upstream-image }}-arm64
      run: grype "docker:${IMAGE}" --output json --file scan-${{ inputs.image-name }}-upstream-arm64.json

    - name: Evaluate vulnerability gate
      id: gate
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        TRACK: ${{ inputs.track }}
      run: scripts/evaluate_scan_gate.sh "$IMAGE_NAME" "$TRACK" "$GITHUB_OUTPUT"

    - name: Run smoke test
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-image }}
        FLAVOR: ${{ inputs.flavor }}
        IMAGE_VERSION: ${{ inputs.application-version }}
        TEST: ${{ inputs.context }}/tests/test.sh
      run: |
        for arch in amd64 arm64; do
          "$TEST" "${CANDIDATE}-${arch}" "$FLAVOR"
        done

    - name: Log in to GHCR
      if: inputs.publish == 'true'
      uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4.5.2
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Push candidate under transport tags
      if: inputs.publish == 'true'
      id: push
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate-image }}
        FLAVOR: ${{ inputs.flavor }}
        TARGET: ${{ inputs.target-repository }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        transport="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${VERSION//./-}-${FLAVOR}"
        references=()
        for arch in amd64 arm64; do
          docker tag "${CANDIDATE}-${arch}" "${TARGET}:${transport}-${arch}"
          pushed=$(docker push "${TARGET}:${transport}-${arch}")
          digest=$(printf '%s\n' "$pushed" | scripts/parse_push_digest.sh)
          references+=("${TARGET}@${digest}")
        done
        docker manifest create "${TARGET}:${transport}" \
          "${references[@]}"
        docker manifest annotate "${TARGET}:${transport}" \
          "${references[1]}" --arch arm64
        docker manifest push --purge "${TARGET}:${transport}"
        raw=$(docker buildx imagetools inspect "${TARGET}:${transport}" --raw)
        digest="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
        docker buildx imagetools inspect "${TARGET}@${digest}" >/dev/null
        printf 'digest=%s\ntransport=%s\n' "$digest" "$transport" >> "$GITHUB_OUTPUT"

    - name: Generate patched index SPDX SBOM
      if: inputs.publish == 'true' && inputs.track == 'patched'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        SBOM: ${{ inputs.sbom-directory }}/sbom-index.spdx.json
        TARGET: ${{ inputs.target-repository }}
      run: syft "registry:${TARGET}@${DIGEST}" -o "spdx-json=${SBOM}"

    - name: Upload scan and build evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: scan-${{ inputs.image-name }}-${{ inputs.tag-version }}
        path: |
          scan-${{ inputs.image-name }}-*.json
          ${{ inputs.evidence-file }}
          ${{ inputs.sbom-directory }}/*.spdx.json
          ${{ inputs.context }}/melange.yaml
          ${{ inputs.context }}/*.env
          ${{ inputs.context }}/source.yaml
          ${{ inputs.build-directory }}/packages/**/*.attest.tar.gz
          ${{ inputs.build-directory }}/packages/**/*-build-metadata-*.apk
          ${{ inputs.build-directory }}/trivy-*.json
        if-no-files-found: error

    - name: Install cosign
      if: inputs.publish == 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

    - name: Sign digest and attach platform SPDX SBOMs
      if: inputs.publish == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        SBOM_DIRECTORY: ${{ inputs.sbom-directory }}
        TARGET: ${{ inputs.target-repository }}
      run: |
        set -euo pipefail
        scripts/attest_sboms.sh "$TARGET" "$DIGEST" "$SBOM_DIRECTORY"

    - name: Verify published signature and SPDX SBOM
      if: inputs.publish == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        TARGET: ${{ inputs.target-repository }}
      run: |
        set -euo pipefail
        identity='https://github.com/tektum/verity-images/.github/workflows/build.yaml@refs/heads/main'
        issuer='https://token.actions.githubusercontent.com'
        cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" \
          --certificate-github-workflow-sha "$GITHUB_SHA" "${TARGET}@${DIGEST}" >/dev/null
        cosign verify-attestation --type spdxjson --certificate-identity "$identity" \
          --certificate-oidc-issuer "$issuer" --certificate-github-workflow-sha "$GITHUB_SHA" \
          "${TARGET}@${DIGEST}" >/dev/null

    - name: Attach build provenance
      if: inputs.publish == 'true'
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
      with:
        subject-name: ${{ inputs.target-repository }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Promote release tags
      if: inputs.publish == 'true'
      id: promote
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        FLAVOR: ${{ inputs.flavor }}
        MAJOR: ${{ inputs.major }}
        TARGET: ${{ inputs.target-repository }}
        VERSION: ${{ inputs.version }}
        PUBLISH_LATEST: ${{ inputs.publish-latest }}
      run: |
        set -euo pipefail
        suffix=""
        [[ "$FLAVOR" == plain ]] || suffix="-${FLAVOR}"
        tags=("${VERSION}${suffix}")
        if [[ -n "$MAJOR" ]]; then
          tags=("${MAJOR}${suffix}" "${tags[@]}")
        else
          tags+=("${VERSION}-$(date -u +%Y%m%d)${suffix}")
        fi
        if [[ "$PUBLISH_LATEST" == true && "${VERSION}${suffix}" != "latest${suffix}" ]]; then
          tags+=("latest${suffix}")
        fi
        for tag in "${tags[@]}"; do
          docker buildx imagetools create --tag "${TARGET}:${tag}" "${TARGET}@${DIGEST}"
          actual=$(docker buildx imagetools inspect "${TARGET}:${tag}" --raw |
            sha256sum | cut -d' ' -f1)
          [[ "sha256:${actual}" == "$DIGEST" ]]
        done
        printf 'tags=%s\n' "$(IFS=,; echo "${tags[*]}")" >> "$GITHUB_OUTPUT"

    - name: Emit outputs
      id: result
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
        PUBLISH: ${{ inputs.publish }}
        TAGS: ${{ steps.promote.outputs.tags }}
      run: |
        if [[ "$PUBLISH" == true ]]; then
          printf 'digest=%s\ntags=%s\n' "$DIGEST" "$TAGS" >> "$GITHUB_OUTPUT"
        else
          printf 'digest=local\ntags=\n' >> "$GITHUB_OUTPUT"
        fi
