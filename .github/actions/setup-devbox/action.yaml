name: Set up locked Devbox
description: Install checksum-verified Nix and Devbox binaries.

runs:
  using: composite
  steps:
    - name: Install verified Nix 3.21.8
      shell: bash
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/DeterminateSystems/nix-installer/releases/download/v3.21.8/nix-installer-x86_64-linux \
          --output /tmp/nix-installer
        printf '%s  %s\n' \
          eecf66f62b044f40b0632d8e9ea72ffc3bd3214357d09317117febff748e71b3 \
          /tmp/nix-installer | sha256sum --check
        chmod +x /tmp/nix-installer
        /tmp/nix-installer install --no-confirm --diagnostic-endpoint ""

    - name: Install verified Devbox 0.17.5
      shell: bash
      run: |
        DEVBOX_BIN_DIR="$HOME/.local/bin" scripts/devbox.sh version
        printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
