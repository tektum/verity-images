name: APK signing smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  sign-and-verify:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/runner=4cpu-linux-x64
    environment: apk-signing
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Sign and verify a disposable message
        shell: bash
        env:
          APK_REPOSITORY_PRIVATE_KEY: ${{ secrets.APK_REPOSITORY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work_dir=$(mktemp -d)
          private_key_source="$work_dir/verity-apk-2026.source.pem"
          private_key="$work_dir/verity-apk-2026.rsa"
          message="$work_dir/message"
          signature="$work_dir/message.sig"
          cleanup() {
            rm -rf "$work_dir"
          }
          trap cleanup EXIT HUP INT TERM

          printf 'verity APK signing smoke\n' > "$message"
          set +x
          printf '%s' "$APK_REPOSITORY_PRIVATE_KEY" > "$private_key_source"
          unset APK_REPOSITORY_PRIVATE_KEY
          .github/scripts/prepare-apk-signing-key.sh "$private_key_source" "$private_key" \
            packages/keys/verity-apk-2026.rsa.pub
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$message"
          expected_fingerprint=764c84bdcf9ca8530146da9976d4cac4b37ba961ad258d589e9a11fb05206698
          actual_fingerprint=$(openssl pkey -pubin \
            -in packages/keys/verity-apk-2026.rsa.pub -pubout -outform DER | sha256sum | awk '{print $1}')
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            printf '::error title=Fingerprint mismatch::Public key fingerprint does not match the approved root.\n'
            exit 1
          fi
          openssl dgst -sha256 -verify packages/keys/verity-apk-2026.rsa.pub \
            -signature "$signature" "$message"
          rm -f "$private_key"
          scan_status=0
          grep -r -l --binary-files=text --exclude-dir=.git -- \
            '[-][-][-][-][-]BEGIN .*PRIVATE KEY[-][-][-][-][-]' . "$work_dir" >/dev/null || scan_status=$?
          case "$scan_status" in
            0)
              printf '::error title=Private key leak::Private key material found in safe outputs.\n'
              exit 1
              ;;
            1) ;;
            *)
              printf '::error title=Private key scan failed::Unable to scan safe outputs.\n'
              exit "$scan_status"
              ;;
          esac
