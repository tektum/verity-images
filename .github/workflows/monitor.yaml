name: Monitor published images

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor-published-images
  cancel-in-progress: false

env:
  GRYPE_VERSION: 0.115.0
  GRYPE_SHA256: 3fad92940650e514c0aa2dad83526942a055e210cec09a8a59d9c024adc2b90e

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Grype
        run: scripts/install_image_tools.sh monitor

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Fetch published catalog
        run: curl -fsSL https://tektum.github.io/verity-images/catalog.json -o catalog.json

      - name: Generate expected image inventory
        run: python3 scripts/gen_matrix.py --all > expected-images.json

      - name: Scan verified SBOMs and reconcile issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/monitor_sboms.sh catalog.json expected-images.json
