name: Monitor published images

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Versioned Squawk finding payload.
        required: true
        type: string

permissions: {}

# Distinct findings run independently. A duplicate delivery id is serialized so two
# read-then-create reconciliations cannot race and create duplicate issues.
concurrency:
  group: monitor-${{ fromJSON(inputs.payload).delivery_id }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-monitor/runner=4cpu-linux-x64
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile Squawk delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SQUAWK_PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$SQUAWK_PAYLOAD" > squawk-payload.json
          scripts/monitor_sboms.sh squawk-payload.json
