name: Monitor published images

# Re-evaluates every published image against the current vulnerability
# database. Each shard verifies the attested per-platform SPDX SBOMs it owns,
# scans them with Grype, and publishes its own code scanning category. One final
# job updates the pinned Image Dashboard only after a complete coherent sweep.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor-published-images
  cancel-in-progress: false

env:
  GRYPE_VERSION: 0.116.1
  GRYPE_SHA256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458
  IMAGE_DASHBOARD_ISSUE: "1091"

jobs:
  snapshot:
    if: github.repository == 'tektum/verity-images'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up validated jq runtime
        uses: ./.github/actions/setup-jq

      - name: Capture published catalog
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/verity-tools:$PATH"
          status=$(curl --silent --show-error --location --output catalog.json \
            --write-out '%{http_code}' https://tektum.github.io/verity-images/catalog.json)
          if [[ "$status" != 200 ]]; then
            printf '::error title=Catalog unavailable::Current catalog returned HTTP %s.\n' "$status"
            exit 1
          fi
          python3 scripts/gen_matrix.py --all > expected-images.json
          jq -e --slurp '
            ([.[0].images[] | [.name, .version]] | sort) ==
            ([.[1].include[] | [.name, .tag_version]] | sort)
          ' catalog.json expected-images.json >/dev/null

      - name: Upload immutable monitor inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: monitor-input
          path: |
            catalog.json
            expected-images.json
          if-no-files-found: error

  monitor:
    needs: snapshot
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-monitor-${{ matrix.shard }}/runner=4cpu-linux-x64
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable monitor inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: monitor-input

      - name: Set up validated jq runtime
        uses: ./.github/actions/setup-jq

      - name: Install pinned Grype
        run: scripts/install_image_tools.sh monitor

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Scan published SBOMs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          export PATH="$RUNNER_TEMP/verity-tools:$PATH"
          scripts/monitor_sboms.sh catalog.json expected-images.json "$SHARD" "$SHARDS" monitor

      - name: Build code scanning results
        run: |
          python3 scripts/build_monitor_sarif.py monitor/manifest.json \
            monitor/results.sarif monitor/report.json

      - name: Summarize shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          export PATH="$RUNNER_TEMP/verity-tools:$PATH"
          {
            printf '### Monitor shard %s\n\n' "$SHARD"
            jq -r '
              "- Catalog `\(.catalog.publishedAt)` from commit `\(.catalog.source.commit)`",
              "- Vulnerability database built `\(.grype.db.built // "unknown")`",
              "- Images: \(.totals.subjects) across \(.totals.platforms) platform SBOMs",
              "- Findings now: \(.totals.monitored)",
              "- Findings at publication: \(.totals.published)",
              "- Fixable findings: \(.totals.fixable)",
              "- Code scanning results: \(.totals.results)"
            ' monitor/report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload code scanning results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: monitor/results.sarif
          category: verity-monitor-${{ matrix.shard }}

      - name: Upload dashboard shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: monitor-${{ matrix.shard }}
          path: monitor/report.json
          if-no-files-found: error

      - name: Upload monitor evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: monitor-evidence-${{ matrix.shard }}
          path: |
            monitor/manifest.json
            monitor/report.json
            monitor/results.sarif
            monitor/scan-*.json
          if-no-files-found: error

  dashboard:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.snapshot.result == 'success' && needs.monitor.result == 'success'
    needs: [snapshot, monitor]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download complete shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: monitor-[0-7]
          path: dashboard-input

      - name: Build Image Dashboard
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/build_image_dashboard.py dashboard-input "$REPOSITORY" \
            "$RUN_ID" "$RUN_ATTEMPT" image-dashboard.md image-dashboard.json

      - name: Update pinned Image Dashboard
        env:
          DASHBOARD_ISSUE: ${{ env.IMAGE_DASHBOARD_ISSUE }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/issues/${DASHBOARD_ISSUE}" > dashboard-issue.json
          jq -e '
            .title == "Image Dashboard" and
            .state == "open" and
            (.body | startswith("<!-- verity-image-dashboard/v1 -->"))
          ' dashboard-issue.json >/dev/null
          jq -r .body dashboard-issue.json > current-dashboard.md
          if ! cmp -s current-dashboard.md image-dashboard.md; then
            gh issue edit "$DASHBOARD_ISSUE" --repo "$REPOSITORY" \
              --body-file image-dashboard.md
          fi

      - name: Dispatch vulnerability remediation rebuilds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: scripts/dispatch_vulnerability_rebuilds.sh image-dashboard.json

      - name: Upload dashboard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-dashboard
          path: |
            image-dashboard.md
            image-dashboard.json
          if-no-files-found: error
