name: Update Renovate Go remediation locks

# This privileged follow-up executes only trusted default-branch code. It treats
# captures from the preceding unprivileged workflow as inert data.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Capture Renovate Go remediation scans]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-go-remediation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update reviewed remediation locks
        env:
          ARTIFACT: go-remediation-captures-${{ github.event.workflow_run.head_sha }}
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trusted="$work/trusted"
          artifact="$work/artifact"
          mkdir -p "$trusted"
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "$ARTIFACT" --dir "$artifact"
          page=1
          changed_files='[]'
          while :; do
            response=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100&page=${page}")
            changed_files=$(jq -c --argjson page "$response" '. + [$page[].filename]' <<<"$changed_files")
            (($(jq length <<<"$response") == 100)) || break
            ((page += 1))
          done
          mapfile -t all_specs < <(
            gh api "repos/${REPOSITORY}/git/trees/${HEAD_SHA}?recursive=1" --jq \
              '.tree[] | select(.path | test("^images/.+/go-remediation\\.spec\\.json$")) | .path'
          )
          mapfile -t specs < <(
            python3 - "$changed_files" "${all_specs[@]}" <<'PYTHON'
          import json, sys
          from pathlib import Path
          changed = json.loads(sys.argv[1])
          specs = sys.argv[2:]
          directories = {str(Path(spec).parent): spec for spec in specs}
          selected = set()
          for filename in changed:
              matches = [directory for directory in directories if filename.startswith(directory + "/")]
              if matches:
                  selected.add(directories[max(matches, key=lambda item: len(Path(item).parts))])
          print("\n".join(sorted(selected)))
          PYTHON
          )
          declare -A original_blobs
          for spec in "${specs[@]}"; do
            directory=${spec%/*}
            lock="$directory/go-remediation.lock.json"
            scan="$directory/go-remediation.lock.scan.json"
            recipe="$directory/melange.yaml"
            for path in "$spec" "$lock" "$scan" "$recipe"; do
              payload=$(gh api "repos/${REPOSITORY}/contents/${path}?ref=${HEAD_SHA}")
              mkdir -p "$trusted/$(dirname "$path")"
              jq -er .content <<<"$payload" | base64 --decode >"$trusted/$path"
              original_blobs["$path"]=$(jq -er .sha <<<"$payload")
            done
          done
          verify=(python3 scripts/go_remediation.py verify-capture "$artifact" \
            --root "$trusted" --repository "$REPOSITORY" --pr "$PR_NUMBER" \
            --run "$RUN_ID" --base "$BASE_SHA" --head "$HEAD_SHA")
          for spec in "${specs[@]}"; do verify+=(--spec "$spec"); done
          "${verify[@]}"
          declare -A raw_captures
          while IFS=$'\t' read -r spec raw; do
            raw_captures["$spec"]=$raw
          done < <(jq -r '.captures[] | [.spec, .raw] | @tsv' "$artifact/manifest.json")
          for spec in "${specs[@]}"; do
            directory=${spec%/*}
            raw=${raw_captures[$spec]:-}
            [[ -n "$raw" ]] || { echo "missing raw capture for $spec" >&2; exit 1; }
            capture=$(jq -er .capture "$trusted/$spec")
            mkdir -p "$trusted/$directory/$(dirname "$capture")"
            cp "$artifact/$raw" "$trusted/$directory/$capture"
          done
          ((${#specs[@]})) || exit 0
          changed_paths=()
          for spec in "${specs[@]}"; do
            directory=${spec%/*}
            lock="$directory/go-remediation.lock.json"
            scan="$directory/go-remediation.lock.scan.json"
            recipe="$directory/melange.yaml"
            cp "$trusted/$lock" "$trusted/$lock.old"
            python3 scripts/go_remediation.py generate "$trusted/$spec" "$trusted/$lock"
            python3 scripts/go_remediation.py bump-epoch "$trusted/$recipe" \
              "$trusted/$lock.old" "$trusted/$lock"
            for path in "$lock" "$scan" "$recipe"; do
              after=$(git hash-object "$trusted/$path")
              before=${original_blobs[$path]:-}
              if [[ "$before" != "$after" ]]; then changed_paths+=("$path"); fi
            done
          done
          if ((${#changed_paths[@]})); then
            tree_entries='[]'
            for path in "${changed_paths[@]}"; do
              blob=$(gh api --method POST "repos/${REPOSITORY}/git/blobs" \
                -f content="$(base64 -w0 "$trusted/$path")" -f encoding=base64 --jq .sha)
              entry=$(jq -nc --arg path "$path" --arg sha "$blob" \
                '{path: $path, mode: "100644", type: "blob", sha: $sha}')
              tree_entries=$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$tree_entries")
            done
            tree_body=$(jq -nc --arg base "$HEAD_SHA" --argjson tree "$tree_entries" \
              '{base_tree: $base, tree: $tree}')
            tree=$(gh api --method POST "repos/${REPOSITORY}/git/trees" \
              --input - --jq .sha <<<"$tree_body")
            commit_body=$(jq -nc --arg tree "$tree" --arg parent "$HEAD_SHA" \
              '{message: "chore(deps): update Go remediation lock", tree: $tree, parents: [$parent]}')
            commit=$(gh api --method POST "repos/${REPOSITORY}/git/commits" \
              --input - --jq .sha <<<"$commit_body")
            gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$commit" -F force=false
          fi
          rm -rf "$work"
