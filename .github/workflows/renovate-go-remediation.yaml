name: Update Renovate Go remediation locks

# workflow_run keeps generation on trusted default-branch code. PR source is
# fetched as data through the GitHub API and is never checked out or executed.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build images]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-go-remediation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update reviewed remediation locks
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response=$(gh api "repos/${REPOSITORY}/git/trees/${HEAD_SHA}?recursive=1")
          mapfile -t specs < <(
            jq -r \
              '.tree[] | select(.path | test("^images/.+/go-remediation\\.spec\\.json$")) | .path' \
              <<<"$response"
          )
          work=$(mktemp -d)
          declare -A original_blobs
          changed_paths=()
          for spec in "${specs[@]}"; do
            directory=${spec%/*}
            lock="$directory/go-remediation.lock.json"
            scan="$directory/go-remediation.lock.scan.json"
            recipe="$directory/melange.yaml"
            for path in "$spec" "$lock" "$scan" "$recipe"; do
              payload=$(gh api "repos/${REPOSITORY}/contents/${path}?ref=${HEAD_SHA}")
              mkdir -p "$work/$(dirname "$path")"
              jq -er .content <<<"$payload" | base64 --decode >"$work/$path"
              original_blobs["$path"]=$(jq -er .sha <<<"$payload")
            done
            cp "$work/$lock" "$work/$lock.old"
            python3 scripts/go_remediation.py generate "$work/$spec" "$work/$lock"
            python3 scripts/go_remediation.py bump-epoch "$work/$recipe" "$work/$lock.old" "$work/$lock"
            for path in "$lock" "$scan" "$recipe"; do
              after=$(git hash-object "$work/$path")
              if [[ "${original_blobs[$path]}" != "$after" ]]; then
                changed_paths+=("$path")
              fi
            done
          done
          if ((${#changed_paths[@]})); then
            tree_entries='[]'
            for path in "${changed_paths[@]}"; do
              content=$(base64 -w0 "$work/$path")
              blob=$(gh api --method POST "repos/${REPOSITORY}/git/blobs" \
                -f content="$content" -f encoding=base64 --jq .sha)
              entry=$(jq -nc --arg path "$path" --arg sha "$blob" \
                '{path: $path, mode: "100644", type: "blob", sha: $sha}')
              tree_entries=$(jq -c --argjson entry "$entry" '. + [$entry]' <<<"$tree_entries")
            done
            tree_body=$(jq -nc --arg base "$HEAD_SHA" --argjson tree "$tree_entries" \
              '{base_tree: $base, tree: $tree}')
            tree=$(gh api --method POST "repos/${REPOSITORY}/git/trees" \
              --input - --jq .sha <<<"$tree_body")
            commit_body=$(jq -nc --arg message 'chore(deps): update Go remediation lock' \
              --arg tree "$tree" --arg parent "$HEAD_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}')
            commit=$(gh api --method POST "repos/${REPOSITORY}/git/commits" \
              --input - --jq .sha <<<"$commit_body")
            gh api --method PATCH "repos/${REPOSITORY}/git/refs/heads/${BRANCH}" \
              -f sha="$commit" -F force=false
          fi
          rm -rf "$work"
