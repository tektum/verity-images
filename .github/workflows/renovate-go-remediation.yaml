name: Update Renovate Go remediation locks

# workflow_run keeps generation on trusted default-branch code. PR source is
# fetched as data through the GitHub API and is never checked out or executed.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build images]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-go-remediation-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out trusted generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update reviewed remediation locks
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=false
          response=$(gh api "repos/${REPOSITORY}/git/trees/${HEAD_SHA}?recursive=1")
          mapfile -t specs < <(
            jq -r \
              '.tree[] | select(.path | test("^images/.+/go-remediation\\.spec\\.json$")) | .path' \
              <<<"$response"
          )
          for spec in "${specs[@]}"; do
            directory=${spec%/*}
            lock="$directory/go-remediation.lock.json"
            scan="$directory/go-remediation.lock.scan.json"
            recipe="$directory/melange.yaml"
            work=$(mktemp -d)
            for path in "$spec" "$lock" "$scan" "$recipe"; do
              payload=$(gh api "repos/${REPOSITORY}/contents/${path}?ref=${HEAD_SHA}")
              mkdir -p "$work/$(dirname "$path")"
              jq -er .content <<<"$payload" | base64 --decode >"$work/$path"
            done
            cp "$work/$lock" "$work/$lock.old"
            python3 scripts/go_remediation.py generate "$work/$spec" "$work/$lock"
            python3 scripts/go_remediation.py bump-epoch "$work/$recipe" "$work/$lock.old" "$work/$lock"
            for path in "$lock" "$scan" "$recipe"; do
              original=$(gh api "repos/${REPOSITORY}/contents/${path}?ref=${HEAD_SHA}")
              before=$(jq -er .content <<<"$original" | base64 --decode | sha256sum | cut -d' ' -f1)
              after=$(sha256sum "$work/$path" | cut -d' ' -f1)
              if [[ "$before" == "$after" ]]; then
                continue
              fi
              content=$(base64 -w0 "$work/$path")
              sha=$(jq -er .sha <<<"$original")
              gh api --method PUT "repos/${REPOSITORY}/contents/${path}" \
                -f message='chore(deps): update Go remediation lock' \
                -f content="$content" -f sha="$sha" -f branch="$BRANCH"
              changed=true
            done
            rm -rf "$work"
          done
          "$changed" || true
