name: Publish images

# Reusable builder for SLSA Build L3 provenance. build.yaml calls this workflow
# for trusted main publication only. Build, scan, smoke test, push, signing, SBOM
# attestation, build provenance, and tag promotion all run here, so every Fulcio
# certificate names this workflow, not the caller, as the signer.

on:
  workflow_call:
    inputs:
      images:
        description: Image matrix generated by build.yaml.
        required: true
        type: string

permissions: {}

env:
  APKO_VERSION: 1.2.31
  APKO_SHA256: abd57139139f4f5ce567f914bd168b7b2f4a3d39851711f0b1dd0c83c518f867
  MELANGE_VERSION: 0.56.5
  MELANGE_SHA256: 40e17d259c9fd7bce8e000a59239d7b9ebf13971117334ad117ae6eefd98f92b
  COPA_VERSION: 0.14.2
  COPA_SHA256: 756c6e0f287dc7839c0a72e91b4d4712b1d8cd86a7233c068c0208a28bcb9ede
  SYFT_VERSION: 1.50.0
  SYFT_SHA256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
  GRYPE_VERSION: 0.116.1
  GRYPE_SHA256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458
  TRIVY_VERSION: 0.73.0
  TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-publish-${{ strategy.job-index }}/family=c8i.*+m8i.*/cpu=32/ram=64+128/image=ubuntu24-full-x64/volume=200gb:gp3/extras=otel/spot=false  # yamllint disable-line rule:line-length
    timeout-minutes: 300
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: publish-${{ matrix.owner }}-${{ matrix.name }}-${{ matrix.tag_version }}-${{ matrix.flavor }}
      cancel-in-progress: false
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download native arm64 packages
        if: matrix.source_built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-arm64-${{ matrix.name }}-${{ matrix.tag_version }}
          path: native-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Enable Docker containerd snapshotter
        if: matrix.track == 'patched'
        run: |
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install image tools
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: scripts/install_image_tools.sh "$TRACK"

      - name: Build candidate
        shell: bash
        env:
          BUILD_NAME: ${{ matrix.build_name }}
          CONTEXT: ${{ matrix.context }}
          FLAVOR: ${{ matrix.flavor }}
          PREBUILT_ARM64: ${{ matrix.source_built && 'native-arm64' || '' }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.version }}
        run: |
          scripts/build_candidate.sh "$CONTEXT" "$BUILD_NAME" "$FLAVOR" "$TRACK" "$VERSION"

      - name: Publish image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: ${{ matrix.name }}
          track: ${{ matrix.track }}
          candidate-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}
          upstream-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}-upstream
          target-repository: ghcr.io/${{ matrix.owner }}/${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          version: ${{ matrix.version }}
          tag-version: ${{ matrix.tag_version }}
          flavor: ${{ matrix.flavor }}
          major: ${{ matrix.major }}
          publish-latest: ${{ matrix.latest }}
          context: ${{ matrix.context }}
          build-directory: dist/${{ matrix.build_name }}
          sbom-directory: dist/${{ matrix.build_name }}/sbom
          evidence-file: ${{ matrix.evidence_file }}
          publish: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}

      - name: Write build report
        shell: bash
        env:
          CATEGORY: ${{ matrix.category }}
          DESCRIPTION: ${{ matrix.description }}
          INPUT_DIGEST: ${{ matrix.input_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          VALIDATED_AT: ${{ github.event.repository.updated_at }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
          SCAN: ${{ steps.publish.outputs.scan-summary }}
          TAGS: ${{ steps.publish.outputs.tags }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.tag_version }}
        run: |
          jq -n -c --arg name "$NAME" --arg version "$VERSION" --arg track "$TRACK" \
            --arg description "$DESCRIPTION" --arg digest "$DIGEST" --arg tags "$TAGS" --argjson scan "$SCAN" \
            --arg category "$CATEGORY" --arg inputDigest "$INPUT_DIGEST" --arg runId "$RUN_ID" \
            --arg runUrl "$RUN_URL" --arg sourceCommit "$SOURCE_COMMIT" \
            --arg validatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{name:$name,version:$version,track:$track,description:$description,digest:$digest,tags:$tags,
              scan:$scan,inputDigest:$inputDigest,runId:$runId,runUrl:$runUrl,sourceCommit:$sourceCommit,
              validatedAt:$validatedAt}
             + (if $category == "" then {} else {category:$category} end)' \
            > "report-${NAME}-${VERSION}.json"

      - name: Upload build report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report-${{ matrix.name }}-${{ matrix.tag_version }}
          path: report-${{ matrix.name }}-${{ matrix.tag_version }}.json

      - name: Add job summary
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
          SCAN: ${{ steps.publish.outputs.scan-summary }}
          TAGS: ${{ steps.publish.outputs.tags }}
        run: |
          printf "## %s\n\n- Digest: \`%s\`\n- Tags: \`%s\`\n- Scan: \`%s\`\n" \
            "$NAME" "$DIGEST" "$TAGS" "$SCAN" >> "$GITHUB_STEP_SUMMARY"
