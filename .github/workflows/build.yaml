name: Build images

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  APKO_VERSION: 1.2.31
  APKO_SHA256: abd57139139f4f5ce567f914bd168b7b2f4a3d39851711f0b1dd0c83c518f867
  MELANGE_VERSION: 0.56.5
  MELANGE_SHA256: 40e17d259c9fd7bce8e000a59239d7b9ebf13971117334ad117ae6eefd98f92b
  COPA_VERSION: 0.14.2
  COPA_SHA256: 756c6e0f287dc7839c0a72e91b4d4712b1d8cd86a7233c068c0208a28bcb9ede
  SYFT_VERSION: 1.50.0
  SYFT_SHA256: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
  GRYPE_VERSION: 0.116.1
  GRYPE_SHA256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458
  TRIVY_VERSION: 0.73.0
  TRIVY_SHA256: 2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b

jobs:
  matrix:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/runner=4cpu-linux-x64
    permissions:
      contents: read
    outputs:
      images: ${{ steps.generate.outputs.images }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate matrix
        id: generate
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha ||
            github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            matrix=$(python3 scripts/gen_matrix.py --all)
          else
            matrix=$(python3 scripts/gen_matrix.py --changed "$BASE_SHA")
          fi
          printf 'images=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  validate:
    if: github.ref != 'refs/heads/main' && fromJSON(needs.matrix.outputs.images).include[0] != null
    needs: matrix
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i+m8i/cpu=16/ram=32/image=ubuntu24-full-x64/volume=100gb:gp3/extras=otel/spot=false  # yamllint disable-line rule:line-length
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Enable Docker containerd snapshotter
        if: matrix.track == 'patched'
        run: |
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install image tools
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: scripts/install_image_tools.sh "$TRACK"

      - name: Build candidate
        shell: bash
        env:
          BUILD_NAME: ${{ matrix.build_name }}
          CONTEXT: ${{ matrix.context }}
          FLAVOR: ${{ matrix.flavor }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.version }}
        run: |
          scripts/build_candidate.sh "$CONTEXT" "$BUILD_NAME" "$FLAVOR" "$TRACK" "$VERSION"

      - name: Validate publish tail
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: ${{ matrix.name }}
          track: ${{ matrix.track }}
          candidate-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}
          upstream-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}-upstream
          target-repository: ghcr.io/${{ matrix.owner }}/${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          version: ${{ matrix.version }}
          tag-version: ${{ matrix.tag_version }}
          flavor: ${{ matrix.flavor }}
          major: ${{ matrix.major }}
          publish-latest: ${{ matrix.latest }}
          context: ${{ matrix.context }}
          build-directory: dist/${{ matrix.build_name }}
          sbom-directory: dist/${{ matrix.build_name }}/sbom
          evidence-file: ${{ matrix.evidence_file }}

      - name: Write build report
        shell: bash
        env:
          DESCRIPTION: ${{ matrix.description }}
          DIGEST: local
          NAME: ${{ matrix.name }}
          SCAN: ${{ steps.publish.outputs.scan-summary }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.tag_version }}
        run: |
          jq -n -c --arg name "$NAME" --arg version "$VERSION" --arg track "$TRACK" \
            --arg description "$DESCRIPTION" --arg digest "$DIGEST" --argjson scan "$SCAN" \
            '{name:$name,version:$version,track:$track,description:$description,digest:$digest,scan:$scan}' \
            > "report-${NAME}-${VERSION}.json"

      - name: Upload build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: report-${{ matrix.name }}-${{ matrix.tag_version }}
          path: report-${{ matrix.name }}-${{ matrix.tag_version }}.json

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      fromJSON(needs.matrix.outputs.images).include[0] != null
    needs: matrix
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/family=c8i+m8i/cpu=32/ram=64/image=ubuntu24-full-x64/volume=200gb:gp3/extras=otel/spot=false  # yamllint disable-line rule:line-length
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: publish-${{ matrix.owner }}-${{ matrix.name }}-${{ matrix.tag_version }}-${{ matrix.flavor }}
      cancel-in-progress: false
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Enable Docker containerd snapshotter
        if: matrix.track == 'patched'
        run: |
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Install image tools
        shell: bash
        env:
          TRACK: ${{ matrix.track }}
        run: scripts/install_image_tools.sh "$TRACK"

      - name: Build candidate
        shell: bash
        env:
          BUILD_NAME: ${{ matrix.build_name }}
          CONTEXT: ${{ matrix.context }}
          FLAVOR: ${{ matrix.flavor }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.version }}
        run: |
          scripts/build_candidate.sh "$CONTEXT" "$BUILD_NAME" "$FLAVOR" "$TRACK" "$VERSION"

      - name: Publish image
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image-name: ${{ matrix.name }}
          track: ${{ matrix.track }}
          candidate-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}
          upstream-image: local/verity-${{ matrix.build_name }}:${{ github.sha }}-upstream
          target-repository: ghcr.io/${{ matrix.owner }}/${{ matrix.name }}
          platforms: ${{ matrix.platforms }}
          version: ${{ matrix.version }}
          tag-version: ${{ matrix.tag_version }}
          flavor: ${{ matrix.flavor }}
          major: ${{ matrix.major }}
          publish-latest: ${{ matrix.latest }}
          context: ${{ matrix.context }}
          build-directory: dist/${{ matrix.build_name }}
          sbom-directory: dist/${{ matrix.build_name }}/sbom
          evidence-file: ${{ matrix.evidence_file }}
          publish: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}

      - name: Write build report
        shell: bash
        env:
          DESCRIPTION: ${{ matrix.description }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
          SCAN: ${{ steps.publish.outputs.scan-summary }}
          TAGS: ${{ steps.publish.outputs.tags }}
          TRACK: ${{ matrix.track }}
          VERSION: ${{ matrix.tag_version }}
        run: |
          jq -n -c --arg name "$NAME" --arg version "$VERSION" --arg track "$TRACK" \
            --arg description "$DESCRIPTION" --arg digest "$DIGEST" --arg tags "$TAGS" --argjson scan "$SCAN" \
            '{name:$name,version:$version,track:$track,description:$description,digest:$digest,tags:$tags,scan:$scan}' \
            > "report-${NAME}-${VERSION}.json"

      - name: Upload build report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: report-${{ matrix.name }}-${{ matrix.tag_version }}
          path: report-${{ matrix.name }}-${{ matrix.tag_version }}.json

      - name: Add job summary
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
          SCAN: ${{ steps.publish.outputs.scan-summary }}
          TAGS: ${{ steps.publish.outputs.tags }}
        run: |
          printf "## %s\n\n- Digest: \`%s\`\n- Tags: \`%s\`\n- Scan: \`%s\`\n" \
            "$NAME" "$DIGEST" "$TAGS" "$SCAN" >> "$GITHUB_STEP_SUMMARY"

  build-gate:
    if: always()
    needs: [matrix, validate, publish]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/runner=4cpu-linux-x64
    permissions:
      contents: read
    steps:
      - name: Require successful image jobs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IMAGES: ${{ needs.matrix.outputs.images }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          [[ "$MATRIX_RESULT" == success ]]
          [[ "$(jq '.include | length' <<<"$IMAGES")" -eq 0 ]] && exit 0
          if [[ "$EVENT" == pull_request || "$EVENT" == merge_group || "$GITHUB_REF" != refs/heads/main ]]; then
            [[ "$VALIDATE_RESULT" == success ]]
          else
            [[ "$PUBLISH_RESULT" == success ]]
          fi

      - name: Download image reports
        if: fromJSON(needs.matrix.outputs.images).include[0] != null
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - name: Combine reports
        if: fromJSON(needs.matrix.outputs.images).include[0] != null
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for report in reports/report-*.json; do
            expected=${report#reports/report-}
            expected=${expected%.json}
            jq -e --slurp --arg expected "$expected" --arg event "$EVENT" '
              length == 1 and
              (.[0] | type == "object") and
              (.[0].name | type == "string" and length > 0) and
              (.[0].version | type == "string" and length > 0) and
              (.[0].name + "-" + .[0].version == $expected) and
              (.[0].track == "wolfi" or .[0].track == "patched") and
              (.[0].description | type == "string" and length > 0) and
              (.[0].scan | type == "object") and
              (((.[0] | keys) | sort == ["description", "digest", "name", "scan", "tags", "track", "version"]) and
                (.[0].digest | test("^sha256:[0-9a-f]{64}$")) and
                (.[0].tags | type == "string" and length > 0) or
               (($event == "pull_request" or $event == "merge_group") and
                ((.[0] | keys) | sort == ["description", "digest", "name", "scan", "track", "version"]) and
                .[0].digest == "local"))
            ' "$report" >/dev/null
          done
          jq -s '{images: sort_by(.name, .version)}' reports/report-*.json > build-report.json
          {
            printf '## Image build report\n\n'
            printf '| Image | Version | Digest | Scan |\n|---|---|---|---|\n'
            jq -r '.images[] | "| \(.name) | \(.version) | `\(.digest)` | `\(.scan | tojson)` |"' build-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined report
        if: fromJSON(needs.matrix.outputs.images).include[0] != null
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-report
          path: build-report.json
