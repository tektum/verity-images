name: Build catalog data

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful Build images workflow run ID.
        required: true

permissions: {}

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  catalog:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.artifacts.outputs.ready }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked catalog tools
        uses: ./.github/actions/setup-devbox

      - name: Select source run
        id: source
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run-id }}
          EVENT: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            run_id=$DISPATCH_RUN_ID
          else
            run_id=$EVENT_RUN_ID
          fi
          metadata=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")
          jq -e --arg repository "$REPOSITORY" '
            .name == "Build images" and
            .path == ".github/workflows/build.yaml" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            (.event == "push" or .event == "schedule" or .event == "workflow_dispatch")
          ' <<<"$metadata" >/dev/null
          source_sha=$(jq -r .head_sha <<<"$metadata")
          git merge-base --is-ancestor "$source_sha" HEAD
          {
            printf 'run-id=%s\n' "$run_id"
            printf 'run-url=%s\n' "$(jq -r .html_url <<<"$metadata")"
            printf 'source-sha=%s\n' "$source_sha"
            printf 'source-event=%s\n' "$(jq -r .event <<<"$metadata")"
            printf 'published-at=%s\n' "$(jq -r .updated_at <<<"$metadata")"
          } >> "$GITHUB_OUTPUT"

      - name: Check source artifacts
        id: artifacts
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run-id }}
        run: |
          count=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "build-report")] | length')
          if [[ "$count" -eq 0 ]]; then
            if [[ "$EVENT" == workflow_dispatch ]]; then
              printf '::error title=Build report unavailable::Run %s has no build-report artifact.\n' "$RUN_ID"
              exit 1
            fi
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'No changed images in build run %s; retaining the current catalog.\n' "$RUN_ID"
            exit 0
          fi
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Download build report
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-report
          path: input/report
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download scan evidence
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: scan-*
          path: input/scans
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate build report
        if: steps.artifacts.outputs.ready == 'true'
        run: |
          jq -e '
            (.images | length > 0) and
            all(.images[];
              (.name | type == "string" and length > 0) and
              (.version | type == "string" and length > 0) and
              (.track == "wolfi" or .track == "patched") and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.tags | type == "string" and length > 0) and
              (.scan | type == "object")
            )
          ' input/report/build-report.json >/dev/null

      - name: Generate expected images
        if: steps.artifacts.outputs.ready == 'true'
        run: devbox run -- python3 scripts/gen_matrix.py --all > expected-images.json

      - name: Download current catalog
        if: steps.artifacts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output previous.json \
            --write-out '%{http_code}' https://tektum.github.io/verity-images/catalog.json)
          if [[ "$status" == 200 ]]; then
            devbox run -- check-jsonschema --schemafile docs/catalog.schema.json previous.json
          elif [[ "$status" == 404 ]]; then
            devbox run -- jq -e --slurp \
              '(.[0].images | map([.name, .version]) | sort) == (.[1].include | map([.name, .tag_version]) | sort)' \
              input/report/build-report.json expected-images.json >/dev/null
            rm previous.json
          else
            printf '::error title=Catalog unavailable::Current catalog returned HTTP %s.\n' "$status"
            exit 1
          fi

      - name: Generate catalog
        if: steps.artifacts.outputs.ready == 'true'
        shell: bash
        run: |
          devbox run -- python3 scripts/build_catalog.py input/report/build-report.json input/scans \
            "$(test -f previous.json && printf previous.json)" catalog.json \
            '${{ steps.source.outputs.run-id }}' '${{ steps.source.outputs.run-url }}' \
            '${{ steps.source.outputs.source-sha }}' '${{ steps.source.outputs.published-at }}'
          devbox run -- jq -e \
            '.schemaVersion == 2 and (.images | length > 0) and all(.images[]; .scan.fixable == 0)' \
            catalog.json >/dev/null
          devbox run -- check-jsonschema --schemafile docs/catalog.schema.json catalog.json
          devbox run -- jq -e --slurp \
            '(.[0].images | map([.name, .version]) | sort) == (.[1].include | map([.name, .tag_version]) | sort)' \
            catalog.json expected-images.json >/dev/null

      - name: Upload catalog data
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-json
          path: |
            catalog.json
            docs/catalog.schema.json
          if-no-files-found: error

      - name: Configure Pages
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Prepare Pages files
        if: steps.artifacts.outputs.ready == 'true'
        run: |
          mkdir pages
          cp catalog.json pages/catalog.json
          cp docs/catalog.schema.json pages/catalog.schema.json

      - name: Upload Pages artifact
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pages

  deploy:
    if: needs.catalog.outputs.ready == 'true'
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}catalog.json
    steps:
      - name: Deploy catalog JSON
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
