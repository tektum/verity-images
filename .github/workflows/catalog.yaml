name: Build catalog data

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog.yaml
      - docs/catalog.schema.json
      - packages/keys/verity-apk-2026.rsa.pub
      - packages/repository-state.json
      - packages/repository-state.pin.json
      - packages/repository-state.schema.json
      - scripts/apk_archive.py
      - scripts/apk_repository_policy.py
      - scripts/build_catalog.py
      - scripts/check_pages_size.py
      - scripts/gen_matrix.py
      - scripts/validate_repository_state.py
      - site/**
  workflow_dispatch:
    inputs:
      mode:
        description: Publication mode.
        required: true
        default: combined
        type: choice
        options: [images, packages, combined]
      run-id:
        description: Successful Build images workflow run ID.
        required: false

permissions: {}

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  catalog:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-catalog/runner=4cpu-linux-x64
    outputs:
      ready: ${{ steps.artifacts.outputs.ready }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked catalog tools
        uses: ./.github/actions/setup-devbox

      - name: Select publication mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_run ]]; then
            mode=images
          elif [[ "$EVENT" == push ]]; then
            mode=packages
          else
            mode=$MODE_INPUT
          fi
          [[ "$mode" == images || "$mode" == packages || "$mode" == combined ]]
          printf 'value=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Select source run
        if: steps.mode.outputs.value != 'packages'
        id: source
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run-id }}
          EVENT: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            run_id=$DISPATCH_RUN_ID
          else
            run_id=$EVENT_RUN_ID
          fi
          metadata=$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")
          conclusion=$(jq -r .conclusion <<<"$metadata")
          if [[ "$conclusion" != success ]]; then
            printf '::error title=Catalog not updated::Run %s (id %s) concluded "%s"; catalog unchanged.\n' \
              "$(jq -r .html_url <<<"$metadata")" "$run_id" "$conclusion"
            exit 1
          fi
          jq -e --arg repository "$REPOSITORY" '
            .name == "Build images" and
            .path == ".github/workflows/build.yaml" and
            .head_branch == "main" and
            .head_repository.full_name == $repository and
            (.event == "push" or .event == "schedule" or .event == "workflow_dispatch")
          ' <<<"$metadata" >/dev/null
          source_sha=$(jq -r .head_sha <<<"$metadata")
          git merge-base --is-ancestor "$source_sha" HEAD
          {
            printf 'run-id=%s\n' "$run_id"
            printf 'run-url=%s\n' "$(jq -r .html_url <<<"$metadata")"
            printf 'source-sha=%s\n' "$source_sha"
            printf 'source-event=%s\n' "$(jq -r .event <<<"$metadata")"
            printf 'published-at=%s\n' "$(jq -r .updated_at <<<"$metadata")"
          } >> "$GITHUB_OUTPUT"

      - name: Stage site assets
        run: cp -R site "$RUNNER_TEMP/site"

      - name: Check out source revision
        if: steps.mode.outputs.value != 'packages'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: git checkout --detach "$SOURCE_SHA"

      - name: Check source artifacts
        id: artifacts
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.mode.outputs.value }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.source.outputs.run-id }}
        run: |
          if [[ "$MODE" == packages ]]; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "build-report")] | length')
          if [[ "$count" -eq 0 ]]; then
            if [[ "$EVENT" == workflow_dispatch ]]; then
              printf '::error title=Build report unavailable::Run %s has no build-report artifact.\n' "$RUN_ID"
              exit 1
            fi
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'No changed images in build run %s; retaining the current catalog.\n' "$RUN_ID"
            exit 0
          fi
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Download build report
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-report
          path: input/report
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download scan evidence
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: scan-*
          path: input/scans
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate build report
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        run: |
          jq -e '
            (.images | length > 0) and
            all(.images[];
              (.name | type == "string" and length > 0) and
              (.version | type == "string" and length > 0) and
              (.track == "wolfi" or .track == "patched") and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.tags | type == "string" and length > 0) and
              (.scan | type == "object")
            )
          ' input/report/build-report.json >/dev/null

      - name: Generate expected images
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        run: devbox --quiet run -- sh -c 'python3 scripts/gen_matrix.py --all > expected-images.json'

      - name: Download current catalog
        if: steps.artifacts.outputs.ready == 'true'
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output previous.json \
            --write-out '%{http_code}' https://tektum.github.io/verity-images/catalog.json)
          if [[ "$status" == 200 ]]; then
            devbox run -- check-jsonschema --schemafile docs/catalog.schema.json previous.json
          elif [[ "$status" == 404 ]]; then
            if [[ "$MODE" == packages ]]; then
              printf '::error title=Catalog unavailable::Package-only publication requires the current catalog.\n'
              exit 1
            fi
            devbox run -- jq -e --slurp \
              '(.[0].images | map([.name, .version]) | sort) == (.[1].include | map([.name, .tag_version]) | sort)' \
              input/report/build-report.json expected-images.json >/dev/null
            rm previous.json
          else
            printf '::error title=Catalog unavailable::Current catalog returned HTTP %s.\n' "$status"
            exit 1
          fi

      - name: Generate catalog
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        shell: bash
        run: |
          devbox run -- python3 scripts/build_catalog.py input/report/build-report.json input/scans \
            "$(test -f previous.json && printf previous.json)" catalog.json \
            '${{ steps.source.outputs.run-id }}' '${{ steps.source.outputs.run-url }}' \
            '${{ steps.source.outputs.source-sha }}' '${{ steps.source.outputs.published-at }}'
          devbox run -- jq -e \
            '.schemaVersion == 2 and (.images | length > 0) and all(.images[]; .scan.fixable == 0)' \
            catalog.json >/dev/null
          devbox run -- check-jsonschema --schemafile docs/catalog.schema.json catalog.json
          devbox run -- jq -e --slurp \
            '(.[0].images | map([.name, .version]) | sort) == (.[1].include | map([.name, .tag_version]) | sort)' \
            catalog.json expected-images.json >/dev/null

      - name: Preserve current catalog
        if: steps.artifacts.outputs.ready == 'true' && steps.mode.outputs.value == 'packages'
        run: cp previous.json catalog.json

      - name: Upload catalog data
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-json
          path: |
            catalog.json
            docs/catalog.schema.json
          if-no-files-found: error

      - name: Configure Pages
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Prepare Pages files
        if: steps.artifacts.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          devbox run -- python3 scripts/validate_repository_state.py --live
          repository=$(devbox run -- jq -r .repository packages/repository-state.json)
          asset_id=$(devbox run -- jq -r .asset.id packages/repository-state.json)
          archive_sha256=$(devbox run -- jq -r .archive.sha256 packages/repository-state.json)
          gh api "repos/${repository}/releases/assets/${asset_id}" \
            -H 'Accept: application/octet-stream' > repository.tar.zst
          actual_sha256="sha256:$(sha256sum repository.tar.zst | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$archive_sha256" ]]; then
            printf '::error title=Archive digest mismatch::Expected %s but downloaded %s.\n' \
              "$archive_sha256" "$actual_sha256"
            exit 1
          fi
          mkdir pages
          cp -R "$RUNNER_TEMP/site/." pages/
          cp catalog.json pages/catalog.json
          cp docs/catalog.schema.json pages/catalog.schema.json
          devbox run -- python3 scripts/validate_repository_state.py --archive repository.tar.zst --pages pages

      - name: Enforce Pages artifact size limit
        if: steps.artifacts.outputs.ready == 'true'
        run: python3 scripts/check_pages_size.py pages

      - name: Upload Pages artifact
        if: steps.artifacts.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pages

  deploy:
    if: needs.catalog.outputs.ready == 'true'
    needs: catalog
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-deploy/runner=4cpu-linux-x64
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
