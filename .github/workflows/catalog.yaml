name: Build catalog data

on:
  workflow_run:
    workflows: [Build images]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful Build images workflow run ID.
        required: true

permissions: {}

jobs:
  catalog:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Select source run
        id: source
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run-id }}
          EVENT: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_TIME: ${{ github.event.workflow_run.updated_at }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            metadata=$(gh api "repos/${REPOSITORY}/actions/runs/${DISPATCH_RUN_ID}")
            {
              printf 'run-id=%s\n' "$DISPATCH_RUN_ID"
              printf 'run-url=%s\n' "$(jq -r .html_url <<<"$metadata")"
              printf 'source-sha=%s\n' "$(jq -r .head_sha <<<"$metadata")"
              printf 'published-at=%s\n' "$(jq -r .updated_at <<<"$metadata")"
            } >> "$GITHUB_OUTPUT"
          else
            printf 'run-id=%s\nrun-url=%s\nsource-sha=%s\npublished-at=%s\n' \
              "$EVENT_RUN_ID" "$EVENT_RUN_URL" "$EVENT_SHA" "$EVENT_TIME" >> "$GITHUB_OUTPUT"
          fi
      - name: Download build report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: build-report
          path: input/report
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download scan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: scan-*
          path: input/scans
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Generate catalog
        shell: bash
        run: |
          python3 scripts/build_catalog.py input/report/build-report.json input/scans catalog.json \
            '${{ steps.source.outputs.run-id }}' '${{ steps.source.outputs.run-url }}' \
            '${{ steps.source.outputs.source-sha }}' '${{ steps.source.outputs.published-at }}'
          jq -e '.schemaVersion == 1 and (.images | length > 0) and all(.images[]; \
            if .track == "patched" then .scan.final == {} else .scan == {} end)' \
            catalog.json >/dev/null

      - name: Upload catalog data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-json
          path: |
            catalog.json
            docs/catalog.schema.json
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Prepare Pages files
        run: |
          mkdir pages
          cp catalog.json pages/catalog.json
          cp docs/catalog.schema.json pages/catalog.schema.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pages

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}catalog.json
    steps:
      - name: Deploy catalog JSON
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
