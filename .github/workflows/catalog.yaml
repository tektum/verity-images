name: Build catalog data

# workflow_run is required to consume image evidence emitted by the trusted
# main-branch build. This workflow checks out only the default branch and
# validates the source workflow, repository, branch, commit, and artifacts.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build images]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/catalog.yaml
      - docs/catalog.schema.json
      - packages/keys/verity-apk-2026.rsa.pub
      - packages/repository-state.json
      - packages/repository-state.pin.json
      - packages/repository-state.schema.json
      - scripts/apk_archive.py
      - scripts/apk_repository_policy.py
      - scripts/build_catalog.py
      - scripts/catalog_inventory.jq
      - scripts/catalog_reconciliation.jq
      - scripts/check_pages_size.py
      - scripts/gen_matrix.py
      - scripts/select_monitor_shards.py
      - scripts/validate_repository_state.py
      - site/**
  workflow_dispatch:
    inputs:
      mode:
        description: Publication mode.
        required: true
        default: combined
        type: choice
        options: [images, packages, combined]
      run-id:
        description: Successful Build images workflow run ID.
        required: false

permissions: {}

concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  catalog:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main')
      )
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-catalog/runner=4cpu-linux-x64
    outputs:
      ready: ${{ steps.reconcile.outputs.ready }}
      monitor-shards: ${{ steps.monitor-scope.outputs.shards }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install locked catalog tools
        uses: ./.github/actions/setup-devbox

      - name: Select publication mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_run ]]; then
            mode=images
          elif [[ "$EVENT" == push ]]; then
            mode=packages
          else
            mode=$MODE_INPUT
          fi
          [[ "$mode" == images || "$mode" == packages || "$mode" == combined ]]
          printf 'value=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Stage site assets
        run: cp -R site "$RUNNER_TEMP/site"

      - name: Download current catalog
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output previous.json \
            --write-out '%{http_code}' https://tektum.github.io/verity-images/catalog.json)
          if [[ "$status" == 200 ]]; then
            devbox run -- check-jsonschema --schemafile docs/catalog.schema.json previous.json
          elif [[ "$status" == 404 ]]; then
            if [[ "$MODE" == packages ]]; then
              printf '::error title=Catalog unavailable::Package-only publication requires the current catalog.\n'
              exit 1
            fi
            rm previous.json
          else
            printf '::error title=Catalog unavailable::Current catalog returned HTTP %s.\n' "$status"
            exit 1
          fi

      - name: Discover build runs
        id: reconcile
        shell: bash
        env:
          DISPATCH_RUN_ID: ${{ inputs.run-id }}
          EVENT: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.value }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == packages ]]; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          validate_identity() {
            local metadata=$1
            local source_sha
            jq -e --arg repository "$REPOSITORY" '
              .name == "Build images" and
              .path == ".github/workflows/build.yaml" and
              .head_branch == "main" and
              .head_repository.full_name == $repository and
              (.event == "push" or .event == "schedule" or .event == "workflow_dispatch")
            ' <<<"$metadata" >/dev/null
            source_sha=$(jq -r .head_sha <<<"$metadata")
            git merge-base --is-ancestor "$source_sha" HEAD
          }

          validate_terminal() {
            local metadata=$1
            local run_id conclusion status
            run_id=$(jq -r .id <<<"$metadata")
            conclusion=$(jq -r .conclusion <<<"$metadata")
            status=$(jq -r .status <<<"$metadata")
            if [[ "$status" != completed || \
              ("$conclusion" != success && "$conclusion" != failure && "$conclusion" != cancelled) ]]; then
              printf '::error title=Catalog not updated::Run %s (id %s) is not terminal; catalog unchanged.\n' \
                "$(jq -r .html_url <<<"$metadata")" "$run_id"
              exit 1
            fi
            validate_identity "$metadata"
          }

          explicit_run_id=
          explicit_metadata=null
          forced_metadata=null
          if [[ "$EVENT" == workflow_run ]]; then
            explicit_run_id=$EVENT_RUN_ID
          elif [[ "$EVENT" == workflow_dispatch && -n "$DISPATCH_RUN_ID" ]]; then
            explicit_run_id=$DISPATCH_RUN_ID
          fi

          if [[ -n "$explicit_run_id" ]]; then
            explicit_metadata=$(gh api "repos/${REPOSITORY}/actions/runs/${explicit_run_id}")
            validate_terminal "$explicit_metadata"
          fi
          if [[ "$EVENT" == workflow_dispatch && -n "$DISPATCH_RUN_ID" ]]; then
            forced_metadata=$explicit_metadata
          fi

          gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows/build.yaml/runs?branch=main&per_page=100" \
            --slurp > "$RUNNER_TEMP/build-run-pages.json"
          jq --arg repository "$REPOSITORY" --argjson explicit "$explicit_metadata" '
            [.[].workflow_runs[]
              | select(
                  (.event == "push" or .event == "schedule" or .event == "workflow_dispatch") and
                  .head_repository.full_name == $repository
                )]
            + (if $explicit == null then [] else [$explicit] end)
          ' "$RUNNER_TEMP/build-run-pages.json" > "$RUNNER_TEMP/build-runs.json"

          if [[ -f previous.json ]]; then
            consumed_runs=$(jq -c '.source.consumedRuns // empty' previous.json)
            if [[ -z "$consumed_runs" ]]; then
              published_at=$(jq -r .publishedAt previous.json)
              source_run_id=$(jq -r .source.runId previous.json)
              consumed_runs=$(jq -c --arg cutoff "$published_at" --arg source "$source_run_id" '
                reduce (.[] | select(.status == "completed" and .updated_at <= $cutoff)) as $run
                  ({($source): 1}; .[($run.id | tostring)] = $run.run_attempt)
              ' "$RUNNER_TEMP/build-runs.json")
            fi
          else
            consumed_runs='{}'
          fi
          jq --argjson ledger "$consumed_runs" --argjson forced "$forced_metadata" \
            --from-file scripts/catalog_reconciliation.jq "$RUNNER_TEMP/build-runs.json" \
            > "$RUNNER_TEMP/reconciliation-plan.json"
          jq '.candidates' "$RUNNER_TEMP/reconciliation-plan.json" > "$RUNNER_TEMP/candidates.json"

          if [[ "$EVENT" == workflow_dispatch && -n "$DISPATCH_RUN_ID" ]]; then
            explicit_artifacts=$(gh api --paginate \
              "repos/${REPOSITORY}/actions/runs/${DISPATCH_RUN_ID}/artifacts?per_page=100" --slurp)
            explicit_report_count=$(jq \
              '[.[].artifacts[] | select(.name == "build-report" and .expired == false)] | length' \
              <<<"$explicit_artifacts")
            if [[ "$explicit_report_count" -eq 0 ]]; then
              printf '::error title=Build report unavailable::Run %s has no build-report artifact.\n' \
                "$DISPATCH_RUN_ID"
              exit 1
            fi
          fi

          : > "$RUNNER_TEMP/reconciliation.ndjson"
          while IFS= read -r metadata; do
            validate_terminal "$metadata"
            run_id=$(jq -r .id <<<"$metadata")
            artifacts=$(gh api --paginate \
              "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --slurp)
            report_count=$(jq \
              '[.[].artifacts[] | select(.name == "build-report" and .expired == false)] | length' \
              <<<"$artifacts")
            if [[ "$report_count" -gt 0 ]]; then
              report_dir="input/${run_id}/report"
              mkdir -p "$report_dir"
              gh run download "$run_id" --repo "$REPOSITORY" \
                --name build-report --dir "$report_dir"
              report="$report_dir/build-report.json"
              if ! jq -e '
                (.images | type == "array" and length > 0) and
                all(.images[];
                  (.name | type == "string" and length > 0) and
                  (.version | type == "string" and length > 0))
              ' "$report" >/dev/null; then
                printf '::warning title=Build report deferred::Run %s has an invalid build report.\n' \
                  "$run_id"
                continue
              fi
              available_scans=$(jq -c '
                [.[].artifacts[]
                  | select(.expired == false and (.name | startswith("scan-")))
                  | .name]
                | unique
              ' <<<"$artifacts")
              missing_scans=$(jq -c --argjson available "$available_scans" '
                [.images[] | "scan-\(.name)-\(.version)"]
                | unique
                | . - $available
              ' "$report")
              if [[ "$(jq length <<<"$missing_scans")" -gt 0 ]]; then
                printf '::warning title=Build report deferred::Run %s is missing live scan artifacts: %s\n' \
                  "$run_id" "$(jq -r 'join(", ")' <<<"$missing_scans")"
                continue
              fi
              jq -c . <<<"$metadata" >> "$RUNNER_TEMP/reconciliation.ndjson"
            fi

          done < <(jq -c '.[]' "$RUNNER_TEMP/candidates.json")
          jq -s . "$RUNNER_TEMP/reconciliation.ndjson" > reconciliation.json

          count=$(jq length reconciliation.json)
          if [[ "$count" -eq 0 ]]; then
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            printf 'No unconsumed build report attempts; retaining the current catalog.\n'
          else
            jq --argjson ledger "$consumed_runs" '
              .[-1] as $latest
              | reduce .[] as $run ($ledger;
                  ($run.id | tostring) as $id
                  | .[$id] = ([.[$id] // 0, $run.run_attempt] | max)
                )
              | {
                  runId: ($latest.id | tostring),
                  runUrl: $latest.html_url,
                  commit: $latest.head_sha,
                  consumedRuns: .
                }
            ' reconciliation.json > catalog-source.json
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Download and validate build batches
        if: steps.reconcile.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r metadata; do
            run_id=$(jq -r .id <<<"$metadata")
            destination="input/${run_id}"
            mkdir -p "$destination/report" "$destination/scans"
            if [[ ! -f "$destination/report/build-report.json" ]]; then
              gh run download "$run_id" --repo "$REPOSITORY" \
                --name build-report --dir "$destination/report"
            fi
            while IFS= read -r artifact; do
              mkdir -p "$destination/scans/$artifact"
              gh run download "$run_id" --repo "$REPOSITORY" \
                --name "$artifact" --dir "$destination/scans/$artifact"
            done < <(
              gh api --paginate \
                "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false and (.name | startswith("scan-"))) | .name'
            )
            jq -e '
              (.images | length > 0) and
              all(.images[];
                (.name | type == "string" and length > 0) and
                (.version | type == "string" and length > 0) and
                (.track == "wolfi" or .track == "patched") and
                (.digest | test("^sha256:[0-9a-f]{64}$")) and
                (.inputDigest | test("^sha256:[0-9a-f]{64}$")) and
                (.runId | test("^[0-9]+$")) and
                (.runUrl | test("^https://github.com/tektum/verity-images/actions/runs/")) and
                (.sourceCommit | test("^[0-9a-f]{40}$")) and
                (.validatedAt | fromdateiso8601 > 0) and
                (.tags | type == "string" and length > 0) and
                (.scan.fixable == 0)
              )
            ' "$destination/report/build-report.json" >/dev/null
          done < <(jq -c '.[]' reconciliation.json)

      - name: Generate expected images
        if: steps.reconcile.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        run: devbox --quiet run -- sh -c 'python3 scripts/gen_matrix.py --all > expected-images.json'

      - name: Generate catalog
        if: steps.reconcile.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        shell: bash
        env:
          EXPECTED_IMAGES: expected-images.json
        run: |
          set -euo pipefail
          current=
          if [[ -f previous.json ]]; then
            current=previous.json
          fi
          while IFS= read -r metadata; do
            run_id=$(jq -r .id <<<"$metadata")
            run_url=$(jq -r .html_url <<<"$metadata")
            source_sha=$(jq -r .head_sha <<<"$metadata")
            published_at=$(jq -r .updated_at <<<"$metadata")
            output="input/${run_id}/catalog.json"
            devbox run -- python3 scripts/build_catalog.py \
              "input/${run_id}/report/build-report.json" "input/${run_id}/scans" \
              "$current" "$output" "$run_id" "$run_url" "$source_sha" "$published_at"
            current=$output
          done < <(jq -c '.[]' reconciliation.json)
          cp "$current" catalog.json
          devbox run -- jq --sort-keys --slurp '.[0] + {source: .[1]}' \
            catalog.json catalog-source.json > sourced-catalog.json
          mv sourced-catalog.json catalog.json
          if [[ ! -f previous.json ]]; then
            devbox run -- jq -e --slurp \
              '(.[0].images | map([.name, .version]) | sort) == (.[1].include | map([.name, .tag_version]) | sort)' \
              catalog.json expected-images.json >/dev/null
          fi
          devbox run -- jq -e \
            '.schemaVersion == 2 and (.images | length > 0) and all(.images[]; .scan.fixable == 0)' \
            catalog.json >/dev/null
          devbox run -- check-jsonschema --schemafile docs/catalog.schema.json catalog.json
          devbox run -- jq -e --slurp --from-file scripts/catalog_inventory.jq \
            catalog.json expected-images.json >/dev/null


      - name: Preserve current catalog
        if: steps.reconcile.outputs.ready == 'true' && steps.mode.outputs.value == 'packages'
        run: cp previous.json catalog.json

      - name: Select changed monitor shards
        id: monitor-scope
        if: steps.reconcile.outputs.ready == 'true' && steps.mode.outputs.value != 'packages'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f previous.json ]]; then
            cp previous.json previous-monitor.json
          else
            printf '{"images":[]}\n' > previous-monitor.json
          fi
          shards=$(devbox run -- python3 scripts/select_monitor_shards.py \
            previous-monitor.json catalog.json)
          printf 'shards=%s\n' "$shards" >> "$GITHUB_OUTPUT"

      - name: Upload catalog data
        if: steps.reconcile.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-json
          path: |
            catalog.json
            docs/catalog.schema.json
          if-no-files-found: error

      - name: Configure Pages
        if: steps.reconcile.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Prepare Pages files
        if: steps.reconcile.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          devbox run -- python3 scripts/validate_repository_state.py --live
          repository=$(devbox run -- jq -r .repository packages/repository-state.json)
          asset_id=$(devbox run -- jq -r .asset.id packages/repository-state.json)
          archive_sha256=$(devbox run -- jq -r .archive.sha256 packages/repository-state.json)
          gh api "repos/${repository}/releases/assets/${asset_id}" \
            -H 'Accept: application/octet-stream' > repository.tar.zst
          actual_sha256="sha256:$(sha256sum repository.tar.zst | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$archive_sha256" ]]; then
            printf '::error title=Archive digest mismatch::Expected %s but downloaded %s.\n' \
              "$archive_sha256" "$actual_sha256"
            exit 1
          fi
          mkdir pages
          cp -R "$RUNNER_TEMP/site/." pages/
          cp catalog.json pages/catalog.json
          cp docs/catalog.schema.json pages/catalog.schema.json
          devbox run -- python3 scripts/validate_repository_state.py --archive repository.tar.zst --pages pages

      - name: Enforce Pages artifact size limit
        if: steps.reconcile.outputs.ready == 'true'
        run: python3 scripts/check_pages_size.py pages

      - name: Upload Pages artifact
        if: steps.reconcile.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: pages

  deploy:
    if: needs.catalog.outputs.ready == 'true'
    needs: catalog
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-deploy/runner=4cpu-linux-x64
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  monitor:
    if: >-
      needs.catalog.outputs.monitor-shards != '' &&
      needs.catalog.outputs.monitor-shards != '[]'
    needs: [catalog, deploy]
    permissions:
      actions: write
      contents: read
      issues: write
      security-events: write
    uses: ./.github/workflows/monitor.yaml
    with:
      shards: ${{ needs.catalog.outputs.monitor-shards }}
