name: Package repository

on:
  pull_request:
    paths:
      - packages/openssl-fips-provider/**
      - .github/scripts/assemble-apk-repository.sh
      - scripts/apk_repository_policy.py
      - .github/workflows/apk-repository.yaml
  push:
    branches: [main]
    paths:
      - packages/openssl-fips-provider/**
      - .github/scripts/assemble-apk-repository.sh
      - scripts/apk_repository_policy.py
      - .github/workflows/apk-repository.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: uname -m | grep -qx aarch64
      - run: melange build packages/openssl-fips-provider/melange.yaml --arch aarch64 --out-dir dist/packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apk-aarch64
          path: dist/packages

  package-qa:
    needs: package-build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: uname -m | grep -qx aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: apk-aarch64
          path: dist/packages
      - run: scripts/test_apk_repository.sh

  fips-runtime:
    needs: package-qa
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: uname -m | grep -qx aarch64
      - run: scripts/test_fips.sh provider openssl-fips-provider:aarch64

  package-gate:
    needs: [package-build, package-qa, fips-runtime]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.package-build.result }}' = success
      - run: test '${{ needs.package-qa.result }}' = success
      - run: test '${{ needs.fips-runtime.result }}' = success
