name: Update Renovate checksums

# workflow_run is required so this trusted default-branch workflow can update an
# in-repository Renovate branch. It never checks out or executes pull request code.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build images]
    types: [completed]

permissions: {}

concurrency:
  group: renovate-checksum-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'renovate[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out trusted updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update canonical release asset checksum
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "$PR_NUMBER" ]] || {
            printf '::error title=Checksum update refused::No pull request is associated with this run.\n'
            exit 1
          }
          changed=$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          mapfile -t recipes < <(grep -E '^(images/traefik|images/go/[^/]+)/melange\.yaml$' <<<"$changed" || true)
          [[ "${#recipes[@]}" -le 1 ]] || {
            printf '::error title=Checksum update refused::Expected at most one supported recipe, found %s.\n' \
              "${#recipes[@]}"
            exit 1
          }
          [[ "${#recipes[@]}" -eq 1 ]] || exit 0
          recipe=${recipes[0]}
          response=$(gh api "repos/${REPOSITORY}/contents/${recipe}?ref=${HEAD_SHA}")
          blob_sha=$(jq -er .sha <<<"$response")
          jq -er .content <<<"$response" | base64 --decode > "$recipe"
          before=$(sha256sum "$recipe" | cut -d' ' -f1)
          case "$recipe" in
            images/traefik/melange.yaml) python3 scripts/update_release_asset_checksum.py "$recipe" ;;
            images/go/*/melange.yaml) python3 scripts/update_go_release_checksums.py "$recipe" ;;
            *) exit 1 ;;
          esac
          after=$(sha256sum "$recipe" | cut -d' ' -f1)
          [[ "$before" != "$after" ]] || exit 0
          content=$(base64 -w0 "$recipe")
          gh api --method PUT "repos/${REPOSITORY}/contents/${recipe}" \
            -f message='chore(deps): update release asset checksum' \
            -f content="$content" \
            -f sha="$blob_sha" \
            -f branch="$BRANCH"
