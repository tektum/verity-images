name: Capture Renovate Go remediation scans

on:
  pull_request:

permissions: {}

jobs:
  capture:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Renovate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture declared Go vulnerability scans
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          mkdir captures
          python3 scripts/go_remediation.py capture \
            --repository "$REPOSITORY" --pr "$PR_NUMBER" --run "$RUN_ID" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --output captures

      - name: Upload inert scan captures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: go-remediation-captures-${{ github.event.pull_request.head.sha }}
          path: captures
          if-no-files-found: error
          retention-days: 1
