package:
  name: verity-nfs-subdir-external-provisioner
  # yamllint disable-line rule:line-length
  version: "4.0.18"  # renovate: datasource=github-tags depName=kubernetes-sigs/nfs-subdir-external-provisioner extractVersion=^nfs-subdir-external-provisioner-(?<version>.+)$
  epoch: 0
  description: Dynamic sub-directory volume provisioner on an existing NFS server
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: c2a2d5d544781e3d3e4d7a7e2d21a8e64cf6d9d1
  x-net-floor: v0.62.0  # renovate: datasource=go depName=golang.org/x/net

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  # Upstream releases the provisioner under its chart tag; the image tag v4.0.2
  # predates every dependency fix since 2021.
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/nfs-subdir-external-provisioner
      tag: nfs-subdir-external-provisioner-${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # Upstream replaces golang.org/x/crypto with a 2022 snapshot. Fixed x/net
  # releases need a current x/crypto, x/sys and x/text, which go/remediate
  # would otherwise pull back below what x/net requires, so lift the whole
  # x/net requirement set first.
  - runs: |
      export GOFLAGS="$GOFLAGS -mod=mod"
      go mod edit -dropreplace golang.org/x/crypto
      go get golang.org/x/net@${{vars.x-net-floor}}
      test "$(go list -m -f '{{.Version}}' golang.org/x/net)" = '${{vars.x-net-floor}}'
      go list -m -f '{{.Replace}}' golang.org/x/crypto | grep -Fx '<nil>'
      go mod tidy
      go mod vendor

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/nfs-subdir-external-provisioner

  # Same static binary as the upstream Dockerfile, which installs it at
  # /nfs-subdir-external-provisioner. The release tag is not semver, so Go
  # stamps the main module with a pseudo-version of the pinned commit.
  - runs: |
      test "$(git rev-parse HEAD)" = '${{vars.source-commit}}'
      dest="${{targets.destdir}}"
      go build -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "$dest/usr/bin/nfs-subdir-external-provisioner" ./cmd/nfs-subdir-external-provisioner
      short=$(printf '%s' '${{vars.source-commit}}' | cut -c1-12)
      mod=$(go version -m "$dest/usr/bin/nfs-subdir-external-provisioner" \
        | awk '$1 == "mod" && $2 == "github.com/kubernetes-sigs/nfs-subdir-external-provisioner" { print $3 }')
      printf '%s\n' "$mod" | grep -Ex "v[0-9]+\.[0-9]+\.[0-9]+-(0\.)?[0-9]{14}-$short(\+dirty)?" ||
        { echo "unexpected main module version '$mod'" >&2; exit 1; }
      ln -s usr/bin/nfs-subdir-external-provisioner "$dest/nfs-subdir-external-provisioner"
      install -Dm644 LICENSE \
        "$dest/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nfs-subdir-external-provisioner build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nfs-subdir-external-provisioner-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nfs-subdir-external-provisioner-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test "$(readlink -f /nfs-subdir-external-provisioner)" = /usr/bin/nfs-subdir-external-provisioner
        apk info --who-owns /usr/bin/nfs-subdir-external-provisioner \
          | grep -F "${{package.name}}-${{package.full-version}}"
        # Without NFS_SERVER the provisioner exits before contacting a cluster.
        if nfs-subdir-external-provisioner >/tmp/out 2>&1; then exit 1; fi
        grep -F 'NFS_SERVER not set' /tmp/out
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/nfs-subdir-external-provisioner
    strip-prefix: nfs-subdir-external-provisioner-
    tag-filter-prefix: nfs-subdir-external-provisioner-
    use-tag: true
