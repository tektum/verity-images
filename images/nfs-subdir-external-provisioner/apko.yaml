contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-nfs-subdir-external-provisioner@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/nfs-subdir-external-provisioner

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Upstream mounts the NFS export here; the provisioner creates volume
  # directories beneath it.
  - path: /persistentvolumes
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # glog writes its log files to /tmp before logtostderr takes effect.
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
