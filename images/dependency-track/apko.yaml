contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - verity-dependency-track@local

accounts:
  groups:
    - groupname: dtrack
      gid: 1000
  users:
    - username: dtrack
      uid: 1000
      gid: 1000
      homedir: /data
  run-as: 1000

entrypoint:
  command: /usr/bin/dependency-track

work-dir: /opt/owasp/dependency-track

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  TZ: Etc/UTC
  LOGGING_LEVEL: INFO
  JAVA_OPTIONS: >-
    -XX:+UseG1GC -XX:+UseStringDeduplication -XX:+UseCompactObjectHeaders
    -XX:MaxRAMPercentage=80.0 -XX:MaxGCPauseMillis=250
  EXTRA_JAVA_OPTIONS: ""
  CONTEXT: /
  LANG: C.UTF-8
  HOME: /data
  DEFAULT_TEMPLATES_OVERRIDE_ENABLED: "false"
  DEFAULT_TEMPLATES_OVERRIDE_BASE_DIRECTORY: /data
  LOGGING_CONFIG_PATH: logback.xml

paths:
  - path: /data
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o775
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777
