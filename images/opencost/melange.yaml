package:
  name: verity-opencost
  # yamllint disable-line rule:line-length
  version: "1.120.4"  # renovate: datasource=github-releases depName=opencost/opencost versioning=regex:^(?<major>1)\.(?<minor>120)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes cost monitoring and allocation engine
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: 1741baaf3682445acba7dfd28c5c5a2a01d4006b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opencost/opencost
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/costmodel
  - runs: |
      # Upstream stamps the release version without the v prefix (see its justfile and release workflow).
      pkg=github.com/opencost/opencost/core/pkg/version
      go build -p 4 -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X $pkg.Version=${{package.version}} -X $pkg.GitCommit=$(git rev-parse --short=7 HEAD)" \
        -o "${{targets.destdir}}/usr/bin/opencost" ./cmd/costmodel
      go version -m "${{targets.destdir}}/usr/bin/opencost" \
        | awk '$1 == "mod" && $2 == "github.com/opencost/opencost" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      # Default pricing models shipped by the upstream image under /models.
      for model in default azure aws gcp alibaba oracle otc stackit; do
        install -Dm644 "configs/$model.json" "${{targets.destdir}}/models/$model.json"
      done
      install -Dm644 THIRD_PARTY_LICENSES.txt "${{targets.destdir}}/THIRD_PARTY_LICENSES.txt"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the OpenCost build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/opencost-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/opencost-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        opencost --help 2>&1 | grep -F 'Cost-Model metric exporter'
        apk info --who-owns /usr/bin/opencost \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        test -s /models/default.json
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: opencost/opencost
    tag-filter-prefix: v1.120.
    strip-prefix: v
