contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - sqlite=3.54.1-r0

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/sqlite3

environment:
  PATH: /usr/bin:/bin

work-dir: /data

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
