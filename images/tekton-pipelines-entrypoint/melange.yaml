package:
  name: verity-tekton-pipelines-entrypoint
  # yamllint disable-line rule:line-length
  version: "1.15.1"  # renovate: datasource=github-releases depName=tektoncd/pipeline versioning=regex:^(?<major>1)\.(?<minor>15)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Tekton Pipelines step entrypoint wrapper
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 16Gi

vars:
  source-commit: 7289f7d7e1ee24cbc84a58b9f763e3869db8ab2e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tektoncd/pipeline
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/entrypoint

  - runs: |
      install -d "${{targets.destdir}}/ko-app"

      go build -p 4 -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w" \
        -o "${{targets.destdir}}/ko-app/entrypoint" ./cmd/entrypoint
      go version -m "${{targets.destdir}}/ko-app/entrypoint" \
        | awk '$1 == "mod" && $2 == "github.com/tektoncd/pipeline" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Tekton entrypoint build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/tekton-pipelines-entrypoint-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/tekton-pipelines-entrypoint-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /ko-app/entrypoint --help 2>&1 | grep -F 'Usage of'
        apk info --who-owns /ko-app/entrypoint \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: tektoncd/pipeline
    tag-filter-prefix: v1.15.
    strip-prefix: v
