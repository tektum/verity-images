contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-portieris@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/portieris

cmd: --alsologtostderr -v=4

# Upstream runs from /run and keeps its notary trust cache in ./.trust. The
# Helm chart overrides the UID (1000060001), so /run is group 0 writable like
# the upstream image.
work-dir: /run

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run
    type: directory
    uid: 65532
    gid: 0
    permissions: 0o775
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
