package:
  name: verity-nfpm
  # yamllint disable-line rule:line-length
  version: "2.49.0"  # renovate: datasource=github-releases depName=goreleaser/nfpm extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Simple deb, rpm, apk, ipk, and Arch Linux packager
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 44ea002d6394aed93d4695d05add27915d6ba65d

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/goreleaser/nfpm
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/nfpm

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X main.version=${{package.version}} \
          -X main.commit=${{vars.source-commit}} \
          -X main.builtBy=verity" \
        -o "${{targets.destdir}}/usr/bin/nfpm" ./cmd/nfpm
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/usr/bin/nfpm" \
        | awk '$1 == "mod" && $2 == "github.com/goreleaser/nfpm/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.md \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nfpm build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nfpm-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nfpm-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        nfpm --version | grep -E "^GitVersion: +${{package.version}}$"
        apk info --who-owns /usr/bin/nfpm | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: goreleaser/nfpm
    strip-prefix: v
