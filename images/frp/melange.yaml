package:
  name: verity-frp
  # yamllint disable-line rule:line-length
  version: "0.72.0"  # renovate: datasource=github-releases depName=fatedier/frp versioning=regex:^(?<major>0)\.(?<minor>72)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Fast reverse proxy server and client for exposing services behind NAT
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: bafec21abce5f91ae4a05b4bd19c55543c263128

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local
    npm_config_cache: /var/cache/melange/npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fatedier/frp
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # The dashboards are embedded with go:embed; build them from the pinned lockfile.
  - runs: |
      cd web
      npm ci --no-audit --no-fund
      npm run build --workspace frps
      npm run build --workspace frpc
      test -s frps/dist/index.html
      test -s frpc/dist/index.html

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/frps ./cmd/frpc

  - runs: |
      for component in frps frpc; do
        go build -mod=readonly -trimpath -buildvcs=true -tags "$component" -ldflags="-s -w" \
          -o "${{targets.destdir}}/usr/bin/$component" "./cmd/$component"
        go version -m "${{targets.destdir}}/usr/bin/$component" \
          | awk '$1 == "mod" && $2 == "github.com/fatedier/frp" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
        test "$("${{targets.destdir}}/usr/bin/$component" --version)" = '${{package.version}}'
      done
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go and npm dependency metadata for the frp build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/frp-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/frp-build/go.sum"
          install -Dm644 web/package-lock.json \
            "${{targets.subpkgdir}}/usr/share/frp-build/web/package-lock.json"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test "$(frps --version)" = '${{package.version}}'
        test "$(frpc --version)" = '${{package.version}}'
        apk info --who-owns /usr/bin/frps \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --who-owns /usr/bin/frpc \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: fatedier/frp
    strip-prefix: v
    tag-filter-prefix: v0.72.
    use-tag: true
