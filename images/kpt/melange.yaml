package:
  name: verity-kpt
  # yamllint disable-line rule:line-length
  version: "1.0.1"  # renovate: datasource=github-releases depName=kptdev/kpt extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes configuration package manager with KRM function pipelines
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 6c8a2e16f1f51605d6db9404ddea4f05db0e2aa2

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kptdev/kpt
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Same version stamping as the upstream goreleaser release build.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/kptdev/kpt/run.version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kpt" .
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/usr/bin/kpt" \
        | awk '$1 == "mod" && $2 == "github.com/kptdev/kpt" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        HOME=/tmp kpt version | grep -Fx "Version: ${{package.version}}"
        apk info --who-owns /usr/bin/kpt | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kptdev/kpt
    strip-prefix: v
