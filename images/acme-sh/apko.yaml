contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - acme.sh
    - busybox
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/acme.sh

work-dir: /acme.sh

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  LE_WORKING_DIR: /usr/share/acme.sh
  LE_CONFIG_HOME: /acme.sh
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /acme.sh
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
