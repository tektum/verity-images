package:
  name: verity-nats-top
  # yamllint disable-line rule:line-length
  version: "0.6.5"  # renovate: datasource=github-releases depName=nats-io/nats-top versioning=regex:^(?<major>0)\.(?<minor>6)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Top-like monitoring tool for NATS servers
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: a0c9ca33ec40ed92c5314d0076aa6f7c07a4ef50

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nats-io/nats-top
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      commit=$(git rev-parse HEAD)
      build_date=$(git show -s --format=%cI HEAD)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=${{package.version}} -X main.commit=$commit -X main.date=$build_date" \
        -o "${{targets.destdir}}/usr/bin/nats-top" .
      go version -m "${{targets.destdir}}/usr/bin/nats-top" \
        | awk '$1 == "mod" && $2 == "github.com/nats-io/nats-top" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/nats-top" --version 2>&1 \
        | grep -F 'nats-top v${{package.version}}, commit '"$commit"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nats-top build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nats-top-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nats-top-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        nats-top --version 2>&1 | grep -F 'nats-top v${{package.version}}'
        apk info --who-owns /usr/bin/nats-top \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'The MIT License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: nats-io/nats-top
    strip-prefix: v
    tag-filter-prefix: v0.6.
    use-tag: true
