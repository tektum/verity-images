package:
  name: verity-cloudprober
  # yamllint disable-line rule:line-length
  version: "0.14.7"  # renovate: datasource=github-releases depName=cloudprober/cloudprober extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Active monitoring software to detect failures before your customers do
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudprober/cloudprober
      tag: v${{package.version}}
      expected-commit: 2538e694312bb67b824fd3ff7b836babe4fbcc85

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/cloudprober

  - runs: |
      timestamp=$(git log -1 --format=%ct)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=v${{package.version}} -X main.buildTimestamp=$timestamp" \
        -o "${{targets.destdir}}/usr/bin/cloudprober" ./cmd/cloudprober
      go version -m "${{targets.destdir}}/usr/bin/cloudprober" \
        | awk '$1 == "mod" && $2 == "github.com/cloudprober/cloudprober" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cloudprober build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/cloudprober-build/go.mod"
          if [ -f go.sum ]; then
            install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/cloudprober-build/go.sum"
          fi

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        cloudprober --version | grep -Fx 'v${{package.version}}'
        apk info --who-owns /usr/bin/cloudprober \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0

update:
  enabled: true
  github:
    identifier: cloudprober/cloudprober
    strip-prefix: v
    tag-filter: v
    use-tag: true
