contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - syslog-ng

accounts:
  groups:
    - groupname: syslog
      gid: 65532
  users:
    - username: syslog
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: >-
    /usr/bin/syslog-ng --foreground --no-caps
    --cfgfile=/etc/syslog-ng/syslog-ng.conf
    --persist-file=/var/lib/syslog-ng/syslog-ng.persist
    --pidfile=/var/lib/syslog-ng/syslog-ng.pid
    --control=/var/lib/syslog-ng/syslog-ng.ctl

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /etc/syslog-ng
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/lib/syslog-ng
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/syslog-ng
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
