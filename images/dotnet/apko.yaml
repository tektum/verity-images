contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - dotnet-8-runtime@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/dotnet

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  DOTNET_RUNNING_IN_CONTAINER: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
