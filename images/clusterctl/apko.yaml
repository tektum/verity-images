contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-clusterctl@local

# Upstream builds on gcr.io/distroless/static:nonroot and runs as USER 65532
# with HOME /home/nonroot, where clusterctl keeps
# $HOME/.config/cluster-api (clusterctl.yaml, overrides, version state).
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

# Upstream uses ENTRYPOINT ["/clusterctl"] with WORKDIR /. This image installs
# /usr/bin/clusterctl as the entrypoint and keeps /clusterctl as a symlink.
entrypoint:
  command: /usr/bin/clusterctl

work-dir: /

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /clusterctl
    type: symlink
    source: /usr/bin/clusterctl
    uid: 0
    gid: 0
  # apko applies the symlink entry's mode (0) through the link to its target,
  # so the binary mode is restored explicitly.
  - path: /usr/bin/clusterctl
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
