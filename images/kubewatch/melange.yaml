package:
  name: verity-kubewatch
  # yamllint disable-line rule:line-length
  version: "2.16.1"  # renovate: datasource=github-releases depName=robusta-dev/kubewatch versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes resource watcher that sends change notifications
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: d821119e025a2f81ec3da66a6465331a7451328d

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/robusta-dev/kubewatch
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # The module path github.com/bitnami-labs/kubewatch has no /v2 suffix, so
      # Go stamps the v2 tag as a pseudo-version. Build without VCS stamping and
      # let metadata.yaml declare the module as the scan identity instead.
      # Same stamps as the upstream Makefile: gitCommit is `git describe --tags`
      # and buildDate is the commit time so the binary does not depend on the
      # build clock.
      build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%S+0000)
      pkg=github.com/bitnami-labs/kubewatch/cmd
      ldflags="-s -w -X $pkg.gitCommit=v${{package.version}} -X $pkg.buildDate=$build_date"
      go build -mod=readonly -trimpath -buildvcs=false -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/kubewatch" .
      "${{targets.destdir}}/usr/bin/kubewatch" version 2>&1 \
        | grep -F 'gitCommit: v${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kubewatch build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kubewatch-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kubewatch-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kubewatch version 2>&1 | grep -F 'gitCommit: v${{package.version}}'
        apk info --who-owns /usr/bin/kubewatch | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: robusta-dev/kubewatch
    strip-prefix: v
