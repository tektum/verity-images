contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - verity-wiremock@local

accounts:
  groups:
    - groupname: wiremock
      gid: 65532
  users:
    - username: wiremock
      uid: 65532
      gid: 65532
      homedir: /home/wiremock
  run-as: 65532

entrypoint:
  command: >-
    /usr/lib/jvm/default-jvm/bin/java -cp /var/wiremock/lib/*:/var/wiremock/extensions/* wiremock.Run

work-dir: /home/wiremock

environment:
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin

paths:
  - path: /home/wiremock
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/wiremock/mappings
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/wiremock/__files
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
