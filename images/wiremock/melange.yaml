package:
  name: verity-wiremock
  # yamllint disable-line rule:line-length
  version: "3.13.2"  # renovate: datasource=github-tags depName=wiremock/wiremock versioning=regex:^(?<major>3)\.(?<minor>13)\.(?<patch>\d+)$
  epoch: 0
  description: WireMock HTTP mock server on Jetty 12
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - openjdk-21-default-jvm
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

# WireMock 3.x ships two server bindings. The default standalone jar shades
# Jetty 11, which is end of community support and carries advisories fixed
# only in Jetty 12, and relocation hides those classes from scanners. This
# recipe ships the upstream wiremock-jetty12 binding with every runtime
# dependency as its own jar instead, and raises these floors.
vars:
  # yamllint disable rule:line-length
  jetty-version: 12.0.41  # renovate: datasource=maven depName=org.eclipse.jetty:jetty-server versioning=regex:^(?<major>12)\.(?<minor>0)\.(?<patch>\d+)$
  httpclient5-version: 5.6.5  # renovate: datasource=maven depName=org.apache.httpcomponents.client5:httpclient5 versioning=regex:^(?<major>5)\.(?<minor>6)\.(?<patch>\d+)$
  jackson-version: 2.21.8  # renovate: datasource=maven depName=com.fasterxml.jackson:jackson-bom versioning=regex:^(?<major>2)\.(?<minor>21)\.(?<patch>\d+)$
  guava-version: 33.8.0-jre  # renovate: datasource=maven depName=com.google.guava:guava versioning=regex:^(?<major>33)\.(?<minor>\d+)\.(?<patch>\d+)-jre$
  handlebars-version: 4.5.8  # renovate: datasource=maven depName=com.github.jknack:handlebars versioning=regex:^(?<major>4)\.(?<minor>\d+)\.(?<patch>\d+)$
  commons-lang3-version: 3.22.0  # renovate: datasource=maven depName=org.apache.commons:commons-lang3
  # yamllint enable rule:line-length

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      # WireMock 3.x includes the Jetty 12 module only on JDK 17+, and its HTTPS
      # proxy CA compiles against the JDK 17 sun.security.x509 API, which JDK 21
      # removed. It runs on JDK 21.
      - openjdk-17-default-jdk
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk
    GRADLE_USER_HOME: /var/cache/gradle
    GRADLE_OPTS: >-
      -Dorg.gradle.internal.http.connectionTimeout=120000
      -Dorg.gradle.internal.http.socketTimeout=120000
      -Dorg.gradle.internal.repository.max.retries=10
      -Dorg.gradle.internal.repository.initial.backoff=2000

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wiremock/wiremock
      tag: ${{package.version}}
      expected-commit: 88587aa13b4899da080538e1b21bec0da105491e
  - runs: |
      # Apply the security floors and fail if an upstream pin moved.
      sed -i "s|^\(    jetty *: \)'12\.[0-9.]*',|\1'${{vars.jetty-version}}',|" wiremock-jetty12/build.gradle
      grep -q "^    jetty *: '${{vars.jetty-version}}',$" wiremock-jetty12/build.gradle
      hc5=org.apache.httpcomponents.client5:httpclient5
      sed -i "s|\"$hc5:[0-9.]*\"|\"$hc5:${{vars.httpclient5-version}}\"|" build.gradle
      grep -q '"org.apache.httpcomponents.client5:httpclient5:${{vars.httpclient5-version}}"' build.gradle
      for pin in "jackson:${{vars.jackson-version}}" "guava:${{vars.guava-version}}" \
        "handlebars:${{vars.handlebars-version}}"; do
        key=${pin%%:*} value=${pin#*:}
        sed -i "s|^\(    $key *: \)'[^']*',|\1'$value',|" build.gradle
        grep -q "^    $key *: '$value',$" build.gradle
      done
      # Handlebars 4.4 moved AssignHelper and NumberHelper to helper.ext.
      sed -i -e 's/handlebars\.helper\.\(AssignHelper\|NumberHelper\);/handlebars.helper.ext.\1;/' \
        src/main/java/com/github/tomakehurst/wiremock/extension/responsetemplating/TemplateEngine.java
      grep -q 'import com.github.jknack.handlebars.helper.ext.AssignHelper;' \
        src/main/java/com/github/tomakehurst/wiremock/extension/responsetemplating/TemplateEngine.java
      # commons-lang3 arrives transitively; raise its floor for every configuration.
      cat >> build.gradle <<'GRADLE'

      // Raise a requested version to the floor, never lower it.
      def parts = { String v -> v.tokenize('.-').collect { it.isInteger() ? it.toInteger() : 0 } }
      def lower = { String a, String b ->
        def x = parts(a), y = parts(b)
        for (i in 0..<Math.max(x.size(), y.size())) {
          def l = i < x.size() ? x[i] : 0, r = i < y.size() ? y[i] : 0
          if (l != r) return l < r
        }
        false
      }
      allprojects {
        configurations.configureEach {
          resolutionStrategy.eachDependency { details ->
            def requested = details.requested.version
            if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3' &&
                requested && lower(requested, '${{vars.commons-lang3-version}}')) {
              details.useVersion '${{vars.commons-lang3-version}}'
            }
          }
        }
      }
      GRADLE
      # Collect the Jetty 12 binding, the core jar, and the resolved runtime
      # classpath (Jetty 11 is excluded upstream) as separate jars.
      cat >> wiremock-jetty12/build.gradle <<'GRADLE'

      tasks.register('verityRuntimeLibs', Sync) {
        from configurations.runtimeClasspath
        from jar
        into layout.buildDirectory.dir('verity-lib')
      }
      GRADLE
      # The wrapper download uses a 10s timeout; retry it before the real build.
      for attempt in 1 2 3 4 5; do ./gradlew --version >/dev/null 2>&1 && break; sleep 10; done
      ./gradlew --no-daemon --max-workers=4 -Dorg.gradle.jvmargs=-Xmx3g :wiremock-jetty12:verityRuntimeLibs
      lib=wiremock-jetty12/build/verity-lib
      test -f "$lib/wiremock-${{package.version}}.jar"
      test -f "$lib/wiremock-jetty12-${{package.version}}.jar"
      test -f "$lib/jetty-server-${{vars.jetty-version}}.jar"
      test -f "$lib/httpclient5-${{vars.httpclient5-version}}.jar"
      test -f "$lib/jackson-databind-${{vars.jackson-version}}.jar"
      test -f "$lib/guava-${{vars.guava-version}}.jar"
      test -f "$lib/handlebars-${{vars.handlebars-version}}.jar"
      # commons-lang3 must resolve at or above its floor.
      lang3=$(ls "$lib" | sed -n 's/^commons-lang3-\([0-9.]*\)\.jar$/\1/p')
      test -n "$lang3"
      awk -v have="$lang3" -v want=${{vars.commons-lang3-version}} 'BEGIN {
        n = split(have, h, "."); m = split(want, w, ".")
        for (i = 1; i <= (n > m ? n : m); i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 > w[i] + 0) ? 0 : 1
        }
        exit 0
      }'
      if ls "$lib" | grep -E -e '-11\.[0-9.]+\.jar$' | grep -E '^(jetty|http2|websocket)'; then
        echo "Jetty 11 leaked onto the runtime classpath" >&2
        exit 1
      fi
      # Jars live under /usr/share: melange writes its SBOM under var/lib, and a /var
      # tree created inside the build container is not writable by melange.
      # The image adds /var/wiremock/extensions for user extensions.
      install -d "${{targets.destdir}}/usr/share/wiremock/lib" \
        "${{targets.destdir}}/usr/share/licenses/verity-wiremock"
      install -m644 "$lib"/*.jar "${{targets.destdir}}/usr/share/wiremock/lib/"
      install -m644 LICENSE.txt NOTICE.txt "${{targets.destdir}}/usr/share/licenses/verity-wiremock/"
      find . -name .gradle -type d -prune -exec rm -rf {} +

test:
  environment:
    contents:
      packages:
        - openjdk-21-default-jvm
  pipeline:
    - runs: |
        java -cp '/usr/share/wiremock/lib/*' wiremock.Run --version | grep -Fx "${{package.version}}"

update:
  enabled: true
  github:
    identifier: wiremock/wiremock
    use-tag: true
    tag-filter-prefix: "3.13."
