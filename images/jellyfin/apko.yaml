contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-jellyfin@local

accounts:
  groups:
    - groupname: jellyfin
      gid: 65532
  users:
    - username: jellyfin
      uid: 65532
      gid: 65532
      homedir: /config
      shell: /sbin/nologin
  run-as: 65532

work-dir: /config

entrypoint:
  command: /usr/bin/dotnet /usr/lib/jellyfin/jellyfin.dll

environment:
  DOTNET_RUNNING_IN_CONTAINER: "true"
  HOME: /config
  JELLYFIN_CACHE_DIR: /cache
  JELLYFIN_CONFIG_DIR: /config/config
  JELLYFIN_DATA_DIR: /config
  JELLYFIN_FFMPEG: /usr/lib/jellyfin-ffmpeg/ffmpeg
  JELLYFIN_LOG_DIR: /config/log
  JELLYFIN_WEB_DIR: /usr/share/jellyfin/web
  PATH: /usr/bin:/bin

paths:
  - path: /config
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /cache
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /media
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

annotations:
  org.opencontainers.image.source: https://github.com/jellyfin/jellyfin
  org.opencontainers.image.licenses: GPL-2.0-only AND GPL-2.0-or-later AND LGPL-2.1-or-later AND MIT
