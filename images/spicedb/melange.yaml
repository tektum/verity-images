package:
  name: verity-spicedb
  # yamllint disable-line rule:line-length
  version: "1.57.1"  # renovate: datasource=github-releases depName=authzed/spicedb versioning=regex:^(?<major>1)\.(?<minor>57)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Open source, Google Zanzibar-inspired fine-grained permissions database
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  source-commit: 7074da7242e5aedfeb4586d93a403eca45388ada

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/authzed/spicedb
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/spicedb

  - name: Build
    runs: |
      # Same package, build tag and linker flags as the upstream goreleaser
      # build: memoryprotection and -checklinkname=0 are required by the
      # go-rtml memory limiter, and cobrautil carries the reported version.
      go build -mod=readonly -trimpath -buildvcs=true -tags memoryprotection \
        -ldflags="-s -w -checklinkname=0 -X github.com/jzelinskie/cobrautil/v2.Version=v${{package.version}}" \
        -o spicedb ./cmd/spicedb

      install -Dm755 spicedb "${{targets.destdir}}/usr/bin/spicedb"
      # Upstream images install the binary as /usr/local/bin/spicedb.
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      ln -s ../../bin/spicedb "${{targets.destdir}}/usr/local/bin/spicedb"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

      "${{targets.destdir}}/usr/bin/spicedb" version | grep -Fx 'spicedb v${{package.version}}'
      go version -m "${{targets.destdir}}/usr/bin/spicedb" \
        | awk '$1 == "mod" && $2 == "github.com/authzed/spicedb" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      go version -m "${{targets.destdir}}/usr/bin/spicedb" \
        | grep -Fx "$(printf '\tbuild\t-tags=memoryprotection')"
      rm spicedb

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the SpiceDB build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/spicedb-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/spicedb-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spicedb version | grep -Fx 'spicedb v${{package.version}}'
        spicedb --help | grep -F 'serve'
        test "$(readlink /usr/local/bin/spicedb)" = ../../bin/spicedb
        apk info --who-owns /usr/bin/spicedb \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: authzed/spicedb
    strip-prefix: v
    tag-filter-prefix: v1.57.
    use-tag: true
