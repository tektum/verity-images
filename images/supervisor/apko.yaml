contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - python-3.13
    - supervisor=4.3.0-r11
    - supervisor-config=4.3.0-r11

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/supervisord

cmd: --nodaemon --configuration /etc/supervisord.conf

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/supervisord.conf
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o644
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
