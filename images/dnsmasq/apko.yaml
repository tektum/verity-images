contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - dnsmasq=2.93-r3

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

# Runtime contract: dnsmasq runs as uid 65532 in the foreground and logs to
# stderr. Both flags live in the entrypoint so they survive replacement
# arguments. The default command only moves DNS to the unprivileged port 5353;
# replacement arguments must pass --port themselves (dnsmasq rejects a repeated
# --port). Port 53 needs NET_BIND_SERVICE or a low
# net.ipv4.ip_unprivileged_port_start. Started as root, the Wolfi build binds and
# then drops to its compiled default user nonroot (65532). DHCP and TFTP are
# not part of the non-root contract.
entrypoint:
  command: /usr/bin/dnsmasq --keep-in-foreground --log-facility=-

cmd: --port=5353

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
