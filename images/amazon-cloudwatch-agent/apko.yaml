contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-amazon-cloudwatch-agent@local

# Mirror public.ecr.aws/cloudwatch-agent/cloudwatch-agent: it runs as root from /,
# with RUN_IN_CONTAINER=True so start-amazon-cloudwatch-agent translates
# /etc/cwagentconfig (or CW_CONFIG_CONTENT) into
# /opt/aws/amazon-cloudwatch-agent/etc and execs the agent as PID 1. Container
# Insights reads host and kubelet state that is root-only on standard nodes.
accounts:
  run-as: 0

entrypoint:
  command: /opt/aws/amazon-cloudwatch-agent/bin/start-amazon-cloudwatch-agent

work-dir: /

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUN_IN_CONTAINER: "True"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
