package:
  name: verity-amazon-cloudwatch-agent
  # yamllint disable-line rule:line-length
  version: "1.300075.0"  # renovate: datasource=github-releases depName=aws/amazon-cloudwatch-agent versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Amazon CloudWatch agent that collects metrics, logs, and traces
  copyright:
    - license: MIT
  # The agent links the OpenTelemetry Collector, Telegraf inputs, and both AWS
  # SDKs into one ~230 MB binary; size the build like the heaviest siblings.
  resources:
    cpu: "16"
    memory: 32Gi

vars:
  source-commit: e9c5a5aa865e13ecc0d9fbdd3144f8e3777693ba
  prometheus-floor: v0.312.0  # renovate: datasource=go depName=github.com/prometheus/prometheus
  thrift-floor: v0.25.0  # renovate: datasource=go depName=github.com/apache/thrift

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/amazon-cloudwatch-agent
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # Security floors, raised before remediation so it builds against them.
  # Upstream pins a prometheus main snapshot (v0.311.2-0.20260409...) that the
  # scanners flag. The minimum fixed release, v0.311.3, sits on the 3.11 branch
  # and lacks the service-discovery metrics API that the replaced
  # amazon-contributing prometheusreceiver fork compiles against, so remediation
  # cannot repair it; the 3.12 line has both. Thrift is an indirect dependency
  # that govulncheck finds unreachable but Grype matches at module granularity.
  - runs: |
      raise_floor() {
        current="$(GOTOOLCHAIN=local go list -m -f '{{.Version}}' "$1")"
        if awk -v have="$current" -v want="$2" 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
          }
          exit (have ~ /-/) ? 0 : 1
        }'; then
          GOTOOLCHAIN=local go get "$1@$2"
        fi
      }
      raise_floor github.com/prometheus/prometheus ${{vars.prometheus-floor}}
      raise_floor github.com/apache/thrift ${{vars.thrift-floor}}
  - uses: go/remediate
    with:
      modroot: .
      # yamllint disable-line rule:line-length
      packages: ./cmd/amazon-cloudwatch-agent ./cmd/config-translator ./cmd/config-downloader ./cmd/start-amazon-cloudwatch-agent
  # Mirror the official image layout under /opt/aws/amazon-cloudwatch-agent, whose
  # paths the binaries hardcode (tool/paths). The upstream Makefile still passes
  # -X cfg/agentinfo.VersionStr, but that package no longer exists: the agent reads
  # its version from bin/CWAGENT_VERSION beside the executable (internal/version),
  # so the build writes that file and asserts the agent reports it.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      module=github.com/aws/amazon-cloudwatch-agent
      agent_dir="${{targets.destdir}}/opt/aws/amazon-cloudwatch-agent"
      install -d -m755 "$agent_dir/bin" "$agent_dir/doc" "$agent_dir/logs" "$agent_dir/var" \
        "$agent_dir/etc/amazon-cloudwatch-agent.d"
      for cmd in amazon-cloudwatch-agent config-translator config-downloader start-amazon-cloudwatch-agent; do
        go build -trimpath -buildvcs=false -ldflags="-s -w" -o "$agent_dir/bin/$cmd" "./cmd/$cmd"
        go version -m "$agent_dir/bin/$cmd" | awk '$1 == "path" { print $2 }' | grep -Fx "${module}/cmd/$cmd"
      done
      printf '%s\n' '${{package.version}}' > "$agent_dir/bin/CWAGENT_VERSION"
      chmod 0644 "$agent_dir/bin/CWAGENT_VERSION"
      "$agent_dir/bin/amazon-cloudwatch-agent" -version | grep -F "CWAgent/${{package.version}} (go"
      install -Dm644 cfg/commonconfig/common-config.toml "$agent_dir/etc/common-config.toml"
      install -Dm644 translator/config/schema.json "$agent_dir/doc/amazon-cloudwatch-agent-schema.json"
      for file in LICENSE NOTICE THIRD-PARTY-LICENSES; do
        install -Dm644 "licensing/$file" "$agent_dir/$file"
      done
      install -Dm644 RELEASE_NOTES "$agent_dir/RELEASE_NOTES"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the amazon-cloudwatch-agent build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/amazon-cloudwatch-agent-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        bin=/opt/aws/amazon-cloudwatch-agent/bin
        "$bin/amazon-cloudwatch-agent" -version | grep -F "CWAgent/${{package.version}} (go"
        grep -Fx '${{package.version}}' "$bin/CWAGENT_VERSION"
        for cmd in config-translator config-downloader start-amazon-cloudwatch-agent; do
          [ -x "$bin/$cmd" ]
        done
        apk info --who-owns "$bin/amazon-cloudwatch-agent" \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: aws/amazon-cloudwatch-agent
    strip-prefix: v
