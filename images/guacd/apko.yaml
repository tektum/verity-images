contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - guacamole-server=1.6.0-r5
    - libguac-client-rdp=1.6.0-r5
    - libguac-client-ssh=1.6.0-r5
    - libguac-client-telnet=1.6.0-r5
    - libguac-client-vnc=1.6.0-r5
    # Fonts the upstream guacamole/guacd image adds for SSH and telnet terminal
    # rendering. Upstream terminus-font has no Wolfi package. Upstream also adds
    # ghostscript for RDP printing; the Wolfi build pulls in GTK 3 and 45 more
    # packages (about 350 MB), so it is omitted and RDP printing is unavailable.
    - ca-certificates-bundle
    - font-liberation
    - font-noto-cjk
    - ttf-dejavu

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

# Runtime contract, matching upstream src/guacd-docker/bin/entrypoint.sh:
# guacd stays in the foreground and binds 0.0.0.0. Both flags live in the
# entrypoint so they survive replacement arguments. The default command sets
# the upstream default log level and the IANA guacd port 4822. Upstream's
# LOG_LEVEL and GUACD_LOG_LEVEL variables need a shell wrapper; pass -L instead.
# The Wolfi build has no kubernetes protocol plugin.
entrypoint:
  command: /usr/sbin/guacd -f -b 0.0.0.0

cmd: -l 4822 -L info

environment:
  PATH: /usr/sbin:/usr/bin:/bin
  HOME: /home/nonroot
  LC_ALL: C.UTF-8

work-dir: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
