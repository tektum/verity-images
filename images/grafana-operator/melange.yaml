package:
  name: verity-grafana-operator
  # yamllint disable-line rule:line-length
  version: "5.25.0"  # renovate: datasource=github-releases depName=grafana/grafana-operator versioning=regex:^(?<major>5)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator that manages Grafana instances, dashboards, datasources and alerting through CRs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 1d8584df2127ad9341567efb2683adaf25894ebe

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/grafana-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Stamp the release the way upstream .ko.yaml does. The Wolfi package leaves
      # embeds.Version at "dev", which the operator logs on every line and sends
      # to Grafana in its User-Agent.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/grafana/grafana-operator/v5/embeds.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/grafana-operator" .
      go version -m "${{targets.destdir}}/usr/bin/grafana-operator" \
        | awk '$1 == "mod" && $2 == "github.com/grafana/grafana-operator/v5" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the grafana-operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/grafana-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/grafana-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        # The operator has no version flag; every setup log line carries the
        # stamped version, and an unreachable kubeconfig fails right after it.
        cat >/tmp/kubeconfig <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
          - name: unreachable
            cluster:
              server: https://127.0.0.1:1
        contexts:
          - name: unreachable
            context: {cluster: unreachable, user: unreachable}
        current-context: unreachable
        users:
          - name: unreachable
            user: {token: unreachable}
        EOF
        if KUBECONFIG=/tmp/kubeconfig grafana-operator >/tmp/out 2>&1; then
          echo 'operator unexpectedly started without a cluster' >&2
          exit 1
        fi
        grep -F 'unable to detect the platform' /tmp/out
        grep -F '"version": "v${{package.version}}"' /tmp/out
        grafana-operator --help | grep -F -e '--health-probe-bind-address'
        apk info --who-owns /usr/bin/grafana-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: grafana/grafana-operator
    strip-prefix: v
    tag-filter-prefix: v5.
    use-tag: true
