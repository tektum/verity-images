package:
  name: verity-csi-attacher
  # yamllint disable-line rule:line-length
  version: "4.13.0"  # renovate: datasource=github-releases depName=kubernetes-csi/external-attacher versioning=regex:^(?<major>4)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: CSI sidecar that attaches and detaches volumes through the CSI driver ControllerPublishVolume RPCs
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 40d44ae14961a415348180a0e666651e82e44eb7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/external-attacher
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/csi-attacher
  # Build without VCS stamping so the binary does not depend on checkout
  # metadata; metadata.yaml declares the /v4 module purl, versioned from
  # package.version, for the scanner.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      go build -mod=vendor -trimpath -buildvcs=false \
        -ldflags="-s -w -X main.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/csi-attacher" ./cmd/csi-attacher
      go version -m "${{targets.destdir}}/usr/bin/csi-attacher" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/kubernetes-csi/external-attacher/v4/cmd/csi-attacher
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the csi-attacher build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/csi-attacher-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/csi-attacher-build/go.sum"
          install -Dm644 vendor/modules.txt "${{targets.subpkgdir}}/usr/share/csi-attacher-build/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        csi-attacher --version | grep -F "v${{package.version}}"
        csi-attacher -h 2>&1 | grep -F -- '-csi-address'
        apk info --who-owns /usr/bin/csi-attacher \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-attacher
    strip-prefix: v
