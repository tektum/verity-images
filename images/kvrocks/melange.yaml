package:
  name: kvrocks-2.17
  # yamllint disable-line rule:line-length
  version: "2.17.0"  # renovate: datasource=github-releases depName=apache/kvrocks versioning=regex:^(?<major>2)\.(?<minor>17)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Distributed key-value NoSQL database on RocksDB, compatible with the Redis protocol
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "16"
    memory: 32Gi

vars:
  source-commit: 185d4221df20af8ed3416e4dec4de8917312a2e9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - git
      - libtool
      - linux-headers
      - openssl-dev
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/kvrocks
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      # PORTABLE=1 keeps RocksDB free of -march=native so the image runs on any CPU.
      ./x.py build --compiler=gcc --skip-build \
        -DCMAKE_BUILD_TYPE=Release \
        -DENABLE_OPENSSL=ON \
        -DPORTABLE=1 \
        -DCMAKE_EXE_LINKER_FLAGS="-latomic"
      # jemalloc 5.3.1 (fetched by the configure step above) calls
      # std::__throw_bad_alloc(), which the Wolfi libstdc++ no longer
      # declares; throw the standard exception directly instead.
      sed -i 's/std::__throw_bad_alloc()/throw std::bad_alloc()/' \
        build/_deps/jemalloc-src/src/jemalloc_cpp.cpp
      grep -F 'throw std::bad_alloc()' build/_deps/jemalloc-src/src/jemalloc_cpp.cpp
      cmake --build build -j"$(nproc)" -t kvrocks
      install -Dm755 build/kvrocks "${{targets.destdir}}/usr/bin/kvrocks"
      install -Dm644 kvrocks.conf "${{targets.destdir}}/etc/kvrocks/kvrocks.conf"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        kvrocks --version | grep -F "${{package.version}}"
        apk info --who-owns /usr/bin/kvrocks \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: apache/kvrocks
    strip-prefix: v
    tag-filter-prefix: v2.17.
    use-tag: true
