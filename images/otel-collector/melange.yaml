package:
  name: verity-otel-collector
  version: "0.160.0"
  epoch: 1  # Go remediation
  description: OpenTelemetry Collector core distribution.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector
      tag: v${{package.version}}
      expected-commit: cd3455cf3a7f672208140b1ebb1581c542b2b0ed

  - uses: go/remediate
    with:
      modroot: cmd/otelcorecol
      packages: .

  - runs: |
      cd cmd/otelcorecol
      sed -i \
        -e 's/Command:     "otelcorecol"/Command:     "otelcol"/' \
        -e 's/Description: ".*testing only."/Description: "OpenTelemetry Collector"/' \
        -e 's/Version:     "0.135.0-dev"/Version:     "${{package.version}}"/' \
        main.go

      go build -trimpath -tags grpcnotrace -ldflags="-s -w" -o otelcol .

      install -Dm755 otelcol "${{targets.destdir}}/otelcol"
      install -Dm644 ../../examples/local/otel-config.yaml \
        "${{targets.destdir}}/etc/otelcol/config.yaml"
      install -Dm644 ../../LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

      "${{targets.destdir}}/otelcol" --version 2>&1 \
        | grep -F "otelcol version ${{package.version}}"
      "${{targets.destdir}}/otelcol" components >/dev/null

  - uses: strip

test:
  pipeline:
    - runs: |
        /otelcol --version 2>&1 | grep -F "otelcol version ${{package.version}}"
        /otelcol components >/dev/null
        test -s /etc/otelcol/config.yaml
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector
    strip-prefix: v
    tag-filter: v
    use-tag: true
