contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - nginx-mainline

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532

entrypoint:
  command: /usr/sbin/nginx

cmd: -g "daemon off;"

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
