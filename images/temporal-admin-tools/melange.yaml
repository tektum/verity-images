package:
  name: temporal-admin-tools
  version: "1.32.2"
  epoch: 2  # otel/log v1 port
  description: Temporal operator tools tdbg, temporal CLI, SQL and Cassandra schema tools
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 12Gi
    disk: 8Gi

vars:
  cli-version: "1.10.0"  # renovate: datasource=github-tags depName=temporalio/cli
  cli-commit: eace324a13f6a9161af1e201e1ca45b67b50b620
  # CVE-2026-82458 and the other thrift advisories fixed in v0.25.0 are not in
  # the Go vulnerability or OSV module feeds that go/remediate reads.
  thrift-floor: v0.25.0  # renovate: datasource=go depName=github.com/apache/thrift
  # GHSA-q7gw-24fr-5p69 is fixed in go.opentelemetry.io/otel v1.47.0, whose go.mod requires
  # otel/log v1.47.0. otel/log v0.21.0 moved KeyValue and its constructors to otel/attribute,
  # which breaks the Temporal server's common/wideevents package embedded in the CLI.
  otel-log-floor: v1.47.0  # renovate: datasource=go depName=go.opentelemetry.io/otel/log

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/temporal
      tag: v${{package.version}}
      expected-commit: 6d085822273f4336796e6959c73ab1d14a23eb77
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/tools/tdbg ./cmd/tools/sql ./cmd/tools/cassandra
  - uses: go/build
    with:
      packages: ./cmd/tools/tdbg
      output: tdbg
      go-package: go-1.26
  - uses: go/build
    with:
      packages: ./cmd/tools/sql
      output: temporal-sql-tool
      go-package: go-1.26
  - uses: go/build
    with:
      packages: ./cmd/tools/cassandra
      output: temporal-cassandra-tool
      go-package: go-1.26
  - runs: |
      mkdir -p "${{targets.destdir}}/etc/temporal"
      cp -r schema "${{targets.destdir}}/etc/temporal/schema"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: git-checkout
    with:
      destination: cli
      repository: https://github.com/temporalio/cli
      tag: v${{vars.cli-version}}
      expected-commit: ${{vars.cli-commit}}
  - runs: chmod 755 cli
  - working-directory: cli
    runs: |
      current="$(go list -m -f '{{.Version}}' github.com/apache/thrift)"
      if awk -v have="$current" -v want=${{vars.thrift-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        go get github.com/apache/thrift@${{vars.thrift-floor}}
      fi
      go get go.opentelemetry.io/otel/log@${{vars.otel-log-floor}}
  # The CLI imports the server as a module dependency, so port wideevents in the vendor
  # tree; go/remediate reapplies the patch after every re-vendor.
  - working-directory: cli
    runs: |
      go mod vendor
      cp ../temporal-server-wideevents.patch .
  - uses: patch
    working-directory: cli
    with:
      patches: temporal-server-wideevents.patch
  - uses: go/remediate
    working-directory: cli
    with:
      modroot: .
      packages: ./cmd/temporal
      vendor-patches: temporal-server-wideevents.patch
  - uses: go/build
    working-directory: cli
    with:
      packages: ./cmd/temporal
      output: temporal
      go-package: go-1.26
      ldflags: -X github.com/temporalio/cli/internal/temporalcli.Version=${{vars.cli-version}}
      extra-args: -mod=vendor
  - runs: |
      install -Dm644 cli/LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/CLI-LICENSE"

subpackages:
  - name: temporal-admin-tools-build-metadata
    description: Resolved Go module metadata for the temporal-admin-tools build
    pipeline:
      - runs: |
          dest="${{targets.subpkgdir}}/usr/share/temporal-admin-tools-build"
          for m in server:. cli:cli; do
            for f in go.mod go.sum; do
              install -m644 -D "${m#*:}/$f" "$dest/${m%%:*}/$f"
            done
          done

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        temporal --version | grep -F "${{vars.cli-version}}"
        tdbg --version
        temporal-sql-tool --help >/dev/null
        temporal-cassandra-tool --help >/dev/null
        test -d /etc/temporal/schema/mysql
        grep -F "MIT License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: temporalio/temporal
    strip-prefix: v
