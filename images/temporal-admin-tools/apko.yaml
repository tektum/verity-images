contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - temporal-admin-tools@local

accounts:
  groups:
    - groupname: temporal
      gid: 65532
  users:
    - username: temporal
      uid: 65532
      gid: 65532
      homedir: /tmp
      shell: /bin/sh
  run-as: 65532

cmd: sleep infinity

environment:
  PATH: /usr/bin:/bin
