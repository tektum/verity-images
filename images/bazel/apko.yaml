contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - bazel-9
    - openjdk-21

accounts:
  groups:
    - groupname: bazel
      gid: 65532
  users:
    - username: bazel
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/bazel

work-dir: /home/bazel

environment:
  HOME: /home/bazel
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/bin
  USER: bazel

paths:
  - path: /home/bazel
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
