contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - haproxy@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/haproxy -f /etc/haproxy/haproxy.cfg

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/haproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
