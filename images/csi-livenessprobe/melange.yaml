package:
  name: verity-csi-livenessprobe
  # yamllint disable-line rule:line-length
  version: "2.20.0"  # renovate: datasource=github-releases depName=kubernetes-csi/livenessprobe versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: CSI sidecar that serves /healthz from the CSI driver Probe RPC
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 08d74914607a0574a300d311c441eca5cd609687

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/livenessprobe
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/livenessprobe
  - runs: |
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/livenessprobe" ./cmd/livenessprobe
      # The module path has no /v2 suffix, so Go cannot stamp the v2 tag as the
      # main module version; guard on the pinned source revision instead.
      go version -m "${{targets.destdir}}/usr/bin/livenessprobe" \
        | awk '$1 == "build" && $2 ~ /^vcs\.revision=/ { sub(/^vcs\.revision=/, "", $2); print $2 }' \
        | grep -Fx '${{vars.source-commit}}'
      go version -m "${{targets.destdir}}/usr/bin/livenessprobe" \
        | awk '$1 == "path" { print $2 }' | grep -Fx github.com/kubernetes-csi/livenessprobe/cmd/livenessprobe
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the livenessprobe build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/livenessprobe-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/livenessprobe-build/go.sum"
          install -Dm644 vendor/modules.txt "${{targets.subpkgdir}}/usr/share/livenessprobe-build/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        livenessprobe -h 2>&1 | grep -F -- '-csi-address'
        apk info --who-owns /usr/bin/livenessprobe \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-csi/livenessprobe
    strip-prefix: v
