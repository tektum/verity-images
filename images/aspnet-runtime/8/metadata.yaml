# Disabled: .NET 8 reached end of support on 2026-11-10 (Microsoft .NET support policy and endoflife.date/dotnet),
# and only upstream-supported streams are published. The last published release of this stream stays in GHCR.
# Use the 11.0 stream (supported until 2028-11-14) or the 10.0 stream.
name: aspnet-runtime
track: wolfi
# yamllint disable-line rule:line-length
description: ASP.NET Core runtime (Microsoft.AspNetCore.App with Microsoft.NETCore.App, no SDK) built from the pinned official Microsoft release binaries with per-architecture checksums. This stream is past upstream end of support; it ships the latest upstream patch release.
category: Languages & Build Tools
upstream: https://dotnet.microsoft.com/
versions: [8.0]
owner: tektum
enabled: false
# scan-identity declares both RIDs on purpose. The recipe installs one RID per architecture, but
# scan_identity.py injects every declared identity into every SBOM, so each SBOM also lists the other
# architecture's runtime package at the same version. Grype's GHSA data is keyed by the RID package names
# and a RID-neutral purl matches nothing (checked at 8.0.0 and 10.0.0), so this is the narrowest identity that
# keeps the gate symmetric across architectures. Syft reports the real package natively as well.
# yamllint disable-line rule:line-length
scan-identity: [pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-x64, pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-arm64, pkg:nuget/Microsoft.NETCore.App.Runtime.linux-x64, pkg:nuget/Microsoft.NETCore.App.Runtime.linux-arm64]
