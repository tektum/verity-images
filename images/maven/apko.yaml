contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - maven-3.9=3.9.16-r2
    - openjdk-21-default-jdk

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/mvn

work-dir: /home/build

environment:
  HOME: /home/build
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin

paths:
  - path: /home/build
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
