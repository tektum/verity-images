contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - cert-manager-controller-1.19@local
    - tzdata

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /app/cmd/controller/controller

work-dir: /home/nonroot

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777
