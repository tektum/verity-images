contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    # Wolfi's keycloak-config-cli stopped at 6.5.1-r2 with fixable advisories
    # in its bundled jars, so the jar is built here. The package places it at
    # the upstream /app path and links /opt/java/openjdk like the -compat
    # package; it depends on busybox, which supplies /bin/sh for the
    # JAVA_OPTS wrapper below.
    - verity-keycloak-config-cli@local

# Upstream (eclipse-temurin:21-jre base) runs as USER 65534 and sets no
# WORKDIR. wolfi-baselayout already defines nobody (65534:65534, home /), so
# no account is added; a second passwd entry would only shadow it.
accounts:
  run-as: 65534

# Upstream uses the shell-form ENTRYPOINT
#   exec java $JAVA_OPTS -jar /app/keycloak-config-cli.jar $0 $@
# so JAVA_OPTS is word-split into JVM options. Keeping that contract needs a
# shell, so this image keeps a /bin/sh wrapper rather than asking users to
# move options to JAVA_TOOL_OPTIONS. The JVM still reads JAVA_TOOL_OPTIONS
# directly, so both work.
# The trailing "keycloak-config-cli" fills $0, so container arguments arrive
# as "$@" with their quoting preserved; upstream word-splits them and passes
# /bin/sh as a stray argument when none are given.
entrypoint:
  command: /bin/sh -c 'exec java $JAVA_OPTS -jar /app/keycloak-config-cli.jar "$@"' keycloak-config-cli

work-dir: /

environment:
  PATH: /opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  JAVA_HOME: /opt/java/openjdk
  LANG: en_US.UTF-8
  LANGUAGE: en_US:en
  LC_ALL: en_US.UTF-8
  JAVA_OPTS: ""
  KEYCLOAK_SSL_VERIFY: "true"
  IMPORT_FILES_LOCATIONS: file:/config/*
