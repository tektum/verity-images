contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-aws-load-balancer-controller@local

# Upstream runs on the EKS distro nonroot base image as UID 65532.
accounts:
  run-as: 65532

# Upstream ships /controller as ENTRYPOINT with no CMD, and its Helm chart passes
# only args. This image installs /usr/bin/aws-load-balancer-controller as the
# entrypoint and keeps /controller as a symlink for manifests that set command.
entrypoint:
  command: /usr/bin/aws-load-balancer-controller

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /controller
    type: symlink
    source: /usr/bin/aws-load-balancer-controller
    uid: 0
    gid: 0
  # apko applies the symlink's unset permissions through the link to its
  # target, so restore the binary mode after creating /controller.
  - path: /usr/bin/aws-load-balancer-controller
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
