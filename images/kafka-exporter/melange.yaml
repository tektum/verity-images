package:
  name: verity-kafka-exporter
  version: "1.11.0"  # renovate: datasource=github-releases depName=danielqsj/kafka_exporter
  epoch: 0
  description: Prometheus exporter for Apache Kafka broker, topic and consumer group metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/danielqsj/kafka_exporter
      tag: v${{package.version}}
      expected-commit: c08240632142c807ef860d56e8a5c2ce0407b58a
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      revision=$(git rev-parse HEAD)
      flags="-s -w"
      flags="$flags -X github.com/prometheus/common/version.Version=${{package.version}}"
      flags="$flags -X github.com/prometheus/common/version.Revision=$revision"
      flags="$flags -X github.com/prometheus/common/version.Branch=HEAD"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/kafka_exporter" .
      go version -m "${{targets.destdir}}/usr/bin/kafka_exporter" \
        | awk '$1 == "mod" && $2 == "github.com/danielqsj/kafka_exporter" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kafka-exporter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kafka-exporter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kafka-exporter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        kafka_exporter --version 2>&1 | grep -F "${{package.version}}"
        apk info --who-owns /usr/bin/kafka_exporter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: danielqsj/kafka_exporter
    strip-prefix: v
    use-tag: true
