package:
  name: verity-vault-secrets-webhook
  # yamllint disable-line rule:line-length
  version: "1.23.1"  # renovate: datasource=github-releases depName=bank-vaults/vault-secrets-webhook extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Bank-Vaults admission webhook injecting Vault secrets into Pods, Secrets and ConfigMaps
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v1.23.1 is an annotated tag that peels to this commit.
  source-commit: 0aea3939ce1b4cd9775f34d5ebd90c7abd62a0b6

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      # Upstream go.mod declares go 1.26.3 and builds on golang:1.26.
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bank-vaults/vault-secrets-webhook
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  # Same build as the upstream Dockerfile (`go build -o
  # /usr/local/bin/vault-secrets-webhook .` with CGO_ENABLED=0): the root main
  # package github.com/bank-vaults/vault-secrets-webhook. Upstream has no
  # GoReleaser config and its Makefile and Dockerfile set no -X stamps, so none
  # are added; -trimpath and VCS stamping keep the main module version visible
  # to the scanner. The bank-vaults/vault-sdk version is asserted because
  # vault-env and bank-vaults build against the same release.
  - runs: |
      commit=$(git rev-parse HEAD)
      test "$commit" = '${{vars.source-commit}}'
      go build -trimpath -buildvcs=true \
        -o "${{targets.destdir}}/usr/bin/vault-secrets-webhook" \
        github.com/bank-vaults/vault-secrets-webhook
      go version -m "${{targets.destdir}}/usr/bin/vault-secrets-webhook" >buildinfo.txt
      awk '$1 == "mod" && $2 == "github.com/bank-vaults/vault-secrets-webhook" { print $3 }' \
        buildinfo.txt | grep -Ex 'v${{package.version}}(\+dirty)?'
      awk '$1 == "build" && $2 ~ /^vcs.revision=/ { print $2 }' buildinfo.txt \
        | grep -Fx "vcs.revision=$commit"
      awk '$1 == "build" && $2 == "CGO_ENABLED=0" { print $2 }' buildinfo.txt | grep -Fx CGO_ENABLED=0
      awk '$1 == "build" && $2 == "-trimpath=true" { print $2 }' buildinfo.txt | grep -Fx -- -trimpath=true
      awk '$1 == "dep" && $2 == "github.com/bank-vaults/vault-sdk" { print $3 }' \
        buildinfo.txt | grep -Ex 'v0\.12\.[0-9]+'
      rm buildinfo.txt
      # Upstream installs the binary as /usr/local/bin/vault-secrets-webhook
      # and its ENTRYPOINT resolves it through PATH.
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      ln -s ../../bin/vault-secrets-webhook \
        "${{targets.destdir}}/usr/local/bin/vault-secrets-webhook"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the vault-secrets-webhook build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/vault-secrets-webhook-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/vault-secrets-webhook-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test -L /usr/local/bin/vault-secrets-webhook
        test "$(readlink -f /usr/local/bin/vault-secrets-webhook)" = /usr/bin/vault-secrets-webhook
        apk info --who-owns /usr/bin/vault-secrets-webhook \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"
        work=$(mktemp -d)
        # Negative: without a Kubernetes client configuration it refuses to start.
        status=0
        HOME="$work" KUBECONFIG= vault-secrets-webhook >"$work/noconfig" 2>&1 || status=$?
        test "$status" -ne 0
        grep -F 'error creating k8s client' "$work/noconfig"
        # With a client configuration and namespace it serves /healthz; the
        # client is only used per admission request, so no API server is needed.
        printf '%s\n' 'apiVersion: v1' 'kind: Config' 'clusters:' \
          '- name: c' '  cluster:' '    server: https://127.0.0.1:9' \
          'users:' '- name: u' '  user: {}' 'contexts:' \
          '- name: x' '  context: {cluster: c, user: u}' 'current-context: x' \
          >"$work/kubeconfig"
        KUBECONFIG="$work/kubeconfig" KUBERNETES_NAMESPACE=vswh \
          LISTEN_ADDRESS=127.0.0.1:18443 /usr/local/bin/vault-secrets-webhook \
          >"$work/serve" 2>&1 &
        pid=$!
        i=0
        until wget -q -O /dev/null http://127.0.0.1:18443/healthz; do
          i=$((i + 1))
          if [ "$i" -gt 30 ]; then cat "$work/serve"; exit 1; fi
          sleep 1
        done
        grep -F 'Listening on http://127.0.0.1:18443' "$work/serve"
        kill "$pid"

update:
  enabled: true
  github:
    identifier: bank-vaults/vault-secrets-webhook
    strip-prefix: v
    use-tag: true
