contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-vault-secrets-webhook@local

# Upstream runs as USER 65534 and the Helm chart sets runAsUser: 65534.
accounts:
  run-as: 65534

# Upstream uses ENTRYPOINT ["vault-secrets-webhook"] resolved through PATH from
# /usr/local/bin, with no WORKDIR. The Helm chart sets no command. The package
# keeps /usr/local/bin/vault-secrets-webhook as a symlink to this entrypoint.
entrypoint:
  command: /usr/bin/vault-secrets-webhook

work-dir: /

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
