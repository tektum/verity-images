contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - composer=2.11.1-r0
    - php-8.4

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/composer

work-dir: /app

environment:
  COMPOSER_HOME: /tmp/composer
  HOME: /tmp
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
