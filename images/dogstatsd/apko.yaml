contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-dogstatsd@local

# Upstream datadog/dogstatsd runs as root behind a shell entrypoint that only
# rejects a missing DD_API_KEY and defaults DD_DOGSTATSD_NON_LOCAL_TRAFFIC.
# This image has no shell: it runs as nonroot, keeps the upstream command
# (`/dogstatsd -c /etc/datadog-agent/ start`), and dogstatsd itself exits
# non-zero with "no API key configured, exiting" when no key is set.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

cmd: /dogstatsd -c /etc/datadog-agent/ start

work-dir: /home/nonroot

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  DOCKER_DD_AGENT: "true"
  # The upstream entrypoint sets this unless DD_DOGSTATSD_SOCKET is set, so the
  # UDP listener accepts traffic from other containers. Set it to false for a
  # socket-only deployment.
  DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
  # The IPC auth token and certificate default to the config directory, which
  # the nonroot user cannot write; without them startup stalls and exits
  # before the API key check. Keep them in the writable run directory.
  DD_RUN_PATH: /var/run/datadog
  DD_AUTH_TOKEN_FILE_PATH: /var/run/datadog/auth_token
  DD_IPC_CERT_FILE_PATH: /var/run/datadog/ipc_cert.pem

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Default log file (/var/log/datadog/dogstatsd.log) and UDS socket
  # (/var/run/datadog/dsd.socket) locations.
  - path: /var/log/datadog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/datadog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
