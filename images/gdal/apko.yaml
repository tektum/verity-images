contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - gdal-tools=3.13.3-r7

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

cmd: gdalinfo --version

work-dir: /work

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
