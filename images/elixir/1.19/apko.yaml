contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - verity-elixir-1.19@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/elixir

work-dir: /app

environment:
  HOME: /home/build
  LANG: C.UTF-8
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
