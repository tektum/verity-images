package:
  name: verity-ecr-credential-provider
  # yamllint disable-line rule:line-length
  version: "1.37.1"  # renovate: datasource=github-tags depName=kubernetes/cloud-provider-aws versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubelet image credential provider plugin for Amazon ECR
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 5905abcef0a4c9921b0eae0445c00793649d675e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/cloud-provider-aws
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/ecr-credential-provider
  # Same ldflags as the upstream Makefile. VCS stamping stays on so the binary
  # reports the k8s.io/cloud-provider-aws main module at its release tag.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      stamp='-X k8s.io/component-base/version.gitVersion=v${{package.version}}'
      stamp="$stamp -X main.gitVersion=v${{package.version}}"
      go build -mod=readonly -trimpath -ldflags="-s -w $stamp" \
        -o "${{targets.destdir}}/usr/bin/ecr-credential-provider" ./cmd/ecr-credential-provider
      go version -m "${{targets.destdir}}/usr/bin/ecr-credential-provider" > buildinfo
      awk '$1 == "path" { print $2 }' buildinfo | grep -Fx k8s.io/cloud-provider-aws/cmd/ecr-credential-provider
      awk '$1 == "mod" { print $2, $3 }' buildinfo \
        | grep -Ex 'k8s.io/cloud-provider-aws v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the ecr-credential-provider build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/ecr-credential-provider-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/ecr-credential-provider-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        ecr-credential-provider --version | grep -Fx 'ecr-credential-provider version v${{package.version}}'
        apk info --who-owns /usr/bin/ecr-credential-provider \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes/cloud-provider-aws
    strip-prefix: v
    use-tag: true
