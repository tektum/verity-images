package:
  name: verity-kafka-proxy
  # yamllint disable-line rule:line-length
  version: "0.4.3"  # renovate: datasource=github-releases depName=grepplabs/kafka-proxy versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kafka protocol proxy that maps broker addresses to local listeners
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 317f1d7aca20d80a341a11235d615b185857d9d6

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grepplabs/kafka-proxy
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # Upstream vendors its modules; go/remediate lifts vulnerable requirements
  # and regenerates vendor/ to match the updated go.mod.
  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Upstream releases stamp config.Version without the v prefix.
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/grepplabs/kafka-proxy/config.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kafka-proxy" .
      go version -m "${{targets.destdir}}/usr/bin/kafka-proxy" \
        | awk '$1 == "mod" && $2 == "github.com/grepplabs/kafka-proxy" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kafka-proxy build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kafka-proxy-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kafka-proxy-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        [ "$(kafka-proxy version)" = "${{package.version}}" ]
        apk info --who-owns /usr/bin/kafka-proxy \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: grepplabs/kafka-proxy
    strip-prefix: v
