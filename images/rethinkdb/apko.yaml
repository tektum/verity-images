contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - rethinkdb=2.4.4-r17

accounts:
  groups:
    - groupname: rethinkdb
      gid: 65532
  users:
    - username: rethinkdb
      uid: 65532
      gid: 65532
      homedir: /data
  run-as: 65532

entrypoint:
  command: /usr/bin/rethinkdb

cmd: --bind all --directory /data/rethinkdb_data

environment:
  PATH: /usr/bin:/bin
  HOME: /data

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

volumes:
  - /data

work-dir: /data
