contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - kube-controller-manager-1.37@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/kube-controller-manager

environment:
  PATH: /usr/bin:/bin
