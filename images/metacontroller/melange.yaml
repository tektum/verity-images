package:
  name: verity-metacontroller
  # yamllint disable-line rule:line-length
  version: "4.17.7"  # renovate: datasource=github-releases depName=metacontroller/metacontroller versioning=regex:^(?<major>4)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Add-on for Kubernetes that runs lightweight controllers defined by webhooks
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 936a241e8ea84af0e86b6e16209979479cd94eac

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/metacontroller/metacontroller
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./pkg/cmd/metacontroller

  - runs: |
      # Same flags as the upstream GoReleaser build (CGO_ENABLED=0, -s -w). Of its
      # stamps only main.version exists in the binary; the commit is in the VCS info.
      bin="${{targets.destdir}}/usr/bin/metacontroller"
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=${{package.version}}" \
        -o "$bin" ./pkg/cmd/metacontroller
      go version -m "$bin" | grep -E '^[[:space:]]+build[[:space:]]+vcs.revision=${{vars.source-commit}}$'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the metacontroller build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/metacontroller-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/metacontroller-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        # Without a cluster the controller logs its build version, then fails on the kubeconfig.
        if metacontroller >out.log 2>&1; then
          cat out.log
          exit 1
        fi
        grep -F '"version":"${{package.version}}"' out.log || { cat out.log; exit 1; }
        apk info --who-owns /usr/bin/metacontroller \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: metacontroller/metacontroller
    strip-prefix: v
    use-tag: true
