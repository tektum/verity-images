package:
  name: verity-cloud-provider-aws
  # yamllint disable-line rule:line-length
  version: "1.37.0"  # renovate: datasource=github-releases depName=kubernetes/cloud-provider-aws versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes cloud controller manager for Amazon Web Services
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: f01a0ef3c40d6e108e6b4384352c83f37b9502e0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/cloud-provider-aws
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/aws-cloud-controller-manager
  - runs: |
      # Upstream's Makefile, Dockerfile, and ko build stamp component-base.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X k8s.io/component-base/version.gitVersion=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/aws-cloud-controller-manager" \
        ./cmd/aws-cloud-controller-manager
      go version -m "${{targets.destdir}}/usr/bin/aws-cloud-controller-manager" \
        | awk '$1 == "mod" && $2 == "k8s.io/cloud-provider-aws" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the aws-cloud-controller-manager build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/aws-cloud-controller-manager-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/aws-cloud-controller-manager-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        aws-cloud-controller-manager --version \
          | grep -Fx "Kubernetes v${{package.version}}"
        apk info --who-owns /usr/bin/aws-cloud-controller-manager \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes/cloud-provider-aws
    strip-prefix: v
