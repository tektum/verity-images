package:
  name: kratos
  version: "26.2.0"
  epoch: 0
  description: Identity and user management server
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 9d7085948039ffb8960160d4979f71527b5cf4d5

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "1"
    CGO_CPPFLAGS: -DSQLITE_DEFAULT_FILE_PERMISSIONS=0600
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ory/kratos
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      flags="-s -w -X github.com/ory/kratos/driver/config.Version=v${{package.version}}"
      flags="$flags -X github.com/ory/kratos/driver/config.Date=$(date -u -d@${SOURCE_DATE_EPOCH} +%FT%TZ)"
      flags="$flags -X github.com/ory/kratos/driver/config.Commit=${{vars.source-commit}}"
      go build -mod=readonly -trimpath -tags sqlite -ldflags "$flags" -o kratos .
      install -Dm755 kratos "${{targets.destdir}}/usr/bin/kratos"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kratos version | grep -F "v${{package.version}}"
        apk info --who-owns /usr/bin/kratos | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: ory/kratos
    strip-prefix: v
    tag-filter: v
