package:
  name: verity-kubeconform
  # yamllint disable-line rule:line-length
  version: "0.8.0"  # renovate: datasource=github-releases depName=yannh/kubeconform versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Fast Kubernetes manifest validator with Custom Resource support
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 02374e583d700721f57300fae78e11acd27ee539

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      # Wolfi go-1.27 ships no GOFIPS140 snapshot modules (lib/fips140 has no
      # v1.0.0 zip), so the fips flavor needs go-1.26 like the other Go FIPS images.
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/yannh/kubeconform
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/kubeconform

  - runs: |
      # Upstream vendors its modules; go/remediate regenerated vendor/ for the
      # remediated go.mod. Release builds stamp the v-prefixed tag (goreleaser
      # -X main.version={{.Tag}}).
      go build -mod=vendor -trimpath -buildvcs=true -tags netgo \
        -ldflags="-s -w -X main.version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/kubeconform" ./cmd/kubeconform
      go version -m "${{targets.destdir}}/usr/bin/kubeconform" \
        | awk '$1 == "mod" && $2 == "github.com/yannh/kubeconform" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kubeconform build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kubeconform-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kubeconform-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kubeconform -v | grep -Fx "v${{package.version}}"
        apk info --who-owns /usr/bin/kubeconform \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: yannh/kubeconform
    strip-prefix: v
