package:
  name: trust-manager-0.26
  version: "0.26.0"
  epoch: 0
  description: cert-manager trust bundle operator
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: d2b8e492c7a99bc69a85fb6ca666ea960c60cecf

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/trust-manager
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/trust-manager
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/trust-manager" ./cmd/trust-manager
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the trust-manager build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/trust-manager-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/trust-manager-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        trust-manager --help | grep -F 'Usage:'
        apk info --who-owns /usr/bin/trust-manager \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cert-manager/trust-manager
    strip-prefix: v
