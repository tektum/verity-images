contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - pgbouncer@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/pgbouncer
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /tmp/pgbouncer
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/pgbouncer
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
