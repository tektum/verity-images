contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - lighttpd

accounts:
  groups:
    - groupname: lighttpd
      gid: 65532
  users:
    - username: lighttpd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/lighttpd -D -f /etc/lighttpd/lighttpd.conf

stop-signal: SIGINT

work-dir: /var/www/html

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/lighttpd
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /var/www/html
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
