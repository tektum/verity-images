contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - json-server=0.17.4-r16
    - tini=0.19.0-r26

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/tini -- /usr/bin/node /usr/local/lib/node_modules/json-server/lib/cli/bin.js

cmd: --host 0.0.0.0 --port 3000 db.json

work-dir: /data

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  NODE_ENV: production

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
