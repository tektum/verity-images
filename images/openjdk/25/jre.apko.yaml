contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - tzdata
    - glibc-locale-en
    - fontconfig
    - ttf-dejavu
    - openjdk-25-jre

accounts:
  run-as: 65532

work-dir: /app

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/bin:/bin
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TZ: UTC

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
