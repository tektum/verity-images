contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - tini
    - verity-fluentd@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/tini -- /usr/bin/entrypoint.sh

cmd: fluentd

environment:
  FLUENTD_CONF: fluent.conf
  PATH: /usr/bin:/bin

paths:
  - path: /fluentd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /fluentd/etc
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /fluentd/log
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /fluentd/plugins
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
