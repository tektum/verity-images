package:
  name: caddy
  version: "2.11.7"  # renovate: datasource=github-releases depName=caddyserver/caddy
  epoch: 3
  description: Fast and extensible HTTP/1-2-3 web server with automatic HTTPS
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/caddyserver/caddy
      tag: v${{package.version}}
      expected-commit: 72dd0fb067f6d7826c7f79907670ba4a713bfe37
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/caddy
  - runs: |
      install -m644 -D Caddyfile "${{targets.destdir}}/etc/caddy/Caddyfile"
      install -m644 -D index.html "${{targets.destdir}}/usr/share/caddy/index.html"
  - uses: go/build/v2
    with:
      packages: ./cmd/caddy
      output: caddy

subpackages:
  - name: caddy-build-metadata
    description: Resolved Go module metadata for the Caddy build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/caddy-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/caddy-build/go.sum"
