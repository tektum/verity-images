contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - caddy@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/caddy

environment:
  GODEBUG: "@GODEBUG@"
  PATH: /usr/bin:/bin
  XDG_CONFIG_HOME: /config
  XDG_DATA_HOME: /data

paths:
  - path: /config
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /config/caddy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/caddy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /data/caddy/locks
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
