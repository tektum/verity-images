package:
  name: verity-nats-2
  version: "2.14.6"
  epoch: 0
  description: High-performance NATS messaging server
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  source-commit: 1aa10f9fe4e7a27b7d877af004a9c0022fdc4910
  x-crypto-floor: v0.56.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nats-io/nats-server
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      current="$(go list -m -f '{{.Version}}' golang.org/x/crypto)"
      if awk -v have="$current" -v want=${{vars.x-crypto-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        go get golang.org/x/crypto@${{vars.x-crypto-floor}}
      fi
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - uses: go/build
    with:
      packages: .
      output: nats-server
      go-package: go-1.26
      ldflags: |
        -w
        -X github.com/nats-io/nats-server/v2/server.gitCommit=${{vars.source-commit}}
        -X github.com/nats-io/nats-server/v2/server.serverVersion=v${{package.version}}
  - runs: |
      binary="${{targets.destdir}}/usr/bin/nats-server"
      "$binary" --version | grep -F "${{package.version}}"
      actual="$(go version -m "$binary" \
        | awk '$1 == "dep" && $2 == "golang.org/x/crypto" { print $3 }')"
      test -n "$actual"
      awk -v have="$actual" -v want=${{vars.x-crypto-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 > w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 1 : 0
      }'
      install -Dm644 docker/nats-server.conf \
        "${{targets.destdir}}/etc/nats/nats-server.conf"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the NATS server build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/nats-server-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/nats-server-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        nats-server --version | grep -F "${{package.version}}"
        nats-server --help >/dev/null
        apk info --who-owns /usr/bin/nats-server \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /etc/nats/nats-server.conf
        test -s /usr/share/licenses/${{package.name}}/LICENSE
