contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - verity-nats-2@local

accounts:
  run-as: 65532

entrypoint:
  command: nats-server

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/nats
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/nats
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
