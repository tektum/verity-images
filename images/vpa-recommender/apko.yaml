contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-vpa-recommender@local

# Upstream pkg/recommender/Dockerfile: ENTRYPOINT ["/recommender"] on distroless nonroot.
entrypoint:
  command: /recommender

accounts:
  run-as: 65532

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /recommender
    type: symlink
    source: /usr/bin/recommender
    uid: 0
    gid: 0
  - path: /usr/bin/recommender
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
