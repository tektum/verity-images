package:
  name: velero-plugin-for-aws-1.14
  version: "1.14.4"
  epoch: 0
  description: Velero object store and volume snapshotter plugin for AWS
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 7373ae03525ce743a4f95f13a8fa9f56c7b8f551

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/velero-io/velero-plugin-for-aws
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./velero-plugin-for-aws ./hack/cp-plugin
  - runs: |
      install -d "${{targets.destdir}}/plugins" "${{targets.destdir}}/usr/bin"
      go build -p 4 -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/plugins/velero-plugin-for-aws" ./velero-plugin-for-aws
      go build -p 4 -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/cp-plugin" ./hack/cp-plugin
      go version -m "${{targets.destdir}}/plugins/velero-plugin-for-aws" \
        | awk '$1 == "mod" && $2 == "github.com/vmware-tanzu/velero-plugin-for-aws" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Velero AWS plugin build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/velero-plugin-for-aws-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/velero-plugin-for-aws-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        if /plugins/velero-plugin-for-aws >/dev/null 2>"$PWD/plugin.err"; then
          echo 'plugin binary unexpectedly ran outside Velero' >&2
          exit 1
        fi
        grep -F 'This binary is a plugin' "$PWD/plugin.err"
        usage=$(cp-plugin 2>&1 || true)
        printf '%s\n' "$usage" | grep -F 'Usage: cp-plugin src dst'
        cp-plugin /plugins/velero-plugin-for-aws "$PWD/copied-plugin"
        cmp /plugins/velero-plugin-for-aws "$PWD/copied-plugin"
        apk info --who-owns /plugins/velero-plugin-for-aws \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: velero-io/velero-plugin-for-aws
    tag-filter-prefix: v1.14.
    strip-prefix: v
