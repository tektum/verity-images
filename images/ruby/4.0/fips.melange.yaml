package:
  name: ruby-fips-entrypoint
  version: "1.0.0"
  epoch: 0
  description: FIPS activation entrypoint for Ruby images
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -m755 -D fips-entrypoint "${{targets.destdir}}/usr/bin/ruby-fips-entrypoint"
