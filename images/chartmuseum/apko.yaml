contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-chartmuseum-0.16@local

accounts:
  run-as: 65534

entrypoint:
  command: /usr/bin/chartmuseum

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65534
    gid: 65534
    permissions: 0o755
