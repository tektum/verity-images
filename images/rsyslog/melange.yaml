package:
  name: verity-rsyslog
  # yamllint disable-line rule:line-length
  version: "8.2610.0"  # renovate: datasource=github-tags depName=rsyslog/rsyslog versioning=regex:^(?<major>8)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: rsyslog with the TCP, UDP, RELP, Elasticsearch, stdout and parser modules of the container config
  copyright:
    - license: GPL-3.0-or-later
    - license: LGPL-3.0-or-later
    - license: Apache-2.0

vars:
  source-commit: 4734a93f4a34c4321d55b58f46ca401abe791330

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - autoconf
      - autoconf-archive
      - automake
      - bison
      - build-base
      - busybox
      - curl-dev
      - flex
      - libestr-dev
      - libfastjson-dev
      - librelp-dev
      - libtool
      - openssl-dev
      - pkgconf
      - pkgconf-dev
      - util-linux-dev
      - yaml-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rsyslog/rsyslog
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - runs: |
      autoreconf -fi
      # Only the modules /etc/rsyslog.conf loads plus the default core modules
      # (imudp, imtcp, imuxsock, imklog, omfwd). No journal, GnuTLS, libgcrypt
      # or database outputs.
      ./configure \
        --prefix=/usr \
        --sbindir=/usr/bin \
        --sysconfdir=/etc \
        --localstatedir=/var \
        --disable-static \
        --enable-largefile \
        --enable-openssl \
        --disable-gnutls \
        --disable-libgcrypt \
        --disable-libzstd \
        --disable-libsystemd \
        --disable-imjournal \
        --disable-omjournal \
        --disable-fmhttp \
        --disable-generate-man-pages \
        --disable-default-tests \
        --enable-imptcp \
        --enable-impstats \
        --disable-impstats-push \
        --enable-omstdout \
        --enable-relp \
        --enable-elasticsearch \
        --enable-mmjsonparse \
        --enable-mmutf8fix
      make -j$(nproc)
      make install DESTDIR="${{targets.destdir}}"
      find "${{targets.destdir}}" -name "*.la" -delete
      install -Dm644 COPYING \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/COPYING"
      install -Dm644 COPYING.LESSER \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/COPYING.LESSER"
      install -Dm644 COPYING.ASL20 \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/COPYING.ASL20"
      # Container config, byte-identical to the Wolfi rsyslog-config 8.2604.0
      # file (itself derived from packaging/docker/appliance/alpine).
      install -d -m755 "${{targets.destdir}}/etc/rsyslog"
      cat > "${{targets.destdir}}/etc/rsyslog.conf" <<'EOF'
      global(processInternalMessages="on")

      module(load="impstats") # config.enabled=`echo $ENABLE_STATISTICS`)
      module(load="imrelp")
      module(load="imptcp")
      module(load="imudp" TimeRequery="500")
      module(load="omstdout")
      module(load="omelasticsearch")
      module(load="mmjsonparse")
      module(load="mmutf8fix")

      input(type="imptcp" port="514")
      input(type="imudp" port="514")
      input(type="imrelp" port="1601")

      syslog.* :omstdout:
      include(file="/etc/rsyslog/droprules.conf" mode="optional")  # permit users to easily drop unwanted messages
      action(name="main_utf8fix" type="mmutf8fix" replacementChar="?")
      include(text=`echo $CNF_CALL_LOG_TO_LOGFILES`)
      include(text=`echo $CNF_CALL_LOG_TO_LOGSENE`)
      EOF
      chmod 0644 "${{targets.destdir}}/etc/rsyslog.conf"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        rsyslogd -v | grep -E "^rsyslogd +${{package.version}} "
        for module in impstats imrelp imptcp imudp omstdout omelasticsearch mmjsonparse mmutf8fix; do
          test -f "/usr/lib/rsyslog/${module}.so"
        done
        rsyslogd -N1 -f /etc/rsyslog.conf

update:
  enabled: true
  github:
    identifier: rsyslog/rsyslog
    strip-prefix: v
    use-tag: true
