package:
  name: verity-k8sgpt
  # yamllint disable-line rule:line-length
  version: "0.4.41"  # renovate: datasource=github-releases depName=k8sgpt-ai/k8sgpt versioning=semver extractVersion=^v(?<version>.+)$
  epoch: 0
  description: CLI and server for scanning Kubernetes clusters and explaining issues with AI
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: 3644ecfd4f932be3901838b35e250a95f7732114
  kubectl-floor: v0.36.4  # renovate: datasource=go depName=k8s.io/kubectl
  gnostic-floor: v0.7.1  # renovate: datasource=go depName=github.com/google/gnostic

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8sgpt-ai/k8sgpt
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # go/remediate raises k8s.io/api and helm to fixed releases but leaves the
  # indirect k8s.io/kubectl behind, whose scheme package then imports API groups
  # the newer k8s.io/api removed. gnostic v0.7.0 does not compile against the
  # gnostic-models release those k8s.io modules require; upstream main uses
  # v0.7.1. Raise both first so the remediated graph stays consistent.
  - runs: |
      raise_floor() {
        current=$(go list -m -f '{{.Version}}' "$1")
        if awk -v have="$current" -v want="$2" 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 > w[i] + 0) ? 1 : 0
          }
          exit 1
        }'; then
          go get "$1@$2"
        fi
      }
      raise_floor k8s.io/kubectl ${{vars.kubectl-floor}}
      raise_floor github.com/google/gnostic ${{vars.gnostic-floor}}
      go list -m k8s.io/kubectl github.com/google/gnostic
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      build_date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=${{package.version}} \
          -X main.commit=${{vars.source-commit}} -X main.date=$build_date" \
        -o "${{targets.destdir}}/usr/bin/k8sgpt" .
      go version -m "${{targets.destdir}}/usr/bin/k8sgpt" \
        | awk '$1 == "mod" && $2 == "github.com/k8sgpt-ai/k8sgpt" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the k8sgpt build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/k8sgpt-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/k8sgpt-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
        - go-1.27
  pipeline:
    - runs: |
        go version -m /usr/bin/k8sgpt \
          | awk '$1 == "mod" && $2 == "github.com/k8sgpt-ai/k8sgpt" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
        HOME=$(mktemp -d) k8sgpt version \
          | grep -E '^k8sgpt: ${{package.version}} \(${{vars.source-commit}}\), built at: [0-9]{4}-'
        apk info --who-owns /usr/bin/k8sgpt \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: k8sgpt-ai/k8sgpt
    strip-prefix: v
