package:
  name: verity-cert-manager-istio-csr
  # yamllint disable-line rule:line-length
  version: "0.19.1"  # renovate: datasource=github-releases depName=cert-manager/istio-csr versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: cert-manager istio-csr agent issuing Istio workload certificates via cert-manager
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  # Peeled commit of the annotated v0.19.1 tag.
  source-commit: 270552830eaaed84f613390f54be9b2bea020d60

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/istio-csr
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd
  # Upstream's ldflags target an internal/version package that no longer
  # exists, so the binary embeds no version string.
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/cert-manager-istio-csr" ./cmd
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the istio-csr build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/cert-manager-istio-csr-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/cert-manager-istio-csr-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /usr/bin/cert-manager-istio-csr --help | grep -F 'Usage:'
        /usr/bin/cert-manager-istio-csr --help | grep -F -- '--issuer-name'
        apk info --who-owns /usr/bin/cert-manager-istio-csr \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cert-manager/istio-csr
    strip-prefix: v
