contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-pulumi@local

accounts:
  groups:
    - groupname: pulumi
      gid: 65532
  users:
    - username: pulumi
      uid: 65532
      gid: 65532
      homedir: /home/pulumi
  run-as: 65532

entrypoint:
  command: /usr/bin/pulumi

work-dir: /home/pulumi

environment:
  HOME: /home/pulumi
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PULUMI_SKIP_UPDATE_CHECK: "true"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  USER: pulumi

paths:
  - path: /home/pulumi
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
