package:
  name: verity-pulumi
  # yamllint disable-line rule:line-length
  version: "3.277.0"  # renovate: datasource=github-releases depName=pulumi/pulumi versioning=regex:^(?<major>3)\.(?<minor>277)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Pulumi infrastructure as code CLI built from the pinned upstream source release
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: a95f099fa05b8c561c511e0a1663b6bf4f2afafb

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local
    GOWORK: "off"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pulumi/pulumi
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: pkg
      packages: ./cmd/pulumi

  - runs: |
      # The CLI module lives in pkg/. Go stamps a nested module's version only when the repository root has a
      # go.mod and the commit carries a pkg/vX.Y.Z tag (upstream publishes that tag, but the checkout only
      # fetches v${{package.version}}), so add both locally for the build so scanners see the release version.
      git tag -f pkg/v${{package.version}} "$(git rev-parse HEAD)"
      printf 'module github.com/pulumi/pulumi\n' > go.mod
      cd pkg
      # Same version stamping as upstream .goreleaser.yml.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -buildid= -X github.com/pulumi/pulumi/sdk/v3/go/common/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/pulumi" ./cmd/pulumi
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/usr/bin/pulumi" \
        | awk '$1 == "mod" && $2 == "github.com/pulumi/pulumi/pkg/v3" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      cd ..
      rm go.mod
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the pulumi CLI build
    pipeline:
      - runs: |
          install -Dm644 pkg/go.mod "${{targets.subpkgdir}}/usr/share/pulumi-build/go.mod"
          install -Dm644 pkg/go.sum "${{targets.subpkgdir}}/usr/share/pulumi-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        HOME=/tmp PULUMI_SKIP_UPDATE_CHECK=true pulumi version | grep -Fx "v${{package.version}}"
        apk info --who-owns /usr/bin/pulumi \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: pulumi/pulumi
    strip-prefix: v
