package:
  name: verity-tempo
  version: "3.0.5"  # renovate: datasource=github-releases depName=grafana/tempo versioning=semver
  epoch: 1  # thrift floor
  description: Grafana Tempo distributed tracing backend
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 9e06ff12113052bd81f05c734443c96dce89102c
  # CVE-2026-82458 and the other thrift advisories fixed in v0.25.0 are not in
  # the Go vulnerability or OSV module feeds that go/remediate reads.
  thrift-floor: v0.25.0  # renovate: datasource=go depName=github.com/apache/thrift

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/tempo
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      current="$(go list -m -f '{{.Version}}' github.com/apache/thrift)"
      if awk -v have="$current" -v want=${{vars.thrift-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        go get github.com/apache/thrift@${{vars.thrift-floor}}
      fi
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/tempo
  - runs: |
      flags="-s -w"
      flags="$flags -X main.Branch=release"
      flags="$flags -X main.Revision=${{vars.source-commit}}"
      flags="$flags -X main.Version=${{package.version}}"
      go build -buildvcs=false -trimpath -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/tempo" ./cmd/tempo
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        tempo --version 2>&1 | grep -F "version ${{package.version}}"
        apk info --who-owns /usr/bin/tempo \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx AGPL-3.0-or-later
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: grafana/tempo
    strip-prefix: v
    tag-filter-prefix: v3.0
    use-tag: true
