package:
  name: verity-cluster-autoscaler-1.35
  version: "1.36.1"
  epoch: 1
  description: Autoscaling components for Kubernetes
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "6"
    memory: 12Gi
    disk: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/autoscaler
      tag: cluster-autoscaler-${{package.version}}
      expected-commit: 35e8a280425c76a4040f57ae0fa232a952c02024
  - uses: go/remediate
    with:
      modroot: cluster-autoscaler
      packages: .
  - uses: go/build
    with:
      modroot: cluster-autoscaler
      packages: .
      output: cluster-autoscaler
      vendor: true

test:
  pipeline:
    - runs: /usr/bin/cluster-autoscaler --help
