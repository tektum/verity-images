contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-http-echo@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/http-echo

environment:
  PATH: /usr/bin:/bin
  ECHO_TEXT: hello-world
