package:
  name: verity-http-echo
  # yamllint disable-line rule:line-length
  version: "1.0.0"  # renovate: datasource=github-releases depName=hashicorp/http-echo extractVersion=^v(?<version>.+)$
  epoch: 0
  description: In-memory HTTP server that renders the text it is given
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/http-echo
      tag: v${{package.version}}
      expected-commit: 866d8f8313e92d96f940c2f0cf807abe934ab145

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      commit=$(git rev-parse --short HEAD)
      timestamp=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/hashicorp/http-echo/version.Version=${{package.version}} \
          -X github.com/hashicorp/http-echo/version.GitCommit=$commit \
          -X github.com/hashicorp/http-echo/version.Timestamp=$timestamp" \
        -o "${{targets.destdir}}/usr/bin/http-echo" .
      go version -m "${{targets.destdir}}/usr/bin/http-echo" \
        | awk '$1 == "mod" && $2 == "github.com/hashicorp/http-echo" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the http-echo build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/http-echo-build/go.mod"
          if [ -f go.sum ]; then
            install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/http-echo-build/go.sum"
          fi

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        http-echo -version | grep -F 'http-echo v${{package.version}} ('
        apk info --who-owns /usr/bin/http-echo \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MPL-2.0
        grep -F 'Mozilla Public License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: hashicorp/http-echo
    strip-prefix: v
    tag-filter: v
    use-tag: true
