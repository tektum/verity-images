package:
  name: verity-smokescreen
  # yamllint disable-line rule:line-length
  version: "0.1.0"  # renovate: datasource=github-releases depName=stripe/smokescreen extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Smokescreen HTTP CONNECT egress proxy with SSRF protection and egress ACLs
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 609eb8931420453daf5893509be0b25b21bd9edb

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/stripe/smokescreen
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Upstream reports its version from the Go build info (versioninfo), so
      # the build must keep VCS stamping.
      go build -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/smokescreen" .
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/usr/bin/smokescreen" \
        | awk '$1 == "mod" && $2 == "github.com/stripe/smokescreen" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.txt \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        smokescreen --version | grep -F "v${{package.version}}"
        apk info --who-owns /usr/bin/smokescreen | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: stripe/smokescreen
    strip-prefix: v
