package:
  name: verity-vendir
  # yamllint disable-line rule:line-length
  version: "0.47.0"  # renovate: datasource=github-releases depName=carvel-dev/vendir versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Declaratively syncs directories, git repositories, and other sources into a local tree
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - git
      - openssh-client
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 59333f3d2e0afd64376c839d201436e5e788cc3e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/carvel-dev/vendir
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/vendir
  - runs: |
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags="-s -w -X carvel.dev/vendir/pkg/vendir/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/vendir" ./cmd/vendir
      go version -m "${{targets.destdir}}/usr/bin/vendir" \
        | awk '$1 == "mod" && $2 == "carvel.dev/vendir" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the vendir build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/vendir-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/vendir-build/go.sum"
          install -Dm644 vendor/modules.txt "${{targets.subpkgdir}}/usr/share/vendir-build/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        vendir version | grep -Fx "vendir version v${{package.version}}"
        apk info --who-owns /usr/bin/vendir \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: carvel-dev/vendir
    strip-prefix: v
