package:
  name: ko
  version: "0.19.1"  # renovate: datasource=github-releases depName=ko-build/ko
  # Above Wolfi ko-0.19.1-r15, the newest revision recognized as fixed by the
  # vulnerability feed, which still carries golang.org/x/crypto v0.58.0.
  epoch: 16
  description: Simple, fast container image builder for Go applications
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ko-build/ko
      tag: v${{package.version}}
      expected-commit: e388f65a1f036f19703b8aff13e1aa5521bc6988

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - uses: go/build
    with:
      packages: .
      output: ko
      go-package: go-1.27
      ldflags: -X github.com/google/ko/pkg/commands.Version=${{package.version}}

  - runs: |
      binary="${{targets.destdir}}/usr/bin/ko"
      test "$("$binary" version)" = "${{package.version}}"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ko-build-metadata
    description: Resolved Go module metadata for the ko build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/ko-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/ko-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test "$(ko version)" = "${{package.version}}"
        ko --help >/dev/null
        ko completion bash | grep -F ko
        apk info --who-owns /usr/bin/ko \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
