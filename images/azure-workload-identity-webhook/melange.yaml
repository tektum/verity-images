package:
  name: azure-workload-identity-webhook
  version: "1.6.3"  # renovate: datasource=github-releases depName=Azure/azure-workload-identity
  # Wolfi ships the same package name with secdb fixes up to 1.6.3-r10. The
  # epoch stays above that revision so this remediated build never sorts below
  # a Wolfi-published fixed revision of the same upstream version.
  epoch: 11
  description: Azure Workload Identity mutating admission webhook
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 6fbebbcee35f8439672bc23a295d208a9dda1088

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-workload-identity
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/webhook
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w \
          -X github.com/Azure/azure-workload-identity/pkg/version.BuildVersion=v${{package.version}} \
          -X github.com/Azure/azure-workload-identity/pkg/version.Vcs=${{vars.source-commit}}" \
        -o "${{targets.destdir}}/manager" ./cmd/webhook
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Azure Workload Identity webhook build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/azure-workload-identity-webhook-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/azure-workload-identity-webhook-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /manager --version | grep -F '"buildVersion":"v${{package.version}}"'
        apk info --who-owns /manager \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: Azure/azure-workload-identity
    strip-prefix: v
