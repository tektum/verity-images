package:
  name: falcosecurity-falcoctl
  version: "0.14.3"  # renovate: datasource=github-releases depName=falcosecurity/falcoctl
  epoch: 0
  description: Falco artifact and index management CLI
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 22737ff196af8a3a9d03f98be61c72e09df647a4

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - uses: go/build
    with:
      packages: .
      output: falcoctl
      go-package: go-1.27
      ldflags: |
        -X github.com/falcosecurity/falcoctl/cmd/version.semVersion=${{package.version}}
        -X github.com/falcosecurity/falcoctl/cmd/version.gitCommit=${{vars.source-commit}}
        -X github.com/falcosecurity/falcoctl/cmd/version.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +%FT%TZ)

  - runs: |
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: falcosecurity-falcoctl-build-metadata
    description: Resolved Go module metadata for the falcoctl build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/falcoctl-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/falcoctl-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        falcoctl version | grep -F "Client Version: ${{package.version}}"
        apk info --who-owns /usr/bin/falcoctl | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    strip-prefix: v
    tag-filter: v
