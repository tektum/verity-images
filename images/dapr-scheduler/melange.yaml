package:
  name: verity-dapr-scheduler
  # yamllint disable-line rule:line-length
  version: "1.19.1"  # renovate: datasource=github-releases depName=dapr/dapr versioning=regex:^(?<major>1)\.(?<minor>19)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Dapr scheduler service, the job and reminder scheduler backed by embedded etcd
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: cfb5ee090dda7cfc26145c7703605d831350aa2a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dapr/dapr
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/scheduler

  - runs: |
      flags="-s -w"
      flags="$flags -X github.com/dapr/dapr/pkg/buildinfo.gitcommit=${{vars.source-commit}}"
      flags="$flags -X github.com/dapr/dapr/pkg/buildinfo.gitversion=v${{package.version}}"
      flags="$flags -X github.com/dapr/dapr/pkg/buildinfo.version=${{package.version}}"
      flags="$flags -X github.com/dapr/kit/logger.DaprVersion=${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "$flags" \
        -o scheduler ./cmd/scheduler
      go version -m scheduler \
        | awk '$1 == "mod" && $2 == "github.com/dapr/dapr" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm755 scheduler "${{targets.destdir}}/usr/bin/scheduler"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Dapr scheduler service build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/verity-dapr-scheduler-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/verity-dapr-scheduler-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        scheduler --help 2>&1 | grep -F -- '-healthz-port'
        apk info --who-owns /usr/bin/scheduler | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: dapr/dapr
    strip-prefix: v
    tag-filter: v1.19.
