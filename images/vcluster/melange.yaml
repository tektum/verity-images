package:
  name: verity-vcluster
  # yamllint disable-line rule:line-length
  version: "0.38.0"  # renovate: datasource=github-releases depName=loft-sh/vcluster versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: vCluster control plane (syncer) for virtual Kubernetes clusters
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v0.38.0 is a lightweight tag on this commit.
  source-commit: 85fed7e0d0c49d3cebda636e9be84b49985cd6a7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/loft-sh/vcluster
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # Make the module resolvable outside upstream's vendored tree, which
  # go/remediate needs (it lists `all` in module mode, then re-vendors):
  # - the e2e tests import the private loft-sh/e2e-framework module; drop them
  #   and the requirement, as the withdrawn Wolfi recipe did;
  # - k8s.io/kubernetes requires its staging modules at v0.0.0. None of the ones
  #   below is vendored for the build, so pin them to the staging release that
  #   matches the k8s.io/api requirement. Re-vendoring then only drops
  #   e2e-only packages; no module version changes.
  - runs: |
      rm -rf e2e
      go mod edit -droprequire github.com/loft-sh/e2e-framework
      sed -i '/loft-sh\/e2e-framework/d' go.sum
      staging=$(awk '$1 == "k8s.io/api" { print $2; exit }' go.mod)
      [ -n "$staging" ]
      for module in cloud-provider controller-manager cri-streaming \
        csi-translation-lib dynamic-resource-allocation endpointslice externaljwt \
        kube-controller-manager kube-scheduler mount-utils sample-apiserver; do
        if grep -q "^# k8s.io/$module " vendor/modules.txt; then exit 1; fi
        go mod edit -replace "k8s.io/$module=k8s.io/$module@$staging"
      done
      go mod vendor

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/vcluster

  # Same build as the upstream goreleaser `vcluster` build that ships in
  # ghcr.io/loft-sh/vcluster-oss (./cmd/vcluster from the vendored tree with
  # -trimpath, -s -w and the SyncerVersion stamp). The `embed_chart` tag is
  # omitted: it only embeds the Helm chart for the CLI create path, which the
  # syncer never runs. The telemetry key ldflag names no variable at this tag.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags "-s -w -buildid= -X github.com/loft-sh/vcluster/pkg/telemetry.SyncerVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/vcluster" ./cmd/vcluster
      go version -m "${{targets.destdir}}/usr/bin/vcluster" \
        | awk '$1 == "mod" && $2 == "github.com/loft-sh/vcluster" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      [ "$("${{targets.destdir}}/usr/bin/vcluster" version)" = '${{package.version}}' ]
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the vcluster build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/vcluster-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/vcluster-build/go.sum"
          install -Dm644 vendor/modules.txt \
            "${{targets.subpkgdir}}/usr/share/vcluster-build/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        [ "$(vcluster version)" = '${{package.version}}' ]
        vcluster start --help | grep -F -- '--config'
        if vcluster definitely-invalid >invalid.txt 2>&1; then exit 1; fi
        grep -F 'unknown command "definitely-invalid"' invalid.txt
        apk info --who-owns /usr/bin/vcluster \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: loft-sh/vcluster
    strip-prefix: v
    use-tag: true
