package:
  name: verity-gatekeeper-3.19
  version: "3.19.3"
  epoch: 0
  description: Policy controller for Kubernetes admission and audit
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 12Gi
    disk: 8Gi

vars:
  source-commit: e06a51136d06eb3b7dd200db0d375755f794aea3

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/bump
    with:
      deps: |-
        github.com/google/cel-go@v0.32.0
        go.opentelemetry.io/otel@v1.46.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.46.0
        go.opentelemetry.io/otel/metric@v1.46.0
        go.opentelemetry.io/otel/sdk@v1.46.0
        go.opentelemetry.io/otel/sdk/metric@v1.46.0
        go.opentelemetry.io/otel/trace@v1.46.0
        golang.org/x/net@v0.58.0
        golang.org/x/text@v0.41.0
        google.golang.org/grpc@v1.83.2
  - runs: |
      sed -i 's/UnversionedLib(ext.TwoVarComprehensions)/ext.TwoVarComprehensions()/' \
        vendor/k8s.io/apiserver/pkg/cel/environment/base.go
      go build -mod=vendor -p 4 -trimpath \
        -ldflags="-s -w -X github.com/open-policy-agent/gatekeeper/v3/pkg/version.Version=v${{package.version}}" \
        -o manager .
      install -Dm755 manager "${{targets.destdir}}/usr/bin/manager"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  pipeline:
    - runs: |
        /usr/bin/manager --help 2>&1 | grep -F "Usage of /usr/bin/manager:"
        if /usr/bin/manager --operation=invalid-webhook >/tmp/invalid 2>&1; then
          echo "invalid webhook operation unexpectedly succeeded" >&2
          exit 1
        fi
        grep -F 'invalid value "invalid-webhook" for flag -operation' /tmp/invalid
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    tag-filter: v
    use-tag: true
