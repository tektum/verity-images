package:
  name: verity-gatekeeper-3.19
  version: "3.19.3"
  epoch: 1
  description: Policy controller for Kubernetes admission and audit
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 12Gi
    disk: 8Gi

vars:
  source-commit: e06a51136d06eb3b7dd200db0d375755f794aea3

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      patch_file=vendor/k8s.io/apiserver/pkg/cel/environment/base.go
      patched_file=$(mktemp)
      cp "$patch_file" "$patched_file"
      sed -i 's/UnversionedLib(ext.TwoVarComprehensions)/ext.TwoVarComprehensions()/' "$patched_file"
      diff -u --label "a/$patch_file" --label "b/$patch_file" \
        "$patch_file" "$patched_file" > cel-vendor.patch || test $? -eq 1
      rm -f "$patched_file"
  - uses: go/remediate
    with:
      modroot: .
      packages: .
      vendor-patches: cel-vendor.patch
  - runs: |
      go build -mod=vendor -p 4 -trimpath \
        -ldflags="-s -w -X github.com/open-policy-agent/gatekeeper/v3/pkg/version.Version=v${{package.version}}" \
        -o manager .
      install -Dm755 manager "${{targets.destdir}}/usr/bin/manager"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  pipeline:
    - runs: |
        /usr/bin/manager --help 2>&1 | grep -F "Usage of /usr/bin/manager:"
        if /usr/bin/manager --operation=invalid-webhook >/tmp/invalid 2>&1; then
          echo "invalid webhook operation unexpectedly succeeded" >&2
          exit 1
        fi
        grep -F 'invalid value "invalid-webhook" for flag -operation' /tmp/invalid
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    tag-filter: v
    use-tag: true
