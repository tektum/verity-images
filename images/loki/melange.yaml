package:
  name: loki-3.6
  version: "3.6.22"  # renovate: datasource=github-releases depName=grafana/loki
  epoch: 0
  description: Like Prometheus, but for logs
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 14Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 38e4020516b25119f795a8a5f55e06ccd9c9d1fc
  grpc-floor: v1.83.2  # renovate: datasource=go depName=google.golang.org/grpc
  otel-floor: v1.47.0  # renovate: datasource=go depName=go.opentelemetry.io/otel

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/loki
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/loki
  - runs: |
      current="$(GOTOOLCHAIN=local go list -m -f '{{.Version}}' google.golang.org/grpc)"
      if awk -v have="$current" -v want=${{vars.grpc-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        GOTOOLCHAIN=local go get google.golang.org/grpc@${{vars.grpc-floor}}
      fi

  # Upstream Loki still resolves otel before the fixes in v1.47.0.
  - runs: |
      for module in go.opentelemetry.io/otel go.opentelemetry.io/otel/trace go.opentelemetry.io/otel/sdk; do
        current="$(go list -mod=mod -m -f '{{.Version}}' "$module")"
        if awk -v have="$current" -v want=${{vars.otel-floor}} 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
          }
          exit (have ~ /-/) ? 0 : 1
        }'; then
          GOTOOLCHAIN=local go get "$module@${{vars.otel-floor}}"
        fi
      done
      GOTOOLCHAIN=local go mod tidy

  - runs: |
      flags="-s -w"
      flags="$flags -X github.com/grafana/loki/v3/pkg/util/build.Branch=release-3.6.x"
      flags="$flags -X github.com/grafana/loki/v3/pkg/util/build.Version=${{package.version}}"
      flags="$flags -X github.com/grafana/loki/v3/pkg/util/build.Revision=${{vars.source-commit}}"
      flags="$flags -X github.com/grafana/loki/v3/pkg/util/build.BuildUser=verity"
      flags="$flags -X github.com/grafana/loki/v3/pkg/util/build.BuildDate=2026-11-12T03:44:24Z"
      go build -mod=readonly -trimpath -tags netgo -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/loki" ./cmd/loki
      actual="$(go version -m "${{targets.destdir}}/usr/bin/loki" \
        | awk '$1 == "dep" && $2 == "google.golang.org/grpc" { print $3 }')"
      [ -n "$actual" ] || {
        echo "google.golang.org/grpc is not linked into loki" >&2
        exit 1
      }
      awk -v have="$actual" -v want=${{vars.grpc-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 > w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 1 : 0
      }' || {
        echo "google.golang.org/grpc version $actual is below required floor ${{vars.grpc-floor}}" >&2
        exit 1
      }
      actual="$(go version -m "${{targets.destdir}}/usr/bin/loki" \
        | awk '$1 == "dep" && $2 ~ "^go\\.opentelemetry\\.io/otel(/trace|/sdk)?$" { print $2 " " $3 }' | sort)"
      [ -n "$actual" ]
      printf '%s\n' "$actual" | awk -v want=${{vars.otel-floor}} 'BEGIN {
        split(substr(want, 2), w, ".")
        count=0; bad=0
      } {
        count++
        split(substr($2, 2), h, /[.+-]/)
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) break
        }
        if (i <= 3 ? h[i] + 0 < w[i] + 0 : $2 ~ /-/) bad=1
      } END { exit (bad || count != 3) ? 1 : 0 }' || {
        echo "Loki links OpenTelemetry modules below the floor ${{vars.otel-floor}}: $actual" >&2
        exit 1
      }
      install -Dm644 cmd/loki/loki-docker-config.yaml \
        "${{targets.destdir}}/etc/loki/local-config.yaml"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 LICENSING.md \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSING.md"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        loki -version 2>&1 | grep -F "${{package.version}}"
        loki -config.file=/etc/loki/local-config.yaml -verify-config
        apk info --who-owns /usr/bin/loki \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx AGPL-3.0-only
        test -s /usr/share/licenses/${{package.name}}/LICENSE
        test -s /usr/share/licenses/${{package.name}}/LICENSING.md

update:
  enabled: true
  github:
    identifier: grafana/loki
    strip-prefix: v
    tag-filter-prefix: v3.6
    use-tag: true
