contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - openssh-client
    - py3.13-ansible-core=2.22.0-r0

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/ansible-playbook

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
