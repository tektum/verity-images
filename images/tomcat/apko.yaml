contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - tomcat-11.0-openjdk-21

accounts:
  run-as: 65532

cmd: catalina.sh run

work-dir: /usr/share/tomcat

environment:
  CATALINA_HOME: /usr/share/tomcat
  JAVA_HOME: /usr/lib/jvm/default-jvm
  LD_LIBRARY_PATH: /usr/lib/tomcat-native
  PATH: /usr/share/tomcat/bin:/usr/lib/jvm/default-jvm/bin:/usr/bin:/bin

paths:
  - path: /usr/share/tomcat/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/webapps
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/conf/Catalina
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/tomcat/conf/Catalina/localhost
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
