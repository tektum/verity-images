package:
  name: valkey-9.0
  # yamllint disable-line rule:line-length
  version: "9.1.3"  # renovate: datasource=github-tags depName=valkey-io/valkey versioning=regex:^(?<major>9)\.(?<minor>1)\.(?<patch>\d+)$
  epoch: 0
  description: Advanced key-value store
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provides:
      - valkey=${{package.full-version}}
    runtime:
      - posix-libc-utils
  resources:
    cpu: "16"
    memory: 32Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - jemalloc
      - linux-headers
      - openssl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/valkey-io/valkey
      tag: ${{package.version}}
      expected-commit: 29173b67508b2de4c0f0ed551f3b47cf19fc3ca8
  - runs: |
      export CFLAGS="$CFLAGS -DUSE_MALLOC_USABLE_SIZE"
      make BUILD_TLS=yes all -j$(nproc)
      make install PREFIX=/usr INSTALL_BIN="${{targets.destdir}}/usr/bin"
  - uses: strip

subpackages:
  - name: ${{package.name}}-cli
    description: Command-line client for Valkey
    dependencies:
      provides:
        - valkey-cli=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/valkey-cli" "${{targets.subpkgdir}}/usr/bin/valkey-cli"
