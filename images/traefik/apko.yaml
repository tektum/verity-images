contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - traefik@local
    - tzdata

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/traefik

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/traefik
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
