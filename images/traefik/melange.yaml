package:
  name: traefik
  version: "3.7.11"
  epoch: 0
  description: Cloud native application proxy
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}
      expected-commit: faa1eb590646aed94e561e24a59be0c47353ae95
  - runs: mkdir release
  - uses: fetch
    with:
      uri: >-
        https://github.com/traefik/traefik/releases/download/v${{package.version}}/traefik-v${{package.version}}.src.tar.gz
      expected-sha256: 31e0e2fbdccd3170b3bc5c3d233a08585bcbc5ede8f753d12a5999d69c21cdd6
      directory: release
  - runs: |
      cp -R release/webui/static/. webui/static/
  - uses: go/build/v2
    with:
      packages: ./cmd/traefik
      output: traefik
      strip: -s -w
      ldflags: >-
        -X github.com/traefik/traefik/v3/pkg/version.Version=v${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.Codename=cheddar

subpackages:
  - name: traefik-build-metadata
    description: Resolved Go module metadata for the Traefik build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/traefik-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/traefik-build/go.sum"
