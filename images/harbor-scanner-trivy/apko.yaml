contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-harbor-scanner-trivy@local

accounts:
  groups:
    - groupname: scanner
      gid: 10000
  users:
    - username: scanner
      uid: 10000
      gid: 10000
      homedir: /home/scanner
  run-as: 10000

entrypoint:
  command: /home/scanner/bin/scanner-trivy

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  HOME: /home/scanner
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # Reported as scanner.version by /api/v1/metadata, as upstream sets it.
  # Must equal vars.trivy-version in melange.yaml; tests/test.sh enforces it.
  # yamllint disable-line rule:line-length
  TRIVY_VERSION: "0.76.2"  # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=regex:^(?<major>0)\.(?<minor>76)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$

paths:
  - path: /home/scanner
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
  - path: /home/scanner/.cache
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
  - path: /home/scanner/.cache/trivy
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
  - path: /home/scanner/.cache/reports
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o1777
