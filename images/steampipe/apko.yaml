contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-steampipe@local
    # Steampipe execs `uname` to pick the FDW architecture, and the PostgreSQL
    # and FDW binaries it downloads at runtime link against glibc and zlib.
    - busybox
    - glibc
    - ld-linux
    - zlib

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/steampipe

work-dir: /workspace

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  # CGO-free os/user falls back to $USER for UIDs missing from /etc/passwd.
  USER: nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  STEAMPIPE_INSTALL_DIR: /home/nonroot/.steampipe
  STEAMPIPE_UPDATE_CHECK: "false"
  STEAMPIPE_TELEMETRY: none

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.steampipe
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
