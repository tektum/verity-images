contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - collectd=5.12.0-r57

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

# Foreground daemon. The default cmd runs the config the Wolfi package ships
# (cpu, interface, load, memory into rrdtool under /var/lib/collectd); pass
# `-C /path/to/collectd.conf` to run a mounted config instead.
entrypoint:
  command: /usr/bin/collectd -f

cmd: -C /etc/collectd/collectd.conf

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot

paths:
  # The package installs its config root-only (0640); nonroot must read it.
  - path: /etc/collectd/collectd.conf
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o644
  # BaseDir and the rrdtool DataDir of the shipped config.
  - path: /var/lib/collectd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
