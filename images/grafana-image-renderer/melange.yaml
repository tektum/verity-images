package:
  name: verity-grafana-image-renderer
  # yamllint disable-line rule:line-length
  version: "5.12.10"  # renovate: datasource=github-tags depName=grafana/grafana-image-renderer versioning=regex:^v?(?<major>5)\.(?<minor>12)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Grafana image renderer service that drives a headless Chromium
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 189bb4fecfc42b982713879f165f735fae5e1581

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/grafana-image-renderer
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      # The module is github.com/grafana/grafana-image-renderer with no /v5
      # suffix, so Go cannot stamp a module version from the v5 tag. The scan
      # identity is declared in metadata.yaml instead. -buildvcs=true (and the
      # checkout's .git) keeps the VCS revision that the service reports as
      # its version, as upstream's own Dockerfile does.
      go build -mod=readonly -trimpath -buildvcs=true -ldflags '-s -w' \
        -o "${{targets.destdir}}/usr/bin/grafana-image-renderer" .
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the image renderer build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/grafana-image-renderer-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/grafana-image-renderer-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        grafana-image-renderer --help 2>&1 | grep -F 'server'
        apk info --who-owns /usr/bin/grafana-image-renderer \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: grafana/grafana-image-renderer
    strip-prefix: v
    use-tag: true
