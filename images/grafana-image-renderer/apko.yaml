contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - chromium
    - fontconfig
    - glibc-locale-en
    - font-freefont
    - font-ipafont-gothic
    - font-kacst
    - font-khmeros
    - font-liberation
    - font-opensans
    - font-tlwg
    - font-wqy-zenhei
    - tini
    - tzdata
    - verity-grafana-image-renderer@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

work-dir: /home/nonroot

entrypoint:
  command: /sbin/tini -- /usr/bin/grafana-image-renderer

cmd: server

environment:
  CHROME_BIN: /usr/bin/chromium
  HOME: /home/nonroot
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 0
    permissions: 0o775
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
