package:
  name: verity-memcached-exporter
  # yamllint disable-line rule:line-length
  version: "0.18.0"  # renovate: datasource=github-releases depName=prometheus/memcached_exporter versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Prometheus exporter for memcached server metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  # v0.18.0 peels to this commit.
  source-commit: 6df2a9958afbc76f81ec74e8b3551a849449812d

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/memcached_exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/memcached_exporter

  # Same version stamps as the upstream .promu.yml, with the commit time as
  # build date so the binary does not depend on the build clock. The checkout
  # keeps .git, so Go stamps the main module version from the v tag for the
  # scanner; a `+dirty` suffix only records go/remediate edits.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d-%H:%M:%S)
      pkg=github.com/prometheus/common/version
      flags="-s -w -X $pkg.Version=${{package.version}}"
      flags="$flags -X $pkg.Revision=${{vars.source-commit}}"
      flags="$flags -X $pkg.Branch=HEAD -X $pkg.BuildUser=verity -X $pkg.BuildDate=$build_date"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/memcached_exporter" ./cmd/memcached_exporter
      go version -m "${{targets.destdir}}/usr/bin/memcached_exporter" \
        | awk '$1 == "mod" && $2 == "github.com/prometheus/memcached_exporter" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the memcached_exporter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/memcached-exporter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/memcached-exporter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        memcached_exporter --version 2>&1 \
          | grep -E '^memcached_exporter, version ${{package.version}} '
        memcached_exporter --help 2>&1 | grep -F -- '--memcached.address'
        apk info --who-owns /usr/bin/memcached_exporter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: prometheus/memcached_exporter
    strip-prefix: v
