package:
  name: nuclei-3.11
  # yamllint disable-line rule:line-length
  version: "3.11.1"  # renovate: datasource=github-releases depName=projectdiscovery/nuclei versioning=regex:^(?<major>3)\.(?<minor>11)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Template-based vulnerability scanner
  copyright:
    - license: MIT
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: a8c88feb4a1c8e961b7902534ce3af97e9d524a4

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/projectdiscovery/nuclei
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/nuclei
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/nuclei" ./cmd/nuclei
      go version -m "${{targets.destdir}}/usr/bin/nuclei" \
        | awk '$1 == "mod" && $2 == "github.com/projectdiscovery/nuclei/v3" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.md \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nuclei build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nuclei-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nuclei-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        HOME=$(mktemp -d) nuclei -version 2>&1 | grep -F "Nuclei Engine Version: v${{package.version}}"
        apk info --who-owns /usr/bin/nuclei \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: projectdiscovery/nuclei
    strip-prefix: v
