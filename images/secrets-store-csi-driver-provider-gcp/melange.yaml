package:
  name: verity-secrets-store-csi-driver-provider-gcp
  # yamllint disable-line rule:line-length
  version: "1.19.0"  # renovate: datasource=github-releases depName=GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Google Secret Manager provider for the Secrets Store CSI Driver
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: e53a911045cb571271c4adf8ae9e258d94e3793d

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X 'main.version=v${{package.version}}'" \
        -o "${{targets.destdir}}/usr/bin/secrets-store-csi-driver-provider-gcp" .
      module=github.com/GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
      go version -m "${{targets.destdir}}/usr/bin/secrets-store-csi-driver-provider-gcp" \
        | awk -v module="$module" '$1 == "mod" && $2 == module { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Secrets Store CSI Driver GCP provider build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/secrets-store-csi-driver-provider-gcp-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /usr/bin/secrets-store-csi-driver-provider-gcp --help 2>&1 | grep -F -- '-kubeconfig'
        apk info --who-owns /usr/bin/secrets-store-csi-driver-provider-gcp \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: GoogleCloudPlatform/secrets-store-csi-driver-provider-gcp
    strip-prefix: v
    tag-filter-prefix: v1.
    use-tag: true
