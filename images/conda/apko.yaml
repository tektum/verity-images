contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - py3.12-conda=26.10.0-r1
    - py3.12-conda-bin=26.10.0-r1
    - python-3.12

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

# The Wolfi /usr/bin/conda launcher is the pip entry point, which refuses every
# command except init and info until `conda init` rewrites files under /usr as
# root. The module entry point runs the full CLI without that step. The
# launcher stays installed because `conda run` activates through it, and
# activation (`conda shell.*`) is not gated.
entrypoint:
  command: /usr/bin/python3.12 -m conda

work-dir: /home/nonroot

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # conda-forge only. The Anaconda defaults channel is not configured: its
  # packages are covered by the Anaconda Terms of Service.
  CONDA_CHANNELS: conda-forge
  CONDA_CHANNEL_PRIORITY: strict
  # conda 26.10 selects the rattler solver by default, which Wolfi does not package;
  # the image ships conda-libmamba-solver.
  CONDA_SOLVER: libmamba

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
