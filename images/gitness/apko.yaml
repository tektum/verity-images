contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    # Upstream harness/harness:3.3.0 is built FROM alpine/git; gitness shells
    # out to git for every repository operation and git-lfs for LFS objects.
    # busybox provides the /bin/sh that git uses to run hooks and helpers.
    - busybox
    - ca-certificates-bundle
    - git
    - git-lfs
    - openssh-client
    - tzdata
    - verity-gitness@local

# Upstream harness/harness:3.3.0 (built from the harness/gitness v3.3.0
# Dockerfile): /app/gitness, ENTRYPOINT ["/app/gitness", "server"], no CMD,
# WORKDIR /app, VOLUME /data, EXPOSE 3000 3022, and the GITNESS_* environment
# below. Upstream runs as root; this image runs as non-root 65532 and owns
# /data, keeps /app/gitness as a symlink to the packaged /usr/bin/gitness, and
# does not carry the /git volume inherited from the alpine/git base, which
# gitness never uses. Unlike upstream, usage metrics are off by default
# (GITNESS_METRIC_ENABLED=false); set GITNESS_METRIC_ENABLED=true at run time
# to opt back in (the upstream endpoint is kept). APKO cannot declare exposed
# ports, so the smoke test asserts the 3000 and 3022 listeners.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /app/gitness server

work-dir: /app

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  XDG_CACHE_HOME: /data
  GITNESS_GIT_ROOT: /data
  GITNESS_REGISTRY_FILESYSTEM_ROOT_DIRECTORY: /data/registry
  GITNESS_DATABASE_DRIVER: sqlite3
  GITNESS_DATABASE_DATASOURCE: /data/database.sqlite
  GITNESS_METRIC_ENABLED: "false"
  GITNESS_METRIC_ENDPOINT: https://stats.drone.ci/api/v1/gitness
  GITNESS_TOKEN_COOKIE_NAME: token
  GITNESS_DOCKER_API_VERSION: "1.41"
  GITNESS_SSH_ENABLE: "true"
  GITNESS_GITSPACE_ENABLE: "true"

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  # The SSH server writes its default host key to the relative path
  # ssh/gitness.rsa under WORKDIR /app, as upstream does as root.
  - path: /app/ssh
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /app/gitness
    type: symlink
    source: /usr/bin/gitness
    uid: 0
    gid: 0
  # apko applies the symlink entry's mode (0) through the link to its target,
  # so the binary mode is restored explicitly.
  - path: /usr/bin/gitness
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755

volumes:
  - /data
