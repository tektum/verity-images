package:
  name: verity-cadvisor
  # yamllint disable-line rule:line-length
  version: "0.60.6"  # renovate: datasource=github-releases depName=google/cadvisor versioning=regex:^(?<major>0)\.(?<minor>60)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Container resource usage and performance metrics daemon
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 5bf5d43ac6f60d7ee36a13b4d5b4a78ad2d0abc7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/cadvisor
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: cmd
      packages: .
  - runs: |
      # The binary lives in the cmd module, which replaces the library modules with the checkout.
      # Its module path carries no release tag, so the scanner identity is declared in metadata.
      cd cmd
      pkg=github.com/google/cadvisor/lib/version
      go build -p 4 -mod=readonly -trimpath -buildvcs=true -tags=netgo \
        -ldflags="-s -w -X $pkg.Version=v${{package.version}} -X $pkg.Revision=$(git rev-parse --short HEAD)" \
        -o "${{targets.destdir}}/usr/bin/cadvisor" .
      cd ..
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cAdvisor build
    pipeline:
      - runs: |
          install -Dm644 cmd/go.mod "${{targets.subpkgdir}}/usr/share/cadvisor-build/go.mod"
          install -Dm644 cmd/go.sum "${{targets.subpkgdir}}/usr/share/cadvisor-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        cadvisor --version | grep -F 'version v${{package.version}} '
        apk info --who-owns /usr/bin/cadvisor \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: google/cadvisor
    tag-filter-prefix: v0.60.
    strip-prefix: v
