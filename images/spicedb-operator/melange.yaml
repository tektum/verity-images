package:
  name: verity-spicedb-operator
  # yamllint disable-line rule:line-length
  version: "1.27.0"  # renovate: datasource=github-releases depName=authzed/spicedb-operator versioning=regex:^(?<major>1)\.(?<minor>27)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator for managing SpiceDB clusters
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  source-commit: 7a4292b85f17cc3da531643dd4fe9d2c434efd3a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/authzed/spicedb-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/spicedb-operator

  - name: Build
    runs: |
      # Same package and "-s -w" linker flags as the upstream goreleaser build.
      # Upstream also passes -X github.com/jzelinskie/cobrautil.Version, but
      # that module is not a dependency, so the flag is a no-op and released
      # binaries report the Go main module version (v<tag>) through
      # pkg/version. Set that variable directly so the reported version stays
      # v<tag> even when go/remediate leaves the tree +dirty.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/authzed/spicedb-operator/pkg/version.Version=v${{package.version}}" \
        -o spicedb-operator ./cmd/spicedb-operator

      install -Dm755 spicedb-operator "${{targets.destdir}}/usr/bin/spicedb-operator"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

      "${{targets.destdir}}/usr/bin/spicedb-operator" version \
        | grep -Fx 'spicedb-operator v${{package.version}}'
      go version -m "${{targets.destdir}}/usr/bin/spicedb-operator" \
        | awk '$1 == "mod" && $2 == "github.com/authzed/spicedb-operator" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      rm spicedb-operator

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the SpiceDB operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/spicedb-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/spicedb-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spicedb-operator version | grep -Fx 'spicedb-operator v${{package.version}}'
        spicedb-operator --help | grep -F 'run SpiceDB operator'
        spicedb-operator run --help | grep -F -- '--config string'
        apk info --who-owns /usr/bin/spicedb-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: authzed/spicedb-operator
    strip-prefix: v
    tag-filter-prefix: v1.27.
    use-tag: true
