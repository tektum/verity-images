package:
  name: verity-contour-1.33
  version: "1.33.5"
  epoch: 0
  description: Contour Kubernetes ingress controller
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 2713ad0e0ebd5d192a53803cef4c1c3a69692b1c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/projectcontour/contour
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/text@v0.39.0
        google.golang.org/grpc@v1.82.1

  - runs: |
      go build -mod=readonly -trimpath -tags "oidc gcp osusergo netgo" \
        -ldflags="-s -w \
          -X github.com/projectcontour/contour/internal/build.Version=v${{package.version}} \
          -X github.com/projectcontour/contour/internal/build.Sha=${{vars.source-commit}} \
          -X github.com/projectcontour/contour/internal/build.Branch=release-1.33" \
        -o "${{targets.destdir}}/usr/bin/contour" ./cmd/contour
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  pipeline:
    - runs: |
        /usr/bin/contour version | grep -F "v${{package.version}}"
        /usr/bin/contour serve --help >/dev/null
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: projectcontour/contour
    strip-prefix: v
    tag-filter-prefix: v1.33
