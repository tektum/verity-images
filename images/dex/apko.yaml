contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-dex@local

accounts:
  groups:
    - groupname: dex
      gid: 1001
  users:
    - username: dex
      uid: 1001
      gid: 1001
  run-as: 1001

entrypoint:
  command: /usr/bin/dex

cmd: serve /etc/dex/config.docker.yaml

work-dir: /var/dex

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /var/dex
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1001
    gid: 1001
    permissions: 0o1777
