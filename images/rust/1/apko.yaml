contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - apk-tools
    - busybox
    - ca-certificates-bundle
    - gcc
    - glibc-dev
    - rust-1.86

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/rustc

work-dir: /app

environment:
  RUST_BACKTRACE: "1"
  CARGO_HOME: /usr/local/cargo
  PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/local/cargo
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
