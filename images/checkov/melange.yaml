package:
  name: verity-checkov
  # yamllint disable-line rule:line-length
  version: "3.4.3"  # renovate: datasource=github-releases depName=bridgecrewio/checkov versioning=regex:^(?<major>3)\.(?<minor>4)\.(?<patch>\d+)$
  epoch: 0
  description: Checkov static analysis for infrastructure as code, installed from the upstream source release
  copyright:
    - license: Apache-2.0
  options:
    # The virtual environment's wheels carry their own shared objects; do not
    # advertise them as system library providers.
    no-provides: true
  dependencies:
    runtime:
      - ca-certificates-bundle
      # Terraform module sources can be git repositories.
      - git
      - python-3.13-base
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  source-commit: 5038a50e21a2253cb5aed2e739d2c22ee28d2e17
  python-version: "3.13"
  venv: /opt/checkov
  # Dependencies resolve from the ranges in checkov's setup.py. checkov pins
  # asteval exactly; the build raises that pin to the release that fixes
  # GHSA-89v8-rhwq-hf77 and GHSA-9w56-46f6-3qhx.
  asteval-version: "1.0.9"  # renovate: datasource=pypi depName=asteval

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - libffi-dev
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev
      - uv
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bridgecrewio/checkov
      tag: ${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - name: Install checkov into a virtual environment
    environment:
      UV_PYTHON: python${{vars.python-version}}
      UV_NO_CACHE: "1"
    runs: |
      # setup.py pins asteval exactly; raise the pin so the installed
      # distribution metadata stays consistent and `uv pip check` proves the
      # final set resolves together.
      sed -i 's/"asteval==1\.0\.6"/"asteval==${{vars.asteval-version}}"/' setup.py
      grep -F '"asteval==${{vars.asteval-version}}"' setup.py
      uv venv "${{vars.venv}}"
      uv pip install --python "${{vars.venv}}/bin/python" --compile-bytecode .
      uv pip check --python "${{vars.venv}}/bin/python"
      "${{vars.venv}}/bin/python" - <<'PY'
      import importlib.metadata as m
      assert m.version("checkov") == "${{package.version}}"
      assert m.version("asteval") == "${{vars.asteval-version}}"
      PY

      mkdir -p "${{targets.destdir}}/opt" "${{targets.destdir}}/usr/bin"
      cp -a "${{vars.venv}}" "${{targets.destdir}}/opt/"
      rm -f "${{targets.destdir}}${{vars.venv}}/.lock"
      ln -s "${{vars.venv}}/bin/checkov" "${{targets.destdir}}/usr/bin/checkov"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        checkov --version | grep -x "${{package.version}}"
        apk info --who-owns /opt/checkov/bin/checkov | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: bridgecrewio/checkov
    tag-filter-prefix: "3.4."
    use-tag: true
