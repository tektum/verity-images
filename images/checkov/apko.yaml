contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-checkov@local

accounts:
  groups:
    - groupname: checkov
      gid: 65532
  users:
    - username: checkov
      uid: 65532
      gid: 65532
      homedir: /home/checkov
  run-as: 65532

entrypoint:
  command: /usr/bin/checkov

work-dir: /src

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/checkov
  CKV_DISABLE_TELEMETRY: "1"
  BC_SKIP_MAPPING: "TRUE"

paths:
  - path: /src
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/checkov
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
