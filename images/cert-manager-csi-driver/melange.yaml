package:
  name: verity-cert-manager-csi-driver
  # yamllint disable-line rule:line-length
  version: "0.16.1"  # renovate: datasource=github-releases depName=cert-manager/csi-driver versioning=regex:^(?<major>0)\.(?<minor>16)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: cert-manager CSI driver node plugin that mounts issued certificates into pods
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - mount
      - tzdata
      - umount
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: deb94d2376e3d84b6c14fa7690f3378f3a52f103

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/csi-driver
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/cert-manager/csi-driver/internal/version.AppVersion=v${{package.version}} \
          -X github.com/cert-manager/csi-driver/internal/version.GitCommit=${{vars.source-commit}}" \
        -o "${{targets.destdir}}/usr/bin/cert-manager-csi-driver" ./cmd
      go version -m "${{targets.destdir}}/usr/bin/cert-manager-csi-driver" \
        | awk '$1 == "mod" && $2 == "github.com/cert-manager/csi-driver" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cert-manager CSI driver build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/cert-manager-csi-driver-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/cert-manager-csi-driver-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        cert-manager-csi-driver --help | grep -F -- '--data-root'
        apk info --who-owns /usr/bin/cert-manager-csi-driver \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cert-manager/csi-driver
    tag-filter-prefix: v0.16.
    strip-prefix: v
