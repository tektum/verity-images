package:
  name: verity-coredns-1.14
  version: "1.14.7"  # renovate: datasource=github-releases depName=coredns/coredns
  epoch: 0
  description: Extensible DNS server with a plugin-based configuration model
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "6"
    memory: 10Gi

vars:
  source-commit: 427fc80ed9ca47f354585eb30a3f1332950856c4

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - libcap-utils
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coredns/coredns
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -tags=grpcnotrace \
        -ldflags="-s -w -X github.com/coredns/coredns/coremain.GitCommit=v${{package.version}}" \
        -o "${{targets.destdir}}/coredns" .
      go version -m "${{targets.destdir}}/coredns" | awk -v v="v${{package.version}}" '
        $1 == "mod" && $2 == "github.com/coredns/coredns" && index($3, v) == 1 { ok = 1 }
        END { exit !ok }'
      setcap cap_net_bind_service=+ep "${{targets.destdir}}/coredns"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - libcap-utils
  pipeline:
    - runs: |
        /coredns -version | grep -F "CoreDNS-${{package.version}}"
        /coredns -plugins >/dev/null
        getcap /coredns | grep -F cap_net_bind_service
        test -f /usr/share/licenses/${{package.name}}/LICENSE
