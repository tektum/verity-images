contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - wasmcloud=2.12.3-r0

accounts:
  groups:
    - groupname: wasmcloud
      gid: 65532
  users:
    - username: wasmcloud
      uid: 65532
      gid: 65532
      homedir: /home/wasmcloud
  run-as: 65532

entrypoint:
  command: /usr/bin/wash

environment:
  PATH: /usr/bin:/bin
  HOME: /home/wasmcloud

paths:
  - path: /home/wasmcloud
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /home/wasmcloud
