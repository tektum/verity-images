package:
  name: verity-kwok
  # yamllint disable-line rule:line-length
  version: "0.8.0"  # renovate: datasource=github-releases depName=kubernetes-sigs/kwok versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes WithOut Kubelet controller that simulates nodes and pods
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 156033d7df7ea0e09cea82b715fe566ea68aeeb4

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/kwok
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/kwok

  - runs: |
      # Same version stamp as the upstream hack/releases.sh build.
      bin="${{targets.destdir}}/usr/bin/kwok"
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X sigs.k8s.io/kwok/pkg/consts.Version=v${{package.version}}" \
        -o "$bin" ./cmd/kwok
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "sigs.k8s.io/kwok" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "$bin" --version | grep -E '^kwok version v${{package.version}} go[0-9.]+ \(linux/[a-z0-9]+\)$'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kwok build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kwok-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kwok-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kwok --version | grep -F 'kwok version v${{package.version}} '
        kwok --help | grep -F -- '--manage-nodes-with-annotation-selector'
        apk info --who-owns /usr/bin/kwok \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/kwok
    strip-prefix: v
    tag-filter-prefix: v0.
    use-tag: true
