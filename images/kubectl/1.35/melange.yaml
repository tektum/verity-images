package:
  name: kubectl-1.35
  version: "1.37.0"
  epoch: 1
  description: Kubernetes command-line client
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi
    disk: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - findutils
      - python3
      - go-1.26
      - grep
      - rsync
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/kubernetes
      tag: v${{package.version}}
      expected-commit: f54c212e3a2f75d674b717a9b29052b20b60aefc
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/kubectl
  - runs: |
      go work edit -go=1.25.0
      go work use
  - runs: |
      export FORCE_HOST_GO=true
      export KUBE_GIT_TREE_STATE=clean
      make WHAT=cmd/kubectl
  - runs: |
      install -m755 -D _output/bin/kubectl "${{targets.destdir}}/usr/bin/kubectl"

test:
  pipeline:
    - runs: /usr/bin/kubectl --help
