package:
  name: verity-hcloud
  # yamllint disable-line rule:line-length
  version: "1.70.2"  # renovate: datasource=github-releases depName=hetznercloud/cli versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Command-line interface for Hetzner Cloud
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 80c634c2e87d2deecf69154d861428f34d2eae08

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hetznercloud/cli
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/hcloud

  # Upstream release builds clear versionPrerelease; the source default is
  # "dev", which would make `hcloud version` report 1.70.2-dev.
  - runs: |
      pkg=github.com/hetznercloud/cli/internal/version
      ldflags="-s -w -X ${pkg}.version=${{package.version}} -X ${pkg}.versionPrerelease="
      ldflags="${ldflags} -X ${pkg}.commit=${{vars.source-commit}}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="${ldflags}" \
        -o "${{targets.destdir}}/usr/bin/hcloud" ./cmd/hcloud
      go version -m "${{targets.destdir}}/usr/bin/hcloud" \
        | awk '$1 == "mod" && $2 == "github.com/hetznercloud/cli" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the hcloud build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/hcloud-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/hcloud-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        hcloud version | grep -Fx 'hcloud ${{package.version}}'
        apk info --who-owns /usr/bin/hcloud \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: hetznercloud/cli
    strip-prefix: v
