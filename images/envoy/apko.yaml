contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - envoy-1.37@local
    - envoy-1.37-config@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/envoy

cmd: -c /etc/envoy/envoy.yaml

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/envoy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
