package:
  name: verity-flux-cli-2.10
  version: "2.10.0"  # renovate: datasource=github-releases depName=fluxcd/flux2
  epoch: 0
  description: Flux CLI for the GitOps Toolkit.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - kustomize
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluxcd/flux2
      tag: v${{package.version}}
      expected-commit: 3fa784edd773d56630bb9f62645e08f70c2cff0a

  - runs: |
      ./manifests/scripts/bundle.sh
      test -s cmd/flux/manifests/source-controller.yaml

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/flux

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w -X main.VERSION=${{package.version}}" \
        -o flux ./cmd/flux

      install -Dm755 flux "${{targets.destdir}}/usr/bin/flux"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

      "${{targets.destdir}}/usr/bin/flux" version --client \
        | grep -Fx "flux: v${{package.version}}"

  - uses: strip

subpackages:
  - name: verity-flux-cli-2.10-build-metadata
    description: Resolved Go module metadata for the Flux CLI build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/flux-cli-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/flux-cli-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        flux version --client | grep -Fx "flux: v${{package.version}}"
        flux install --export --components source-controller \
          | grep -F 'ghcr.io/fluxcd/source-controller:'
        apk info --who-owns /usr/bin/flux \
          | grep -F "${{package.name}}-${{package.full-version}}"
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: fluxcd/flux2
    strip-prefix: v
    tag-filter-prefix: v2.10.
    use-tag: true
