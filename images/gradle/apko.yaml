contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - openjdk-21
    - verity-gradle-9@local

accounts:
  groups:
    - groupname: gradle
      gid: 65532
  users:
    - username: gradle
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/gradle

work-dir: /home/gradle

environment:
  GRADLE_USER_HOME: /home/gradle/.gradle
  HOME: /home/gradle
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/bin
  USER: gradle

paths:
  - path: /home/gradle
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
