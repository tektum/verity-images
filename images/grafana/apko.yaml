contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - grafana-12.4

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/grafana server --homepath /usr/share/grafana --config /etc/grafana/grafana.ini

environment:
  GF_PATHS_CONFIG: /etc/grafana/grafana.ini
  GF_PATHS_DATA: /var/lib/grafana
  GF_PATHS_LOGS: /var/log/grafana
  GF_PATHS_PLUGINS: /var/lib/grafana/plugins
  PATH: /usr/bin:/bin

paths:
  - path: /etc/grafana
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/grafana
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/grafana
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/grafana/plugins
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
