contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-vmselect@local

accounts:
  run-as: 10001

entrypoint:
  command: /usr/bin/vmselect

cmd: -cacheDataPath=/vmselect-cache

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /vmselect-cache
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755

volumes:
  - /vmselect-cache
