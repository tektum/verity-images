package:
  name: verity-cloud-sql-proxy
  # yamllint disable-line rule:line-length
  version: "2.28.0"  # renovate: datasource=github-releases depName=GoogleCloudPlatform/cloud-sql-proxy versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Cloud SQL Auth Proxy for authorized, encrypted connections to Cloud SQL instances
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: aa05bcc2b21c3ba3985bb1f3f3196a0ac3ee5863

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    # Upstream Dockerfile builds a static binary with CGO_ENABLED=0.
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/cloud-sql-proxy
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # The release version comes from the embedded cmd/version.txt, exactly as
      # in the upstream Dockerfile; it must agree with the checked-out tag.
      [ "$(tr -d '[:space:]' < cmd/version.txt)" = "${{package.version}}" ]
      # Same ldflag as the upstream Dockerfile, so --version reports
      # <version>+container like the upstream container image. -s -w only drop
      # symbol tables; -buildvcs stamps the v2 module version for scanning.
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/GoogleCloudPlatform/cloud-sql-proxy/v2/cmd.metadataString=container" \
        -o "${{targets.destdir}}/usr/bin/cloud-sql-proxy" .
      go version -m "${{targets.destdir}}/usr/bin/cloud-sql-proxy" \
        | awk '$1 == "mod" && $2 == "github.com/GoogleCloudPlatform/cloud-sql-proxy/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/cloud-sql-proxy" --version \
        | grep -Fx 'cloud-sql-proxy version ${{package.version}}+container'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cloud-sql-proxy build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/cloud-sql-proxy-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/cloud-sql-proxy-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        [ "$(cloud-sql-proxy --version)" = "cloud-sql-proxy version ${{package.version}}+container" ]
        apk info --who-owns /usr/bin/cloud-sql-proxy \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: GoogleCloudPlatform/cloud-sql-proxy
    strip-prefix: v
