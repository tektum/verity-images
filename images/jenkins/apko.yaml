contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - findutils
    - fontconfig
    - glibc-locale-en
    - grep
    - jenkins-docker
    - jenkins-plugin-manager
    - openjdk-21-jre
    - sed
    - verity-jenkins@local

accounts:
  groups:
    - groupname: jenkins
      gid: 1000
  users:
    - username: jenkins
      uid: 1000
      gid: 1000
      shell: /bin/bash
  run-as: 1000

entrypoint:
  command: /usr/bin/tini -- /usr/local/bin/jenkins.sh

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  PATH: /usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/bin
  JENKINS_HOME: /var/jenkins_home
  JENKINS_SLAVE_AGENT_PORT: "50000"
  JENKINS_UC: https://updates.jenkins.io
  COPY_REFERENCE_FILE_LOG: /var/jenkins_home/copy_reference_file.log
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  TZ: UTC

paths:
  - path: /var/jenkins_home
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /usr/share/jenkins/ref
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755

work-dir: /var/jenkins_home

volumes:
  - /var/jenkins_home
