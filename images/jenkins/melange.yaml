package:
  name: verity-jenkins
  # Tracks the LTS line: only three-component jenkinsci/docker tags are LTS releases.
  # yamllint disable-line rule:line-length
  version: "2.580.2"  # renovate: datasource=github-tags depName=jenkinsci/docker versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$
  epoch: 0
  description: Jenkins automation server web archive
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openjdk-21-jre
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout

pipeline:
  - uses: fetch
    with:
      uri: https://get.jenkins.io/war-stable/${{package.version}}/jenkins.war
      expected-sha256: d98032d2401c540a35613a82ed358921fcf3166d5e6eaaaf60a7941845be3251
      extract: false
  - runs: |
      install -Dm644 jenkins.war "${{targets.destdir}}/usr/share/jenkins/jenkins.war"

test:
  pipeline:
    - runs: test -s /usr/share/jenkins/jenkins.war
