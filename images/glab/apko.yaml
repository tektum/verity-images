contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    # The Wolfi glab package declares git as a runtime dependency; glab shells
    # out to git to resolve the project from the repository remote and for its
    # clone, checkout, and push workflows.
    - glab=1.133.0-r0

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/glab

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  # An image cannot update itself; skip the release check that otherwise
  # contacts gitlab.com regardless of the configured GitLab host.
  GLAB_CHECK_UPDATE: "false"

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
