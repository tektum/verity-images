package:
  name: verity-mdbook
  # yamllint disable-line rule:line-length
  version: "0.5.4"  # renovate: datasource=github-releases depName=rust-lang/mdBook versioning=regex:^(?<major>0)\.(?<minor>5)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Create books from Markdown files
  copyright:
    - license: MPL-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - rust-1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rust-lang/mdBook
      tag: v${{package.version}}
      expected-commit: 2ea30c00f00647d2b3f4c0f79b3e0e1eabc0b66d

  - uses: cargo/remediate

  - runs: |
      cargo auditable build --release --locked -p mdbook
      install -Dm755 target/release/mdbook "${{targets.destdir}}/usr/bin/mdbook"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      rm -rf .cargo

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        mdbook --version | grep -Fx 'mdbook v${{package.version}}'
        apk info --license "${{package.name}}" | grep -Fx 'MPL-2.0'

update:
  enabled: true
  github:
    identifier: rust-lang/mdBook
    strip-prefix: v
