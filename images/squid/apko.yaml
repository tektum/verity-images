contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - squid-7@local

accounts:
  groups:
    - groupname: squid
      gid: 65532
  users:
    - username: squid
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/squid -N -f /etc/squid/squid.conf

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /var/spool/squid
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/squid
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
