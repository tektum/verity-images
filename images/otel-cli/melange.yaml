package:
  name: verity-otel-cli
  # yamllint disable-line rule:line-length
  version: "0.4.5"  # renovate: datasource=github-releases depName=equinix-labs/otel-cli versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: OpenTelemetry command-line tool for sending spans from shell scripts
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 0d4b8a9c49f60a6fc25ed22863259ff573332060

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/equinix-labs/otel-cli
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # go/remediate raises golang.org/x/net past GO-2026-6860 and GO-2026-6866,
  # which the Wolfi otel-cli 0.4.5-r41 build still ships, and any other module
  # with a released fix.
  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Same flags as the upstream GoReleaser defaults (CGO_ENABLED=0, -s -w)
      # with its main.version, main.commit and main.date stamps. The version is
      # also reported as the instrumentation scope version of every span.
      bin="${{targets.destdir}}/usr/bin/otel-cli"
      date=$(git log -1 --format=%cI)
      stamp="-X main.version=${{package.version}} -X main.commit=${{vars.source-commit}} -X main.date=$date"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w $stamp" -o "$bin" .
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "github.com/equinix-labs/otel-cli" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the otel-cli build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/otel-cli-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/otel-cli-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        otel-cli --help | grep -F 'create an OpenTelemetry span and send it'
        apk info --who-owns /usr/bin/otel-cli \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: equinix-labs/otel-cli
    strip-prefix: v
    use-tag: true
