contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-semgrep@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/semgrep

cmd: --help

work-dir: /src

environment:
  HOME: /home/nonroot
  PATH: /usr/bin:/bin
  SEMGREP_IN_DOCKER: "1"
  SEMGREP_ENABLE_VERSION_CHECK: "0"
  SEMGREP_SEND_METRICS: "off"

paths:
  - path: /src
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
