contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-opensearch-k8s-operator@local

# Upstream runs as USER 65532:65532 with WORKDIR /.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: "65532:65532"

# Upstream ships ENTRYPOINT ["/manager"] with no CMD; its Helm chart and
# kustomize manifests also set command: /manager.
entrypoint:
  command: /manager

work-dir: /

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
