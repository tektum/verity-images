package:
  name: kubernetes-reflector
  version: "10.0.65"
  epoch: 0
  description: Mirrors Kubernetes secrets and configmaps across namespaces
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - aspnet-10-runtime
  resources:
    cpu: "4"
    memory: 6Gi
  test-resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - dotnet-10-sdk
  environment:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emberstack/kubernetes-reflector
      tag: v${{package.version}}
      expected-commit: 0d074fb01e3f244692a3e257037362ab9454a68f
  - runs: |
      # Framework-dependent publish: the .NET and ASP.NET Core shared runtime
      # comes from the Wolfi aspnet-10-runtime package, never from a bundled
      # runtime pack downloaded during restore. HOME stays outside the build
      # workspace because .NET creates mode 0700 state there that the
      # workspace export cannot read.
      export HOME="$(mktemp -d)"
      dotnet publish src/ES.Kubernetes.Reflector/ES.Kubernetes.Reflector.csproj \
        -c Release \
        -o publish \
        /p:UseAppHost=false
      install -d "${{targets.destdir}}/app"
      cp -a publish/. "${{targets.destdir}}/app/"
      find "${{targets.destdir}}/app" -type d -exec chmod 0755 {} +
      find "${{targets.destdir}}/app" -type f -exec chmod 0644 {} +
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test -s /app/ES.Kubernetes.Reflector.dll
        test -s /app/ES.Kubernetes.Reflector.deps.json
        grep -F '"Microsoft.AspNetCore.App"' /app/ES.Kubernetes.Reflector.runtimeconfig.json
        if find /app -name 'Microsoft.AspNetCore.App.Runtime*' -o -name 'System.Private.CoreLib.dll' | grep .; then
          echo 'a bundled .NET runtime leaked into the application directory' >&2
          exit 1
        fi
        dotnet --list-runtimes | grep -F Microsoft.AspNetCore.App
        apk info --license kubernetes-reflector | grep -Fx MIT
        test -s /usr/share/licenses/${{package.name}}/LICENSE
