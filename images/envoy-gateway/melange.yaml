package:
  name: envoy-gateway-src
  version: "1.10.0"  # renovate: datasource=github-releases depName=envoyproxy/gateway
  epoch: 0
  description: Envoy Gateway controller and egctl
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 16Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/envoyproxy/gateway
      tag: v${{package.version}}
      expected-commit: 02e9f89d1c1dc16b723de48fa3289dfa413a6e01
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/envoy-gateway ./cmd/egctl
  - runs: |
      vp=github.com/envoyproxy/gateway/internal/cmd/version
      for cmd in envoy-gateway egctl; do
        go build -mod=readonly -trimpath -buildvcs=false \
          -ldflags="-s -w \
            -X ${vp}.envoyGatewayVersion=v${{package.version}} \
            -X ${vp}.gitCommitID=02e9f89d1c1dc16b723de48fa3289dfa413a6e01" \
          -o "${{targets.destdir}}/usr/local/bin/$cmd" ./cmd/$cmd
      done
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Envoy Gateway build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/envoy-gateway-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/envoy-gateway-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /usr/local/bin/envoy-gateway --help | grep -F 'Usage:'
        /usr/local/bin/egctl --help | grep -F 'Usage:'
        apk info --who-owns /usr/local/bin/envoy-gateway | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0

update:
  enabled: true
  github:
    identifier: envoyproxy/gateway
    strip-prefix: v
