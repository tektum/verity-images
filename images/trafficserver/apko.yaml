contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - verity-trafficserver@local

accounts:
  groups:
    - groupname: trafficserver
      gid: 65532
  users:
    - username: trafficserver
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/traffic_server

environment:
  PATH: /usr/bin:/bin

volumes:
  - /var/cache/trafficserver

paths:
  - path: /var/cache/trafficserver
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750
  - path: /var/log/trafficserver
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run/trafficserver
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
