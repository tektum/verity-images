package:
  name: verity-cert-exporter
  # yamllint disable-line rule:line-length
  version: "2.19.0"  # renovate: datasource=github-releases depName=joe-elliott/cert-exporter versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Prometheus exporter for certificate expiration on disk and in Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: c78126c651415288c8c7a0815136fc072785c399

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/joe-elliott/cert-exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  # The module path has no /v2 suffix, so Go cannot stamp the v2 tag and would
  # report a date pseudo-version. Build without VCS stamping; metadata.yaml
  # declares the module purl, versioned from package.version, for the scanner.
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w -X main.version=${{package.version}} -X main.commit=${{vars.source-commit}}" \
        -o "${{targets.destdir}}/usr/bin/cert-exporter" .
      go version -m "${{targets.destdir}}/usr/bin/cert-exporter" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/joe-elliott/cert-exporter
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cert-exporter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/cert-exporter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/cert-exporter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        cert-exporter --help 2>&1 | grep -F 'include-cert-glob'
        apk info --who-owns /usr/bin/cert-exporter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: joe-elliott/cert-exporter
    strip-prefix: v
    tag-filter: v
