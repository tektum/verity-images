contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - git
    - git-lfs
    - gitea-1.24@local
    - openssh-client
    - sqlite-libs
    - tzdata

accounts:
  groups:
    - groupname: git
      gid: 1000
  users:
    - username: git
      uid: 1000
      gid: 1000
      homedir: /var/lib/gitea/git
      shell: /bin/sh
  run-as: 1000

entrypoint:
  command: /usr/bin/gitea web --config /etc/gitea/app.ini

work-dir: /var/lib/gitea

environment:
  GITEA_CUSTOM: /var/lib/gitea/custom
  GITEA_TEMP: /tmp/gitea
  GITEA_WORK_DIR: /var/lib/gitea
  HOME: /var/lib/gitea/git
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

paths:
  - path: /etc/gitea
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o770
  - path: /var/lib/gitea
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o750
  - path: /var/lib/gitea/custom
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o750
  - path: /var/lib/gitea/data
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o750
  - path: /var/lib/gitea/git
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o750
  - path: /var/lib/gitea/log
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o750
  - path: /tmp/gitea
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o700

volumes:
  - /etc/gitea
  - /var/lib/gitea
