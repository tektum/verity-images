contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-bank-vaults@local

# Upstream runs as USER 65534 (Alpine nobody, home /) with no WORKDIR. Dev
# mode falls back to $HOME/.vault-token when VAULT_TOKEN is unset.
accounts:
  groups:
    - groupname: nobody
      gid: 65534
  users:
    - username: nobody
      uid: 65534
      gid: 65534
      homedir: /
  run-as: 65534

# Upstream uses ENTRYPOINT ["bank-vaults"] resolved from /usr/local/bin, and
# the Vault operator runs `bank-vaults` and `template` by name. The binaries
# live in /usr/bin with /usr/local/bin symlinks from the package.
entrypoint:
  command: /usr/bin/bank-vaults

work-dir: /

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
