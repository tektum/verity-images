contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - fluent-bit-4.2@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/fluent-bit

cmd: -c /etc/fluent-bit/fluent-bit.conf

environment:
  PATH: /usr/bin:/bin
