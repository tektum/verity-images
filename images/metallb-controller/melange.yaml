package:
  name: verity-metallb-controller
  # Stays on the metallb-speaker release line so the pair runs one MetalLB version.
  # yamllint disable-line rule:line-length
  version: "0.15.3"  # renovate: datasource=github-tags depName=metallb/metallb versioning=regex:^v?(?<major>0)\.(?<minor>15)\.(?<patch>\d+)$
  epoch: 0
  description: MetalLB controller for allocating load-balancer service addresses
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 85bfb4f0e0d35090c514e1e5e1a21a8bbd253518

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/metallb/metallb
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./controller

  - runs: |
      # Same version stamping as the upstream controller Dockerfile.
      flags="-s -w -X go.universe.tf/metallb/internal/version.gitCommit=${{vars.source-commit}}"
      flags="$flags -X go.universe.tf/metallb/internal/version.gitBranch=v${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="$flags" \
        -o "${{targets.destdir}}/controller" ./controller
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/controller" \
        | awk '$1 == "mod" && $2 == "go.universe.tf/metallb" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /controller --help 2>&1 | grep -F -- '-webhook-mode string'
        apk info --who-owns /controller | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: metallb/metallb
    strip-prefix: v
    tag-filter: v0.15
    use-tag: true
