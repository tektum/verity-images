package:
  name: verity-crane
  # yamllint disable-line rule:line-length
  version: "0.22.1"  # renovate: datasource=github-releases depName=google/go-containerregistry versioning=regex:^(?<major>0)\.(?<minor>22)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Command line tool for interacting with remote container images and registries
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 8a72a424fdecb4caa14f2d525e5d2503331442b5

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/go-containerregistry
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/crane
  - runs: |
      # Upstream releases stamp both the CLI and the registry User-Agent version.
      mod=github.com/google/go-containerregistry
      ver=${{package.version}}
      go build -p 4 -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X $mod/cmd/crane/cmd.Version=$ver -X $mod/pkg/v1/remote/transport.Version=$ver" \
        -o "${{targets.destdir}}/usr/bin/crane" ./cmd/crane
      go version -m "${{targets.destdir}}/usr/bin/crane" \
        | awk '$1 == "mod" && $2 == "github.com/google/go-containerregistry" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the crane build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/crane-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/crane-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        [ "$(crane version)" = "${{package.version}}" ]
        apk info --who-owns /usr/bin/crane \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: google/go-containerregistry
    tag-filter-prefix: v0.22.
    strip-prefix: v
