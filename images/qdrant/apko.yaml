contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - qdrant-1.20@local

accounts:
  run-as: 65532

entrypoint:
  command: /qdrant/qdrant

environment:
  PATH: /usr/bin:/bin
  RUN_MODE: production
  TZ: Etc/UTC

paths:
  - path: /qdrant/storage
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /qdrant/snapshots
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /qdrant
