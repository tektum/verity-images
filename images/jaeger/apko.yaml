contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-jaeger@local

accounts:
  run-as: 10001

entrypoint:
  command: /usr/bin/jaeger

cmd: --set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317 --set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318

environment:
  PATH: /usr/bin:/bin
