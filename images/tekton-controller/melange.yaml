package:
  name: tekton-controller-0.61
  version: "0.61.0"
  epoch: 0
  description: Tekton Pipelines Kubernetes controller
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 16Gi

vars:
  source-commit: c2dc17a339e300e7b62a38bbae41f599ecc8fa13

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tektoncd/pipeline
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/bump
    with:
      deps: |-
        github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0-beta.4.0.20240610221955-50774cd97099
        github.com/containerd/containerd@v1.7.34
        github.com/go-jose/go-jose/v3@v3.0.5
        github.com/go-jose/go-jose/v4@v4.1.4
        github.com/google/go-containerregistry@v0.22.0
        github.com/hashicorp/go-retryablehttp@v0.7.7
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
        go.opentelemetry.io/otel/sdk@v1.43.0
        golang.org/x/net@v0.57.0
        golang.org/x/text@v0.40.0
        google.golang.org/grpc@v1.82.1

  - runs: |
      install -d "${{targets.destdir}}/ko-app"

      go build -p 4 -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w" \
        -o "${{targets.destdir}}/ko-app/controller" ./cmd/controller
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Tekton controller build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/tekton-controller-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/tekton-controller-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /ko-app/controller --help 2>&1 | grep -F 'Usage of'
        apk info --who-owns /ko-app/controller \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: tektoncd/pipeline
    tag-filter-prefix: v0.61.
    strip-prefix: v
