package:
  name: verity-rabbitmq-messaging-topology-operator
  # yamllint disable-line rule:line-length
  version: "1.20.6"  # renovate: datasource=github-releases depName=rabbitmq/messaging-topology-operator versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator that manages RabbitMQ messaging topology objects
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 2d678f92ca2fcb866eb82e3148163249327d8a92

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/messaging-topology-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd

  - runs: |
      # Upstream builds the cmd/main.go file, which Go never stamps; build the
      # package so the module version is recorded.
      go build -mod=readonly -trimpath -buildvcs=true -tags timetzdata -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/manager" ./cmd
      go version -m "${{targets.destdir}}/usr/bin/manager" \
        | awk '$1 == "mod" && $2 == "github.com/rabbitmq/messaging-topology-operator" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.txt \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the messaging topology operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/rabbitmq-messaging-topology-operator-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/rabbitmq-messaging-topology-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        manager --help 2>&1 | grep -F -- '-health-probe-bind-address'
        apk info --who-owns /usr/bin/manager \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MPL-2.0
        grep -F 'Mozilla Public License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: rabbitmq/messaging-topology-operator
    strip-prefix: v
