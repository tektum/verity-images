package:
  name: verity-ffmpeg-9.0
  # yamllint disable-line rule:line-length
  version: "9.0.2"  # renovate: datasource=github-tags depName=FFmpeg/FFmpeg versioning=regex:^(?<major>9)\.(?<minor>0)\.(?<patch>\d+)$ extractVersion=^n(?<version>.+)$
  epoch: 0
  description: FFmpeg 9.0 ffmpeg and ffprobe, LGPL build from the upstream release
  copyright:
    # LGPL build: configure runs without --enable-gpl, --enable-version3 and
    # --enable-nonfree, and every enabled external library is LGPL compatible.
    - license: LGPL-2.1-or-later
  resources:
    cpu: "16"
    memory: 16Gi
  test-resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - dav1d-dev
      - gnutls-dev
      - lame-dev
      - libvorbis-dev
      - libvpx-dev
      - libwebp-dev
      - nasm
      - openh264-dev
      - opus-dev
      - pkgconf
      - svt-av1-dev
      - wolfi-baselayout
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FFmpeg/FFmpeg
      tag: n${{package.version}}
      expected-commit: 946fcce07b6dcd0331c8cc609192aeff5e1924f8

  # A shallow checkout has no tag history for ffbuild/version.sh, so pin the
  # reported version to the release instead of a git describe fallback.
  # --disable-autodetect keeps the configuration to the explicit list below,
  # whatever else happens to be installed in the build environment.
  - runs: |
      printf '%s\n' "${{package.version}}" > VERSION
      ./configure \
        --prefix=/usr \
        --disable-static \
        --enable-shared \
        --enable-pic \
        --disable-debug \
        --disable-doc \
        --disable-ffplay \
        --disable-autodetect \
        --enable-iconv \
        --enable-zlib \
        --enable-gnutls \
        --enable-libdav1d \
        --enable-libmp3lame \
        --enable-libopenh264 \
        --enable-libopus \
        --enable-libsvtav1 \
        --enable-libvorbis \
        --enable-libvpx \
        --enable-libwebp
      grep -Fx '#define CONFIG_GPL 0' config.h
      grep -Fx '#define CONFIG_NONFREE 0' config.h
      grep -Fx '#define CONFIG_VERSION3 0' config.h
      make -j$(nproc)
      make install DESTDIR="${{targets.destdir}}"
      install -Dm644 COPYING.LGPLv2.1 LICENSE.md \
        -t "${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      rm -rf "${{targets.destdir}}/usr/share/ffmpeg/examples"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: FFmpeg 9.0 library headers and pkg-config files
    pipeline:
      - uses: split/dev

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        ffmpeg -hide_banner -version | head -n1 | grep -F 'ffmpeg version ${{package.version}} '
        ffprobe -hide_banner -version | head -n1 | grep -F 'ffprobe version ${{package.version}} '
        ffmpeg -hide_banner -buildconf > /tmp/buildconf
        if grep -E -- '--enable-(gpl|nonfree|version3)' /tmp/buildconf; then exit 1; fi
        ffmpeg -hide_banner -L | grep -F 'GNU Lesser General Public'
        test ! -e /usr/bin/ffplay
        d=$(mktemp -d)
        ffmpeg -hide_banner -nostdin -f lavfi -i testsrc=duration=1:size=64x48:rate=10 \
          -f lavfi -i sine=frequency=440:duration=1 \
          -c:v libvpx-vp9 -c:a libopus -shortest "$d/out.webm"
        ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$d/out.webm" | sort | tr '\n' ' ' \
          | grep -Fx 'opus vp9 '
