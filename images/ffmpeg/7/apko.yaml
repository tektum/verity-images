contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-ffmpeg-7@local

accounts:
  groups:
    - groupname: ffmpeg
      gid: 65532
  users:
    - username: ffmpeg
      uid: 65532
      gid: 65532
      homedir: /work
      shell: /sbin/nologin
  run-as: 65532

work-dir: /work

entrypoint:
  command: /usr/bin/ffmpeg

cmd: -hide_banner -version

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
