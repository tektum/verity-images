package:
  name: verity-keda-metrics-apiserver
  version: "2.21.0"
  epoch: 0
  description: KEDA metrics API server for external metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 12Gi

vars:
  source-commit: 626ded5d783108bedf647e20bbc83f8e458e02e4

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kedacore/keda
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/adapter

  - runs: |
      flags="-s -w -X=github.com/kedacore/keda/v2/version.GitCommit=${{vars.source-commit}}"
      flags="$flags -X=github.com/kedacore/keda/v2/version.Version=${{package.version}}"
      go build -mod=readonly -trimpath -ldflags "$flags" -o keda-adapter ./cmd/adapter
      install -Dm755 keda-adapter "${{targets.destdir}}/usr/bin/keda-adapter"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      "${{targets.destdir}}/usr/bin/keda-adapter" --help 2>&1 | grep -F -- '--lister-kubeconfig'

subpackages:
  - name: verity-keda-metrics-apiserver-build-metadata
    description: Resolved Go module metadata for the KEDA metrics API server build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/verity-keda-metrics-apiserver-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/verity-keda-metrics-apiserver-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        keda-adapter --help 2>&1 | grep -F -- '--secure-port'
        apk info --who-owns /usr/bin/keda-adapter | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kedacore/keda
    strip-prefix: v
    tag-filter: v
