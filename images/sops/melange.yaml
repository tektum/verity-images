package:
  name: verity-sops
  # yamllint disable-line rule:line-length
  version: "3.13.3"  # renovate: datasource=github-releases depName=getsops/sops versioning=regex:^(?<major>3)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Editor of encrypted files supporting age, SSH, Vault, and cloud KMS keys
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 26e2f4784ca61353082c32dbd987c25eda086dc9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsops/sops
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # go/remediate raises golang.org/x/crypto past GO-2026-5932 and any other
  # module with a released fix.
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/sops
  - runs: |
      go build -p 4 -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/getsops/sops/v3/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/sops" ./cmd/sops
      go version -m "${{targets.destdir}}/usr/bin/sops" \
        | awk '$1 == "mod" && $2 == "github.com/getsops/sops/v3" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the sops build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/sops-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/sops-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        sops --disable-version-check --version | head -n 1 | grep -Fx 'sops ${{package.version}}'
        apk info --who-owns /usr/bin/sops \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MPL-2.0
        grep -F 'Mozilla Public License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: getsops/sops
    strip-prefix: v
