contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - tzdata
    - verity-tidb@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/tidb-server

paths:
  - path: /var/lib/tidb
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

work-dir: /var/lib/tidb

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
