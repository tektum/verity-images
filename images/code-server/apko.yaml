contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - verity-code-server@local
    # Developer tools from upstream's ci/release-image/Dockerfile. sudo and the
    # setuid fixuid helper are deliberately omitted; busybox provides vi and wget.
    - bash
    - ca-certificates-bundle
    - curl
    - git
    - git-lfs
    - glibc-locale-en
    - htop
    - nano
    - openssh-client
    - procps
    - zsh

# Upstream image contract (codercom/code-server): user coder (1000:1000) with
# home and working directory /home/coder, port 8080, and
# ENTRYPOINT ["/usr/bin/entrypoint.sh", "--bind-addr", "0.0.0.0:8080", "."].
accounts:
  groups:
    - groupname: coder
      gid: 1000
  users:
    - username: coder
      uid: 1000
      gid: 1000
      homedir: /home/coder
      shell: /bin/bash
  run-as: 1000

entrypoint:
  command: /usr/bin/entrypoint.sh --bind-addr 0.0.0.0:8080 .

work-dir: /home/coder

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  HOME: /home/coder
  USER: coder
  LANG: en_US.UTF-8
  ENTRYPOINTD: /entrypoint.d
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/coder
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
