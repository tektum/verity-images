package:
  name: verity-eks-pod-identity-agent
  # yamllint disable-line rule:line-length
  version: "0.3.0"  # renovate: datasource=github-tags depName=aws/eks-pod-identity-agent versioning=regex:^(?<major>0)\.(?<minor>3)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Amazon EKS Pod Identity Agent and its workload identity CSI node plugin
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v0.3.0 is an annotated tag; this is its peeled commit.
  source-commit: db071b424fdc09c7e401afdf1053b2c71ed44c80

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-pod-identity-agent
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: '. ./cmd/eks-pod-identity-csi-driver'

  # Same ldflags as the upstream Makefile `build` target used by the upstream
  # Dockerfile. The agent prints configuration.AgentVersion from `version`;
  # upstream sets it from version.txt, which matches the tag without the v.
  - uses: go/build
    with:
      packages: .
      output: eks-pod-identity-agent
      go-package: go-1.27
      ldflags: |
        -buildid=
        -X 'k8s.io/component-base/version.gitVersion=v${{package.version}}'
        -X 'k8s.io/component-base/version.gitCommit=${{vars.source-commit}}'
        -X 'k8s.io/component-base/version/verflag.programName=eks-pod-identity-agent'
        -X 'go.amzn.com/eks/eks-pod-identity-agent/configuration.AgentVersion=${{package.version}}'

  - uses: go/build
    with:
      packages: ./cmd/eks-pod-identity-csi-driver
      output: eks-pod-identity-csi-driver
      go-package: go-1.27
      ldflags: |
        -buildid=
        -X 'go.amzn.com/eks/eks-pod-identity-agent/configuration.AgentVersion=${{package.version}}'

  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      [ "$(cat version.txt)" = '${{package.version}}' ]
      bin="${{targets.destdir}}/usr/bin"
      "$bin/eks-pod-identity-agent" version \
        | grep -Fx 'EKS Pod Identity Agent version ${{package.version}}'
      for cmd in eks-pod-identity-agent eks-pod-identity-csi-driver; do
        go version -m "$bin/$cmd" \
          | awk '$1 == "mod" && $2 == "go.amzn.com/eks/eks-pod-identity-agent" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
      done
      go version -m "$bin/eks-pod-identity-agent" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx go.amzn.com/eks/eks-pod-identity-agent
      go version -m "$bin/eks-pod-identity-csi-driver" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx go.amzn.com/eks/eks-pod-identity-agent/cmd/eks-pod-identity-csi-driver
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the eks-pod-identity-agent build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/eks-pod-identity-agent-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/eks-pod-identity-agent-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        eks-pod-identity-agent version \
          | grep -Fx 'EKS Pod Identity Agent version ${{package.version}}'
        eks-pod-identity-agent server --help | grep -F -- '--cluster-name'
        eks-pod-identity-csi-driver -h 2>&1 | grep -F -- '-v string'
        for cmd in eks-pod-identity-agent eks-pod-identity-csi-driver; do
          apk info --who-owns "/usr/bin/$cmd" \
            | grep -F "${{package.name}}-${{package.full-version}}"
        done
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
        test -s /usr/share/licenses/${{package.name}}/NOTICE

update:
  enabled: true
  github:
    identifier: aws/eks-pod-identity-agent
    strip-prefix: v
    tag-filter-prefix: v0.3.
    use-tag: true
