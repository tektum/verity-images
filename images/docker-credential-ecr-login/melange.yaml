package:
  name: verity-docker-credential-ecr-login
  # yamllint disable-line rule:line-length
  version: "0.12.0"  # renovate: datasource=github-releases depName=awslabs/amazon-ecr-credential-helper extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Docker credential helper for Amazon ECR and ECR Public
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 7ff7d6bd7a06408ddb9646c9ebccf97dbd190d55

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/amazon-ecr-credential-helper
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: ecr-login
      packages: ./cli/docker-credential-ecr-login

  - runs: |
      # The Go module lives in ecr-login/. Go stamps a nested module's version
      # only when the repository root has a go.mod and the commit carries an
      # ecr-login/vX.Y.Z tag; upstream has neither, so add both locally for the
      # build so scanners see the real release version.
      git tag -f ecr-login/v${{package.version}} "$(git rev-parse HEAD)"
      printf 'module github.com/awslabs/amazon-ecr-credential-helper\n' > go.mod
      cd ecr-login
      # Same version stamping as upstream scripts/build_binary.sh.
      package_root=github.com/awslabs/amazon-ecr-credential-helper/ecr-login
      go build -trimpath -buildvcs=true \
        -ldflags="-s -w -buildid= \
          -X $package_root/version.Version=${{package.version}} \
          -X $package_root/version.GitCommitSHA=$(git rev-parse --short=7 HEAD)" \
        -o "${{targets.destdir}}/usr/bin/docker-credential-ecr-login" \
        ./cli/docker-credential-ecr-login
      # The Go main module is the scan identity; it must carry the release version.
      go version -m "${{targets.destdir}}/usr/bin/docker-credential-ecr-login" \
        | awk '$1 == "mod" && $2 == "'"$package_root"'" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      cd ..
      rm go.mod
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        HOME=/tmp docker-credential-ecr-login -v | grep -Fx "Version:    ${{package.version}}"
        apk info --who-owns /usr/bin/docker-credential-ecr-login \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: awslabs/amazon-ecr-credential-helper
    strip-prefix: v
