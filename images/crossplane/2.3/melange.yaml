package:
  name: crossplane-2.3
  version: "2.4.0"
  epoch: 2
  description: Cloud native control plane
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/crossplane/crossplane
      tag: v${{package.version}}
      expected-commit: 61fa450c0c14a75bf5632872bd4a5b6945ec5a26
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/crossplane
  - uses: go/build/v2
    with:
      packages: ./cmd/crossplane
      output: crossplane
      strip: -s -w
      ldflags: >-
        -X github.com/crossplane/crossplane-runtime/v2/pkg/version.version=v${{package.version}}

test:
  pipeline:
    - runs: /usr/bin/crossplane --version
