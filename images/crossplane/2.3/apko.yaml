contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - crossplane-2.3@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/crossplane

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /cache/xpkg
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /cache/xfn
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
