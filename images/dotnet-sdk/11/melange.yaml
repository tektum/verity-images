package:
  name: verity-dotnet-sdk-11
  # yamllint disable-line rule:line-length
  version: "11.0.100"  # renovate: datasource=dotnet-version depName=dotnet-sdk versioning=regex:^(?<major>11)\.(?<minor>0)\.(?<patch>\d+)$
  epoch: 0
  description: .NET 11 SDK from the pinned official Microsoft release archive.
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      # Microsoft's documented runtime dependency set. ICU, OpenSSL and GSSAPI are loaded with dlopen,
      # so the package cannot discover them as shared object dependencies.
      - icu
      - krb5-libs
      - libgcc
      - libssl3
      - libstdc++
      - tzdata
      - wolfi-baselayout
      - zlib

# The SDK archive bundles the shared .NET and ASP.NET Core runtimes, and the vulnerability feeds key .NET
# advisories by those runtime packages, so scan-identity is versioned from the bundled runtime version. The
# test below fails the build unless the archive really ships exactly this runtime, so the two cannot drift.
vars:
  # yamllint disable-line rule:line-length
  upstream-version: 11.0.0  # renovate: datasource=dotnet-version depName=dotnet-runtime versioning=regex:^(?<major>11)\.(?<minor>0)\.(?<patch>\d+)$

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - runs: |
      # The sha512 values come from the official release metadata of this exact version:
      # https://builds.dotnet.microsoft.com/dotnet/release-metadata/11.0/releases.json
      # A version bump without matching checksums fails closed on the check below.
      case "${{build.arch}}" in
        x86_64)
          rid=linux-x64
          sha512=1bec9cca2ec689b1e80245b84f2b53c9441d1aa6daccf2ceb27490768bffa95954fa585bd275def31069d874d543d9ba9e6591fe9ade2dbd9f34ec5c0fd0050c
          ;;
        aarch64)
          rid=linux-arm64
          sha512=cfa248bb1377606e868602fb5b4d66fa16b7546156593937d1982f7f2142e6ded76d71c4a26efdab99f87c46ab40c3c672ab1b57ef7fa25449efe5b140a55af4
          ;;
        *) echo "unsupported architecture ${{build.arch}}" >&2; exit 1 ;;
      esac
      archive=dotnet-sdk-${{package.version}}-$rid.tar.gz
      url="https://builds.dotnet.microsoft.com/dotnet/Sdk/${{package.version}}"
      wget -q --tries=3 --timeout=60 -O "/tmp/$archive" "$url/$archive"
      printf '%s  /tmp/%s\n' "$sha512" "$archive" | sha512sum -c -
      install -d \
        "${{targets.destdir}}/usr/share/dotnet" \
        "${{targets.destdir}}/usr/bin" \
        "${{targets.destdir}}/usr/share/licenses/verity-dotnet-sdk-11"
      tar -xzf "/tmp/$archive" -C "${{targets.destdir}}/usr/share/dotnet"
      rm -f "/tmp/$archive"
      mv \
        "${{targets.destdir}}/usr/share/dotnet/LICENSE.txt" \
        "${{targets.destdir}}/usr/share/dotnet/ThirdPartyNotices.txt" \
        "${{targets.destdir}}/usr/share/licenses/verity-dotnet-sdk-11/"
      # The optional LTTng tracing provider links liblttng-ust.so.0, which Wolfi does not ship. It only loads
      # when LTTng tracing is enabled explicitly, so it is dropped instead of pulling a tracing stack in.
      find "${{targets.destdir}}/usr/share/dotnet" -name libcoreclrtraceptprovider.so -delete
      ln -s ../share/dotnet/dotnet "${{targets.destdir}}/usr/bin/dotnet"

test:
  pipeline:
    - runs: |
        dotnet --list-sdks | grep -q '^${{package.version}} '
        test "$(dotnet --list-runtimes | grep -c '^Microsoft.NETCore.App ')" = 1
        dotnet --list-runtimes | grep -q '^Microsoft.NETCore.App ${{vars.upstream-version}} '
        dotnet --list-runtimes | grep -q '^Microsoft.AspNetCore.App ${{vars.upstream-version}} '
        test "$(readlink -f /usr/bin/dotnet)" = /usr/share/dotnet/dotnet
