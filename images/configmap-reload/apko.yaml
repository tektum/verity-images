contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - configmap-reload@local
    - busybox
    - netcat-openbsd
    - wget

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/configmap-reload

environment:
  PATH: /usr/bin:/bin
