package:
  name: configmap-reload
  version: "0.15.0"
  epoch: 19
  description: ConfigMap and Secret volume watcher with webhook-triggered reloads
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GO111MODULE: "on"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jimmidyson/configmap-reload
      tag: v${{package.version}}
      expected-commit: 3f1e9babda3b94b235d203712c17cb88c53d43d8
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build --installsuffix cgo \
        -ldflags="-s -w -extldflags '-static'" \
        -a \
        -o "${{targets.destdir}}/usr/bin/configmap-reload" \
        ./configmap-reload.go

test:
  pipeline:
    - runs: /usr/bin/configmap-reload -h
