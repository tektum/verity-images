package:
  name: verity-dotnet-runtime-9
  # yamllint disable-line rule:line-length
  version: "9.0.23"  # renovate: datasource=dotnet-version depName=dotnet-runtime versioning=regex:^(?<major>9)\.(?<minor>0)\.(?<patch>\d+)$
  epoch: 0
  description: .NET 9 runtime from the pinned official Microsoft release archive.
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      # Microsoft's documented runtime dependency set. ICU, OpenSSL and GSSAPI are loaded with dlopen,
      # so the package cannot discover them as shared object dependencies.
      - icu
      - krb5-libs
      - libgcc
      - libssl3
      - libstdc++
      - tzdata
      - wolfi-baselayout
      - zlib

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - runs: |
      # The sha512 values come from the official release metadata of this exact version:
      # https://builds.dotnet.microsoft.com/dotnet/release-metadata/9.0/releases.json
      # A version bump without matching checksums fails closed on the check below.
      case "${{build.arch}}" in
        x86_64)
          rid=linux-x64
          sha512=6a80895a9f43d36ff95ee79103b6006d803d2aae9d82c6df14962e6ad2e7f8843bf31b9440baa9d44a3d931b805698d3944f8a5573dac2f33e339a55cf2cd370
          ;;
        aarch64)
          rid=linux-arm64
          sha512=0606e212e46a7fe4d2a4a11cdb52f2be4a18e68d2bd564a724abecc624a8b347b6d0ce976b94f60b7863277fee74b416d89e8c4a50b74e3addb324ee36489fc9
          ;;
        *) echo "unsupported architecture ${{build.arch}}" >&2; exit 1 ;;
      esac
      archive=dotnet-runtime-${{package.version}}-$rid.tar.gz
      url="https://builds.dotnet.microsoft.com/dotnet/Runtime/${{package.version}}"
      wget -q --tries=3 --timeout=60 -O "/tmp/$archive" "$url/$archive"
      printf '%s  /tmp/%s\n' "$sha512" "$archive" | sha512sum -c -
      install -d \
        "${{targets.destdir}}/usr/share/dotnet" \
        "${{targets.destdir}}/usr/bin" \
        "${{targets.destdir}}/usr/share/licenses/verity-dotnet-runtime-9"
      tar -xzf "/tmp/$archive" -C "${{targets.destdir}}/usr/share/dotnet"
      mv \
        "${{targets.destdir}}/usr/share/dotnet/LICENSE.txt" \
        "${{targets.destdir}}/usr/share/dotnet/ThirdPartyNotices.txt" \
        "${{targets.destdir}}/usr/share/licenses/verity-dotnet-runtime-9/"
      # The optional LTTng tracing provider links liblttng-ust.so.0, which Wolfi does not ship. It only loads
      # when LTTng tracing is enabled explicitly, so it is dropped instead of pulling a tracing stack in.
      rm -f "${{targets.destdir}}"/usr/share/dotnet/shared/Microsoft.NETCore.App/*/libcoreclrtraceptprovider.so
      ln -s ../share/dotnet/dotnet "${{targets.destdir}}/usr/bin/dotnet"

test:
  pipeline:
    - runs: |
        dotnet --list-runtimes | grep -q '^Microsoft.NETCore.App ${{package.version}} '
        test "$(readlink -f /usr/bin/dotnet)" = /usr/share/dotnet/dotnet
