package:
  name: vexctl
  # yamllint disable-line rule:line-length
  version: "0.4.4"  # renovate: datasource=github-releases depName=openvex/vexctl versioning=regex:^(?<major>0)\.(?<minor>4)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Tool to create, merge, and apply OpenVEX documents
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 6Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: d344883b69c29d7b8ec11b146743db77630fc6b8

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openvex/vexctl
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - uses: go/build
    with:
      packages: .
      output: vexctl
      go-package: go-1.27
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=clean
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d @$(git log -1 --format=%ct) +%FT%TZ)

  - runs: |
      binary="${{targets.destdir}}/usr/bin/vexctl"
      "$binary" version 2>&1 | grep -F "v${{package.version}}"
      "$binary" version 2>&1 | grep -F "${{vars.source-commit}}"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        vexctl version 2>&1 | grep -F "v${{package.version}}"
        vexctl --help >/dev/null
        apk info --who-owns /usr/bin/vexctl \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: openvex/vexctl
    strip-prefix: v
    use-tag: true
