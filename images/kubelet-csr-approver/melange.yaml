package:
  name: verity-kubelet-csr-approver
  # yamllint disable-line rule:line-length
  version: "1.2.15"  # renovate: datasource=github-releases depName=postfinance/kubelet-csr-approver versioning=regex:^(?<major>1)\.(?<minor>2)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Controller that approves compliant kubelet-serving certificate signing requests
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 4d9716dfd4174b81ba3c3a77e122fbcca192c19b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/postfinance/kubelet-csr-approver
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/kubelet-csr-approver

  - runs: |
      pkg=github.com/postfinance/kubelet-csr-approver
      ldflags="-s -w -X $pkg/internal/cmd.commit=${{vars.source-commit}}"
      ldflags="$ldflags -X $pkg/internal/cmd.ref=refs/tags/v${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/kubelet-csr-approver" ./cmd/kubelet-csr-approver
      go version -m "${{targets.destdir}}/usr/bin/kubelet-csr-approver" \
        | awk -v pkg="$pkg" '$1 == "mod" && $2 == pkg { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kubelet-csr-approver build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kubelet-csr-approver-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kubelet-csr-approver-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        # Without a cluster the controller logs its build identity, then exits.
        if kubelet-csr-approver >/tmp/out 2>&1; then
          echo 'controller started without a cluster' >&2
          exit 1
        fi
        cat /tmp/out
        grep -F 'refs/tags/v${{package.version}}' /tmp/out
        grep -F '${{vars.source-commit}}' /tmp/out
        apk info --who-owns /usr/bin/kubelet-csr-approver \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'Permission is hereby granted' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: postfinance/kubelet-csr-approver
    strip-prefix: v
    tag-filter-prefix: v1.2.
    use-tag: true
