package:
  name: trufflehog-3.99
  # yamllint disable-line rule:line-length
  version: "3.99.8"  # renovate: datasource=github-releases depName=trufflesecurity/trufflehog versioning=regex:^(?<major>3)\.(?<minor>99)\.(?<patch>\d+)$
  epoch: 0
  description: Secret scanner that finds and verifies leaked credentials
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: ea68ca03c865c5f324e86e849ced20ed3cf9dbbb

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/trufflesecurity/trufflehog
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/trufflesecurity/trufflehog/v3/pkg/version.BuildVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/trufflehog" .
      go version -m "${{targets.destdir}}/usr/bin/trufflehog" \
        | awk '$1 == "mod" && $2 == "github.com/trufflesecurity/trufflehog/v3" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the trufflehog build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/trufflehog-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/trufflehog-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        trufflehog --version 2>&1 | grep -F "${{package.version}}"
        trufflehog --help 2>&1 | grep -F 'Usage'
        apk info --who-owns /usr/bin/trufflehog \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx AGPL-3.0-only
        grep -F 'GNU AFFERO GENERAL PUBLIC LICENSE' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: trufflesecurity/trufflehog
    strip-prefix: v
