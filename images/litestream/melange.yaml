package:
  name: litestream-0.5
  # yamllint disable-line rule:line-length
  version: "0.5.18"  # renovate: datasource=github-releases depName=benbjohnson/litestream versioning=regex:^(?<major>0)\.(?<minor>5)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Streaming replication for SQLite
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 057d39564c75ebd67ba042410a7ffa05ad4c242d

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/benbjohnson/litestream
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/litestream
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/litestream" ./cmd/litestream
      go version -m "${{targets.destdir}}/usr/bin/litestream" \
        | awk '$1 == "mod" && $2 == "github.com/benbjohnson/litestream" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the litestream build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/litestream-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/litestream-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        litestream version | grep -Fx "${{package.version}}"
        apk info --who-owns /usr/bin/litestream \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: benbjohnson/litestream
    strip-prefix: v
    tag-filter-prefix: v0.5.
    use-tag: true
