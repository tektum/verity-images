package:
  name: verity-regclient
  # yamllint disable-line rule:line-length
  version: "0.11.7"  # renovate: datasource=github-releases depName=regclient/regclient extractVersion=^v(?<version>.+)$
  epoch: 0
  description: regclient OCI registry tools regctl, regsync and regbot
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v0.11.7 is an annotated tag that peels to this commit.
  source-commit: 36abda84830dae07db00bf9e5cec95d97b78222a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/regclient/regclient
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/regctl ./cmd/regsync ./cmd/regbot

  # Same build as upstream `make binaries` (COMMANDS regctl regsync regbot):
  # CGO 0, -trimpath, and LD_FLAGS "-s -w -extldflags -static -buildid=" with
  # the release tag stamped into internal/version.vcsTag. All three commands
  # come from one module, one commit and one go.mod, so they ship as one
  # consistent package, as in the upstream release assets.
  - runs: |
      commit=$(git rev-parse HEAD)
      test "$commit" = '${{vars.source-commit}}'
      version='v${{package.version}}'
      ldflags="-s -w -extldflags -static -buildid="
      ldflags="$ldflags -X github.com/regclient/regclient/internal/version.vcsTag=$version"
      for cmd in regctl regsync regbot; do
        go build -mod=readonly -trimpath -buildvcs=true -ldflags "$ldflags" \
          -o "${{targets.destdir}}/usr/bin/$cmd" "./cmd/$cmd"
        go version -m "${{targets.destdir}}/usr/bin/$cmd" \
          | awk '$1 == "mod" && $2 == "github.com/regclient/regclient" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
        "${{targets.destdir}}/usr/bin/$cmd" version --format '{{.VCSTag}}' | grep -Fx "$version"
        "${{targets.destdir}}/usr/bin/$cmd" version --format '{{.VCSCommit}}' | grep -Fx "$commit"
      done
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the regclient build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/regclient-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/regclient-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        export HOME=$(mktemp -d)
        for cmd in regctl regsync regbot; do
          "$cmd" version --format '{{.VCSTag}}' | grep -Fx 'v${{package.version}}'
          apk info --who-owns "/usr/bin/$cmd" \
            | grep -F "${{package.name}}-${{package.full-version}}"
        done
        regctl --help | grep -F 'manifest'
        regsync --help | grep -F 'once'
        regbot --help | grep -F 'once'
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: regclient/regclient
    strip-prefix: v
    use-tag: true
