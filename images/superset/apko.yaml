contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-superset@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

cmd: >-
  gunicorn --bind 0.0.0.0:8088 --workers 2 --worker-class gthread --threads 20
  --timeout 60 --limit-request-line 0 --limit-request-field_size 0
  superset.app:create_app()

work-dir: /app

environment:
  HOME: /home/nonroot
  PATH: /usr/bin:/bin
  FLASK_APP: superset
  SUPERSET_HOME: /app/superset_home
  PYTHONPATH: /app/pythonpath
  SUPERSET_PORT: "8088"
  PYTHONDONTWRITEBYTECODE: "1"

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app/pythonpath
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /app/superset_home
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
