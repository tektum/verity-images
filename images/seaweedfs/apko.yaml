contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - tzdata
    - verity-seaweedfs@local

accounts:
  groups:
    - groupname: seaweed
      gid: 65532
  users:
    - username: seaweed
      uid: 65532
      gid: 65532
      homedir: /data
      shell: /sbin/nologin
  run-as: 65532

entrypoint:
  command: /entrypoint.sh

# Master, volume, filer and S3 in one process, without the admin server.
cmd: server -s3

work-dir: /data

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/seaweedfs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
