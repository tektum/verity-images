package:
  name: verity-yace
  # yamllint disable-line rule:line-length
  version: "0.68.0"  # renovate: datasource=github-releases depName=prometheus-community/yet-another-cloudwatch-exporter versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Prometheus exporter for AWS CloudWatch metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 3bf04a0e9c7458bbc0bb8d6a8f3f534d5349f0b9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/yet-another-cloudwatch-exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/yace
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      # Same version stamps as the upstream .promu.yml, with the commit time as
      # build date so the binary does not depend on the build clock.
      build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d-%H:%M:%S)
      pkg=github.com/prometheus/common/version
      flags="-s -w -X $pkg.Version=${{package.version}}"
      flags="$flags -X $pkg.Revision=${{vars.source-commit}}"
      flags="$flags -X $pkg.Branch=HEAD -X $pkg.BuildUser=verity -X $pkg.BuildDate=$build_date"
      go build -mod=readonly -trimpath -buildvcs=false -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/yace" ./cmd/yace
      go version -m "${{targets.destdir}}/usr/bin/yace" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/prometheus-community/yet-another-cloudwatch-exporter/cmd/yace
      # Upstream images ship the EC2 example as the default configuration.
      install -Dm644 examples/ec2.yml "${{targets.destdir}}/etc/yace/config.yml"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the yace build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/yace-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/yace-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        [ "$(yace version)" = '${{package.version}}' ]
        yace --help 2>&1 | grep -F -- '--config.file'
        yace verify-config --config.file=/etc/yace/config.yml
        apk info --who-owns /usr/bin/yace \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: prometheus-community/yet-another-cloudwatch-exporter
    strip-prefix: v
