contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-gcp-cloud-controller-manager@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/cloud-controller-manager

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot

paths:
  # Upstream's image ships the binary at /cloud-controller-manager, and
  # manifests that set `command:` reference that path.
  - path: /cloud-controller-manager
    type: symlink
    source: /usr/bin/cloud-controller-manager
    uid: 0
    gid: 0
  # apko applies the symlink entry's zero mode to the link target; restore it.
  - path: /usr/bin/cloud-controller-manager
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
