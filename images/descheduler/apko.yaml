contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-descheduler@local

# Upstream runs as USER 1000, and its Helm chart sets runAsUser 1000.
accounts:
  groups:
    - groupname: descheduler
      gid: 1000
  users:
    - username: descheduler
      uid: 1000
      gid: 1000
      homedir: /home/descheduler
  run-as: 1000

# Upstream ships /bin/descheduler with CMD ["/bin/descheduler", "--help"]; this
# image installs /usr/bin/descheduler as the entrypoint and keeps --help as the
# default argument. Arguments replace only the command.
entrypoint:
  command: /usr/bin/descheduler

cmd: --help

work-dir: /home/descheduler

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/descheduler
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
