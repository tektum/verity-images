package:
  name: verity-descheduler
  # yamllint disable-line rule:line-length
  version: "0.37.0"  # renovate: datasource=github-releases depName=kubernetes-sigs/descheduler extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes descheduler, evicts pods so they can be rescheduled onto better nodes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v0.37.0 is a lightweight tag on this commit.
  source-commit: 0756d2fc3b78ec05e0ae80a7748fb0f9fa29bc30

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/descheduler
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/descheduler

  # Same build as upstream `make build` (Makefile and Dockerfile): CGO 0, the
  # vendored main package sigs.k8s.io/descheduler/cmd/descheduler, and the same
  # -X stamps in sigs.k8s.io/descheduler/pkg/version. Upstream defaults VERSION
  # to v<date>-<git describe --tags> and BUILD to the build time; both are
  # derived from the pinned commit time instead so the build is reproducible.
  # The upstream v0.37.0 image reports v20261004-v0.37.0, the commit date.
  # BRANCH is `git branch --show-current` exactly as upstream, which is empty
  # for the detached tag checkout, as in the upstream release image.
  - runs: |
      commit=$(git rev-parse HEAD)
      test "$commit" = '${{vars.source-commit}}'
      stamp=sigs.k8s.io/descheduler/pkg/version
      version="v$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d)-v${{package.version}}"
      build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%S+0000)
      branch=$(git branch --show-current)
      ldflags="-X $stamp.version=$version -X $stamp.buildDate=$build_date"
      ldflags="$ldflags -X $stamp.gitbranch=$branch -X $stamp.gitsha1=$commit"
      go build -trimpath -buildvcs=true -ldflags "$ldflags" \
        -o "${{targets.destdir}}/usr/bin/descheduler" sigs.k8s.io/descheduler/cmd/descheduler
      "${{targets.destdir}}/usr/bin/descheduler" version \
        | grep -F "GitVersion:$version GitBranch:$branch GitSha1:$commit BuildDate:$build_date "
      "${{targets.destdir}}/usr/bin/descheduler" version \
        | grep -F "{Major:0 Minor:$(echo '${{package.version}}' | cut -d. -f2-) "
      go version -m "${{targets.destdir}}/usr/bin/descheduler" \
        | awk '$1 == "mod" && $2 == "sigs.k8s.io/descheduler" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        descheduler version | grep -F "GitVersion:v"
        descheduler version | grep -F -- "-v${{package.version}} "
        descheduler --help | grep -F -- '--policy-config-file'
        apk info --who-owns /usr/bin/descheduler \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/descheduler
    strip-prefix: v
    use-tag: true
