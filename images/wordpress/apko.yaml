contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - php-8.5
    - php-8.5-bcmath
    - php-8.5-curl
    - php-8.5-dom
    - php-8.5-exif
    - php-8.5-fileinfo
    - php-8.5-fpm
    - php-8.5-gd
    - php-8.5-iconv
    - php-8.5-intl
    - php-8.5-mbstring
    - php-8.5-mysqli
    - php-8.5-mysqlnd
    - php-8.5-openssl
    - php-8.5-simplexml
    - php-8.5-sodium
    - php-8.5-xml
    - php-8.5-zip
    - wordpress=7.1.4-r0
    - wordpress-oci-entrypoint=7.1.4-r0

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

cmd: php-fpm

work-dir: /var/www/html

stop-signal: SIGQUIT

environment:
  PATH: /usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

paths:
  - path: /var/www/html
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # The wordpress package ships its source root as 0700; the entrypoint copies
  # it into the work directory as the non-root user.
  - path: /usr/src/wordpress
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
