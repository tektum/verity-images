contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - influxd-3.8

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/influxd

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/influxdb2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/influxdb2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
