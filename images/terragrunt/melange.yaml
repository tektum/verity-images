package:
  name: terragrunt-1.2
  # yamllint disable-line rule:line-length
  version: "1.2.1"  # renovate: datasource=github-releases depName=gruntwork-io/terragrunt versioning=regex:^(?<major>1)\.(?<minor>2)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Orchestration wrapper for OpenTofu and Terraform
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: ed85b42a24b52494212b622cd45cb349cec53a3b
  go-getter-floor: v1.8.10  # renovate: datasource=go depName=github.com/hashicorp/go-getter

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gruntwork-io/terragrunt
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # CVE-2026-19585 is only in the NVD feed, which go/remediate does not read, and
  # upstream still requires go-getter v1.8.9 indirectly.
  - runs: |
      current="$(go list -m -f '{{.Version}}' github.com/hashicorp/go-getter)"
      if awk -v have="$current" -v want=${{vars.go-getter-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        GOTOOLCHAIN=local go get github.com/hashicorp/go-getter@${{vars.go-getter-floor}}
      fi
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/gruntwork-io/terragrunt/internal/version.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/terragrunt" .
      go version -m "${{targets.destdir}}/usr/bin/terragrunt" \
        | awk '$1 == "mod" && $2 == "github.com/gruntwork-io/terragrunt" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.txt \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the terragrunt build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/terragrunt-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/terragrunt-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        terragrunt --version 2>&1 | grep -F "v${{package.version}}"
        terragrunt --help 2>&1 | grep -F 'Usage'
        apk info --who-owns /usr/bin/terragrunt \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: gruntwork-io/terragrunt
    strip-prefix: v
