contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - tesseract=5.5.2-r8
    - tesseract-eng=5.5.2-r8
    - tesseract-osd=5.5.2-r8

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/tesseract

cmd: --help

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  TESSDATA_PREFIX: /usr/share/tessdata

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
