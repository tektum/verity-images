package:
  name: apko
  version: "1.5.1"  # renovate: datasource=github-releases depName=chainguard-dev/apko
  # Above Wolfi apko-1.5.0-r0, the newest published revision, which still
  # carries golang.org/x/crypto v0.58.0 (GO-2026-5932).
  epoch: 1
  description: Build OCI images from APK packages without a Dockerfile
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/apko
      tag: v${{package.version}}
      expected-commit: 2af887e71025923c2c9db14cfa3d0be35946bd1d

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  # Upstream .goreleaser.yaml takes LDFLAGS from its Makefile, which stamps
  # sigs.k8s.io/release-utils/version with `git describe --tags` (v1.5.0).
  # release-utils prefers a VCS-stamped main module version over the
  # ldflags, and go/remediate leaves go.mod modified, which Go would report as
  # v1.5.0+dirty, so VCS stamping is disabled and the tree state is explicit.
  # The main module is then (devel); metadata.yaml declares the scan identity.
  - uses: go/build
    with:
      packages: .
      output: apko
      go-package: go-1.27
      extra-args: -buildvcs=false
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d @$(git log -1 --format=%ct) +%FT%TZ)

  - runs: |
      binary="${{targets.destdir}}/usr/bin/apko"
      "$binary" version >version.out 2>&1
      cat version.out
      grep -E "^GitVersion: +v${{package.version}}\$" version.out
      grep -E "^GitCommit: +$(git rev-parse HEAD)\$" version.out
      rm version.out
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: apko-build-metadata
    description: Resolved Go module metadata for the apko build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/apko-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/apko-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        apko version 2>&1 | grep -E "^GitVersion: +v${{package.version}}$"
        apko --help >/dev/null
        apko show-config --help >/dev/null
        apk info --who-owns /usr/bin/apko \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
