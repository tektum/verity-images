package:
  name: verity-authservice
  # yamllint disable-line rule:line-length
  version: "1.1.10"  # renovate: datasource=github-releases depName=istio-ecosystem/authservice extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Envoy ext_authz gRPC server that enforces OIDC authentication for Istio and Envoy workloads
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: cb5615ffb4477d5cde80cca697fb0a851fd2befe

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio-ecosystem/authservice
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd

  - runs: |
      # Stamp the tetratelabs/run version in git describe form so --version
      # reports the release tag; a zero commit distance on main prints it bare.
      build="v${{package.version}}-0-g${{vars.source-commit}}-main"
      go build -mod=readonly -trimpath -buildvcs=true -tags netgo \
        -ldflags="-s -w -X github.com/tetratelabs/run/pkg/version.build=$build" \
        -o "${{targets.destdir}}/usr/bin/authservice" ./cmd
      # Syft reports the stamped main module natively, so the gate scans the
      # authservice module itself through GHSA without a scan-identity entry.
      go version -m "${{targets.destdir}}/usr/bin/authservice" \
        | awk '$1 == "mod" && $2 == "github.com/istio-ecosystem/authservice" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the authservice build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/authservice-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/authservice-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        authservice --version | grep -F 'v${{package.version}}'
        apk info --who-owns /usr/bin/authservice \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: istio-ecosystem/authservice
    strip-prefix: v
    tag-filter: v
    use-tag: true
