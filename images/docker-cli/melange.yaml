package:
  name: docker-cli-29.9
  # yamllint disable-line rule:line-length
  version: "29.9.3"  # renovate: datasource=github-releases depName=docker/cli versioning=regex:^(?<major>29)\.(?<minor>9)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Docker command-line client
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 5457199aa57c45e990c59c89cab5f02b817238d7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    # Upstream scripts/build/.variables always adds grpcnotrace.
    GOFLAGS: -tags=grpcnotrace

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/cli
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # docker/cli keeps its module file as vendor.mod so that it is not a SemVer
  # module (upstream scripts/with-go-mod.sh links it as go.mod for builds).
  # Copy it so the build runs in module mode, which records every dependency
  # and the v<version>+incompatible main module in the binary's build info;
  # upstream's own GOPATH-mode build records neither.
  - runs: |
      test ! -e go.mod
      cp vendor.mod go.mod
      cp vendor.sum go.sum
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/docker
  - runs: |
      build_time=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
      commit=$(git rev-parse --short HEAD)
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/docker/cli/cli/version.Version=${{package.version}} \
          -X github.com/docker/cli/cli/version.GitCommit=$commit \
          -X github.com/docker/cli/cli/version.BuildTime=$build_time" \
        -o "${{targets.destdir}}/usr/bin/docker" ./cmd/docker
      go version -m "${{targets.destdir}}/usr/bin/docker" \
        | awk '$1 == "mod" && $2 == "github.com/docker/cli" { print $3 }' \
        | grep -Ex 'v${{package.version}}\+incompatible(\.dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the docker-cli build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/docker-cli-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/docker-cli-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        docker --version | grep -F "Docker version ${{package.version}}, build "
        docker version --format '{{.Client.Version}}' 2>/dev/null \
          | grep -Fx "${{package.version}}"
        apk info --who-owns /usr/bin/docker \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0

update:
  enabled: true
  github:
    identifier: docker/cli
    strip-prefix: v
