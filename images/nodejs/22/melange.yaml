package:
  name: verity-nodejs-22
  version: "22.23.4"  # renovate: datasource=github-releases depName=nodejs/node
  epoch: 0
  description: Node.js 22 built from the official source release, with npm and corepack.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "30"
    memory: 52Gi
  test-resources:
    cpu: "2"
    memory: 2Gi

vars:
  python-version: "3.13"
  # npm replaces the copy bundled in the Node.js tarball, whose dependency
  # tree carries fixable advisories. The overlays below patch the same
  # packages the patched node-22-slim stream overlays on npm.
  npm-version: "12.0.2"  # renovate: datasource=npm depName=npm
  ip-address-version: "10.7.4"  # renovate: datasource=npm depName=ip-address
  undici-version: "6.29.1"  # renovate: datasource=npm depName=undici
  brace-expansion-version: "5.0.12"  # renovate: datasource=npm depName=brace-expansion
  postcss-selector-parser-version: "7.1.6"  # renovate: datasource=npm depName=postcss-selector-parser
  tar-version: "7.5.22"  # renovate: datasource=npm depName=tar
  # glob 14 needs minimatch 11 and path-scurry 3; minimatch 11 needs
  # @isaacs/nonrecursive-glob-match. npm still bundles glob 13 and minimatch 10.
  glob-version: "14.0.3"  # renovate: datasource=npm depName=glob
  minimatch-version: "11.0.3"  # renovate: datasource=npm depName=minimatch
  path-scurry-version: "3.0.0"  # renovate: datasource=npm depName=path-scurry
  nonrecursive-glob-match-version: "1.0.3"  # renovate: datasource=npm depName=@isaacs/nonrecursive-glob-match

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - brotli-dev
      - build-base
      - busybox
      - c-ares-dev
      - ca-certificates-bundle
      # V8 in Node.js 22 aborts in gen-regexp-special-case (`ch <= 0xffff`)
      # against ICU 79. Stay on ICU 78, which the linked runtime then requires
      # as libicu78. This is a compatibility ceiling, not a tracked version.
      - icu-dev<79
      - libuv-dev
      - linux-headers
      - nghttp2-dev
      - openssl-3.6-dev
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}-base
      - samurai
      - wolfi-base
      - zlib-dev
  environment:
    # V8 relies on null pointer checks being kept; see wolfi-dev/os#34075.
    CXXFLAGS: -fdelete-null-pointer-checks

pipeline:
  # The official release tarball. Its SHA-256 is the entry for node-v${version}.tar.gz
  # in https://nodejs.org/dist/v${version}/SHASUMS256.txt, whose detached
  # signature (SHASUMS256.txt.asc) verifies against the Node.js release keys.
  - uses: fetch
    with:
      uri: https://nodejs.org/dist/v${{package.version}}/node-v${{package.version}}.tar.gz
      expected-sha256: 4dd79de8cdc85d65cb32f48a75aee1067bf00bf94b96ecc8e4c2f82f6f0272c2

  # npm registry tarballs, kept as files and unpacked in the install step. The
  # SHA-256 values are of the registry tarballs; the registry also publishes a
  # SHA-512 integrity value for each, which was checked when they were pinned.
  - uses: fetch
    with:
      uri: https://registry.npmjs.org/npm/-/npm-${{vars.npm-version}}.tgz
      expected-sha256: 5dbb86c71d07a1957f2e90734092dd6a58bdcd9ebc2d8d41ca1c6e6a21d364e1
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/ip-address/-/ip-address-${{vars.ip-address-version}}.tgz
      expected-sha256: f9e1d0dd369c002f43770c6ee35942c8078e76d080a1e18e89113eef865f26ff
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/undici/-/undici-${{vars.undici-version}}.tgz
      expected-sha256: 29c4b8e0b2d86cb8795571c1959012ce057a14ecfd34858335f47c31e770a04f
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/brace-expansion/-/brace-expansion-${{vars.brace-expansion-version}}.tgz
      expected-sha256: ef8448ec78f20b692f04fa6d01f39b5ab34c66404bea3429f5a39c6c9e0be8b4
      extract: false

  - uses: fetch
    with:
      # yamllint disable-line rule:line-length
      uri: https://registry.npmjs.org/postcss-selector-parser/-/postcss-selector-parser-${{vars.postcss-selector-parser-version}}.tgz
      expected-sha256: 48c903f98c5591d8d26f16f389d5cb3435459474c645209a79f6241bf4b657b6
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/tar/-/tar-${{vars.tar-version}}.tgz
      expected-sha256: b792c2d1c7fc770910522ca1ffc29eee02ee38de4fa3a01e7832eb705879c6c6
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/glob/-/glob-${{vars.glob-version}}.tgz
      expected-sha256: f936d47081e316874bcd0ad9ed38a4275c7a16f5dd3300917231e0030a0acd91
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/minimatch/-/minimatch-${{vars.minimatch-version}}.tgz
      expected-sha256: 175b2fd9c9d3611e06980341c1be226c7af72b1f414eefb424dca1be9cd9e8ae
      extract: false

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/path-scurry/-/path-scurry-${{vars.path-scurry-version}}.tgz
      expected-sha256: 28d5862f70595973f00d63bb219083d6ed7a28488685a73a1c3340ba55688675
      extract: false

  - uses: fetch
    with:
      # yamllint disable-line rule:line-length
      uri: https://registry.npmjs.org/@isaacs/nonrecursive-glob-match/-/nonrecursive-glob-match-${{vars.nonrecursive-glob-match-version}}.tgz
      expected-sha256: 9c67e29b5fea7f3736c427cf061c81fa0546f3587f397fa303e46c8dbf8e9998
      extract: false

  - name: Configure and build
    runs: |
      # Defines recommended in the libuv readme.
      common_flags="-D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
      # O2 instead of Os trades about 10% binary size for about 20% speed.
      export CFLAGS="${CFLAGS/-Os/-O2} $common_flags"
      export CXXFLAGS="${CXXFLAGS/-Os/-O2} $common_flags"
      export CPPFLAGS="${CPPFLAGS/-Os/-O2} $common_flags"

      python${{vars.python-version}} configure.py \
        --prefix=/usr \
        --shared-brotli \
        --shared-zlib \
        --shared-openssl \
        --shared-cares \
        --shared-nghttp2 \
        --shared-libuv \
        --ninja \
        --openssl-use-def-ca-store \
        --with-icu-default-data-dir="$(icu-config --icudatadir)" \
        --with-intl=system-icu \
        --openssl-conf-name=openssl_conf

      # A V8 translation unit needs about 2.5 GiB, so cap the job count by
      # memory as well as by CPU to keep the compile out of the OOM killer.
      jobs=$(nproc)
      mem_jobs=$(($(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 2621440))
      [ "$mem_jobs" -ge "$jobs" ] || jobs=$mem_jobs
      [ "$jobs" -ge 1 ] || jobs=1
      make BUILDTYPE=Release JOBS="$jobs"

  - name: Install
    runs: |
      make DESTDIR="${{targets.destdir}}" install

      npm_dir="${{targets.destdir}}/usr/lib/node_modules/npm"
      rm -rf "$npm_dir"
      mkdir -p "$npm_dir"
      tar -xzf "npm-${{vars.npm-version}}.tgz" --strip-components=1 -C "$npm_dir"
      for spec in \
        "ip-address ${{vars.ip-address-version}}" \
        "undici ${{vars.undici-version}}" \
        "brace-expansion ${{vars.brace-expansion-version}}" \
        "postcss-selector-parser ${{vars.postcss-selector-parser-version}}" \
        "tar ${{vars.tar-version}}" \
        "glob ${{vars.glob-version}}" \
        "minimatch ${{vars.minimatch-version}}" \
        "path-scurry ${{vars.path-scurry-version}}" \
        "@isaacs/nonrecursive-glob-match ${{vars.nonrecursive-glob-match-version}}"; do
        set -- $spec
        rm -rf "$npm_dir/node_modules/$1"
        mkdir -p "$npm_dir/node_modules/$1"
        # A scoped tarball is fetched under its unscoped base name.
        tar -xzf "${1##*/}-$2.tgz" --strip-components=1 -C "$npm_dir/node_modules/$1"
        [ "$(./out/Release/node -p "require('$npm_dir/node_modules/$1/package.json').version")" = "$2" ]
      done
      # glob 14 and minimatch 11 are outside the ranges npm and its bundled
      # dependents declare, so `npm ls -g --all` would report them invalid.
      # Raise each such range to the overlaid version. The rewritten consumers
      # are pinned below and were checked for APIs that glob 14 and minimatch 11
      # removed; the build fails if an npm bump changes that set.
      ./out/Release/node -e '
      const fs = require("fs");
      const path = require("path");
      const [dir, ...names] = process.argv.slice(1);
      const expected = [
        "node_modules/@npmcli/arborist/package.json:minimatch",
        "node_modules/@npmcli/map-workspaces/package.json:glob",
        "node_modules/@npmcli/map-workspaces/package.json:minimatch",
        "node_modules/@npmcli/package-json/package.json:glob",
        "node_modules/@tufjs/models/package.json:minimatch",
        "node_modules/cacache/package.json:glob",
        "node_modules/libnpmdiff/package.json:minimatch",
        "node_modules/npm-packlist/node_modules/ignore-walk/package.json:minimatch",
        "node_modules/npm-packlist/package.json:glob",
        "package.json:glob",
        "package.json:minimatch",
      ];
      const rewritten = [];
      const semver = require(path.join(dir, "node_modules/semver"));
      const resolve = (from, name) => {
        for (let d = from; ; d = path.dirname(d)) {
          const p = path.join(d, "node_modules", name);
          if (fs.existsSync(p)) return p;
          if (d === dir) return null;
        }
      };
      for (const f of fs.readdirSync(dir, { recursive: true })) {
        if (!/^(node_modules\/(@[^/]+\/)?[^/]+\/)*package\.json$/.test(f)) continue;
        const file = path.join(dir, f);
        const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
        const before = rewritten.length;
        for (const deps of [pkg.dependencies, pkg.optionalDependencies, pkg.peerDependencies]) {
          for (const name of names) {
            const top = path.join(dir, "node_modules", name);
            const { version } = require(path.join(top, "package.json"));
            if (deps?.[name] && resolve(path.dirname(file), name) === top && !semver.satisfies(version, deps[name])) {
              deps[name] = "^" + version;
              rewritten.push(f + ":" + name);
            }
          }
        }
        if (rewritten.length > before) fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
      }
      if (rewritten.sort().join(" ") !== expected.join(" ")) {
        console.error("rewritten npm dependency ranges changed: " + rewritten.join(" "));
        process.exit(1);
      }
      ' "$npm_dir" glob minimatch path-scurry
      [ "$(./out/Release/node -p "require('$npm_dir/package.json').version")" = "${{vars.npm-version}}" ]

      rm -rf "${{targets.destdir}}"/usr/include \
        "${{targets.destdir}}"/usr/share/doc \
        "${{targets.destdir}}"/usr/share/man \
        "${{targets.destdir}}"/usr/share/systemtap

  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - name: Version, npm and corepack
      runs: |
        node --version | grep -Fx "v${{package.version}}"
        npm --version
        # The overlaid npm dependencies must satisfy the declared ranges.
        npm ls --global --all >/dev/null
        corepack --version
    - name: Execute JavaScript and Intl
      runs: |
        node -e 'console.log(new Intl.NumberFormat("de-DE").format(1234.56))' | grep -Fx '1.234,56'
    - name: Root stores exclude removed roots
      runs: |
        node -e '
        const fs = require("fs");
        const tls = require("tls");
        const { X509Certificate } = require("crypto");
        const pems = {
          bundled: tls.rootCertificates,
          system: fs.readFileSync("/etc/ssl/certs/ca-certificates.crt", "utf8")
            .match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g) || [],
        };
        for (const [store, list] of Object.entries(pems)) {
          const subjects = list.map((pem) => new X509Certificate(pem).subject);
          const re = /^CN=(emSign ECC Root CA - G3|AAA Certificate Services)$/m;
          const banned = subjects.filter((s) => re.test(s));
          if (banned.length) { console.error(store + ": " + banned.join("\n")); process.exit(1); }
        }
        '
