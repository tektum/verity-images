package:
  name: linkerd-controller
  version: "26.11.2"  # renovate: datasource=github-tags depName=linkerd/linkerd2
  epoch: 0
  description: Linkerd control plane controllers (destination, identity, proxy injector, policy)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "16"
    memory: 24Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - go-1.26
      - python3
      - rust-1.95
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    # Upstream Dockerfile.controller enables tokio runtime metrics.
    RUSTFLAGS: --cfg tokio_unstable

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/linkerd/linkerd2
      tag: edge-${{package.version}}
      expected-commit: 76f5e82dff7c0ead5390db7dd00266db9f6f93e1
  - uses: go/remediate
    with:
      modroot: .
      packages: ./controller/cmd
  # Upstream builds the controller with -tags prod so the multicluster
  # service-mirror uses the committed vfsgen templates. Upstream binds the
  # version at container build time through LINKERD_CONTAINER_VERSION_OVERRIDE;
  # stamping it at link time instead keeps package.version its only source,
  # and pkg/version then reports the same edge-X.Y.Z string.
  - runs: |
      go build -tags prod -mod=readonly -trimpath -buildvcs=false \
        -ldflags "-s -w -X github.com/linkerd/linkerd2/pkg/version.Version=edge-${{package.version}}" \
        -o "${{targets.destdir}}/controller" ./controller/cmd
  # GHSA-cq8v-f236-94qc: cargo-audit reports the advisory only as unsound, so
  # cargo/remediate does not act on it; pin the fixed release explicitly.
  - runs: |
      cargo update -p rand@0.9.2 --precise 0.9.3  # renovate: datasource=crate depName=rand versioning=semver
  - uses: cargo/remediate
  - runs: |
      cargo auditable build --release --locked --package linkerd-policy-controller
      install -Dm755 target/release/linkerd-policy-controller \
        "${{targets.destdir}}/linkerd-policy-controller"
      install -Dm644 LICENSE "${{targets.destdir}}/linkerd/LICENSE"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module and Cargo metadata for the Linkerd controller build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/linkerd-controller-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/linkerd-controller-build/go.sum"
          install -Dm644 Cargo.lock \
            "${{targets.subpkgdir}}/usr/share/linkerd-controller-build/Cargo.lock"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /controller destination -version | grep -Fx "edge-${{package.version}}"
        # Upstream builds clap without its help feature; --help is rejected.
        if /linkerd-policy-controller --help >/tmp/policy-help 2>&1; then
          echo 'policy controller unexpectedly accepted --help' >&2
          exit 1
        fi
        grep -F 'error: unexpected argument found' /tmp/policy-help
        if /linkerd-policy-controller --default-opaque-ports=notaport >/tmp/policy-ports 2>&1; then
          echo 'policy controller accepted invalid opaque ports' >&2
          exit 1
        fi
        grep -F 'invalid digit found in string' /tmp/policy-ports
        apk info --who-owns /controller \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' /linkerd/LICENSE
