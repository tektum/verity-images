contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-k6@local

accounts:
  groups:
    - groupname: k6
      gid: 65532
  users:
    - username: k6
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/k6

work-dir: /home/k6

environment:
  PATH: /usr/bin:/bin
  HOME: /home/k6
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/k6
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
