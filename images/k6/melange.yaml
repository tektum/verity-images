package:
  name: verity-k6
  version: "2.3.0"  # renovate: datasource=github-releases depName=grafana/k6
  epoch: 0
  description: Modern load testing tool using Go and JavaScript
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: e0887846143ab176d4b5483c9d52cf3b3e009f1a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/k6
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -trimpath -buildvcs=true \
        -ldflags="-s -w -X go.k6.io/k6/v2/internal/build.BuildOrigin=release" \
        -o "${{targets.destdir}}/usr/bin/k6" .
      go version -m "${{targets.destdir}}/usr/bin/k6" \
        | awk '$1 == "mod" && $2 == "go.k6.io/k6/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE.md \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE.md"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the k6 build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/k6-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/k6-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        k6 version | grep -F "k6 v${{package.version}}"
        apk info --who-owns /usr/bin/k6 \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx AGPL-3.0-or-later
        grep -F 'GNU AFFERO GENERAL PUBLIC LICENSE' \
          "/usr/share/licenses/${{package.name}}/LICENSE.md"

update:
  enabled: true
  github:
    identifier: grafana/k6
    strip-prefix: v
    use-tag: true
