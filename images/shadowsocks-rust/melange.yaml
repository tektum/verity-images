package:
  name: verity-shadowsocks-rust
  # yamllint disable-line rule:line-length
  version: "1.25.0"  # renovate: datasource=github-releases depName=shadowsocks/shadowsocks-rust versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Shadowsocks proxy server, local client, manager and URL utility
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 14Gi

vars:
  binaries: sslocal ssserver ssmanager ssservice ssurl

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - rust-1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/shadowsocks/shadowsocks-rust
      tag: v${{package.version}}
      expected-commit: ab388c7466d21f979430e33cc9ef10e22fb05955

  - uses: cargo/remediate

  - runs: |
      set --
      for bin in ${{vars.binaries}}; do
        set -- "$@" --bin "$bin"
      done
      cargo auditable build --release --locked "$@"
      for bin in ${{vars.binaries}}; do
        install -Dm755 "target/release/$bin" "${{targets.destdir}}/usr/bin/$bin"
      done
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      rm -rf .cargo

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        for bin in sslocal ssserver ssmanager ssservice; do
          "$bin" --version | grep -Fx "shadowsocks ${{package.version}}"
        done
        ssurl --version | grep -Fx "ssurl ${{package.version}}"
        for bin in ${{vars.binaries}}; do
          apk info --who-owns "/usr/bin/$bin" \
            | grep -F "${{package.name}}-${{package.full-version}}"
        done
        ssserver --help | grep -F -- '--encrypt-method'
        ssservice genkey -m 2022-blake3-aes-256-gcm | base64 -d | wc -c | grep -Fx 32
        ssurl --decode 'ss://YWVzLTI1Ni1nY206dmVyaXR5@127.0.0.1:8388' \
          | grep -F 'aes-256-gcm'

update:
  enabled: true
  github:
    identifier: shadowsocks/shadowsocks-rust
    strip-prefix: v
