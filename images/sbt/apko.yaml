contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - sbt=2.0.12-r0
    - openjdk-17-default-jdk

accounts:
  groups:
    - groupname: build
      gid: 65532
  users:
    - username: build
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/sbt

work-dir: /work

environment:
  HOME: /home/build
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin
  USER: build

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build/.sbt
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build/.ivy2
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build/.cache
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build/.cache/coursier
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/build/.cache/sbt
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
