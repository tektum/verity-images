package:
  name: verity-fleet-controller
  # yamllint disable-line rule:line-length
  version: "0.16.3"  # renovate: datasource=github-releases depName=rancher/fleet versioning=regex:^(?<major>0)\.(?<minor>16)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Fleet controller and CLI for GitOps at scale across Kubernetes clusters
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 2137e669ebec4d397262df1149edb65bceaa4466

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local
    GOWORK: "off"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/fleet
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/fleetcontroller ./cmd/fleetcli

  - runs: |
      flags="-s -w -X github.com/rancher/fleet/pkg/version.Version=v${{package.version}}"
      flags="$flags -X github.com/rancher/fleet/pkg/version.GitCommit=${{vars.source-commit}}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$flags" \
        -o "${{targets.destdir}}/usr/bin/fleetcontroller" ./cmd/fleetcontroller
      go version -m "${{targets.destdir}}/usr/bin/fleetcontroller" \
        | awk '$1 == "mod" && $2 == "github.com/rancher/fleet" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/fleetcontroller" --version \
        | grep -F 'v${{package.version}} (${{vars.source-commit}})'
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$flags" \
        -o "${{targets.destdir}}/usr/bin/fleet" ./cmd/fleetcli
      go version -m "${{targets.destdir}}/usr/bin/fleet" \
        | awk '$1 == "mod" && $2 == "github.com/rancher/fleet" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/fleet" --version \
        | grep -F 'v${{package.version}} (${{vars.source-commit}})'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Fleet controller build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/fleet-controller-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/fleet-controller-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        fleetcontroller --version | grep -F 'v${{package.version}} (${{vars.source-commit}})'
        fleetcontroller --help >/dev/null
        apk info --who-owns /usr/bin/fleetcontroller \
          | grep -F "${{package.name}}-${{package.full-version}}"
        fleet --version | grep -F 'v${{package.version}} (${{vars.source-commit}})'
        fleet --help >/dev/null
        apk info --who-owns /usr/bin/fleet \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: rancher/fleet
    strip-prefix: v
    tag-filter-prefix: v0.16.
    use-tag: true
