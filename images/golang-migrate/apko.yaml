contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - golang-migrate-4.20@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/migrate

cmd: --help

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/nonroot

paths:
  # The upstream image also exposes the binary at /migrate. apko applies the
  # symlink entry's (default zero) mode to its target, so restore it.
  - path: /migrate
    type: symlink
    source: /usr/bin/migrate
  - path: /usr/bin/migrate
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
