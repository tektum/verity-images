package:
  name: verity-kube-rbac-proxy
  # yamllint disable-line rule:line-length
  version: "0.23.1"  # renovate: datasource=github-releases depName=brancz/kube-rbac-proxy versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes RBAC authorizing HTTP proxy
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 0766d1dbaf0c2c777887b4ccc3ecaef06e8938b3

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/brancz/kube-rbac-proxy
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/kube-rbac-proxy

  - runs: |
      # Same version stamps as the upstream Makefile build target.
      ldflags="-s -w"
      ldflags="$ldflags -X k8s.io/component-base/version.gitVersion=v${{package.version}}"
      ldflags="$ldflags -X k8s.io/component-base/version.gitCommit=${{vars.source-commit}}"
      ldflags="$ldflags -X k8s.io/component-base/version/verflag.programName=kube-rbac-proxy"
      go build -mod=readonly -trimpath -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/local/bin/kube-rbac-proxy" ./cmd/kube-rbac-proxy
      "${{targets.destdir}}/usr/local/bin/kube-rbac-proxy" --version \
        | grep -Fx 'kube-rbac-proxy v${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kube-rbac-proxy build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kube-rbac-proxy-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kube-rbac-proxy-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kube-rbac-proxy --version | grep -Fx 'kube-rbac-proxy v${{package.version}}'
        apk info --who-owns /usr/local/bin/kube-rbac-proxy | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: brancz/kube-rbac-proxy
    strip-prefix: v
