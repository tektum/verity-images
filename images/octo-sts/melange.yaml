package:
  name: verity-octo-sts
  # yamllint disable-line rule:line-length
  version: "0.14.3"  # renovate: datasource=github-releases depName=octo-sts/app versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: GitHub security token service that exchanges OIDC tokens for scoped GitHub tokens
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  # v0.14.3 is a lightweight tag on this commit.
  source-commit: bc52cffd7339db1cda312d436e1331b64d97474f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/octo-sts/app
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/app

  # Upstream publishes ./cmd/app with ko and no version ldflags. The checkout
  # keeps .git, so Go stamps the main module version from the v tag for the
  # scanner; a `+dirty` suffix only records go/remediate edits.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/octo-sts" ./cmd/app
      go version -m "${{targets.destdir}}/usr/bin/octo-sts" \
        | awk '$1 == "mod" && $2 == "github.com/octo-sts/app" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the octo-sts build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/octo-sts-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/octo-sts-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        # Without PORT and STS_DOMAIN the service refuses to start.
        if octo-sts >/tmp/octo-sts.out 2>&1; then exit 1; fi
        grep -F 'failed to process env var' /tmp/octo-sts.out
        apk info --who-owns /usr/bin/octo-sts \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: octo-sts/app
    strip-prefix: v
