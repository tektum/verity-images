contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-ferretdb@local

accounts:
  groups:
    - groupname: ferretdb
      gid: 1000
  users:
    - username: ferretdb
      uid: 1000
      gid: 1000
      homedir: /nonexistent
  run-as: 1000

entrypoint:
  command: /ferretdb

work-dir: /

environment:
  PATH: /usr/bin:/bin
  FERRETDB_LISTEN_ADDR: ":27017"
  FERRETDB_DEBUG_ADDR: ":8088"
  FERRETDB_STATE_DIR: /state

paths:
  - path: /state
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
