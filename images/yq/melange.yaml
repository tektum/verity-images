package:
  name: yq
  version: "4.54.1"
  # A high epoch keeps this build above Wolfi yq revisions of the same version,
  # so the recipe test and package resolution select this package.
  epoch: 101
  description: Portable command-line YAML, JSON, XML, CSV and properties processor
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: 504fc38780cc46be8444ea1b72fb55919fc0bfb0
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - uses: go/build
    with:
      packages: .
      output: yq
      go-package: go-1.27
  - runs: |
      "${{targets.destdir}}/usr/bin/yq" --version | grep -F "version v${{package.version}}"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: yq-build-metadata
    description: Resolved Go module metadata for the yq build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/yq-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/yq-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        yq --version | grep -F "version v${{package.version}}"
        yq --help >/dev/null
        test "$(printf 'key: cat\n' | yq '.key' -)" = cat
        apk info --who-owns /usr/bin/yq | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx MIT
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v
