package:
  name: verity-percona-server-mongodb-operator
  # yamllint disable-line rule:line-length
  version: "1.23.1"  # renovate: datasource=github-releases depName=percona/percona-server-mongodb-operator versioning=regex:^(?<major>1)\.(?<minor>23)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator for Percona Server for MongoDB with its pod-side healthcheck and entrypoint scripts
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # /init-entrypoint.sh and the scripts it copies into pods are bash; it
      # uses install, cp, chown, chmod and id from busybox.
      - bash
      - busybox
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: a4367b91e914abe73bacf85e9a7f4b587addd40c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/percona/percona-server-mongodb-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/manager ./cmd/mongodb-healthcheck

  - runs: |
      # Same stamps as upstream build/Dockerfile. Upstream release images carry
      # the sanitized release branch name (release-1-23-1) as GitBranch; the
      # build time is taken from the commit so the build stays reproducible.
      commit=$(git rev-parse HEAD)
      test "$commit" = "${{vars.source-commit}}"
      branch="release-$(printf '%s' '${{package.version}}' | tr . -)"
      build_time=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)
      # The operator copies these into pods, so it must ship the matching release.
      test "$(cat pkg/version/version.txt)" = "${{package.version}}"

      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-w -s -X main.GitCommit=$commit -X main.GitBranch=$branch -X main.BuildTime=$build_time" \
        -o "${{targets.destdir}}/usr/local/bin/percona-server-mongodb-operator" ./cmd/manager
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-w -s -X main.GitCommit=$commit -X main.GitBranch=$branch" \
        -o "${{targets.destdir}}/mongodb-healthcheck" ./cmd/mongodb-healthcheck

      for bin in usr/local/bin/percona-server-mongodb-operator mongodb-healthcheck; do
        go version -m "${{targets.destdir}}/$bin" \
          | awk '$1 == "mod" && $2 == "github.com/percona/percona-server-mongodb-operator" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
      done

      # Paths match the upstream image: the operator runs /init-entrypoint.sh
      # from this image to copy the rest into /opt/percona inside each pod.
      for script in init-entrypoint.sh ps-entry.sh physical-restore-ps-entry.sh \
        pbm-entry.sh mongot-entrypoint.sh; do
        install -Dm755 "build/$script" "${{targets.destdir}}/$script"
      done
      mkdir -p "${{targets.destdir}}/logcollector"
      cp -R build/logcollector/. "${{targets.destdir}}/logcollector/"
      find "${{targets.destdir}}/logcollector" -type d -exec chmod 755 {} +
      find "${{targets.destdir}}/logcollector" -type f -exec chmod 644 {} +
      chmod 755 "${{targets.destdir}}/logcollector/entrypoint.sh"

      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Percona Server for MongoDB operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/percona-server-mongodb-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/percona-server-mongodb-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /mongodb-healthcheck --version 2>&1 \
          | grep -F 'git commit ${{vars.source-commit}}, branch release-'
        /usr/local/bin/percona-server-mongodb-operator -help 2>&1 | grep -F -- '-health-probe-bind-address'
        for f in /init-entrypoint.sh /ps-entry.sh /physical-restore-ps-entry.sh \
          /pbm-entry.sh /mongot-entrypoint.sh /logcollector/entrypoint.sh /mongodb-healthcheck; do
          test -x "$f"
        done
        apk info --who-owns /usr/local/bin/percona-server-mongodb-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: percona/percona-server-mongodb-operator
    strip-prefix: v
    tag-filter-prefix: v1.23.
    use-tag: true
