package:
  name: verity-flux-helm-controller-1.7
  version: "1.7.1"
  epoch: 0
  description: Flux Helm Controller for Kubernetes.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: da037f220ee3e97eb91a70506b5c5f169e46bb68

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluxcd/helm-controller
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" -o manager .
      install -Dm755 manager "${{targets.destdir}}/manager"
      go version -m "${{targets.destdir}}/manager" \
        | awk '$1 == "mod" && $2 == "github.com/fluxcd/helm-controller" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Flux Helm Controller build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/flux-helm-controller-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/flux-helm-controller-build/go.sum"

test:
  pipeline:
    - runs: |
        /manager --help >/dev/null
        test -f /usr/share/licenses/${{package.name}}/LICENSE
