contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-fleet-agent@local

# Upstream runs as UID 1000; the Fleet charts and the agent manifest set
# runAsUser 1000 and invoke the binary by name through PATH.
accounts:
  groups:
    - groupname: fleet
      gid: 1000
  users:
    - username: fleet
      uid: 1000
      gid: 1000
      homedir: /home/fleet
  run-as: 1000

entrypoint:
  command: /usr/bin/fleetagent

work-dir: /home/fleet

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/fleet
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o1777
