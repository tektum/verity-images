package:
  name: verity-oras
  # yamllint disable-line rule:line-length
  version: "1.3.6"  # renovate: datasource=github-releases depName=oras-project/oras versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: OCI registry client for pushing and pulling artifacts
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 9b1fc815f6b7fba743f08b9b5c5846639cc11d3c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oras-project/oras
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/oras

  - runs: |
      tree_state=clean
      git diff --quiet || tree_state=dirty
      pkg=oras.land/oras/internal/version
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X ${pkg}.GitCommit=${{vars.source-commit}} -X ${pkg}.GitTreeState=${tree_state}" \
        -o "${{targets.destdir}}/usr/bin/oras" ./cmd/oras
      go version -m "${{targets.destdir}}/usr/bin/oras" \
        | awk '$1 == "mod" && $2 == "oras.land/oras" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the ORAS build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/oras-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/oras-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        oras version | grep -Ex 'Version: +${{package.version}}'
        apk info --who-owns /usr/bin/oras \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: oras-project/oras
    strip-prefix: v
