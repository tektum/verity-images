package:
  name: verity-csi-resizer
  # yamllint disable-line rule:line-length
  version: "2.3.0"  # renovate: datasource=github-releases depName=kubernetes-csi/external-resizer versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: CSI external-resizer sidecar that drives CSI volume expansion and modification RPCs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v2.3.0 is a lightweight tag on this commit.
  source-commit: baa08e6d8773f167dbddce36579f36d84bbe3fde

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/external-resizer
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/csi-resizer

  # Same build as upstream release-tools build.make: CGO 0, vendored modules,
  # -X main.version=<tag> and a static link. The module path carries the /v2
  # suffix, so Go stamps the main module version from the v2 tag for the
  # scanner; a `+dirty` suffix only records go/remediate edits.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      version='v${{package.version}}'
      go build -mod=vendor -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=$version -extldflags -static -buildid=" \
        -o "${{targets.destdir}}/usr/bin/csi-resizer" ./cmd/csi-resizer
      go version -m "${{targets.destdir}}/usr/bin/csi-resizer" \
        | awk '$1 == "mod" && $2 == "github.com/kubernetes-csi/external-resizer/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/csi-resizer" --version \
        | awk '{ print $2 }' | grep -Fx "$version"
      # Upstream image contract: ENTRYPOINT ["/csi-resizer"].
      ln -s usr/bin/csi-resizer "${{targets.destdir}}/csi-resizer"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the csi-resizer build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/csi-resizer-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/csi-resizer-build/go.sum"
          install -Dm644 vendor/modules.txt "${{targets.subpkgdir}}/usr/share/csi-resizer-build/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /csi-resizer --version | grep -Fx '/csi-resizer v${{package.version}}'
        csi-resizer -h 2>&1 | grep -F -- '-csi-address'
        apk info --who-owns /usr/bin/csi-resizer \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-resizer
    strip-prefix: v
