contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - erlang-28
    - busybox

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/erl

work-dir: /app

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
