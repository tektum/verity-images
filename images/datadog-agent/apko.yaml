contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-datadog-agent@local

# Upstream datadog/agent runs s6-overlay as root: shell cont-init scripts pick
# a datadog.yaml, reject a missing DD_API_KEY, copy /conf.d and /checks.d, and
# s6 supervises the core agent next to trace-agent, process-agent,
# system-probe, security-agent and the other side binaries. This image ships
# only the core agent: no shell, no supervisor, nonroot, and the command s6
# runs for it (`agent run`). Mount check configs into
# /etc/datadog-agent/conf.d directly. The agent does not refuse to start
# without an API key; the payload forwarder rejects intake with it instead.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

cmd: /opt/datadog-agent/bin/agent/agent run

work-dir: /home/nonroot

environment:
  PATH: /opt/datadog-agent/bin/agent:/usr/sbin:/usr/bin:/sbin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  DOCKER_DD_AGENT: "true"
  # The IPC auth token and certificate default to the config directory, which
  # the nonroot user cannot write; keep them in the writable run directory so
  # `agent status`, `agent health` and other CLI calls find them too.
  DD_AUTH_TOKEN_FILE_PATH: /var/run/datadog/auth_token
  DD_IPC_CERT_FILE_PATH: /var/run/datadog/ipc_cert.pem

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Default run path (install path + /run): checkpoints, remote config cache.
  - path: /opt/datadog-agent/run
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # Default log file (/var/log/datadog/agent.log) and UDS socket locations.
  - path: /var/log/datadog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/datadog
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
