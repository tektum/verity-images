package:
  name: verity-victoriametrics-operator
  # yamllint disable-line rule:line-length
  version: "0.75.2"  # renovate: datasource=github-releases depName=VictoriaMetrics/operator versioning=regex:^(?<major>0)\.(?<minor>75)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator for VictoriaMetrics, VictoriaLogs and VictoriaTraces
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 61d1fd3209bfe1819ad4f6e48dcd7f74f51e228c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/VictoriaMetrics/operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd

  - runs: |
      # Same shape as the upstream release image (operator-<date>-<time>-v<version>),
      # dated from the commit so the build stays reproducible. The operator parses
      # this to pick its own config-reloader tag, so no suffix may follow the version.
      build_date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y%m%d-%H%M%S)
      buildinfo="operator-$build_date-v${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=$buildinfo" \
        -o "${{targets.destdir}}/usr/bin/vm-operator" ./cmd
      go version -m "${{targets.destdir}}/usr/bin/vm-operator" \
        | awk '$1 == "mod" && $2 == "github.com/VictoriaMetrics/operator" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      test "$("${{targets.destdir}}/usr/bin/vm-operator" -version 2>&1)" = "$buildinfo"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the VictoriaMetrics operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/victoriametrics-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/victoriametrics-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        vm-operator -version 2>&1 | grep -Ex 'operator-[0-9]{8}-[0-9]{6}-v${{package.version}}'
        apk info --who-owns /usr/bin/vm-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: VictoriaMetrics/operator
    strip-prefix: v
    tag-filter-prefix: v0.75.
    use-tag: true
