package:
  name: sealed-secrets-0
  # renovate: datasource=github-tags depName=bitnami/sealed-secrets versioning=semver-coerced
  version: "0.39.1"
  # First Verity-owned source build for the existing Sealed Secrets v0 family.
  epoch: 1
  description: Bitnami Sealed Secrets controller and kubeseal CLI
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - ${{package.name}}-kubeseal=${{package.full-version}}
  resources:
    cpu: "6"
    memory: 12Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bitnami/sealed-secrets
      tag: v${{package.version}}
      expected-commit: af17f829e4647765d5c576837261bf44863c96cc

  - uses: go/remediate
    with:
      modroot: .
      packages: './cmd/controller ./cmd/kubeseal'
  - uses: go/build
    with:
      go-package: go-1.26
      packages: ./cmd/controller
      output: controller
      ldflags: -X main.VERSION=v${{package.version}}

  - runs: |
      "${{targets.destdir}}/usr/bin/controller" --version \
        | grep -Fx "controller version: v${{package.version}}"
      "${{targets.destdir}}/usr/bin/controller" --help >/dev/null
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-kubeseal
    description: kubeseal CLI for Bitnami Sealed Secrets
    dependencies:
      runtime:
        - ca-certificates-bundle
      provides:
        - kubeseal=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          go-package: go-1.26
          packages: ./cmd/kubeseal
          output: kubeseal
          ldflags: -X main.VERSION=v${{package.version}}
      - runs: |
          "${{targets.subpkgdir}}/usr/bin/kubeseal" --help >/dev/null

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
        - go-1.26
  pipeline:
    - runs: |
        controller --version | grep -Fx "controller version: v${{package.version}}"
        controller --help >/dev/null
        kubeseal --help >/dev/null
        go version -m /usr/bin/controller \
          | grep -F "github.com/bitnami/sealed-secrets"
        go version -m /usr/bin/kubeseal \
          | grep -F "github.com/bitnami/sealed-secrets"
        apk info --who-owns /usr/bin/controller \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --who-owns /usr/bin/kubeseal \
          | grep -F "${{package.name}}-kubeseal-${{package.full-version}}"
        apk info --depends "${{package.name}}" \
          | grep -F ca-certificates-bundle
        apk info --provides "${{package.name}}-kubeseal" \
          | grep -Fx "kubeseal=${{package.full-version}}"
        apk info --license "${{package.name}}" \
          | grep -Fx Apache-2.0
        grep -F "Apache License" \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: bitnami/sealed-secrets
    strip-prefix: v
