package:
  name: verity-pyroscope
  # yamllint disable-line rule:line-length
  version: "2.4.3"  # renovate: datasource=github-tags depName=grafana/pyroscope versioning=regex:^v?(?<major>2)\.(?<minor>4)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Grafana Pyroscope continuous profiling database
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 860ef8d7093f9b6c824a7528010b15d782645e4f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - corepack
      - git
      - go-1.26
      - nodejs-24
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    NODE_OPTIONS: --max-old-space-size=8192

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/pyroscope
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      # Grafana checkouts have shipped a .gitconfig (ssh url rewrite) and
      # .config/go/env (GOPRIVATE) for their own developers. HOME is the build
      # directory, so either would send module fetches over ssh and break
      # go/remediate. This tag ships neither; the cleanup keeps that true if a
      # later tag adds them (see images/mimir). Only the ssh rewrite section is
      # removed: the same .gitconfig holds safe.directory, which VCS stamping
      # needs, so the file itself must stay.
      git config --global --remove-section 'url.ssh://git@github.com/grafana' 2>/dev/null || true
      rm -rf .config/go
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/pyroscope ./cmd/profilecli
  - uses: corepack/install
    with:
      directory: ui
  - name: Build web UI
    runs: |
      cd ui
      corepack yarn build
      test -f dist/index.html
  - name: Build binaries
    runs: |
      # The module is github.com/grafana/pyroscope/v2 and the tag is v-prefixed,
      # so Go stamps the real module version from the checkout's VCS data. Keep
      # .git, and fail the build unless the main module reports v<version>.
      pkg=github.com/grafana/pyroscope/v2/pkg/util/build
      flags="-s -w -X $pkg.Branch=release"
      flags="$flags -X $pkg.Revision=$(printf '%.9s' '${{vars.source-commit}}')"
      flags="$flags -X $pkg.Version=${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true -tags netgo,embedassets \
        -ldflags "$flags" -o "${{targets.destdir}}/usr/bin/pyroscope" ./cmd/pyroscope
      go build -mod=readonly -trimpath -buildvcs=true -tags netgo \
        -ldflags "$flags" -o "${{targets.destdir}}/usr/bin/profilecli" ./cmd/profilecli
      for bin in pyroscope profilecli; do
        go version -m "${{targets.destdir}}/usr/bin/$bin" \
          | awk '$1 == "mod" && $2 == "github.com/grafana/pyroscope/v2" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
      done
      install -Dm644 cmd/pyroscope/pyroscope.yaml \
        "${{targets.destdir}}/etc/pyroscope/config.yaml"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Pyroscope build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/pyroscope-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/pyroscope-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        pyroscope -version 2>&1 | grep -F "${{package.version}}"
        profilecli --help 2>&1 | grep -F 'Usage'
        apk info --who-owns /usr/bin/pyroscope \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx AGPL-3.0-only
        grep -F 'GNU AFFERO GENERAL PUBLIC LICENSE' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: grafana/pyroscope
    strip-prefix: v
    use-tag: true
