contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-pyroscope@local

accounts:
  groups:
    - groupname: pyroscope
      gid: 10001
  users:
    - username: pyroscope
      uid: 10001
      gid: 10001
  run-as: 10001

work-dir: /data

entrypoint:
  command: /usr/bin/pyroscope

cmd: -config.file=/etc/pyroscope/config.yaml

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /data
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755
  - path: /data-compactor
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755
  - path: /data-metastore
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 10001
    gid: 10001
    permissions: 0o1777
