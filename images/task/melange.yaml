package:
  name: verity-task
  # yamllint disable-line rule:line-length
  version: "3.54.0"  # renovate: datasource=github-releases depName=go-task/task versioning=regex:^(?<major>3)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Task runner and build tool driven by Taskfile.yml
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: b5aef1c287a9be8038347a17646bdf4bc7185bce
  go-getter-floor: v1.8.10  # renovate: datasource=go depName=github.com/hashicorp/go-getter

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/go-task/task
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # CVE-2026-19585 in github.com/hashicorp/go-getter has an NVD record but no Go
  # vulnerability database entry, so go/remediate does not raise it, and Task
  # v3.54.0 still requires v1.8.9 (remote Taskfiles).
  - runs: |
      current="$(go list -m -f '{{.Version}}' github.com/hashicorp/go-getter)"
      if awk -v have="$current" -v want=${{vars.go-getter-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        go get github.com/hashicorp/go-getter@${{vars.go-getter-floor}}
      fi
      go list -m github.com/hashicorp/go-getter

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/task

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/task" ./cmd/task
      go version -m "${{targets.destdir}}/usr/bin/task" \
        | awk '$1 == "mod" && $2 == "github.com/go-task/task/v3" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Task build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/task-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/task-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        task --version | grep -E '^(Task version: )?v?${{package.version}}( |$)'
        apk info --who-owns /usr/bin/task \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: go-task/task
    strip-prefix: v
