package:
  name: verity-kiali
  # yamllint disable-line rule:line-length
  version: "2.34.1"  # renovate: datasource=github-tags depName=kiali/kiali versioning=regex:^(?<major>2)\.(?<minor>34)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kiali, the console for the Istio service mesh
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: cf1b692d92d6e780f764ed44d6a2c4e2dc5a4543

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - corepack
      - git
      - go-1.26
      - nodejs-24
      - npm
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    NODE_OPTIONS: --max-old-space-size=8192

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kiali/kiali
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: corepack/install
    with:
      directory: frontend
  - name: Build web UI
    runs: |
      # frontend/frontend.go embeds frontend/build, which go/remediate's
      # module listing needs to exist, so the UI is built first.
      cd frontend
      corepack yarn run build:kiali
      test -f build/index.html
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - name: Build binary
    runs: |
      # The module path is github.com/kiali/kiali with no /v2 suffix, so Go
      # cannot stamp a module version from the v2 tag. The scan identity is
      # declared in metadata.yaml instead. The frontend is embedded from
      # frontend/build.
      pkg=github.com/kiali/kiali/cmd
      flags="-s -w -X $pkg.version=v${{package.version}}"
      flags="$flags -X $pkg.commitHash=${{vars.source-commit}}"
      flags="$flags -X $pkg.goVersion=$(go env GOVERSION | sed 's/^go//')"
      go build -mod=readonly -trimpath -buildvcs=false -ldflags "$flags" \
        -o "${{targets.destdir}}/opt/kiali/kiali" .
      install -d "${{targets.destdir}}/usr/bin"
      ln -s /opt/kiali/kiali "${{targets.destdir}}/usr/bin/kiali"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Kiali build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kiali-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kiali-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kiali --help 2>&1 | grep -F 'console for Istio service mesh'
        apk info --who-owns /opt/kiali/kiali \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kiali/kiali
    strip-prefix: v
    use-tag: true
