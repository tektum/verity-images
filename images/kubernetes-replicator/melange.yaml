package:
  name: verity-kubernetes-replicator
  # yamllint disable-line rule:line-length
  version: "2.12.6"  # renovate: datasource=github-releases depName=mittwald/kubernetes-replicator versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Replicates Secrets, ConfigMaps, Roles, RoleBindings and ServiceAccounts across namespaces
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v2.12.6 is an annotated tag that peels to this commit.
  source-commit: efed1ab2a14e1f6e07a37f52a82ff53033775657

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mittwald/kubernetes-replicator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  # Same build as upstream .goreleaser.yml and Dockerfile.buildx: CGO 0 and
  # `go build .` of the root main package. The module path has no /v2 suffix,
  # so Go cannot stamp the v2 tag and would report a v1.0.1-0.<date>-<commit>
  # pseudo-version that misstates the release. Build without VCS stamping;
  # metadata.yaml declares the module purl, versioned from package.version,
  # for the scanner. Upstream defines no version variable to stamp.
  # The published upstream image (Dockerfile, used by GoReleaser) runs
  # ENTRYPOINT ["/replicator"], so the package ships that path as a symlink.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/kubernetes-replicator" .
      go version -m "${{targets.destdir}}/usr/bin/kubernetes-replicator" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/mittwald/kubernetes-replicator
      ln -s /usr/bin/kubernetes-replicator "${{targets.destdir}}/replicator"
      install -Dm644 LICENSE.txt \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kubernetes-replicator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/kubernetes-replicator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/kubernetes-replicator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /replicator -h 2>&1 | grep -F -- '-push-allowed-source-namespaces'
        kubernetes-replicator -h 2>&1 | grep -F -- '-status-addr'
        out=$(mktemp)
        if kubernetes-replicator -resync-period nope >"$out" 2>&1; then
          echo 'invalid -resync-period unexpectedly succeeded' >&2
          exit 1
        fi
        grep -F 'invalid duration' "$out"
        apk info --who-owns /usr/bin/kubernetes-replicator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: mittwald/kubernetes-replicator
    strip-prefix: v
    use-tag: true
