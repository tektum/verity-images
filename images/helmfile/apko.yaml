contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - helm-4
    - verity-helmfile@local

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/helmfile

work-dir: /work

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  HELM_PLUGINS: /usr/libexec/helm/plugins
  # helmfile version otherwise queries GitHub for a newer release; any value
  # disables it (cmd/root.go, envvar.UpgradeNoticeDisabled in pkg/envvar/const.go).
  HELMFILE_UPGRADE_NOTICE_DISABLED: "true"
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
