contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - bash
    - busybox
    - ca-certificates-bundle
    - glibc-locale-en
    - tzdata
    - xz
    - zstd
    # Locally built packages, including the subpackages they depend on: apk
    # only installs from a tagged repository what is requested with its tag.
    - ecpg-17@local
    - libpq-17@local
    - postgresql-17@local
    - postgresql-17-base@local
    - postgresql-17-client@local
    - postgresql-17-client-base@local
    - postgresql-17-contrib@local
    - postgresql-17-oci-entrypoint-compat@local

accounts:
  groups:
    - groupname: postgres
      gid: 999
  users:
    - username: postgres
      uid: 999
      gid: 999
      shell: /bin/bash
      homedir: /var/lib/postgresql

entrypoint:
  command: docker-entrypoint.sh

cmd: postgres

stop-signal: SIGINT

environment:
  LANG: en_US.utf8
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  PG_MAJOR: "17"
  PGDATA: /var/lib/postgresql/data

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 0o1777
  - path: /var/lib/postgresql/data
    type: directory
    uid: 999
    gid: 999
    permissions: 0o1777
  - path: /var/run/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 0o3777
  - path: /docker-entrypoint-initdb.d
    type: directory
    permissions: 0o755

volumes:
  - /var/lib/postgresql/data
