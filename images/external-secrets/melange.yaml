package:
  name: external-secrets-operator
  version: "2.6.0"
  epoch: 8
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  grpc-floor: v1.83.2  # renovate: datasource=go depName=google.golang.org/grpc
  ntlmssp-floor: v0.1.1  # renovate: datasource=go depName=github.com/Azure/go-ntlmssp

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/external-secrets/external-secrets/archive/cc1ae7fe2927fbe61df9aa87bf2e5075972c79f9.tar.gz
      expected-sha256: c45b054f10c90acf2d5814296205438631c83c17a9bb32d0888703b631d266fb
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      GOTOOLCHAIN=local go get \
        google.golang.org/grpc@${{vars.grpc-floor}} \
        github.com/Azure/go-ntlmssp@${{vars.ntlmssp-floor}}
  - uses: go/build
    with:
      go-package: go-1.26
      packages: .
      output: external-secrets
  - runs: |
      "${{targets.destdir}}/usr/bin/external-secrets" --help >/dev/null
      modules="$(go version -m "${{targets.destdir}}/usr/bin/external-secrets")"
      test "$(printf '%s\n' "$modules" \
        | awk '$1 == "dep" && $2 == "google.golang.org/grpc" { print $3 }')" \
        = "${{vars.grpc-floor}}"
      test "$(printf '%s\n' "$modules" \
        | awk '$1 == "dep" && $2 == "github.com/Azure/go-ntlmssp" { print $3 }')" \
        = "${{vars.ntlmssp-floor}}"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: external-secrets-operator-build-metadata
    description: Resolved Go module metadata for the External Secrets build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/external-secrets-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/external-secrets-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        external-secrets --help >/dev/null
        apk info --who-owns /usr/bin/external-secrets \
          | grep -F "${{package.name}}-${{package.full-version}}"
        test -f /usr/share/licenses/${{package.name}}/LICENSE
