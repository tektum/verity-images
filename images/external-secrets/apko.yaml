contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - external-secrets-operator@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/external-secrets

environment:
  PATH: /usr/bin:/bin
