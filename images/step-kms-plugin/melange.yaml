package:
  name: verity-step-kms-plugin
  # yamllint disable-line rule:line-length
  version: "0.17.0"  # renovate: datasource=github-releases depName=smallstep/step-kms-plugin versioning=regex:^(?<major>0)\.(?<minor>17)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Step plugin to manage keys and certificates on cloud KMSs and HSMs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - pcsc-lite
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: ade1d6c998c6fb6dff4739d0cbbb52abfbf8c796
  # go.step.sm/crypto v0.92.0 moves from go-jose/v3, which has no fixed
  # release for CVE-2026-116585, CVE-2026-116586 and CVE-2026-116587, to
  # go-jose/v4.
  step-crypto-floor: v0.92.0  # renovate: datasource=go depName=go.step.sm/crypto

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - pcsc-lite-dev
      - python3
  environment:
    # CGO links the YubiKey backend against Wolfi's shared libpcsclite, as
    # the upstream release binaries do.
    CGO_ENABLED: "1"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/step-kms-plugin
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - runs: |
      current="$(GOTOOLCHAIN=local go list -m -f '{{.Version}}' go.step.sm/crypto)"
      if awk -v have="$current" -v want=${{vars.step-crypto-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        GOTOOLCHAIN=local go get go.step.sm/crypto@${{vars.step-crypto-floor}}
        GOTOOLCHAIN=local go mod tidy
      fi

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      release_date=$(git show -s --format=%cd --date=format:'%Y-%m-%d %H:%M UTC' HEAD)
      cmd=github.com/smallstep/step-kms-plugin/cmd
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X '$cmd.Version=${{package.version}}' -X '$cmd.ReleaseDate=$release_date'" \
        -o "${{targets.destdir}}/usr/bin/step-kms-plugin" .
      go version -m "${{targets.destdir}}/usr/bin/step-kms-plugin" \
        | awk '$1 == "mod" && $2 == "github.com/smallstep/step-kms-plugin" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      if go version -m "${{targets.destdir}}/usr/bin/step-kms-plugin" \
        | grep -F 'github.com/go-jose/go-jose/v3'; then
        echo 'go-jose/v3 is still linked' >&2
        exit 1
      fi
      "${{targets.destdir}}/usr/bin/step-kms-plugin" version \
        | grep -F 'step-kms-plugin/${{package.version}} '
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the step-kms-plugin build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/step-kms-plugin-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/step-kms-plugin-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        step-kms-plugin version | grep -F 'step-kms-plugin/${{package.version}} '
        step-kms-plugin --help >/dev/null
        apk info --who-owns /usr/bin/step-kms-plugin \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: smallstep/step-kms-plugin
    strip-prefix: v
    tag-filter-prefix: v0.17.
    use-tag: true
