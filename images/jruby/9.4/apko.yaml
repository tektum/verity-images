contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - jruby-9.4
    - jruby-9.4-default-ruby
    - openjdk-17-jre

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/jruby

work-dir: /app

environment:
  HOME: /home/nonroot
  # The install tree is not writable by the runtime user; skip the AppCDS archive
  # instead of warning on every start.
  JRUBY_OPTS: --nocache
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
