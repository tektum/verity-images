package:
  name: verity-policy-reporter
  # yamllint disable-line rule:line-length
  version: "3.11.2"  # renovate: datasource=github-releases depName=kyverno/policy-reporter versioning=regex:^(?<major>3)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>3\.\d+\.\d+)$
  epoch: 0
  description: Kyverno PolicyReport watcher with REST API, Prometheus metrics, and notification targets
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 8bb91357fd7326a21e3370c2edf839a15d0a6774

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - gcc
      - git
      - glibc-dev
      - go-1.27
      - python3
  environment:
    # The SQLite driver (mattn/go-sqlite3) compiles the bundled SQLite with cgo,
    # as the upstream Dockerfile does with CGO_ENABLED=1.
    CGO_ENABLED: "1"
    # Upstream build tag, here so remediation lists, scans, and builds the same
    # tagged package graph that ships.
    GOFLAGS: -p=4 -tags=sqlite_unlock_notify
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # The module path github.com/kyverno/policy-reporter has no /v3 suffix, so
      # Go cannot stamp the v3 tag as the module version. Build without VCS
      # stamping and let metadata.yaml declare the module as the scan identity.
      # The upstream Makefile stamps main.Version with the bare image tag. The
      # upstream Dockerfile links the same binary statically for a scratch
      # image; this one links dynamically against the image's glibc.
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w -X main.Version=${{package.version}}" \
        -o "${{targets.destdir}}/app/policyreporter" .
      "${{targets.destdir}}/app/policyreporter" version \
        | grep -Fx 'AppVersion: ${{package.version}}'
      # Same /app layout as the upstream image: the default --template-dir is
      # ./templates relative to the /app working directory.
      install -d "${{targets.destdir}}/app/templates"
      install -m644 templates/summary.html templates/violations.html templates/templates.go \
        "${{targets.destdir}}/app/templates/"
      install -m644 LICENSE.md "${{targets.destdir}}/app/LICENSE.md"
      install -Dm644 LICENSE.md \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE.md"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the policy-reporter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/policy-reporter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/policy-reporter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        /app/policyreporter version | grep -Fx 'AppVersion: ${{package.version}}'
        /app/policyreporter run --help | grep -F -- '--template-dir'
        test -s /app/templates/summary.html
        test -s /app/templates/violations.html
        apk info --who-owns /app/policyreporter | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE.md"

update:
  enabled: true
  github:
    identifier: kyverno/policy-reporter
    strip-prefix: v
