contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-policy-reporter@local

# The upstream scratch image runs as USER 1234 with no passwd entry, so the
# process gets gid 0. Keep both ids so files written to the SQLite and tmp
# volumes keep the same ownership.
accounts:
  users:
    - username: policyreporter
      uid: 1234
      gid: 0
      homedir: /app
  run-as: 1234

# Same contract as the upstream Dockerfile: ENTRYPOINT ["/app/policyreporter",
# "run"] in WORKDIR /app, so ./templates and ./config.yaml resolve under /app.
entrypoint:
  command: /app/policyreporter run

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
