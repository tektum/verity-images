package:
  name: verity-oauth2-proxy
  # yamllint disable-line rule:line-length
  version: "7.15.6"  # renovate: datasource=github-releases depName=oauth2-proxy/oauth2-proxy extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Reverse proxy that provides authentication with OpenID Connect and OAuth2 providers
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oauth2-proxy/oauth2-proxy
      tag: v${{package.version}}
      expected-commit: ea755ac07aa200acc22e02f95d25b91de6c9fe20

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/oauth2-proxy/oauth2-proxy/v7/pkg/version.VERSION=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/oauth2-proxy" .
      # Syft reports the stamped main module natively, so the gate scans the
      # oauth2-proxy module itself through GHSA without a scan-identity entry.
      go version -m "${{targets.destdir}}/usr/bin/oauth2-proxy" \
        | awk '$1 == "mod" && $2 == "github.com/oauth2-proxy/oauth2-proxy/v7" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the oauth2-proxy build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/oauth2-proxy-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/oauth2-proxy-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        oauth2-proxy --version | grep -F 'oauth2-proxy v${{package.version}} '
        apk info --who-owns /usr/bin/oauth2-proxy \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: oauth2-proxy/oauth2-proxy
    strip-prefix: v
    tag-filter: v
    use-tag: true
