contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - difftastic=0.72.0-r0

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/difft

work-dir: /work

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
