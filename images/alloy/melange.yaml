package:
  name: verity-alloy
  version: "1.21.3"  # renovate: datasource=github-releases depName=grafana/alloy
  epoch: 0
  description: Grafana Alloy OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "16"
    memory: 64Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: f2108cd783accbd491b24843484c33abba6da52a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - nodejs-24
      - npm
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - runs: |
      cd internal/web/ui
      npm ci --no-audit --no-fund
      npm run build
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      pkg=github.com/grafana/alloy/internal/build
      flags="-s -w"
      flags="$flags -X $pkg.Branch=HEAD"
      flags="$flags -X $pkg.Version=v${{package.version}}"
      flags="$flags -X github.com/grafana/alloy/syntax/internal/stdlib.Version=v${{package.version}}"
      flags="$flags -X $pkg.Revision=${{vars.source-commit}}"
      flags="$flags -X $pkg.BuildUser=verity"
      go build -p 6 -buildvcs=false -trimpath -tags gore2regex -ldflags "$flags" \
        -o "${{targets.destdir}}/usr/bin/alloy" .
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      mkdir -p "${{targets.destdir}}/etc/alloy"
      printf 'logging {\n  level = "info"\n}\n' > "${{targets.destdir}}/etc/alloy/config.alloy"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        alloy --version 2>&1 | grep -F "v${{package.version}}"
        apk info --who-owns /usr/bin/alloy \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
        test -s /etc/alloy/config.alloy

update:
  enabled: true
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
