package:
  name: verity-nsc
  # yamllint disable-line rule:line-length
  version: "2.15.0"  # renovate: datasource=github-releases depName=nats-io/nsc versioning=regex:^(?<major>2)\.(?<minor>15)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: NATS account and user JWT/NKEY management tool
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: c8d67c23c187ed0db496ce5b2b66e96715bb72bf

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nats-io/nsc
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      commit=$(git rev-parse HEAD)
      build_date=$(git show -s --format=%cI HEAD)
      ldflags="-s -w -X main.version=${{package.version}} -X main.commit=$commit"
      ldflags="$ldflags -X main.date=$build_date -X main.builtBy=verity"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/nsc" .
      go version -m "${{targets.destdir}}/usr/bin/nsc" \
        | awk '$1 == "mod" && $2 == "github.com/nats-io/nsc/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/nsc" --version 2>&1 \
        | grep -Fx 'nsc version ${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nsc build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nsc-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nsc-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        nsc --version 2>&1 | grep -Fx 'nsc version ${{package.version}}'
        apk info --who-owns /usr/bin/nsc \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: nats-io/nsc
    strip-prefix: v
    tag-filter-prefix: v2.15.
    use-tag: true
