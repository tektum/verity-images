package:
  name: deno
  version: "2.9.7"
  epoch: 4
  description: A modern runtime for JavaScript and TypeScript.
  copyright:
    - license: MIT
  resources:
    cpu: "22"
    memory: 36Gi
  test-resources:
    cpu: "1"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-${{vars.clang-version}}
      - cmake
      - glibc-dev
      - posix-libc-utils
      - protobuf-dev
      - protoc
      - python3
      - rust-1.95
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/denoland/deno
      tag: v${{package.version}}
      expected-commit: 0c071246a412575e07423263404a5d13e7ed6aa2
  - uses: patch
    with:
      patches: rand-pin-bump.patch hickory-0.26.patch
  - runs: |
      cargo update -p rand@0.8.5 --precise 0.8.6 # renovate: datasource=crate depName=rand versioning=semver
      cargo update -p quinn-proto --precise 0.11.17 # renovate: datasource=crate depName=quinn-proto versioning=semver
      cargo update -p hickory-resolver \
        --precise 0.26.3 # renovate: datasource=crate depName=hickory-resolver versioning=semver
  - uses: cargo/build
    with:
      output: deno
  - uses: strip

update:
  enabled: true
  github:
    identifier: denoland/deno
    strip-prefix: v

test:
  pipeline:
    - runs: deno --version

vars:
  clang-version: 22
