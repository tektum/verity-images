package:
  name: deno
  version: "2.9.6"
  epoch: 3
  description: A modern runtime for JavaScript and TypeScript.
  copyright:
    - license: MIT
  resources:
    cpu: "22"
    memory: 36Gi
  test-resources:
    cpu: "1"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-${{vars.clang-version}}
      - cmake
      - glibc-dev
      - posix-libc-utils
      - protobuf-dev
      - protoc
      - python3
      - rust-1.95
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/denoland/deno
      tag: v${{package.version}}
      expected-commit: e518fbd66dda5debcbdefc0beb0b3756b37b64fa
  - uses: cargo/remediate
  - uses: cargo/build
    with:
      output: deno
  - uses: strip

update:
  enabled: true
  github:
    identifier: denoland/deno
    strip-prefix: v

test:
  pipeline:
    - runs: deno --version

vars:
  clang-version: 22
