contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - deno

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/deno

work-dir: /app

environment:
  DENO_DIR: /deno-dir
  PATH: /usr/bin:/bin

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /deno-dir
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
