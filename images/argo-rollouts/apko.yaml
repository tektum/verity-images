contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-argo-rollouts@local

accounts:
  groups:
    - groupname: argo-rollouts
      gid: 999
  users:
    - username: argo-rollouts
      uid: 999
      gid: 999
  run-as: 999

entrypoint:
  command: /usr/bin/rollouts-controller

work-dir: /home/argo-rollouts

environment:
  HOME: /home/argo-rollouts
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/argo-rollouts
    type: directory
    uid: 999
    gid: 999
    permissions: 0o755
  - path: /home/argo-rollouts/plugin-bin
    type: directory
    uid: 999
    gid: 999
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 999
    gid: 999
    permissions: 0o1777
