package:
  name: verity-polaris
  # yamllint disable-line rule:line-length
  version: "10.2.7"  # renovate: datasource=github-releases depName=FairwindsOps/polaris extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes best-practice auditor with a dashboard and an admission webhook
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v10.2.6 is a lightweight tag on this commit.
  source-commit: 3aa5859048d9e535db9d9ae393593bf4bb4101e1

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FairwindsOps/polaris
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  # Same build as the upstream GoReleaser release: CGO 0, the root main
  # package, and -X main.Version=<version without v> -X main.Commit=<sha>.
  # The dashboard templates and assets are embedded with go:embed, so the
  # binary is the whole runtime.
  - runs: |
      commit=$(git rev-parse HEAD)
      test "$commit" = '${{vars.source-commit}}'
      go build -trimpath -buildvcs=true \
        -ldflags "-X main.Version=${{package.version}} -X main.Commit=$commit -s -w" \
        -o "${{targets.destdir}}/usr/bin/polaris" .
      "${{targets.destdir}}/usr/bin/polaris" version \
        | grep -Fx 'Polaris version:${{package.version}}'
      go version -m "${{targets.destdir}}/usr/bin/polaris" \
        | awk '$1 == "build" && $2 ~ /^vcs.revision=/ { print $2 }' \
        | grep -Fx "vcs.revision=$commit"
      # Upstream installs the binary as /usr/local/bin/polaris.
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      ln -s ../../bin/polaris "${{targets.destdir}}/usr/local/bin/polaris"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        polaris version | grep -Fx 'Polaris version:${{package.version}}'
        /usr/local/bin/polaris version | grep -Fx 'Polaris version:${{package.version}}'
        polaris audit --help | grep -F -- '--audit-path'
        apk info --who-owns /usr/bin/polaris \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: FairwindsOps/polaris
    strip-prefix: v
    use-tag: true
