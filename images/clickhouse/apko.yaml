contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - clickhouse-26.1

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/clickhouse-server

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /var/lib/clickhouse
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /var/log/clickhouse-server
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/clickhouse-server
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /var/lib/clickhouse
