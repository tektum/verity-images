package:
  name: clickhouse-26.5
  # yamllint disable-line rule:line-length
  version: "26.5.7.64"  # renovate: datasource=github-tags depName=ClickHouse/ClickHouse versioning=regex:^v?(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)(-stable|-lts)?$
  # CVE-2026-111497 (GHSA-9v8h-qqgm-4m35) is in the bundled Brotli decoder,
  # which the release tag still pins at 1.0.9. The recipe replaces it with
  # Brotli 1.2.1 as upstream main does. The Wolfi security feed records the
  # fix as clickhouse-26.5 26.5.7.64-r5, which is no longer published, so this
  # package keeps the Wolfi name and uses epoch 5 to match that revision.
  epoch: 5
  description: ClickHouse column-oriented database built from the upstream stable release
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - clickhouse=${{package.full-version}}
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "30"
    memory: 52Gi
  test-resources:
    cpu: "2"
    memory: 4Gi

vars:
  clang-version: "21"
  brotli-version: "1.2.1"  # renovate: datasource=github-tags depName=google/brotli versioning=semver-coerced

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - clang-${{vars.clang-version}}
      - cmake
      - coreutils
      - findutils
      - git
      # The aarch64 CPU probe runs `grep -P`, which busybox lacks.
      - grep
      - lld-${{vars.clang-version}}
      - llvm-${{vars.clang-version}}
      # The upstream builder image assembles isa-l with NASM 2.16. This is a
      # compatibility ceiling, not a tracked version.
      - nasm<3
      # Upstream builds with Ninja. Wolfi ships it outside PATH, and the
      # samurai drop-in skips this project's targets.
      - ninja-build
      - perl
      - python3
      # Upstream pins a nightly from the 1.96 cycle; release builds need no
      # nightly features.
      - rust-1.96
      - wolfi-base
      - yasm

pipeline:
  # Every bundled third-party library is a pinned submodule of the release tag.
  - uses: git-checkout
    with:
      repository: https://github.com/ClickHouse/ClickHouse
      tag: v${{package.version}}-stable
      expected-commit: 77a35148bbcdb78cf1a3d47fcea90b593bca671f
      recurse-submodules: true
      shallow-submodules: true
      submodule-jobs: 16

  # Upstream main moved contrib/brotli to 1.2.1 and extended the source list in
  # contrib/brotli-cmake (ClickHouse commit a4e1ef85eb4a). The patch is that
  # source-list change; 1.2.1 only adds the decoder fix on top of 1.2.0.
  - runs: rm -rf contrib/brotli
  - uses: git-checkout
    with:
      repository: https://github.com/google/brotli
      tag: v${{vars.brotli-version}}
      expected-commit: db24a98aed38a16de78cc05ca15cdd8dc2a0d92d
      destination: contrib/brotli
  - uses: patch
    with:
      patches: brotli-1.2.1.patch
  - runs: |
      grep -Fx '#define BROTLI_VERSION_PATCH 1' contrib/brotli/c/common/version.h
      grep -Fx '#define BROTLI_VERSION_MINOR 2' contrib/brotli/c/common/version.h
      # git-checkout copies its 0700 clone directory mode to the destination, which the runner
      # cannot read back when it retrieves the workspace.
      chmod -R a+rX contrib/brotli

  # The release tag carries the branch version (26.5.7.1). Upstream release
  # builds stamp the published version, tag, and commit before configuring.
  - name: Stamp release version
    runs: |
      versions=cmake/autogenerated_versions.txt
      sed -i \
        -e "s|^SET(VERSION_STRING .*)|SET(VERSION_STRING ${{package.version}})|" \
        -e "s|^SET(VERSION_DESCRIBE .*)|SET(VERSION_DESCRIBE v${{package.version}}-stable)|" \
        -e "s|^SET(VERSION_GITHASH .*)|SET(VERSION_GITHASH $(git rev-parse HEAD))|" \
        "$versions"
      grep -Fx "SET(VERSION_STRING ${{package.version}})" "$versions"
      grep -Fx "SET(VERSION_DESCRIBE v${{package.version}}-stable)" "$versions"
      grep -Fx "SET(VERSION_GITHASH $(git rev-parse HEAD))" "$versions"

  # Upstream partially links the PRQL and polyglot Rust archives with ld.lld
  # to hide internal symbols. With the Wolfi Rust and LLVM pair the stripped
  # archive loses local symbols and the final link fails with undefined
  # symbols, so take the existing ppc64le skip on every architecture. This
  # only affects symbol table size.
  - name: Skip Rust archive symbol stripping
    runs: |
      cmake_file=rust/workspace/CMakeLists.txt
      old='CMAKE_SYSTEM_PROCESSOR STREQUAL "ppc64le")'
      new='CMAKE_SYSTEM_PROCESSOR MATCHES "ppc64le|x86_64|aarch64")'
      sed -i "s/$old/$new/" "$cmake_file"
      [ "$(grep -cF "$new" "$cmake_file")" -eq 2 ]
      ! grep -F "$old" "$cmake_file"

  - name: Configure
    runs: |
      # The upstream build refuses inherited compiler flags and supplies its own
      # hermetic toolchain and sysroot from the source tree.
      unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
      cmake -S . -B build -G Ninja \
        -DCMAKE_MAKE_PROGRAM=/usr/lib/ninja-build/bin/ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_INSTALL_SYSCONFDIR=/etc \
        -DCMAKE_INSTALL_LOCALSTATEDIR=/var \
        -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
        -DCOMPILER_CACHE=disabled \
        -DDISABLE_ALL_DEBUG_SYMBOLS=1 \
        -DENABLE_TESTS=0 \
        -DENABLE_THINLTO=0 \
        -DENABLE_UTILS=0

  - name: Build
    runs: |
      unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS
      # The build limits compile and link jobs by available memory itself.
      cmake --build build

  - name: Install
    runs: |
      DESTDIR="${{targets.destdir}}" cmake --install build
      rm -rf "${{targets.destdir}}"/usr/lib/debug

  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - name: Version
      runs: |
        clickhouse --version | grep -F "${{package.version}}"
        clickhouse-server --version | grep -F "${{package.version}}"
        clickhouse-client --version | grep -F "${{package.version}}"
    - name: Local query
      runs: |
        [ "$(clickhouse-local --query 'SELECT 40 + 2')" = 42 ]
        if clickhouse-local --query 'NOT VALID SQL' 2>err.txt; then
          echo 'invalid SQL unexpectedly succeeded' >&2
          exit 1
        fi
        grep -qi 'syntax error' err.txt
    - name: Default server configuration
      runs: |
        test -f /etc/clickhouse-server/config.xml
        test -f /etc/clickhouse-server/users.xml
