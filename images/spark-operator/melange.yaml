package:
  name: verity-spark-operator
  # yamllint disable-line rule:line-length
  version: "2.6.0"  # renovate: datasource=github-releases depName=kubeflow/spark-operator extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubeflow Spark operator controller and admission webhook for Apache Spark on Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v2.6.0 is an annotated tag on this commit.
  source-commit: 192fff45e233dcb7f4649e1bc7ef2b8485c134de

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    # Upstream's Makefile and Dockerfile build with CGO_ENABLED=0.
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubeflow/spark-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/operator

  # Same build as upstream `make build-operator`: CGO 0 and the same -X stamps
  # in k8s.io/component-base/version. Upstream builds the file
  # cmd/operator/main.go; building the ./cmd/operator package instead lets Go
  # stamp the main module with the release tag, which the scan identity relies
  # on. The build date is the pinned commit time, as upstream CI derives it from
  # SOURCE_DATE_EPOCH, and the tree state is reported as upstream computes it.
  - runs: |
      commit=$(git rev-parse HEAD)
      test "$commit" = '${{vars.source-commit}}'
      if [ -z "$(git status --porcelain)" ]; then tree_state=clean; else tree_state=dirty; fi
      build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%S+00:00)
      stamp=k8s.io/component-base/version
      ldflags="-s -w -X $stamp.gitVersion=v${{package.version}} -X $stamp.gitCommit=$commit"
      ldflags="$ldflags -X $stamp.gitTreeState=$tree_state -X $stamp.buildDate=$build_date"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "$ldflags" \
        -o "${{targets.destdir}}/usr/bin/spark-operator" ./cmd/operator
      "${{targets.destdir}}/usr/bin/spark-operator" version \
        | grep -Fx "Git Version: v${{package.version}}"
      "${{targets.destdir}}/usr/bin/spark-operator" version \
        | grep -Fx "Git Commit: $commit"
      go version -m "${{targets.destdir}}/usr/bin/spark-operator" \
        | awk '$1 == "mod" && $2 == "github.com/kubeflow/spark-operator/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      # The CRDs generated for this build. Upstream's image does not carry them;
      # they ship here so a consumer can install the exact schema the binary
      # expects.
      for crd in config/crd/bases/*.yaml; do
        install -Dm644 "$crd" \
          "${{targets.destdir}}/usr/share/spark-operator/crds/$(basename "$crd")"
      done
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the spark-operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/spark-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/spark-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spark-operator version --short | grep -Fx "Git Version: v${{package.version}}"
        spark-operator controller start --help 2>&1 | grep -F -- '--submitter-service-url'
        spark-operator webhook start --help 2>&1 | grep -F -- '--webhook-cert-dir'
        for crd in sparkapplications scheduledsparkapplications sparkconnects; do
          grep -Fx 'kind: CustomResourceDefinition' \
            "/usr/share/spark-operator/crds/sparkoperator.k8s.io_$crd.yaml"
        done
        apk info --who-owns /usr/bin/spark-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubeflow/spark-operator
    strip-prefix: v
    use-tag: true
