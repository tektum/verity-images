package:
  name: verity-rekor-cli
  # yamllint disable-line rule:line-length
  version: "1.6.2"  # renovate: datasource=github-releases depName=sigstore/rekor versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Sigstore Rekor transparency log command-line client
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # v1.6.2 is an annotated tag; this is its peeled commit.
  source-commit: 0baa39712ffa627b70756ea555193ec84bea4507

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/rekor
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/rekor-cli

  # Same ldflags as the upstream Makefile CLI_LDFLAGS (REKOR_LDFLAGS) used by
  # the Dockerfile and goreleaser. release-utils prefers the VCS stamped main
  # module version over gitVersion, and go/remediate may edit go.mod, so
  # `version` reports v<version> or v<version>+dirty. Only the client is
  # shipped, as in the upstream `deploy-cli` image; rekor-server is the
  # sibling images/rekor-server image.
  - uses: go/build
    with:
      packages: ./cmd/rekor-cli
      output: rekor-cli
      go-package: go-1.27
      ldflags: |
        -buildid=
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -u -d @$(git log -1 --format=%ct) +%FT%TZ)

  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      binary="${{targets.destdir}}/usr/bin/rekor-cli"
      "$binary" version 2>&1 | grep -E '^GitVersion: +v${{package.version}}(\+dirty)?$'
      "$binary" version 2>&1 | grep -E '^GitCommit: +${{vars.source-commit}}$'
      go version -m "$binary" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/sigstore/rekor/cmd/rekor-cli
      go version -m "$binary" \
        | awk '$1 == "mod" && $2 == "github.com/sigstore/rekor" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the rekor-cli build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/rekor-cli-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/rekor-cli-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        rekor-cli version 2>&1 | grep -E '^GitVersion: +v${{package.version}}(\+dirty)?$'
        rekor-cli upload --help >/dev/null
        apk info --who-owns /usr/bin/rekor-cli \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx Apache-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: sigstore/rekor
    strip-prefix: v
    tag-filter-prefix: v1
    use-tag: true
