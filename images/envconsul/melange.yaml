package:
  name: verity-envconsul
  # yamllint disable-line rule:line-length
  version: "0.14.1"  # renovate: datasource=github-releases depName=hashicorp/envconsul versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Launch a subprocess with environment variables from Consul and Vault
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 294f187c97d3a0b38e967635a6130c339e6c3f92

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/envconsul
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # go/remediate raises golang.org/x/crypto past GO-2026-5932 and any other
  # module with a released fix.
  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Same stamps as the upstream Makefile (CGO_ENABLED=0, -s -w, version.Name
      # and the short version.GitCommit).
      bin="${{targets.destdir}}/usr/bin/envconsul"
      short=$(git rev-parse --short=7 HEAD)
      stamp="-X github.com/hashicorp/envconsul/version.Name=envconsul"
      stamp="$stamp -X github.com/hashicorp/envconsul/version.GitCommit=$short"
      grep -Ex '[[:space:]]+Version[[:space:]]+= "${{package.version}}"' version/version.go
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w $stamp" -o "$bin" .
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "github.com/hashicorp/envconsul" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the envconsul build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/envconsul-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/envconsul-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        envconsul -version 2>&1 \
          | grep -Ex 'envconsul v${{package.version}} \([0-9a-f]{7}\)'
        apk info --who-owns /usr/bin/envconsul \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MPL-2.0
        grep -F 'Mozilla Public License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: hashicorp/envconsul
    strip-prefix: v
    use-tag: true
