contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - bash
    - busybox
    - couchdb-3.5=3.5.3-r1
    - couchdb-3.5-compat=3.5.3-r1
    # Wolfi moves the whole share/ tree (JavaScript query server main.js, Fauxton)
    # into the -doc subpackage; without it views and design documents fail.
    - couchdb-3.5-doc=3.5.3-r1

accounts:
  groups:
    - groupname: couchdb
      gid: 65532
  users:
    - username: couchdb
      uid: 65532
      gid: 65532
      homedir: /opt/couchdb
  run-as: 65532

entrypoint:
  command: /usr/bin/docker-entrypoint.sh

cmd: /opt/couchdb/bin/couchdb

environment:
  PATH: /usr/bin:/bin
  HOME: /opt/couchdb

paths:
  - path: /usr/share/couchdb
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/couchdb/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/couchdb/etc/local.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /usr/share/couchdb/var/log
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

volumes:
  - /opt/couchdb/data

work-dir: /opt/couchdb
