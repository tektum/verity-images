package:
  name: verity-lychee
  # yamllint disable-line rule:line-length
  version: "0.24.2"  # renovate: datasource=github-releases depName=lycheeverse/lychee versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^lychee-v(?<version>.+)$
  epoch: 0
  description: Fast, asynchronous link checker for Markdown, HTML and websites
  copyright:
    - license: Apache-2.0 OR MIT
  resources:
    cpu: "8"
    memory: 12Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - rust-1.99

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lycheeverse/lychee
      tag: lychee-v${{package.version}}
      expected-commit: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b

  # Shipped crates that cargo/remediate cannot raise inside the upstream
  # semver ranges:
  # - octocrab's `jwt-rust-crypto` backend links jsonwebtoken's RustCrypto
  #   stack (rsa 0.9, RUSTSEC-2023-0071; crypto-bigint 0.5, RUSTSEC-2026-0387).
  #   The patch selects `jwt-aws-lc-rs`, the provider rustls already links.
  # - lychee-lib requires quick-xml ^0.39 and quick-junit 0.6.0 ^0.38
  #   (RUSTSEC-2026-0194/0195, fixed in 0.41.0). The patch moves lychee-lib to
  #   0.41 with the one `read_text` API adjustment; quick-junit 0.6.1 uses 0.41.
  # - aws-lc-rs 1.15.4 requires aws-lc-sys ^0.37; 1.19.0 is built on a fixed
  #   aws-lc-sys.
  # - serde_with 3.18.0 (GHSA-7gcf-g7xr-8hxj, no RustSec entry) and rand 0.9.2
  #   (GHSA-cq8v-f236-94qc, RustSec lists it as informational `unsound`) are
  #   not raised by cargo/remediate, but Grype reports both as fixable.
  - uses: patch
    with:
      patches: aws-lc-jwt-quick-xml.patch

  - runs: |
      cargo update -p quick-xml@0.39.2 --precise 0.41.0 # renovate: datasource=crate depName=quick-xml versioning=semver
      cargo update -p quick-junit --precise 0.6.1 # renovate: datasource=crate depName=quick-junit versioning=semver
      cargo update -p aws-lc-rs --precise 1.19.0 # renovate: datasource=crate depName=aws-lc-rs versioning=semver
      cargo update -p serde_with --precise 3.21.0 # renovate: datasource=crate depName=serde_with versioning=semver
      cargo update -p rand@0.9.2 --precise 0.9.3 # renovate: datasource=crate depName=rand versioning=semver

  # The default `email-check` feature pulls mailify-lib 0.2.0, which pins
  # hickory-resolver 0.25 (GHSA-5j98-2g5x-46v6, GHSA-6f2x-v7q7-m7m5 and the
  # hickory-proto advisories are fixed only in 0.26, outside its semver range).
  # Without the feature lychee excludes mail addresses instead of probing them
  # over SMTP, and no DNS resolver crate is linked at all.
  - uses: cargo/remediate
    with:
      default-features: false

  - runs: |
      cargo auditable build --release --locked -p lychee --no-default-features
      install -Dm755 target/release/lychee "${{targets.destdir}}/usr/bin/lychee"
      install -Dm644 LICENSE-APACHE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE-APACHE"
      install -Dm644 LICENSE-MIT \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE-MIT"
      rm -rf .cargo

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        lychee --version | grep -Fx 'lychee ${{package.version}}'
        printf '[local](https://example.invalid/page)\n' >offline.md
        lychee --offline --no-progress offline.md
        apk info --who-owns /usr/bin/lychee \
          | grep -F "${{package.name}}-${{package.full-version}}"

update:
  enabled: true
  github:
    identifier: lycheeverse/lychee
    strip-prefix: lychee-v
    tag-filter: lychee-v
    use-tag: true
