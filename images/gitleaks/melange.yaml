package:
  name: gitleaks-8.30
  version: "8.30.1"  # renovate: datasource=github-releases depName=gitleaks/gitleaks versioning=semver
  epoch: 0
  description: Secret scanner for git repositories, files, and directories
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gitleaks/gitleaks
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w \
          -X github.com/zricethezav/gitleaks/v8/version.Version=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/gitleaks" .
      go version -m "${{targets.destdir}}/usr/bin/gitleaks" \
        | awk '$1 == "mod" && $2 == "github.com/zricethezav/gitleaks/v8" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the gitleaks build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/gitleaks-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/gitleaks-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        gitleaks version | grep -Fx "${{package.version}}"
        gitleaks --help | grep -F 'Usage:'
        apk info --who-owns /usr/bin/gitleaks \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: gitleaks/gitleaks
    strip-prefix: v
