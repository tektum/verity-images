contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-vpa-updater@local

# Upstream pkg/updater/Dockerfile: ENTRYPOINT ["/updater"] on distroless nonroot.
entrypoint:
  command: /updater

accounts:
  run-as: 65532

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /updater
    type: symlink
    source: /usr/bin/updater
    uid: 0
    gid: 0
  - path: /usr/bin/updater
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
