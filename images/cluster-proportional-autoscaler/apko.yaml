contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-cluster-proportional-autoscaler@local

# Mirror registry.k8s.io/cpa/cluster-proportional-autoscaler:v1.10.3, which runs
# /cluster-proportional-autoscaler as 65535:65535 from /home/nonroot.
accounts:
  groups:
    - groupname: nonroot
      gid: 65535
  users:
    - username: nonroot
      uid: 65535
      gid: 65535
      homedir: /home/nonroot
  run-as: "65535:65535"

entrypoint:
  command: /cluster-proportional-autoscaler

work-dir: /home/nonroot

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /

paths:
  - path: /home/nonroot
    type: directory
    uid: 65535
    gid: 65535
    permissions: 0o755
  - path: /cluster-proportional-autoscaler
    type: symlink
    source: /usr/bin/cluster-proportional-autoscaler
    uid: 0
    gid: 0
  - path: /usr/bin/cluster-proportional-autoscaler
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
