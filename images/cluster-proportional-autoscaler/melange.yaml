package:
  name: verity-cluster-proportional-autoscaler
  # yamllint disable-line rule:line-length
  version: "1.10.3"  # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-proportional-autoscaler versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Scales a workload's replicas with the number of cluster nodes and cores
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 3b6a79d52d5a62ade6aaf36401f979598ee76b3e

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/cluster-proportional-autoscaler
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/cluster-proportional-autoscaler
  # Upstream build/build.sh stamps pkg/version.Version, which does not exist;
  # the variable is VERSION. Stamp it so --version reports the release tag.
  # metadata.yaml declares the module purl, versioned from package.version.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      module=github.com/kubernetes-sigs/cluster-proportional-autoscaler
      go build -mod=vendor -trimpath -buildvcs=false \
        -ldflags="-s -w -X ${module}/pkg/version.VERSION=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/cluster-proportional-autoscaler" ./cmd/cluster-proportional-autoscaler
      go version -m "${{targets.destdir}}/usr/bin/cluster-proportional-autoscaler" \
        | awk '$1 == "path" { print $2 }' \
        | grep -Fx "${module}/cmd/cluster-proportional-autoscaler"
      "${{targets.destdir}}/usr/bin/cluster-proportional-autoscaler" --version \
        | grep -Fx "v${{package.version}}"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cluster-proportional-autoscaler build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/cluster-proportional-autoscaler-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"
          install -Dm644 vendor/modules.txt "$dir/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        cluster-proportional-autoscaler --version | grep -Fx "v${{package.version}}"
        apk info --who-owns /usr/bin/cluster-proportional-autoscaler \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/cluster-proportional-autoscaler
    strip-prefix: v
