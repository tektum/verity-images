contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - dgraph=25.5.1-r6

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /dgraph
  run-as: 65532

work-dir: /dgraph

entrypoint:
  command: /usr/bin/dgraph

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /dgraph
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
