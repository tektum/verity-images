package:
  name: verity-step-cli
  # yamllint disable-line rule:line-length
  version: "0.31.0"  # renovate: datasource=github-releases depName=smallstep/cli versioning=regex:^(?<major>0)\.(?<minor>31)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Smallstep command line toolkit for certificates, keys and PKI
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 8301c0dfb1546ccddb808375b9f9311be03c2ba9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/cli
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/step

  - runs: |
      build_date=$(git show -s --format=%cI HEAD)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.Version=${{package.version}} -X main.BuildTime=$build_date" \
        -o "${{targets.destdir}}/usr/bin/step" ./cmd/step
      go version -m "${{targets.destdir}}/usr/bin/step" \
        | awk '$1 == "mod" && $2 == "github.com/smallstep/cli" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/step" version | grep -F 'Smallstep CLI/${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the step CLI build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/step-cli-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/step-cli-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        step version | grep -F 'Smallstep CLI/${{package.version}}'
        step --help >/dev/null
        apk info --who-owns /usr/bin/step \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: smallstep/cli
    strip-prefix: v
    tag-filter-prefix: v0.31.
    use-tag: true
