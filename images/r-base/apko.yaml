contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - R

accounts:
  groups:
    - groupname: r
      gid: 65532
  users:
    - username: r
      uid: 65532
      gid: 65532
      homedir: /home/r
  run-as: 65532

cmd: /usr/bin/R

work-dir: /home/r

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  HOME: /home/r
  LANG: en_US.UTF-8

paths:
  - path: /home/r
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
