package:
  name: verity-datadog-operator
  # yamllint disable-line rule:line-length
  version: "1.31.2"  # renovate: datasource=github-releases depName=DataDog/datadog-operator versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Datadog Operator manager and secret backend helper
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: f840e8fa829ed3f3a827f177391e0c323a367b11

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    # Upstream builds static binaries with CGO_ENABLED=0 from the repository
    # go.work (root module plus ./api), which go/remediate also keeps in sync.
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DataDog/datadog-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd ./cmd/helpers

  - runs: |
      # Same version stamps as the upstream Makefile LDFLAGS. The build time is
      # the commit time so the binary does not depend on the build clock.
      build_time=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d/%H:%M:%S)
      pkg=github.com/DataDog/datadog-operator/pkg/version
      ldflags="-s -w -X $pkg.Version=${{package.version}}"
      ldflags="$ldflags -X $pkg.Commit=${{vars.source-commit}}"
      ldflags="$ldflags -X $pkg.BuildTime=$build_time"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/manager" ./cmd
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/helpers" ./cmd/helpers
      # The Go main module is the scan identity; it must carry the release version.
      for binary in manager helpers; do
        go version -m "${{targets.destdir}}/usr/bin/$binary" \
          | awk '$1 == "mod" && $2 == "github.com/DataDog/datadog-operator" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
      done
      "${{targets.destdir}}/usr/bin/manager" -version \
        | grep -Fx -- '- Version: ${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Datadog Operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/datadog-operator-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/datadog-operator-build/go.sum"
          install -Dm644 go.work "${{targets.subpkgdir}}/usr/share/datadog-operator-build/go.work"
          install -Dm644 go.work.sum "${{targets.subpkgdir}}/usr/share/datadog-operator-build/go.work.sum"
          install -Dm644 api/go.mod "${{targets.subpkgdir}}/usr/share/datadog-operator-build/api/go.mod"
          install -Dm644 api/go.sum "${{targets.subpkgdir}}/usr/share/datadog-operator-build/api/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        manager -version | grep -Fx -- '- Version: ${{package.version}}'
        helpers --help | grep -F 'read-secret'
        apk info --who-owns /usr/bin/manager | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: DataDog/datadog-operator
    strip-prefix: v
