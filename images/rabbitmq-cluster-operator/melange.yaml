package:
  name: rabbitmq-cluster-operator
  version: "2.23.0"
  epoch: 0
  description: RabbitMQ Cluster Operator for Kubernetes
  copyright:
    - license: MPL-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 3ad2b0ec0b43dbeb4b57c1142fc5c813a5716033
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd
  - runs: |
      go build -a -tags timetzdata -trimpath -ldflags="-s -w" -o manager ./cmd
      install -Dm755 manager "${{targets.destdir}}/usr/bin/manager"

test:
  pipeline:
    - runs: /usr/bin/manager --help
