package:
  name: rabbitmq-cluster-operator
  version: "2.22.4"
  epoch: 1
  description: RabbitMQ Cluster Operator for Kubernetes
  copyright:
    - license: MPL-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 346a71c43af3fae21c544e5bc09f7b347ca286ee
  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.82.1
  - runs: |
      go build -a -tags timetzdata -trimpath -ldflags="-s -w" -o manager ./cmd
      install -Dm755 manager "${{targets.destdir}}/usr/bin/manager"

test:
  pipeline:
    - runs: /usr/bin/manager --help
