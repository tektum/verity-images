contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - cassandra-5.0@local
    - openjdk-21-default-jvm
    - busybox

accounts:
  groups:
    - groupname: cassandra
      gid: 65532
  users:
    - username: cassandra
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/share/java/cassandra/bin/cassandra

cmd: -f

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  JVM_EXTRA_OPTS: -Djava.security.manager=allow
  PATH: /usr/share/java/cassandra/bin:/usr/lib/jvm/java-21-openjdk/bin:/usr/bin:/bin

paths:
  - path: /var/lib/cassandra
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/cassandra
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /var/lib/cassandra
