package:
  name: verity-kube-bench-0.11
  version: "0.16.0"
  epoch: 3  # Build kubectl from source
  description: Checks Kubernetes deployments against CIS benchmarks
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - busybox
      - ca-certificates-bundle
      - findutils
      - jq
      - openssl
      - procps
  resources:
    cpu: "4"
    memory: 8Gi
    disk: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - findutils
      - go-1.26
      - grep
      - python3
      - rsync
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aquasecurity/kube-bench
      tag: v${{package.version}}
      expected-commit: 5c6c22d51b926020e7414e1f1e051851d1a2feff
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - uses: go/build
    with:
      packages: .
      output: kube-bench
      go-package: go-1.26
      ldflags: |
        -X github.com/aquasecurity/kube-bench/cmd.cfgDir=/etc/kube-bench/cfg
        -X github.com/aquasecurity/kube-bench/cmd.KubeBenchVersion=v${{package.version}}
  - runs: |
      mkdir -p "${{targets.destdir}}/etc/kube-bench"
      cp -r cfg "${{targets.destdir}}/etc/kube-bench/"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/kubernetes
      tag: v1.36.5
      expected-commit: ad950d1cc78b0183c476bd4d3f1934c104229727
      destination: kubernetes
  - runs: chmod 755 kubernetes
  - uses: go/remediate
    working-directory: kubernetes
    with:
      modroot: .
      packages: ./cmd/kubectl
  - runs: |
      cd kubernetes
      export FORCE_HOST_GO=true
      export KUBE_GIT_TREE_STATE=clean
      make WHAT=cmd/kubectl
      install -m755 -D _output/bin/kubectl "${{targets.destdir}}/usr/bin/kubectl"
      tag=$(git describe --tags --exact-match)
      "${{targets.destdir}}/usr/bin/kubectl" version --client \
        | grep -F "Client Version: ${tag}"

subpackages:
  - name: verity-kube-bench-0.11-build-metadata
    description: Resolved Go module metadata for the kube-bench build
    pipeline:
      - runs: |
          install -m644 -D go.mod \
            "${{targets.subpkgdir}}/usr/share/kube-bench-build/go.mod"
          install -m644 -D go.sum \
            "${{targets.subpkgdir}}/usr/share/kube-bench-build/go.sum"
