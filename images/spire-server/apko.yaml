contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-spire-server@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /opt/spire/bin/spire-server run

work-dir: /opt/spire

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
  - path: /opt/spire/bin
    type: directory
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /opt/spire/bin/spire-server
    type: symlink
    source: /usr/bin/spire-server
    uid: 0
    gid: 0
  - path: /usr/bin/spire-server
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /etc/spire/server
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /run/spire/server/private
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /tmp/spire-server/private
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /var/lib/spire/server
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
