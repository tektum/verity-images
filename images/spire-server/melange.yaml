package:
  name: verity-spire-server
  # yamllint disable-line rule:line-length
  version: "1.15.5"  # renovate: datasource=github-releases depName=spiffe/spire versioning=regex:^(?<major>1)\.(?<minor>15)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: SPIRE server, the SPIFFE workload identity control plane
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: f62d747d56e9caa6a38ad4bcbc32dbcc3dc1399a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - python3
  environment:
    # The SQL datastore links the cgo SQLite driver, as in the upstream build.
    CGO_ENABLED: "1"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spiffe/spire
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/spire-server

  - runs: |
      flags="-s -w -X github.com/spiffe/spire/pkg/common/version.gittag=${{package.version}}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "$flags" \
        -o spire-server ./cmd/spire-server
      go version -m spire-server \
        | awk '$1 == "mod" && $2 == "github.com/spiffe/spire" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm755 spire-server "${{targets.destdir}}/usr/bin/spire-server"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: verity-spire-server-build-metadata
    description: Resolved Go module metadata for the SPIRE server build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/verity-spire-server-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/verity-spire-server-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spire-server --version 2>&1 | grep -Fx "${{package.version}}"
        spire-server run -h 2>&1 | grep -F -- '-config'
        apk info --who-owns /usr/bin/spire-server | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: spiffe/spire
    strip-prefix: v
    tag-filter: v1.15.
