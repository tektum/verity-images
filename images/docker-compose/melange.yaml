package:
  name: verity-docker-compose
  # yamllint disable-line rule:line-length
  version: "5.7.1"  # renovate: datasource=github-releases depName=docker/compose versioning=regex:^(?<major>5)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Docker Compose command line tool for multi-container applications
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  # The release tag is annotated; this is the peeled commit it points to.
  source-commit: fb1fd129f86828359335477f82821525201d4a8c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/docker/compose/v5/internal.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/docker-compose" ./cmd
      go version -m "${{targets.destdir}}/usr/bin/docker-compose" \
        | awk '$1 == "mod" && $2 == "github.com/docker/compose/v5" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Docker Compose build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/docker-compose-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/docker-compose-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        docker-compose version | grep -Fx 'Docker Compose version v${{package.version}}'
        apk info --who-owns /usr/bin/docker-compose \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter-prefix: v5.
    use-tag: true
