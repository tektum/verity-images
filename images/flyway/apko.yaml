contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-flyway@local

accounts:
  groups:
    - groupname: flyway
      gid: 65532
  users:
    - username: flyway
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /flyway/flyway

cmd: -?

work-dir: /flyway

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  LANG: en_US.UTF-8
  PATH: /flyway:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
