contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - varnish-9.1@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/varnishd -F -j none -n /var/lib/varnish -a :8080 -f /etc/varnish/default.vcl

environment:
  PATH: /usr/bin:/bin
  TMPDIR: /var/lib/varnish

paths:
  - path: /etc/varnish
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/varnish
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
