package:
  name: verity-minio
  version: "2026.09.16"
  epoch: 0
  description: MinIO object storage server
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgsty/silo
      tag: RELEASE.${{package.version}}T00-00-00Z
      expected-commit: 2a4d51406b7ed87af5fe6fe0f801f3290f96eb3c
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/minio
  - runs: |
      flags="-s -w"
      go build -trimpath -ldflags "$flags" -o minio ./cmd/minio
      install -m755 -D minio "${{targets.destdir}}/usr/bin/minio"
      install -m644 -D LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: verity-minio-build-metadata
    description: Resolved Go module metadata for the MinIO build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/minio-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/minio-build/go.sum"

test:
  pipeline:
    - runs: |
        /usr/bin/minio --version 2>&1 | grep -q RELEASE
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: pgsty/silo
    use-tag: true
