contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-minio@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/minio

cmd:
  - server
  - /data

environment:
  PATH: /usr/bin:/bin
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

volumes:
  - /data
