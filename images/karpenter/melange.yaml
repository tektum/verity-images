package:
  name: karpenter-1.11
  version: "1.14.1"
  # Matches verity-org/verity's pinned revision, which supersedes the
  # vulnerable public 1.14.1-r0 package for this same source commit.
  epoch: 7
  description: Karpenter is a Kubernetes Node Autoscaler built for flexibility, performance, and simplicity.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  # Pinned to verity-org/verity@96ae1121b1ee73f1e1ab42421804e441e3c155b8:packages/bespoke/karpenter-1.11.yaml,
  # which is adapted from wolfi-dev/os@2c0385b38bd6869a0e928363916e7a7148a1acaf.
  - uses: git-checkout
    with:
      repository: https://github.com/aws/karpenter-provider-aws
      tag: v${{package.version}}
      expected-commit: bde00654cd316fddb3dccfba3f5ac07039865429
  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.58.0
        golang.org/x/text@v0.39.0
  - uses: go/build
    with:
      go-package: go-1.26
      packages: ./cmd/controller
      output: controller
      ldflags: -X=sigs.k8s.io/karpenter/pkg/operator.Version=${{package.version}}
  - runs: |
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /usr/bin/controller --help >/dev/null
        grep -aF "${{package.version}}" /usr/bin/controller
        apk info --who-owns /usr/bin/controller | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: aws/karpenter-provider-aws
    tag-filter-prefix: v1.11.
    strip-prefix: v
