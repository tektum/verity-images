package:
  name: verity-bat
  version: "0.26.1"
  epoch: 0
  description: Syntax-highlighting cat replacement
  copyright:
    - license: MIT OR Apache-2.0
  resources:
    cpu: "4"
    memory: 7Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - glibc-2.44-dev
      - rust-1.94
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sharkdp/bat
      tag: v${{package.version}}
      expected-commit: 979ba22628bc9d8171f2cffca2bd5c90c9fc0a9e
  - runs: |
      omnibump --language rust --dir . \
        --packages "plist@1.7.0=1.10.0 git2@0.20.2=0.20.4" \
        --fail-on-unapplied-pins --features application,git
  - uses: cargo/remediate
    with:
      features: application git
  - runs: |
      cargo auditable build --release --locked
      install -m755 -D target/release/bat "${{targets.destdir}}/usr/bin/bat"
      rm -rf .cargo
  - uses: strip

test:
  pipeline:
    - runs: /usr/bin/bat --version
