package:
  name: verity-configurable-http-proxy
  # yamllint disable-line rule:line-length
  version: "5.4.0"  # renovate: datasource=github-tags depName=jupyterhub/configurable-http-proxy versioning=regex:^(?<major>5)\.(?<minor>\d+)\.(?<patch>\d+)$
  epoch: 0
  description: JupyterHub configurable-http-proxy with production npm dependencies from the upstream lockfile
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      # /bin/sh, env and printenv for the upstream chp-docker-entrypoint wrapper.
      - busybox
      - ca-certificates-bundle
      # Upstream's Dockerfile builds on node:24-alpine.
      - nodejs-24
      - wolfi-baselayout
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: fb02665d62ca333ecbabba8e83ea42e0a5c9de21
  # Upstream's Dockerfile installs into this directory and its entrypoint
  # wrapper resolves configurable-http-proxy from its bin directory.
  prefix: /srv/configurable-http-proxy

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-24
      - npm
  environment:
    npm_config_cache: /var/cache/melange/npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyterhub/configurable-http-proxy
      tag: ${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # Upstream's Dockerfile runs `npm ci --omit=dev` from the committed lockfile.
  # No production dependency has an install script, so none are run.
  - runs: |
      set -eu
      test "$(node -p 'require("./package.json").version')" = '${{package.version}}'
      npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      app="${{targets.destdir}}${{vars.prefix}}"
      # The runtime files are the package's published "files" plus the
      # container entrypoint wrapper; tests and dev tooling stay out.
      install -d "$app/lib/error"
      install -m644 package.json index.js "$app/"
      install -m644 lib/*.js "$app/lib/"
      install -m644 lib/error/*.html "$app/lib/error/"
      install -Dm755 bin/configurable-http-proxy "$app/bin/configurable-http-proxy"
      install -m755 chp-docker-entrypoint "$app/chp-docker-entrypoint"
      cp -R node_modules "$app/node_modules"
      test ! -e "$app/node_modules/jasmine"
      test ! -e "$app/node_modules/c8"
      install -d "${{targets.destdir}}/usr/bin"
      ln -s "${{vars.prefix}}/bin/configurable-http-proxy" \
        "${{targets.destdir}}/usr/bin/configurable-http-proxy"
      ln -s "${{vars.prefix}}/chp-docker-entrypoint" \
        "${{targets.destdir}}/usr/bin/chp-docker-entrypoint"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved npm dependency metadata for the configurable-http-proxy build
    pipeline:
      - runs: |
          install -Dm644 package-lock.json \
            "${{targets.subpkgdir}}/usr/share/configurable-http-proxy-build/package-lock.json"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        test "$(configurable-http-proxy --version)" = '${{package.version}}'
        test "$(chp-docker-entrypoint --version)" = '${{package.version}}'
        apk info --who-owns ${{vars.prefix}}/bin/configurable-http-proxy \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx BSD-3-Clause
        grep -F 'BSD 3-Clause License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: jupyterhub/configurable-http-proxy
    tag-filter-prefix: "5."
    use-tag: true
