package:
  name: verity-k8sgpt-operator
  # yamllint disable-line rule:line-length
  version: "0.2.29"  # renovate: datasource=github-releases depName=k8sgpt-ai/k8sgpt-operator versioning=semver extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes operator for K8sGPT
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: a141cf9d7a232299fa6a86a4200e31ee2789d0b5

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8sgpt-ai/k8sgpt-operator
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/manager" ./cmd
      go version -m "${{targets.destdir}}/usr/bin/manager" \
        | awk '$1 == "mod" && $2 == "github.com/k8sgpt-ai/k8sgpt-operator" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the k8sgpt-operator build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/k8sgpt-operator-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/k8sgpt-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
        - go-1.26
  pipeline:
    - runs: |
        go version -m /usr/bin/manager \
          | awk '$1 == "mod" && $2 == "github.com/k8sgpt-ai/k8sgpt-operator" { print $3 }' \
          | grep -Ex 'v${{package.version}}(\+dirty)?'
        apk info --who-owns /usr/bin/manager \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: k8sgpt-ai/k8sgpt-operator
    strip-prefix: v
