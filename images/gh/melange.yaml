package:
  name: verity-gh
  # yamllint disable-line rule:line-length
  version: "2.104.0"  # renovate: datasource=github-releases depName=cli/cli versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: GitHub's official command line tool
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - git
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 3d5a9e355a837f2f5ee78d7484c118cc1342ad1a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cli/cli
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/gh

  - runs: |
      build_date=$(date -u -d "@$(git log -1 --format=%ct)" +%F)
      build_pkg=github.com/cli/cli/v2/internal/build
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X $build_pkg.Version=${{package.version}} -X $build_pkg.Date=$build_date" \
        -o "${{targets.destdir}}/usr/bin/gh" ./cmd/gh
      go version -m "${{targets.destdir}}/usr/bin/gh" \
        | awk '$1 == "mod" && $2 == "github.com/cli/cli/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/gh" --version | grep -F 'gh version ${{package.version}} '
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the gh build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/gh-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/gh-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        gh --version | grep -F 'gh version ${{package.version}} '
        gh --help >/dev/null
        gh completion --shell bash | grep -F '__start_gh' >/dev/null
        apk info --who-owns /usr/bin/gh \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cli/cli
    strip-prefix: v
    tag-filter-prefix: v2.
    use-tag: true
