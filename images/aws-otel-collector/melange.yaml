package:
  name: verity-aws-otel-collector
  # yamllint disable-line rule:line-length
  version: "0.51.0"  # renovate: datasource=github-releases depName=aws-observability/aws-otel-collector versioning=regex:^(?<major>0)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: AWS Distro for OpenTelemetry (ADOT) Collector
  copyright:
    - license: Apache-2.0
  # The collector links the OpenTelemetry Collector core, a large slice of the
  # contrib components, and both AWS SDKs into one binary; size the build like
  # amazon-cloudwatch-agent.
  resources:
    cpu: "16"
    memory: 32Gi

vars:
  source-commit: a7de7aa1873d9d4073fd2edaa822a78409c6c7ce
  # GHSA-q7gw-24fr-5p69 is fixed in otel/sdk, otel/trace, and otel/sdk/log v1.47.0,
  # GHSA-8wmf-6v46-5gfg in the otlptrace exporters v1.45.0, and GHSA-w34q-cm8f-9c5x
  # in otlploggrpc v0.21.0. otel v1.47.0 requires otel/log v1.47.0, which the v0.20
  # log exporters and the otelzap v0.19 bridge no longer compile against, so their
  # matching releases are raised with it.
  otel-floor: v1.47.0  # renovate: datasource=go depName=go.opentelemetry.io/otel/sdk
  # yamllint disable-line rule:line-length
  otel-log-exporter-floor: v0.23.0  # renovate: datasource=go depName=go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc
  otelzap-floor: v0.21.0  # renovate: datasource=go depName=go.opentelemetry.io/contrib/bridges/otelzap
  # Thrift is indirect (jaeger and zipkin receivers); its v0.25.0 fixes are not in the Go
  # vulnerability or OSV module feeds that go/remediate reads.
  thrift-floor: v0.25.0  # renovate: datasource=go depName=github.com/apache/thrift

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws-observability/aws-otel-collector
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  # Upstream builds from its committed vendor tree, so its go.sum was never
  # checked against the checksum database for the alertmanager zip: the recorded
  # h1 hash differs from sum.golang.org, although the vendored
  # api/v2/models package is byte-identical to the proxy's v0.33.0. Remediation
  # resolves modules in -mod=mod, so drop the stale line and record the hash
  # verified by sum.golang.org before anything downloads it.
  - runs: |
      sed -i '\#^github.com/prometheus/alertmanager v[^ ]* h1:#d' go.sum
      GOFLAGS=-mod=mod go mod download github.com/prometheus/alertmanager
      grep -E '^github.com/prometheus/alertmanager v[^ ]+ h1:' go.sum
  # Security floors, raised before remediation so it builds against them. The
  # vendor tree is resynced so govulncheck can load packages in vendor mode.
  - runs: |
      export GOFLAGS=-mod=mod
      raise_floor() {
        current="$(go list -m -f '{{.Version}}' "$1")"
        if awk -v have="$current" -v want="$2" 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
          }
          exit (have ~ /-/) ? 0 : 1
        }'; then
          go get "$1@$2"
        fi
      }
      for module in go.opentelemetry.io/otel go.opentelemetry.io/otel/trace \
        go.opentelemetry.io/otel/sdk go.opentelemetry.io/otel/log go.opentelemetry.io/otel/sdk/log \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp; do
        raise_floor "$module" ${{vars.otel-floor}}
      done
      for module in go.opentelemetry.io/otel/exporters/stdout/stdoutlog \
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc \
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp; do
        raise_floor "$module" ${{vars.otel-log-exporter-floor}}
      done
      raise_floor go.opentelemetry.io/contrib/bridges/otelzap ${{vars.otelzap-floor}}
      raise_floor github.com/apache/thrift ${{vars.thrift-floor}}
      # Record checksums for packages the raised modules newly import, then vendor.
      go list -deps ./cmd/awscollector ./cmd/healthcheck >/dev/null
      go mod vendor
  # Upstream CI applies patches/signalfxexporter.patch to vendor/ before every
  # build; go/remediate regenerates vendor/ and reapplies it.
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/awscollector ./cmd/healthcheck
      vendor-patches: patches/signalfxexporter.patch
  # Same flags as the upstream Makefile (GOBUILD and LDFLAGS) for the aoc and
  # healthcheck binaries. Date is the source commit time rather than the wall
  # clock so the build is reproducible. Layout follows cmd/awscollector/Dockerfile:
  # /awscollector, /healthcheck, config.yaml as /etc/otel-config.yaml, and the
  # config/ tree (ECS, EKS, App Runner presets) under /etc.
  - runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      grep -Fx 'v${{package.version}}' VERSION
      signalfx=vendor/github.com/open-telemetry/opentelemetry-collector-contrib/exporter/signalfxexporter
      if grep -q SendOTLPHistograms "$signalfx/config.go"; then
        echo 'patches/signalfxexporter.patch is not applied to vendor/' >&2
        exit 1
      fi
      module=github.com/aws-observability/aws-otel-collector
      build_date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      ldflags="-s -w -X ${module}/tools/version.GitHash=${{vars.source-commit}}"
      ldflags="$ldflags -X ${module}/tools/version.Version=v${{package.version}}"
      ldflags="$ldflags -X ${module}/tools/version.Date=${build_date}"
      for cmd in awscollector healthcheck; do
        go build -mod=vendor -trimpath -buildvcs=false -ldflags="$ldflags" \
          -o "${{targets.destdir}}/$cmd" "./cmd/$cmd"
        go version -m "${{targets.destdir}}/$cmd" | awk '$1 == "path" { print $2 }' \
          | grep -Fx "${module}/cmd/$cmd"
      done
      # Every invocation logs the stamped version before flag parsing.
      { "${{targets.destdir}}/awscollector" --help 2>&1 || true; } \
        | grep -F 'ADOT Collector version: v${{package.version}}'
      install -Dm644 config.yaml "${{targets.destdir}}/etc/otel-config.yaml"
      (cd config && find . -type f -name '*.yaml') | while read -r file; do
        install -Dm644 "config/$file" "${{targets.destdir}}/etc/$file"
      done
      license_dir="${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      install -Dm644 LICENSE "$license_dir/LICENSE"
      install -Dm644 NOTICE "$license_dir/NOTICE"
      install -Dm644 THIRD-PARTY-LICENSES.txt "$license_dir/THIRD-PARTY-LICENSES.txt"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the aws-otel-collector build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/aws-otel-collector-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"
          install -Dm644 vendor/modules.txt "$dir/modules.txt"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        { /awscollector --help 2>&1 || true; } \
          | grep -F 'ADOT Collector version: v${{package.version}}'
        if /healthcheck -port 0 >/tmp/healthcheck.out 2>&1; then
          echo 'healthcheck accepted port 0' >&2
          exit 1
        fi
        grep -F 'port outside of range' /tmp/healthcheck.out
        grep -F 'awsxray:' /etc/otel-config.yaml
        test -s /etc/ecs/ecs-default-config.yaml
        test -s /etc/eks/prometheus/config-all.yaml
        test -s /etc/apprunner/apprunner-default-config.yaml
        apk info --who-owns /awscollector | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: aws-observability/aws-otel-collector
    strip-prefix: v
