package:
  name: verity-ratify
  # yamllint disable-line rule:line-length
  version: "1.4.8"  # renovate: datasource=github-releases depName=ratify-project/ratify versioning=regex:^v?(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Artifact verification CLI and policy engine for container supply chains
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: bee965470e98895dd9e9180642cf526c4d5a0450

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ratify-project/ratify
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/ratify
  - runs: |
      # Match the upstream goreleaser stamp: tag without the v prefix and full commit.
      mod=github.com/ratify-project/ratify
      ldflags="-s -w -X $mod/internal/version.GitTag=${{package.version}}"
      ldflags="$ldflags -X $mod/internal/version.GitCommitHash=${{vars.source-commit}}"
      go build -p 4 -mod=readonly -trimpath -buildvcs=false -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/ratify" ./cmd/ratify
      "${{targets.destdir}}/usr/bin/ratify" version \
        | grep -Ex 'Version: +${{package.version}}'
      "${{targets.destdir}}/usr/bin/ratify" version \
        | grep -Ex 'Git commit: +${{vars.source-commit}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -Dm644 NOTICE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/NOTICE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the ratify build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/ratify-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/ratify-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        ratify version | grep -Ex 'Version: +${{package.version}}'
        ratify verify --help | grep -F -- '--subject'
        apk info --who-owns /usr/bin/ratify \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: ratify-project/ratify
    tag-filter-prefix: v1.
    strip-prefix: v
