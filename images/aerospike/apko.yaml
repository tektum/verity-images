contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - verity-aerospike@local

accounts:
  run-as: 65532

# Upstream image layout: asd reads /etc/aerospike/aerospike.conf, serves
# clients on 3000, fabric on 3001 and mesh heartbeat on 3002, and keeps data
# under /opt/aerospike. --fgdaemon keeps it in the foreground as PID 1; extra
# arguments (for example --config-file) are appended.
entrypoint:
  command: /usr/bin/asd --fgdaemon

environment:
  PATH: /usr/bin:/bin

annotations:
  org.opencontainers.image.licenses: AGPL-3.0-or-later

paths:
  - path: /opt/aerospike
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aerospike/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750
  - path: /opt/aerospike/smd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o750
  - path: /opt/aerospike/usr
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aerospike/usr/udf
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /opt/aerospike/usr/udf/lua
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/run/aerospike
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/aerospike
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

work-dir: /opt/aerospike
