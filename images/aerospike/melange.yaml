package:
  name: verity-aerospike
  # Upstream also pushes bare numeric tags (8.2.0.1 and others), but those are
  # lightweight tags on master that do not carry the release source; only the
  # annotated v-prefixed tags point at release commits.
  # yamllint disable-line rule:line-length
  version: "8.2.0.0"  # renovate: datasource=github-tags depName=aerospike/aerospike-server versioning=regex:^(?<major>8)\.(?<minor>2)\.(?<patch>\d+)\.(?<build>\d+)$ extractVersion=^v(?<version>\d+\.\d+\.\d+\.\d+)$
  epoch: 0
  description: Aerospike Database Server Community Edition built from the upstream release tag
  copyright:
    # Server sources: "either version 3 of the License, or (at your option) any
    # later version". modules/common and modules/mod-lua are Apache-2.0; the
    # statically linked third-party modules carry their own permissive
    # licenses, listed in LICENSE and LICENSE.3rdParty.
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - wolfi-baselayout
  resources:
    cpu: "16"
    memory: 32Gi
  test-resources:
    cpu: "1"
    memory: 2Gi

vars:
  # v8.2.0.0 is an annotated tag; this is its peeled commit.
  source-commit: edb3ccb2ab105bb9301c690915346b29548577e3

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - curl-dev
      - git
      # On aarch64 the build compiles the upstream "tso" GCC plugin, whose
      # plugin headers include gmp.h.
      - gmp-dev
      - libtool
      - linux-headers
      - openssl-dev
      - python3
      - zlib-dev
  environment:
    # gen_version otherwise POSTs build metadata to build.aerospike.com.
    AEROSPIKE_TELEMETRY: "FALSE"
    # The v8.2.0.0 tree pins modules/jemalloc at c80c613a, which
    # aerospike/jemalloc does not advertise ("not our ref"). The same commit is
    # served by the jemalloc/jemalloc fork network, so fetch it from there. The
    # superproject gitlink still pins the exact commit; only the transport
    # changes. Its only delta from the public asd-4.5.0 branch (8c87a080) is
    # tracking VERSION in configure.ac.
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: url.https://github.com/jemalloc/jemalloc.git.insteadOf
    GIT_CONFIG_VALUE_0: https://github.com/aerospike/jemalloc.git

pipeline:
  # Every bundled library (abseil, s2geometry, ICU, PCRE2, jemalloc, Lua,
  # jansson, yaml-cpp, nlohmann json and json-schema-validator, libbacktrace,
  # simde, aerospike-common, mod-lua) is a submodule pinned by this commit.
  - uses: git-checkout
    with:
      repository: https://github.com/aerospike/aerospike-server
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
      recurse-submodules: true
      shallow-submodules: true
      submodule-jobs: 8

  - runs: |
      # build/version stamps the binary from the nearest numeric tag on a
      # release line. The shallow checkout only holds the v-prefixed tag, so
      # add the numeric spelling locally and select the release-line format.
      git tag -f "${{package.version}}" HEAD
      export AEROSPIKE_VERSION_FORCE_BRANCH="hotfix/v${{package.version}}"
      test "$(bash build/version -v)" = "${{package.version}}"

      # No EEREPO: the Community Edition sources only. CMake's GNUInstallDirs
      # installs abseil into lib64 on Wolfi; upstream selects that directory
      # only for the RHEL family, so name it here.
      make -j"$(nproc)" EDITION=community \
        ABSL_LIB_DIR="$(pwd)/modules/abseil-cpp/installation/lib64"

      bin="target/Linux-$(uname -m)/bin/asd"
      "$bin" --version | grep -F "Aerospike Community Edition build ${{package.version}}"

      install -Dm755 "$bin" "${{targets.destdir}}/usr/bin/asd"
      install -Dm644 as/opt/schema/aerospike_config_schema.json \
        "${{targets.destdir}}/opt/aerospike/schema/aerospike_config_schema.json"
      for f in LICENSE LICENSE-AGPL LICENSE-APACHE LICENSE.3rdParty; do
        install -Dm644 "$f" "${{targets.destdir}}/opt/aerospike/doc/$f"
      done
      install -Dm644 LICENSE "${{targets.destdir}}/licenses/LICENSE"

  - runs: |
      # The rendered default of the upstream image template
      # (aerospike-server.docker, releases/8.2/community): one node, namespace
      # "test" on a 4 GiB file under /opt/aerospike/data, console logging.
      install -d "${{targets.destdir}}/etc/aerospike"
      cat > "${{targets.destdir}}/etc/aerospike/aerospike.conf" <<'EOF'
      # Aerospike database configuration file.
      # Single-node, single-namespace layout matching the upstream image
      # defaults. Mount your own file over this path or pass --config-file.

      service {
          cluster-name docker
      }

      logging {
          console {
              context any info
          }
      }

      network {
          service {
              address any
              port 3000
          }

          heartbeat {
              mode mesh
              address local
              port 3002
              interval 150
              timeout 10
          }

          fabric {
              address local
              port 3001
          }
      }

      namespace test {
          replication-factor 1
          nsup-period 120

          storage-engine device {
              file /opt/aerospike/data/test.dat
              filesize 4G
              read-page-cache true
          }
      }
      EOF
      chmod 644 "${{targets.destdir}}/etc/aerospike/aerospike.conf"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        asd --version | grep -F "Aerospike Community Edition build ${{package.version}}"
        apk info --who-owns /usr/bin/asd | grep -F "${{package.name}}-${{package.full-version}}"
