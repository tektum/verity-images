contents:
  repositories:
    - "@LOCAL_REPOSITORY@"
    - https://tektum.github.io/verity-images/apk
    - https://packages.wolfi.dev/os
  keyring:
    - "@LOCAL_KEY@"
    - "@REPOSITORY_KEY@"
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - go-fips-entrypoint@local
    - ca-certificates-bundle
    - verity-go-1.25@local
    - openssl
    - openssl-fips-provider=3.1.2-r3

entrypoint:
  command: /usr/bin/go-fips-entrypoint

environment:
  GOFIPS140: v1.0.0
  OPENSSL_FIPS_RUNTIME_DIR: /run/openssl-fips
  PATH: /usr/bin:/bin

paths:
  - path: /run/openssl-fips
    type: directory
    permissions: 0o1777
