package:
  name: verity-go-1.26
  version: "1.26.11"  # renovate: datasource=golang-version depName=go
  epoch: 0
  description: Go toolchain packaged from the pinned upstream release archive
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - build-base
  options:
    # The official toolchain archive contains foreign ELF fixtures under src/debug/elf/testdata.
    # They are compiler test inputs, not runtime dependencies of the packaged toolchain.
    no-depends: true

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - runs: |
      case "${{build.arch}}" in
        x86_64)
          archive=go${{package.version}}.linux-amd64.tar.gz
          sha256=9849f4e04ee35303714e34fbc3ac8ab44ea3e448a95aa182f91e3b9b79c710ec
          ;;
        aarch64)
          archive=go${{package.version}}.linux-arm64.tar.gz
          sha256=6c2f29b458b5add0835f18b776f69c8881a6d88428f1484a6da55755e620757e
          ;;
        *) exit 1 ;;
      esac
      wget -q -O "/tmp/$archive" "https://go.dev/dl/$archive"
      printf '%s  /tmp/%s\n' "$sha256" "$archive" | sha256sum -c -
      install -d "${{targets.destdir}}/usr/lib" "${{targets.destdir}}/usr/bin"
      tar -xzf "/tmp/$archive" -C "${{targets.destdir}}/usr/lib"
      ln -s ../lib/go/bin/go "${{targets.destdir}}/usr/bin/go"
      ln -s ../lib/go/bin/gofmt "${{targets.destdir}}/usr/bin/gofmt"

subpackages:
  - name: go-fips-entrypoint
    description: FIPS activation entrypoint for Go images
    pipeline:
      - runs: |
          install -m755 -D fips-entrypoint "${{targets.subpkgdir}}/usr/bin/go-fips-entrypoint"

test:
  pipeline:
    - runs: |
        test "$(go version | awk '{print $3}')" = "go${{package.version}}"
        test "$(go env GOROOT)" = /usr/lib/go
