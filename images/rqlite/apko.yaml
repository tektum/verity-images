contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - rqlite-8@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/rqlited

cmd: /rqlite/data

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /rqlite/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

volumes:
  - /rqlite/data
