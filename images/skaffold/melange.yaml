package:
  name: verity-skaffold
  # yamllint disable-line rule:line-length
  version: "2.25.0"  # renovate: datasource=github-releases depName=GoogleContainerTools/skaffold versioning=regex:^(?<major>2)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Command line tool for continuous development of Kubernetes applications
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: d915e113210eb7590ccbc8363aeab38053172ab3

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleContainerTools/skaffold
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/skaffold

  - runs: |
      # Same stamps and release tags as the upstream Makefile; the build date is
      # the pinned commit's timestamp. Upstream links statically with cgo; the
      # osusergo and netgo tags already select the pure Go resolvers, so this
      # build is a static pure Go binary.
      build_date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      bin="${{targets.destdir}}/usr/bin/skaffold"
      pkg=github.com/GoogleContainerTools/skaffold/v2/pkg/skaffold/version
      stamp="-X $pkg.version=v${{package.version}} -X $pkg.gitCommit=${{vars.source-commit}}"
      stamp="$stamp -X $pkg.buildDate=$build_date"
      go build -mod=vendor -trimpath -buildvcs=true \
        -tags 'timetzdata osusergo netgo static_build release' \
        -ldflags="-s -w $stamp" -o "$bin" ./cmd/skaffold
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "github.com/GoogleContainerTools/skaffold/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the skaffold build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/skaffold-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/skaffold-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        skaffold version | grep -Fx 'v${{package.version}}'
        apk info --who-owns /usr/bin/skaffold \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: GoogleContainerTools/skaffold
    strip-prefix: v
    use-tag: true
