package:
  name: verity-spiffe-helper
  # yamllint disable-line rule:line-length
  version: "0.12.3"  # renovate: datasource=github-releases depName=spiffe/spiffe-helper versioning=regex:^(?<major>0)\.(?<minor>12)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: SPIFFE Workload API helper that writes X.509 and JWT SVIDs to disk
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 198ef4e4c8e5893027d2dbcd8e2210936e19057c

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spiffe/spiffe-helper
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/spiffe-helper
  - runs: |
      # Same version stamping as the upstream Makefile release build.
      version_pkg=github.com/spiffe/spiffe-helper/pkg/version
      githash=$(git rev-parse --short=7 HEAD)
      ldflags="-s -w -X ${version_pkg}.gittag=${{package.version}} -X ${version_pkg}.githash=${githash}"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="$ldflags" \
        -o "${{targets.destdir}}/usr/bin/spiffe-helper" ./cmd/spiffe-helper
      go version -m "${{targets.destdir}}/usr/bin/spiffe-helper" \
        | awk '$1 == "mod" && $2 == "github.com/spiffe/spiffe-helper" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the spiffe-helper build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/spiffe-helper-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/spiffe-helper-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spiffe-helper -version | grep -Fx '${{package.version}}'
        apk info --who-owns /usr/bin/spiffe-helper \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: spiffe/spiffe-helper
    strip-prefix: v
