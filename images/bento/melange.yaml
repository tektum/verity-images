package:
  name: verity-bento
  version: "1.23.0"  # renovate: datasource=github-releases depName=warpstreamlabs/bento
  epoch: 0
  description: Declarative stream processor
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 16Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOFLAGS: -p=4

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/warpstreamlabs/bento
      tag: v${{package.version}}
      expected-commit: 680288a8c44be4d24abc018ad38adaec40b994ae
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/bento
  - runs: |
      flags="-s -w -X main.Version=${{package.version}}"
      go build -trimpath -ldflags "$flags" -o bento.bin ./cmd/bento
      install -m755 -D bento.bin "${{targets.destdir}}/usr/bin/bento"
      install -m644 -D LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: verity-bento-build-metadata
    description: Resolved Go module metadata for the bento build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/bento-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/bento-build/go.sum"

test:
  pipeline:
    - runs: |
        /usr/bin/bento --version | grep -Fx 'Version: ${{package.version}}'
        test -s /usr/share/licenses/${{package.name}}/LICENSE
