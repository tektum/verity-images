package:
  name: verity-opensearch-3
  # yamllint disable-line rule:line-length
  version: "3.9.0"  # renovate: datasource=maven depName=org.opensearch:opensearch versioning=regex:^(?<major>3)\.(?<minor>\d+)\.(?<patch>\d+)$
  epoch: 0
  description: OpenSearch distributed search and analytics engine
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - glibc-locale-en
      - grep
      - openjdk-21-default-jvm
      - sed

# Security floors for bundled dependencies OpenSearch 3.9.0 pins below their fixed releases.
vars:
  # yamllint disable rule:line-length
  guava: 33.8.0-jre  # renovate: datasource=maven depName=com.google.guava:guava versioning=regex:^(?<major>33)\.(?<minor>\d+)\.(?<patch>\d+)-jre$
  jackson2: 2.22.4  # renovate: datasource=maven depName=com.fasterxml.jackson.core:jackson-databind versioning=regex:^(?<major>2)\.(?<minor>22)\.(?<patch>\d+)$
  jackson3: 3.2.4  # renovate: datasource=maven depName=tools.jackson.core:jackson-core versioning=regex:^(?<major>3)\.(?<minor>2)\.(?<patch>\d+)$
  # yamllint enable rule:line-length

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - openjdk-21-default-jdk
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    # Keep Gradle state out of the workspace, which melange must read back after the build.
    GRADLE_USER_HOME: /var/cache/gradle
    # Gradle resolves several thousand artifacts; retry slow or dropped downloads.
    JAVA_TOOL_OPTIONS: >-
      -Djava.net.preferIPv4Stack=true
      -Dorg.gradle.internal.http.connectionTimeout=120000
      -Dorg.gradle.internal.http.socketTimeout=120000
      -Dorg.gradle.internal.repository.max.retries=10
      -Dorg.gradle.internal.repository.initial.backoff=2000

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opensearch-project/OpenSearch
      tag: ${{package.version}}
      expected-commit: 4ee42a94e87f66fbf1e62a9871b1b87f91e02472
  - runs: |
      # Resolve Maven Central through Google's mirror, which the build hosts reach reliably
      # (the same mirror images/cassandra uses).
      mirror=https://maven-central.storage-download.googleapis.com/maven2/
      install -d "$GRADLE_USER_HOME/init.d"
      cat >"$GRADLE_USER_HOME/init.d/mirror.gradle" <<EOF
      def mirror = '$mirror'
      def redirect = { repos ->
        repos.withType(MavenArtifactRepository).configureEach { repo ->
          if (repo.url.toString().startsWith('https://repo.maven.apache.org/maven2')) {
            repo.url = mirror
          }
        }
      }
      beforeSettings { settings -> redirect(settings.pluginManagement.repositories) }
      allprojects { project -> redirect(project.repositories) }
      EOF
      cat >"$GRADLE_USER_HOME/init.d/floors.gradle" <<'EOF'
      // Raise a requested version to its floor, never lower it, and stay on the floor's line.
      def parts = { String v -> v.tokenize('.-').collect { it.isInteger() ? it.toInteger() : 0 } }
      def lower = { String a, String b ->
        def x = parts(a), y = parts(b)
        for (i in 0..<Math.max(x.size(), y.size())) {
          def l = i < x.size() ? x[i] : 0, r = i < y.size() ? y[i] : 0
          if (l != r) return l < r
        }
        false
      }
      def floorFor = { String group, String name ->
        if (group == 'com.google.guava' && name == 'guava') return '${{vars.guava}}'
        if (group.startsWith('com.fasterxml.jackson.') && name != 'jackson-annotations') return '${{vars.jackson2}}'
        if (group.startsWith('tools.jackson.')) return '${{vars.jackson3}}'
        null
      }
      allprojects {
        configurations.configureEach {
          resolutionStrategy.eachDependency { details ->
            def floor = floorFor(details.requested.group, details.requested.name)
            def requested = details.requested.version
            if (floor && requested && parts(requested)[0] == parts(floor)[0] && lower(requested, floor)) {
              details.useVersion(floor)
            }
          }
        }
      }
      EOF
      case "$(uname -m)" in
        x86_64) dist=no-jdk-linux-tar; classifier=no-jdk-linux-x64 ;;
        aarch64) dist=no-jdk-linux-arm64-tar; classifier=no-jdk-linux-arm64 ;;
        *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
      esac
      ./gradlew --no-daemon -Dbuild.snapshot=false ":distribution:archives:$dist:assemble"
      tar -xzf "distribution/archives/$dist/build/distributions/opensearch-min-${{package.version}}-$classifier.tar.gz"
      install -d "${{targets.destdir}}/usr/share" "${{targets.destdir}}/licenses"
      # Fail if a floor matched nothing or a shipped jar is still below its floor.
      for floor in guava:${{vars.guava}} jackson-databind:${{vars.jackson2}} jackson-core:${{vars.jackson3}}; do
        name=${floor%%:*} minimum=${floor#*:}
        found=$(find "opensearch-${{package.version}}" -name "$name-[0-9]*.jar" |
          sed "s|.*/$name-||; s|\.jar$||" | grep "^${minimum%%.*}\." | sort -u)
        [ -n "$found" ] || { echo "dependency set changed: no $name ${minimum%%.*}.x jar" >&2; exit 1; }
        for version in $found; do
          [ "$(printf '%s\n%s\n' "$minimum" "$version" | sort -V | head -n1)" = "$minimum" ] ||
            { echo "$name $version is below floor $minimum" >&2; exit 1; }
        done
      done
      mv "opensearch-${{package.version}}" "${{targets.destdir}}/usr/share/opensearch"
      # Listen beyond loopback, as the upstream container image does.
      printf '\nnetwork.host: 0.0.0.0\n' >>"${{targets.destdir}}/usr/share/opensearch/config/opensearch.yml"
      install -m644 LICENSE.txt "${{targets.destdir}}/licenses/LICENSE.txt"
      install -m644 NOTICE.txt "${{targets.destdir}}/licenses/NOTICE.txt"
      find . -name .gradle -type d -prune -exec rm -rf {} +
      # Gradle leaves owner-only directories that melange cannot read back from the workspace.
      chmod -R a+rX .

test:
  environment:
    contents:
      packages:
        - openjdk-21-default-jvm
    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
      OPENSEARCH_JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  pipeline:
    - runs: /usr/share/opensearch/bin/opensearch --version

update:
  enabled: true
  github:
    identifier: opensearch-project/OpenSearch
    use-tag: true
    tag-filter-prefix: "3."
