package:
  name: cmctl-2.6
  version: "2.6.2"
  epoch: 0
  description: cert-manager command line tool
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: 1fe7c19102fe47563c7968455541db4c2a2c8bce

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/cmctl
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w \
          -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}} \
          -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=${{vars.source-commit}} \
          -X k8s.io/client-go/pkg/version.gitVersion=v${{package.version}} \
          -X k8s.io/client-go/pkg/version.gitCommit=${{vars.source-commit}}" \
        -o "${{targets.destdir}}/usr/bin/cmctl" .
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cmctl build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/cmctl-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/cmctl-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        cmctl --help | grep -F 'Usage:'
        cmctl version --client | grep -F 'v${{package.version}}'
        apk info --who-owns /usr/bin/cmctl \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cert-manager/cmctl
    strip-prefix: v
