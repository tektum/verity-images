package:
  name: verity-nats-server-config-reloader
  # yamllint disable-line rule:line-length
  version: "0.25.0"  # renovate: datasource=github-releases depName=nats-io/nack versioning=regex:^(?<major>0)\.(?<minor>25)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Sidecar that reloads NATS server configuration on file changes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 4f08e6d39ae244c0236e791dc533f22bfe08003e
  x-sys-floor: v0.49.0  # renovate: datasource=go depName=golang.org/x/sys

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nats-io/nack
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # x/net's fixed releases require a newer x/sys than the one go/remediate
  # selects on its own, which leaves go.sum without the entries the build needs.
  - runs: |
      current="$(go list -m -f '{{.Version}}' golang.org/x/sys)"
      if awk -v have="$current" -v want=${{vars.x-sys-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        GOTOOLCHAIN=local go get golang.org/x/sys@${{vars.x-sys-floor}}
      fi
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/nats-server-config-reloader

  - runs: |
      git_info="$(git rev-parse --short=12 HEAD)"
      build_date=$(git show -s --format=%cI HEAD)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.Version=${{package.version}} -X main.GitInfo=$git_info -X main.BuildTime=$build_date" \
        -o "${{targets.destdir}}/usr/bin/nats-server-config-reloader" ./cmd/nats-server-config-reloader
      go version -m "${{targets.destdir}}/usr/bin/nats-server-config-reloader" \
        | awk '$1 == "mod" && $2 == "github.com/nats-io/nack" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/nats-server-config-reloader" --version 2>&1 \
        | grep -F "NATS Server Config Reloader v${{package.version}} ($git_info, "
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the nats-server-config-reloader build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/nats-server-config-reloader-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/nats-server-config-reloader-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        nats-server-config-reloader --version 2>&1 \
          | grep -F 'NATS Server Config Reloader v${{package.version}} ('
        apk info --who-owns /usr/bin/nats-server-config-reloader \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: nats-io/nack
    strip-prefix: v
    tag-filter-prefix: v0.25.
    use-tag: true
