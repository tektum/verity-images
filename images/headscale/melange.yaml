package:
  name: verity-headscale-0.29
  version: "0.29.7"
  epoch: 0
  description: Open source, self-hosted implementation of the Tailscale control server.
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: c9cf210b8bc84d13177e18b91f555788a44b47b6

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/juanfont/headscale
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/headscale
  # The remediation leaves go.sum without the zip hashes of the genproto modules it raised; resolve them
  # before the -mod=readonly build.
  - runs: |
      go list -deps -mod=mod ./cmd/headscale >/dev/null
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o headscale ./cmd/headscale
      install -Dm755 headscale "${{targets.destdir}}/usr/bin/headscale"
      go version -m "${{targets.destdir}}/usr/bin/headscale" \
        | awk '$1 == "mod" && $2 == "github.com/juanfont/headscale" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 config-example.yaml \
        "${{targets.destdir}}/usr/share/headscale/config-example.yaml"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Headscale build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/headscale-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/headscale-build/go.sum"

test:
  pipeline:
    - runs: |
        headscale version 2>&1 | grep -Fx 'headscale version v${{package.version}}'
        headscale --help 2>&1 | grep -F 'Tailscale control server'
        test -f /usr/share/headscale/config-example.yaml
        test -f /usr/share/licenses/${{package.name}}/LICENSE
