contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-zot@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/zot

cmd: serve /etc/zot/config.json

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /var/lib/registry
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

volumes:
  - /var/lib/registry
