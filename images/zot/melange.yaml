package:
  name: verity-zot
  version: "2.1.20"
  epoch: 1
  description: Zot OCI registry
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOEXPERIMENT: jsonv2
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/project-zot/zot
      tag: v${{package.version}}
      expected-commit: 3b5796d834e8661ea661a5fcc47add8d4405aebf
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/zot
  - runs: |
      flags="-s -w"
      flags="$flags -X zotregistry.dev/zot/v2/pkg/buildinfo.ReleaseTag=v${{package.version}}"
      flags="$flags -X zotregistry.dev/zot/v2/pkg/buildinfo.Commit=3b5796d834e8661ea661a5fcc47add8d4405aebf"
      flags="$flags -X zotregistry.dev/zot/v2/pkg/buildinfo.BinaryType=minimal"
      flags="$flags -X zotregistry.dev/zot/v2/pkg/buildinfo.GoVersion=$(go version | cut -d' ' -f3)"
      go build -trimpath -ldflags "$flags" -o zot ./cmd/zot
      install -m755 -D zot "${{targets.destdir}}/usr/bin/zot"
      install -m644 -D LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -m644 -D /dev/stdin "${{targets.destdir}}/etc/zot/config.json" <<'EOF'
      {
        "distSpecVersion": "1.1.1",
        "storage": {"rootDirectory": "/var/lib/registry"},
        "http": {"address": "0.0.0.0", "port": "5000"}
      }
      EOF
  - uses: strip

subpackages:
  - name: verity-zot-build-metadata
    description: Resolved Go module metadata for the Zot build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/zot-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/zot-build/go.sum"

test:
  pipeline:
    - runs: |
        /usr/bin/zot --version 2>&1 | grep -F '3b5796d834e8661ea661a5fcc47add8d4405aebf'
        /usr/bin/zot verify /etc/zot/config.json >/dev/null
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: project-zot/zot
    strip-prefix: v
    tag-filter: v
    use-tag: true
