package:
  name: falcosecurity-falcosidekick
  version: "2.35.1"  # renovate: datasource=github-releases depName=falcosecurity/falcosidekick
  epoch: 1
  description: Event forwarder for Falco alerts
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: a31e86077a4a64d99596f39bb092a650d09e3b00

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/falcosecurity/falcosidekick
      tag: ${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - uses: go/build
    with:
      packages: .
      output: falcosidekick
      extra-args: -buildvcs=false
      go-package: go-1.26
      ldflags: |
        -X main.GitVersion=${{package.version}}
        -X main.gitCommit=${{vars.source-commit}}
        -X main.gitTreeState=clean
        -X main.buildDate=$(date -u -d @${SOURCE_DATE_EPOCH} +%FT%TZ)

  - runs: |
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: falcosecurity-falcosidekick-build-metadata
    description: Resolved Go module metadata for the Falcosidekick build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/falcosidekick-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/falcosidekick-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        falcosidekick --version | grep -E "^GitVersion: +${{package.version}}$"
        apk info --who-owns /usr/bin/falcosidekick | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: falcosecurity/falcosidekick
