package:
  name: verity-dive
  # yamllint disable-line rule:line-length
  version: "0.13.1"  # renovate: datasource=github-releases depName=wagoodman/dive versioning=regex:^(?<major>0)\.(?<minor>13)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Explore the layers of a container image and measure wasted space
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: fe98c8a2eb08c443a36e3cc7568078909e298433
  docker-floor: v28.5.2+incompatible  # renovate: datasource=go depName=github.com/docker/docker

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wagoodman/dive
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # go/remediate raises github.com/docker/cli to v29, whose client packages need
  # the final github.com/docker/docker release; upstream v0.13.1 pins v28.0.4,
  # and stepping one patch release per pass exhausts the remediation pass limit.
  - runs: |
      current="$(go list -m -f '{{.Version}}' github.com/docker/docker)"
      if awk -v have="$current" -v want=${{vars.docker-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, /[.+-]/)
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit 1
      }'; then
        GOTOOLCHAIN=local go get github.com/docker/docker@${{vars.docker-floor}}
      fi

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      build_date=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      commit=$(git rev-parse HEAD)
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X main.version=${{package.version}} -X main.commit=$commit -X main.buildTime=$build_date" \
        -o "${{targets.destdir}}/usr/bin/dive" .
      go version -m "${{targets.destdir}}/usr/bin/dive" \
        | awk '$1 == "mod" && $2 == "github.com/wagoodman/dive" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "${{targets.destdir}}/usr/bin/dive" --version | grep -Fx 'dive ${{package.version}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the dive build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/dive-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/dive-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        dive --version | grep -Fx 'dive ${{package.version}}'
        dive --help >/dev/null
        apk info --who-owns /usr/bin/dive \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: wagoodman/dive
    strip-prefix: v
    tag-filter-prefix: v0.13.
    use-tag: true
