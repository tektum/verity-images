contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-spire-controller-manager@local

accounts:
  groups:
    - groupname: nonroot
      gid: 1000
  users:
    - username: nonroot
      uid: 1000
      gid: 1000
  run-as: 1000

entrypoint:
  command: /spire-controller-manager

work-dir: /

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
  - path: /spire-controller-manager
    type: symlink
    source: /usr/bin/spire-controller-manager
    uid: 0
    gid: 0
  - path: /usr/bin/spire-controller-manager
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
