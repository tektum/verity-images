package:
  name: verity-spire-controller-manager
  # yamllint disable-line rule:line-length
  version: "0.8.1"  # renovate: datasource=github-releases depName=spiffe/spire-controller-manager versioning=regex:^(?<major>0)\.(?<minor>8)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: SPIRE controller manager for Kubernetes workload registration
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 12Gi

vars:
  source-commit: 823124bb8d0bb54c29793f82e9edce2cc2cd5c7b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spiffe/spire-controller-manager
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "-s -w" \
        -o spire-controller-manager ./cmd
      go version -m spire-controller-manager \
        | awk '$1 == "mod" && $2 == "github.com/spiffe/spire-controller-manager" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm755 spire-controller-manager "${{targets.destdir}}/usr/bin/spire-controller-manager"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: verity-spire-controller-manager-build-metadata
    description: Resolved Go module metadata for the SPIRE controller manager build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/verity-spire-controller-manager-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/verity-spire-controller-manager-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        spire-controller-manager -h 2>&1 | grep -F -- '-spire-api-socket'
        apk info --who-owns /usr/bin/spire-controller-manager | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: spiffe/spire-controller-manager
    strip-prefix: v
    tag-filter: v0.8.
