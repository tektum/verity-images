contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - busybox
    - verity-ipfs-cluster@local

accounts:
  groups:
    - groupname: ipfs
      gid: 65532
  users:
    - username: ipfs
      uid: 65532
      gid: 65532
      homedir: /data/ipfs-cluster
  run-as: 65532

# The upstream entrypoint initializes service.json and identity.json under
# IPFS_CLUSTER_PATH on first start and then execs ipfs-cluster-service.
entrypoint:
  command: /usr/local/bin/entrypoint.sh

cmd: daemon

work-dir: /data/ipfs-cluster

volumes:
  - /data/ipfs-cluster

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
  IPFS_CLUSTER_PATH: /data/ipfs-cluster
  IPFS_CLUSTER_CONSENSUS: crdt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /data/ipfs-cluster
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
