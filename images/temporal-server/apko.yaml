contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - posix-libc-utils
    - tzdata
    - verity-temporal-server@local

accounts:
  groups:
    - groupname: temporal
      gid: 65532
  users:
    - username: temporal
      uid: 65532
      gid: 65532
      homedir: /var/lib/temporal
      shell: /bin/sh
  run-as: 65532

cmd: /etc/temporal/entrypoint.sh

work-dir: /var/lib/temporal

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /var/lib/temporal
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
