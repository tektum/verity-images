package:
  name: verity-temporal-server
  version: "1.32.2"
  epoch: 0
  description: Temporal server (frontend, history, matching and worker services)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - posix-libc-utils
      - tzdata
  resources:
    cpu: "4"
    memory: 16Gi
    disk: 8Gi

vars:
  # The server module resolves thrift v0.24.0 through gocql. The thrift advisories fixed in
  # v0.25.0 are not in the Go vulnerability or OSV module feeds that go/remediate reads.
  thrift-floor: v0.25.0  # renovate: datasource=go depName=github.com/apache/thrift

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/temporal
      tag: v${{package.version}}
      expected-commit: 6d085822273f4336796e6959c73ab1d14a23eb77
  - runs: |
      current="$(go list -m -f '{{.Version}}' github.com/apache/thrift)"
      if awk -v have="$current" -v want=${{vars.thrift-floor}} 'BEGIN {
        split(substr(have, 2), h, /[.+-]/)
        split(substr(want, 2), w, ".")
        for (i = 1; i <= 3; i++) {
          if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
        }
        exit (have ~ /-/) ? 0 : 1
      }'; then
        go get github.com/apache/thrift@${{vars.thrift-floor}}
      fi
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/server
  - runs: |
      # Same tags as `make temporal-server`; -buildvcs keeps the tagged module version in the binary.
      go build -p 4 -mod=readonly -trimpath -buildvcs=true -tags disable_grpc_modules \
        -ldflags="-s -w" -o temporal-server ./cmd/server
      go version -m temporal-server \
        | awk '$1 == "mod" && $2 == "go.temporal.io/server" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm755 temporal-server "${{targets.destdir}}/usr/bin/temporal-server"
      install -Dm755 docker/scripts/sh/entrypoint.sh "${{targets.destdir}}/etc/temporal/entrypoint.sh"
      # The embedded configuration reads this dynamic config file unless DYNAMIC_CONFIG_FILE_PATH is set.
      install -Dm644 config/dynamicconfig/docker.yaml \
        "${{targets.destdir}}/etc/temporal/config/dynamicconfig/docker.yaml"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Temporal server build
    pipeline:
      - runs: |
          dest="${{targets.subpkgdir}}/usr/share/temporal-server-build"
          for f in go.mod go.sum; do
            install -m644 -D "$f" "$dest/$f"
          done

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        temporal-server --version | grep -F "${{package.version}}"
        apk info --who-owns /usr/bin/temporal-server \
          | grep -F "${{package.name}}-${{package.full-version}}"
        test -x /etc/temporal/entrypoint.sh
        test -f /etc/temporal/config/dynamicconfig/docker.yaml
        grep -F "MIT License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: temporalio/temporal
    tag-filter-prefix: v1.32.
    strip-prefix: v
