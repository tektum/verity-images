package:
  name: prometheus-node-exporter
  version: "1.10.2"
  epoch: 0
  description: Prometheus exporter for hardware and OS metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 7Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 654f19dee6a0c41de78a8d6d870e8c742cdb43b9

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.15.1
        golang.org/x/net@v0.58.0
        golang.org/x/text@v0.41.0

  - runs: |
      flags="-s -w -X github.com/prometheus/common/version.Version=${{package.version}}"
      flags="$flags -X github.com/prometheus/common/version.Revision=${{vars.source-commit}}"
      flags="$flags -X github.com/prometheus/common/version.Branch=HEAD"
      flags="$flags -X github.com/prometheus/common/version.BuildUser=verity"
      go build -mod=readonly -trimpath -ldflags "$flags" -o node_exporter .
      install -Dm755 node_exporter "${{targets.destdir}}/usr/bin/node_exporter"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

test:
  pipeline:
    - runs: |
        /bin/node_exporter --version 2>&1 | grep -F "version ${{package.version}}"
        /bin/node_exporter --help >/dev/null
        test -s /usr/share/licenses/${{package.name}}/LICENSE

update:
  enabled: true
  github:
    identifier: prometheus/node_exporter
    strip-prefix: v
    tag-filter: v1.10.
    use-tag: true
