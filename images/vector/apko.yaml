contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - vector=0.56.0-r0

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/vector

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/vector
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/vector
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
