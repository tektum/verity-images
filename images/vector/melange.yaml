package:
  name: vector
  version: "0.59.0"
  epoch: 2
  description: Minimal Vector stdin-to-console observability pipeline
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "22"
    memory: 36Gi
  test-resources:
    cpu: "1"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - openssl-dev
      - patch
      - perl
      - pkgconf
      - protobuf-dev
      - protoc
      - rust-1.95

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vectordotdev/vector
      tag: v${{package.version}}
      expected-commit: a3231c76bdea5078bc54c205cf89f5a1ceddbb73
  - runs: |
      patch -p1 --fuzz=0 < tonic-0.12.patch
      cargo update -p tonic@0.11.0 --precise 0.12.3  # renovate: datasource=crate depName=tonic versioning=semver
      cargo auditable build --release --locked --no-default-features --features sources-stdin,sinks-console
      install -m755 -D target/release/vector "${{targets.destdir}}/usr/bin/vector"
  - uses: strip

test:
  pipeline:
    - runs: /usr/bin/vector --version | grep -F "vector ${{package.version}}"
