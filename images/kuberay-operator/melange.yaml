package:
  name: verity-kuberay-operator
  # yamllint disable-line rule:line-length
  version: "1.7.2"  # renovate: datasource=github-releases depName=kuberay-project/kuberay versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: KubeRay operator, the Kubernetes controller for RayCluster, RayJob and RayService
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: fb5edf56ce1e2783bf3adbc4fbec97488ef208f1

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kuberay-project/kuberay
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: ray-operator
      packages: .

  # Upstream's Dockerfile runs `go build -a -o manager main.go` in ray-operator
  # with CGO and the strictfipsruntime tag for its own FIPS image; this plain
  # image builds static. The operator has no version flag: its User-Agent and
  # pod annotations carry the KUBERAY_VERSION constant of the release.
  - runs: |
      test "$(git rev-parse HEAD)" = '${{vars.source-commit}}'
      # The operator is the ray-operator submodule. Upstream tags each release
      # ray-operator/vX.Y.Z on the same commit as vX.Y.Z, which lets Go stamp the
      # main module version the scan identity relies on. Recreate that tag when
      # the release checkout did not fetch it.
      tag=ray-operator/v${{package.version}}
      git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag "$tag" HEAD
      test "$(git rev-parse "$tag^{commit}")" = '${{vars.source-commit}}'
      grep -F "KUBERAY_VERSION = \"v${{package.version}}\"" \
        ray-operator/controllers/ray/utils/constant.go
      cd ray-operator
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/kuberay-operator" .
      go version -m "${{targets.destdir}}/usr/bin/kuberay-operator" \
        | awk '$1 == "mod" && $2 == "github.com/ray-project/kuberay/ray-operator" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      # Upstream's image and Helm chart (operatorCommand) run /manager.
      ln -s usr/bin/kuberay-operator "${{targets.destdir}}/manager"
      # The CRDs generated for this release. The upstream image does not carry
      # them; they ship here so a consumer can install the schema the binary expects.
      for crd in config/crd/bases/*.yaml; do
        install -Dm644 "$crd" \
          "${{targets.destdir}}/usr/share/kuberay-operator/crds/$(basename "$crd")"
      done
      cd ..
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the KubeRay operator build
    pipeline:
      - runs: |
          install -Dm644 ray-operator/go.mod \
            "${{targets.subpkgdir}}/usr/share/kuberay-operator-build/go.mod"
          install -Dm644 ray-operator/go.sum \
            "${{targets.subpkgdir}}/usr/share/kuberay-operator-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kuberay-operator --help 2>&1 | grep -F -- '-health-probe-bind-address'
        test "$(readlink -f /manager)" = /usr/bin/kuberay-operator
        for crd in rayclusters raycronjobs rayjobs rayservices; do
          grep -Fx 'kind: CustomResourceDefinition' \
            "/usr/share/kuberay-operator/crds/ray.io_$crd.yaml"
        done
        apk info --who-owns /usr/bin/kuberay-operator \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kuberay-project/kuberay
    strip-prefix: v
    tag-filter-prefix: v1.
    use-tag: true
