package:
  name: verity-linkerd-web
  # Linkerd edge releases are tagged edge-YY.M.N; the APK version is YY.M.N.
  # yamllint disable-line rule:line-length
  version: "26.11.2"  # renovate: datasource=github-tags depName=linkerd/linkerd2 versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^edge-(?<version>.+)$
  epoch: 0
  description: Linkerd viz dashboard web server with its bundled web UI
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "8"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 76f5e82dff7c0ead5390db7dd00266db9f6f93e1

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26
      - nodejs-22
      - python3
      - yarn
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    YARN_CACHE_FOLDER: /var/cache/melange/yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/linkerd/linkerd2
      tag: edge-${{package.version}}
      expected-commit: ${{vars.source-commit}}

  # Mirror web/Dockerfile: install the locked dependencies, then switch to
  # production only for the bundle build so build-time tooling is installed.
  - name: Build web UI
    runs: |
      ./bin/web setup install --frozen-lockfile --non-interactive
      NODE_ENV=production ./bin/web build
      test -s web/app/dist/index_bundle.js
      ls web/app/dist/main.*.js >/dev/null

  - uses: go/remediate
    with:
      modroot: .
      packages: ./web

  # Upstream links no version; LINKERD_CONTAINER_VERSION_OVERRIDE in the image
  # supplies it. The edge tag is not semver, so -buildvcs stamps the main
  # module with a pseudo-version of the pinned commit, the form Linkerd's GHSA
  # ranges use. metadata.yaml also declares the module purl and the NVD CPE,
  # versioned from package.version.
  - name: Build server and install upstream layout
    runs: |
      [ "$(git rev-parse HEAD)" = '${{vars.source-commit}}' ]
      root="${{targets.destdir}}/linkerd"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags "-s -w" \
        -o "$root/web" ./web
      go version -m "$root/web" | awk '$1 == "path" { print $2 }' \
        | grep -Fx github.com/linkerd/linkerd2/web
      short=$(printf '%s' '${{vars.source-commit}}' | cut -c1-12)
      mod=$(go version -m "$root/web" \
        | awk '$1 == "mod" && $2 == "github.com/linkerd/linkerd2" { print $3 }')
      printf '%s\n' "$mod" | grep -Ex "v[0-9]+\.[0-9]+\.[0-9]+-(0\.)?[0-9]{14}-$short(\+dirty)?" ||
        { echo "web: unexpected main module version '$mod'" >&2; exit 1; }
      LINKERD_CONTAINER_VERSION_OVERRIDE=edge-${{package.version}} \
        "$root/web" -version | grep -Fx edge-${{package.version}}
      install -d "$root/app"
      cp -R web/app/dist "$root/app/dist"
      cp -R web/templates "$root/templates"
      find "$root/app" "$root/templates" -type d -exec chmod 755 {} +
      find "$root/app" "$root/templates" -type f -exec chmod 644 {} +
      install -Dm644 LICENSE "$root/LICENSE"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module and web UI dependency metadata for the Linkerd web build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/linkerd-web-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"
          install -Dm644 web/app/package.json "$dir/package.json"
          install -Dm644 web/app/yarn.lock "$dir/yarn.lock"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        cd /linkerd
        LINKERD_CONTAINER_VERSION_OVERRIDE=edge-${{package.version}} ./web -version \
          | grep -Fx edge-${{package.version}}
        test -s app/dist/index_bundle.js
        test -f templates/app.tmpl.html
        test -f templates/includes/base.tmpl.html
        test ! -e app/node_modules
        apk info --who-owns /linkerd/web \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2
    strip-prefix: edge-
    tag-filter: edge-
    use-tag: true
