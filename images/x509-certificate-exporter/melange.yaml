package:
  name: verity-x509-certificate-exporter
  # yamllint disable-line rule:line-length
  version: "4.2.4"  # renovate: datasource=github-releases depName=enix/x509-certificate-exporter versioning=regex:^(?<major>4)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Prometheus exporter for x509 certificate expiration in files, kubeconfigs and Kubernetes secrets
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 8afe83c84d35eee2a0ae78945b9cfb44733b10b7

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/enix/x509-certificate-exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/x509-certificate-exporter

  - runs: |
      # Same stamps as the upstream GoReleaser build; the build time is the
      # pinned commit's timestamp so rebuilds stay reproducible.
      pkg=github.com/enix/x509-certificate-exporter/v4/internal/product
      build_time=$(date -u -d "@$(git log -1 --format=%ct)" +%Y-%m-%dT%H:%M:%SZ)
      bin="${{targets.destdir}}/usr/bin/x509-certificate-exporter"
      stamp="-X $pkg.version=${{package.version}} -X $pkg.gitCommit=${{vars.source-commit}}"
      stamp="$stamp -X $pkg.buildTime=$build_time"
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w $stamp" \
        -o "$bin" ./cmd/x509-certificate-exporter
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "github.com/enix/x509-certificate-exporter/v4" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      "$bin" --version | grep -Fx 'Version:    ${{package.version}}'
      "$bin" --version | grep -Fx 'Git commit: ${{vars.source-commit}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the x509-certificate-exporter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/x509-certificate-exporter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/x509-certificate-exporter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        x509-certificate-exporter --version | grep -Fx 'Version:    ${{package.version}}'
        x509-certificate-exporter --help | grep -F -- '--watch-file'
        apk info --who-owns /usr/bin/x509-certificate-exporter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT
        grep -F 'MIT License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: enix/x509-certificate-exporter
    strip-prefix: v
    tag-filter-prefix: v4.
    use-tag: true
