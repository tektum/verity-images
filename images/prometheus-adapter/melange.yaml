package:
  name: prometheus-adapter-0.12
  # yamllint disable-line rule:line-length
  version: "0.12.0"  # renovate: datasource=github-releases depName=kubernetes-sigs/prometheus-adapter versioning=regex:^(?<major>0)\.(?<minor>12)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Kubernetes custom, external, and resource metrics API server backed by Prometheus
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 17cef511b1854441490bceeca7a710a04ce091ad

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/prometheus-adapter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/adapter
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/prometheus-adapter" ./cmd/adapter
      go version -m "${{targets.destdir}}/usr/bin/prometheus-adapter" \
        | awk '$1 == "mod" && $2 == "sigs.k8s.io/prometheus-adapter" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      # Upstream images expose the binary as /adapter; keep that path working.
      ln -s usr/bin/prometheus-adapter "${{targets.destdir}}/adapter"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the prometheus-adapter build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/prometheus-adapter-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/prometheus-adapter-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        prometheus-adapter --help 2>&1 | grep -F -- '--prometheus-url'
        test "$(readlink /adapter)" = usr/bin/prometheus-adapter
        apk info --who-owns /usr/bin/prometheus-adapter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/prometheus-adapter
    strip-prefix: v
