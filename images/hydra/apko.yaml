contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - hydra=26.2.0-r9

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/hydra

cmd: serve all

environment:
  HOME: /tmp
  PATH: /usr/bin:/bin

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
