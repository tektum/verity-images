package:
  name: grype-0.121
  # yamllint disable-line rule:line-length
  version: "0.121.3"  # renovate: datasource=github-releases depName=anchore/grype versioning=regex:^(?<major>0)\.(?<minor>121)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Vulnerability scanner for container images and filesystems
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: cd1f23eb50dfb52647090158f453c7359172591f

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/grype
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -tags containers_image_openpgp,exclude_graphdriver_btrfs \
        -ldflags="-s -w \
          -X main.version=${{package.version}} \
          -X main.gitCommit=${{vars.source-commit}} \
          -X main.buildDate=$(git log -1 --format=%cI) \
          -X main.gitDescription=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/grype" ./cmd/grype
      go version -m "${{targets.destdir}}/usr/bin/grype" \
        | awk '$1 == "mod" && $2 == "github.com/anchore/grype" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the grype build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/grype-build/go.mod"
          install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/grype-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        grype version | grep -F "${{package.version}}"
        grype --help | grep -F 'Usage:'
        apk info --who-owns /usr/bin/grype \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: anchore/grype
    strip-prefix: v
