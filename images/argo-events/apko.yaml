contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-argo-events@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/argo-events

# The ArgoWorkflow sensor trigger writes the workflow to os.TempDir before
# running `argo submit`.
paths:
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777

work-dir: /

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
