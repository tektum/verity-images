package:
  name: trivy
  version: "0.74.0"
  epoch: 1
  description: Simple and comprehensive vulnerability scanner for containers
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 15Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aquasecurity/trivy
      tag: v${{package.version}}
      expected-commit: e1fd17a0ea4a8cf24bc4b4dd7e2cfbf4bb31b994
  - uses: go/bump
    with:
      deps: |-
        github.com/go-git/go-git/v5@v5.19.2
        go.opentelemetry.io/otel@v1.46.0
        go.opentelemetry.io/otel/metric@v1.46.0
        go.opentelemetry.io/otel/sdk@v1.46.0
        go.opentelemetry.io/otel/trace@v1.46.0
        golang.org/x/net@v0.56.0
        golang.org/x/text@v0.39.0
        oras.land/oras-go/v2@v2.6.2
  - uses: go/build
    with:
      experiments: jsonv2
      packages: ./cmd/trivy
      output: trivy
      ldflags: -X github.com/aquasecurity/trivy/pkg/version/app.ver=${{package.version}}
      go-package: go-1.26
  - runs: |
      mkdir -p "${{targets.destdir}}/contrib"
      install -Dm644 contrib/*.tpl "${{targets.destdir}}/contrib/"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: trivy-build-metadata
    description: Resolved Go module metadata for the Trivy build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/trivy-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/trivy-build/go.sum"
