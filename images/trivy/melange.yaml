package:
  name: trivy
  version: "0.76.1"
  epoch: 1
  description: Simple and comprehensive vulnerability scanner for containers
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 15Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOEXPERIMENT: jsonv2

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aquasecurity/trivy
      tag: v${{package.version}}
      expected-commit: e713f67f7d54decdcd9b3132c9751833dcced698
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/trivy
  - uses: go/build
    with:
      experiments: jsonv2
      packages: ./cmd/trivy
      output: trivy
      ldflags: -X github.com/aquasecurity/trivy/pkg/version/app.ver=${{package.version}}
      go-package: go-1.27
  - runs: |
      mkdir -p "${{targets.destdir}}/contrib"
      install -Dm644 contrib/*.tpl "${{targets.destdir}}/contrib/"
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: trivy-build-metadata
    description: Resolved Go module metadata for the Trivy build
    pipeline:
      - runs: |
          install -m644 -D go.mod "${{targets.subpkgdir}}/usr/share/trivy-build/go.mod"
          install -m644 -D go.sum "${{targets.subpkgdir}}/usr/share/trivy-build/go.sum"
