contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - trivy

entrypoint:
  command: /usr/bin/trivy

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /root/.cache/trivy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
