contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - trivy@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/trivy

environment:
  HOME: /home/nonroot
  PATH: /usr/bin:/bin

paths:
  - path: /home/nonroot/.cache/trivy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
