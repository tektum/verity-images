package:
  name: verity-temporal-ui
  version: "2.58.1"
  epoch: 0
  description: Temporal Web UI server with the prebuilt UI assets committed upstream
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "2"
    memory: 8Gi
    disk: 4Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 088a347e59d87f7d95817913230d33bac0486c3b
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/server
  - runs: |
      # Package directory build (not a file) so Go stamps the tagged main module version.
      go build -p 2 -mod=readonly -trimpath -buildvcs=true -ldflags="-s -w" \
        -o ui-server ./cmd/server
      go version -m ui-server \
        | awk '$1 == "mod" && $2 == "github.com/temporalio/ui-server/v2" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm755 ui-server "${{targets.destdir}}/home/ui-server/ui-server"
      install -d "${{targets.destdir}}/home/ui-server/config"
      install -m644 config/*.yaml "${{targets.destdir}}/home/ui-server/config/"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the Temporal UI server build
    pipeline:
      - runs: |
          dest="${{targets.subpkgdir}}/usr/share/temporal-ui-build"
          for f in go.mod go.sum; do
            install -m644 -D "$f" "$dest/$f"
          done

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /home/ui-server/ui-server --version | grep -F "${{package.version}}"
        apk info --who-owns /home/ui-server/ui-server \
          | grep -F "${{package.name}}-${{package.full-version}}"
        test -f /home/ui-server/config/docker.yaml
        grep -F "MIT License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
