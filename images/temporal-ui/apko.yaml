contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - tzdata
    - verity-temporal-ui@local

accounts:
  groups:
    - groupname: temporal
      gid: 65532
  users:
    - username: temporal
      uid: 65532
      gid: 65532
      homedir: /home/ui-server
      shell: /sbin/nologin
  run-as: 65532

entrypoint:
  command: /home/ui-server/ui-server

cmd: --env docker start

work-dir: /home/ui-server

environment:
  PATH: /usr/bin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
