package:
  name: verity-rabbitmq-default-user-credential-updater
  # yamllint disable-line rule:line-length
  version: "1.0.19"  # renovate: datasource=github-releases depName=rabbitmq/default-user-credential-updater versioning=regex:^(?<major>1)\.(?<minor>\d+)\.(?<patch>\d+)$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Vault sidecar that rotates the RabbitMQ default user password
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 67e1caa59355b89512724d5b05e287f1df565228

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOMAXPROCS: "4"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/default-user-credential-updater
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Build the main package (not a file list) so Go stamps the module version.
      go build -mod=readonly -trimpath -buildvcs=true -tags timetzdata -ldflags="-s -w" \
        -o "${{targets.destdir}}/usr/bin/default-user-credential-updater" .
      go version -m "${{targets.destdir}}/usr/bin/default-user-credential-updater" \
        | awk '$1 == "mod" && $2 == "github.com/rabbitmq/default-user-credential-updater" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the default user credential updater build
    pipeline:
      - runs: |
          install -Dm644 go.mod \
            "${{targets.subpkgdir}}/usr/share/rabbitmq-default-user-credential-updater-build/go.mod"
          install -Dm644 go.sum \
            "${{targets.subpkgdir}}/usr/share/rabbitmq-default-user-credential-updater-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        default-user-credential-updater --help 2>&1 | grep -F -- '-default-user-file'
        apk info --who-owns /usr/bin/default-user-credential-updater \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MPL-2.0
        grep -F 'Mozilla Public License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: rabbitmq/default-user-credential-updater
    strip-prefix: v
