contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - uv=0.13.8-r1
    - uv-compat=0.13.8-r1
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

entrypoint:
  command: /usr/bin/uv

work-dir: /io

environment:
  PATH: /usr/bin:/bin
  HOME: /home/nonroot
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  UV_CACHE_DIR: /home/nonroot/.cache/uv
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: manual

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.cache
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.cache/uv
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /io
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
