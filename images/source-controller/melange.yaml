package:
  name: verity-source-controller-1.9
  version: "1.9.5"
  epoch: 0
  description: Kubernetes controller for Flux source artifacts.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "4"
    memory: 8Gi

vars:
  source-commit: 53194ad4730ebf07718b29d58f66efd6938fd3da

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/fluxcd/source-controller/archive/${{vars.source-commit}}.tar.gz
      expected-sha256: 8c63658daf156ecdff63f3f37e24656b80203b88dea616fce242da1f8068c190
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - runs: |
      go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
        -tags netgo,osusergo,static_build -o manager .
      install -Dm755 manager "${{targets.destdir}}/manager"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

test:
  pipeline:
    - runs: |
        help_output=$(/manager --help 2>&1)
        printf '%s\n' "$help_output" | grep -F 'Usage of /manager:'
        printf '%s\n' "$help_output" | grep -F -- '--default-service-account string'
        test -f /usr/share/licenses/${{package.name}}/LICENSE
