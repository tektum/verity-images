package:
  name: verity-grafana-alloy-1.10
  version: "1.10.2"
  epoch: 0
  description: OpenTelemetry Collector distribution with Prometheus pipelines.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - libsystemd
      - tzdata
  resources:
    cpu: "4"
    memory: 16Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: b19f8c577aa79fd51de96ab292eedd7838336b09

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-1.26
      - nodejs-22
      - systemd-dev
      - yarn
  environment:
    CGO_ENABLED: "1"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/bump
    with:
      deps: |-
        github.com/antchfx/xpath@v1.3.6
        github.com/apache/thrift@v0.23.0
        github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
        github.com/aws/aws-sdk-go-v2/service/cloudwatchlogs@v1.65.0
        github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
        github.com/cloudflare/circl@v1.6.3
        github.com/docker/docker@v29.3.1+incompatible
        github.com/dvsekhvalnov/jose2go@v1.7.0
        github.com/expr-lang/expr@v1.17.7
        github.com/go-git/go-billy/v5@v5.9.0
        github.com/go-git/go-git/v5@v5.19.2
        github.com/go-jose/go-jose/v4@v4.1.4
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/grafana/loki/v3@v3.6.4
        github.com/opencontainers/runc@v1.3.6
        github.com/opencontainers/selinux@v1.13.0
        github.com/ulikunitz/xz@v0.5.15
        go.mongodb.org/mongo-driver@v1.17.7
        go.opentelemetry.io/otel@v1.43.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
        go.opentelemetry.io/otel/sdk@v1.43.0
        golang.org/x/crypto@v0.52.0
        golang.org/x/net@v0.55.0
        golang.org/x/text@v0.39.0
        google.golang.org/grpc@v1.82.1
  - runs: |
      cd internal/web/ui
      yarn --network-timeout=1200000
      yarn run build
  - runs: |
      flags="-s -w -X github.com/grafana/alloy/internal/build.Branch=HEAD"
      flags="$flags -X github.com/grafana/alloy/internal/build.Version=v${{package.version}}"
      flags="$flags -X github.com/grafana/alloy/syntax/internal/stdlib.Version=v${{package.version}}"
      flags="$flags -X github.com/grafana/alloy/internal/build.Revision=${{vars.source-commit}}"
      flags="$flags -X github.com/grafana/alloy/internal/build.BuildUser=verity"
      flags="$flags -X github.com/grafana/alloy/internal/build.BuildDate=2025-08-19T15:17:14Z"
      go build -mod=readonly -trimpath \
        -tags "netgo builtinassets promtail_journal_enabled" \
        -ldflags "$flags" -o alloy .
      install -Dm755 alloy "${{targets.destdir}}/usr/bin/alloy"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
      install -d -m755 "${{targets.destdir}}/etc/alloy"
      printf '%s\n' 'logging {' '  level = "info"' '}' \
        > "${{targets.destdir}}/etc/alloy/config.alloy"
  - uses: strip

test:
  pipeline:
    - runs: |
        alloy --version 2>&1 | grep -F "v${{package.version}}"
        alloy run --help >/dev/null
        test -s /usr/share/licenses/${{package.name}}/LICENSE
        test -s /etc/alloy/config.alloy

update:
  enabled: true
  github:
    identifier: grafana/alloy
    strip-prefix: v
    tag-filter: v1.10.
    use-tag: true
