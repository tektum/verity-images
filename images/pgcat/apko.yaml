contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - pgcat

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/pgcat

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/pgcat
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
