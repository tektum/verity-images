contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - samurai
    - zlib=1.3.3-r0
    - verity-cmake-4.1@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/cmake

environment:
  PATH: /usr/bin:/bin
