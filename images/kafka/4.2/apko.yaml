contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - verity-kafka-4.2@local

accounts:
  groups:
    - groupname: kafka
      gid: 9092
  users:
    - username: kafka
      uid: 9092
      gid: 9092
      homedir: /opt/kafka
  run-as: 9092

entrypoint:
  command: /opt/kafka/bin/kafka-server-start.sh

cmd: /opt/kafka/config/server.properties

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  LANG: en_US.UTF-8
  PATH: /opt/kafka/bin:/usr/lib/jvm/java-21-openjdk/bin:/usr/local/bin:/usr/bin:/bin

paths:
  - path: /var/lib/kafka
    type: directory
    uid: 9092
    gid: 9092
    permissions: 0o755
  - path: /var/lib/kafka/data
    type: directory
    uid: 9092
    gid: 9092
    permissions: 0o755
  - path: /opt/kafka/logs
    type: directory
    uid: 9092
    gid: 9092
    permissions: 0o755

work-dir: /opt/kafka
