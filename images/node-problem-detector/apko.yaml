contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    # The custom plugin monitor runs shell plugins (config/plugin/*.sh).
    - bash
    - busybox
    - ca-certificates-bundle
    - tzdata
    - verity-node-problem-detector@local

# Upstream runs as root: the default kernel monitor reads the host /dev/kmsg,
# which needs root on hosts with kernel.dmesg_restrict=1, and the journald
# watchers read the host journal. Charts may override the user.
accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 0

entrypoint:
  command: /usr/bin/node-problem-detector

cmd: --config.system-log-monitor=/config/kernel-monitor.json,/config/readonly-monitor.json

work-dir: /

environment:
  PATH: /usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 0
    gid: 0
    permissions: 0o1777
