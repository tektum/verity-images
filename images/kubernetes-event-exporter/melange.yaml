package:
  name: verity-kubernetes-event-exporter
  # yamllint disable-line rule:line-length
  version: "1.7"  # renovate: datasource=github-releases depName=mustafaakin/kubernetes-event-exporter versioning=regex:^(?<major>1)\.(?<minor>\d+)(?:\.(?<patch>\d+))?$ extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Exports Kubernetes events to sinks such as stdout, files, webhooks and message queues
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 2668c4309da33fd47ee0846923b8aa2107b87f88

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -p=4
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mustafaakin/kubernetes-event-exporter
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      # Same version stamp as the upstream release image build.
      bin="${{targets.destdir}}/usr/bin/kubernetes-event-exporter"
      pkg=github.com/resmoio/kubernetes-event-exporter/pkg/version
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X $pkg.Version=v${{package.version}}" -o "$bin" .
      go version -m "$bin" \
        | awk '$1 == "mod" && $2 == "github.com/resmoio/kubernetes-event-exporter" { print $3 }' \
        | grep -E '^v'
      go version -m "$bin" | grep -Fx '	build	vcs.revision=${{vars.source-commit}}'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the kubernetes-event-exporter build
    pipeline:
      - runs: |
          dir="${{targets.subpkgdir}}/usr/share/kubernetes-event-exporter-build"
          install -Dm644 go.mod "$dir/go.mod"
          install -Dm644 go.sum "$dir/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kubernetes-event-exporter -h 2>&1 | grep -F -- '-metrics-address'
        apk info --who-owns /usr/bin/kubernetes-event-exporter \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: mustafaakin/kubernetes-event-exporter
    strip-prefix: v
    use-tag: true
