package:
  name: kube-state-metrics
  version: "2.20.0"
  epoch: 3  # First revision recognized as fixed by the vulnerability feed.
  description: Add-on agent to generate and expose cluster-level metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - tzdata
      - wolfi-baselayout
  resources:
    cpu: "2"
    memory: 5Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

vars:
  source-commit: 4ffeda2ef866b0fef372849825a803296483b336

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/kubernetes/kube-state-metrics/archive/${{vars.source-commit}}.tar.gz
      expected-sha256: fffdaa8e6bbb0e2e9b2d07886bd70ef2f4b6507901ffb0de678b5486b6a46eba
  - uses: go/remediate
    with:
      modroot: .
      packages: .
  - uses: go/build
    with:
      packages: .
      output: kube-state-metrics
      go-package: go-1.26
      ldflags: |
        -X github.com/prometheus/common/version.Version=${{package.version}}
        -X github.com/prometheus/common/version.Revision=${{vars.source-commit}}
        -X github.com/prometheus/common/version.Branch=v${{package.version}}
        -X github.com/prometheus/common/version.BuildUser=verity
        -X github.com/prometheus/common/version.BuildDate=2026-08-17T20:49:04Z
  - runs: |
      "${{targets.destdir}}/usr/bin/kube-state-metrics" version | grep -F "${{package.version}}"
      "${{targets.destdir}}/usr/bin/kube-state-metrics" --help >/dev/null
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        kube-state-metrics version | grep -F "${{package.version}}"
        kube-state-metrics --help >/dev/null
        apk info --who-owns /usr/bin/kube-state-metrics | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "Apache License" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: kubernetes/kube-state-metrics
    strip-prefix: v
    tag-filter: v
