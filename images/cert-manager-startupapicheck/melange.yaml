package:
  name: cert-manager-startupapicheck-1.19
  version: "1.19.6"
  epoch: 1  # Go remediation
  description: cert-manager startup API check
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - tzdata
  resources:
    cpu: "8"
    memory: 16Gi

vars:
  source-commit: 60b0447cc9a64885d42567ea590862b88a62d1ad

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/cert-manager
      tag: v${{package.version}}
      expected-commit: ${{vars.source-commit}}
  - uses: go/remediate
    with:
      modroot: cmd/startupapicheck
      packages: .
  - runs: |
      install -d "${{targets.destdir}}/app/cmd/startupapicheck"
      cd cmd/startupapicheck
      go build -mod=readonly -trimpath -buildvcs=false \
        -ldflags="-s -w \
          -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}} \
          -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=${{vars.source-commit}} \
          -X github.com/cert-manager/cert-manager/pkg/util.AppGitState=clean" \
        -o "${{targets.destdir}}/app/cmd/startupapicheck/startupapicheck" .
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the cert-manager startup API check build
    pipeline:
      - runs: |
          install -Dm644 cmd/startupapicheck/go.mod \
            "${{targets.subpkgdir}}/usr/share/cert-manager-startupapicheck-build/go.mod"
          install -Dm644 cmd/startupapicheck/go.sum \
            "${{targets.subpkgdir}}/usr/share/cert-manager-startupapicheck-build/go.sum"

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        /app/cmd/startupapicheck/startupapicheck --help | grep -F 'Usage:'
        apk info --who-owns /app/cmd/startupapicheck/startupapicheck \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx Apache-2.0
        grep -F 'Apache License' \
          "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: cert-manager/cert-manager
    tag-filter-prefix: v1.19.
    strip-prefix: v
