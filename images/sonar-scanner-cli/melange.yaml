package:
  name: sonar-scanner-cli
  version: "8.3.1.16491"
  epoch: 0
  description: Scanner CLI for SonarQube and SonarCloud
  copyright:
    - license: LGPL-3.0-or-later
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - maven-3.9
      - openjdk-21-default-jdk
  environment:
    JAVA_HOME: /usr/lib/jvm/default-jvm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SonarSource/sonar-scanner-cli
      tag: ${{package.version}}
      expected-commit: e5262fe8ea3db13523fc963d80fa7fb3b2ee9175

  - runs: |
      mvn -B -ntp -DskipTests package
      mkdir -p "${{targets.destdir}}/opt"
      unzip -q target/sonar-scanner-*.zip -d "${{targets.destdir}}/opt"
      mv "${{targets.destdir}}"/opt/sonar-scanner-* "${{targets.destdir}}/opt/sonar-scanner"
      rm -f "${{targets.destdir}}"/opt/sonar-scanner/bin/*.bat
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -s /opt/sonar-scanner/bin/sonar-scanner "${{targets.destdir}}/usr/bin/sonar-scanner"
      install -Dm644 LICENSE.txt "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
        - openjdk-21-default-jvm
        - openjdk-21-jre
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
  pipeline:
    - runs: |
        sonar-scanner --version | grep -F "SonarScanner CLI"
        apk info --who-owns /usr/bin/sonar-scanner | grep -F "${{package.name}}-${{package.full-version}}"
        grep -F "GNU LESSER GENERAL PUBLIC LICENSE" "/usr/share/licenses/${{package.name}}/LICENSE"

update:
  enabled: true
  github:
    identifier: SonarSource/sonar-scanner-cli
    tag-filter: "8."
