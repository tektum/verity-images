contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates-bundle
    - openjdk-21-default-jvm
    - openjdk-21-jre
    - sonar-scanner-cli=8.1.0.6389-r1

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/sonar-scanner-cli

work-dir: /usr/src

environment:
  HOME: /tmp
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin

paths:
  - path: /usr/src
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
  - path: /usr/bin/sonar-scanner
    type: symlink
    source: /usr/bin/sonar-scanner-cli
  - path: /usr/bin/sonar-scanner-cli
    type: permissions
    permissions: 0o755
