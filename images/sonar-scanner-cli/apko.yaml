contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - openjdk-21-default-jvm
    - openjdk-21-jre
    - sonar-scanner-cli@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/sonar-scanner

work-dir: /usr/src

environment:
  HOME: /tmp
  JAVA_HOME: /usr/lib/jvm/default-jvm
  PATH: /usr/lib/jvm/default-jvm/bin:/usr/bin:/bin

paths:
  - path: /usr/src
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777
