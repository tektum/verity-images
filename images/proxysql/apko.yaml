contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - proxysql

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/proxysql

cmd: -f

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /etc/proxysql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/proxysql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
