contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ca-certificates-bundle
    - mitmproxy=12.3.1-r4

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      homedir: /home/nonroot
  run-as: 65532

work-dir: /home/nonroot

entrypoint:
  command: /usr/bin/mitmdump

environment:
  HOME: /home/nonroot
  PATH: /usr/bin:/bin

paths:
  - path: /home/nonroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /home/nonroot/.mitmproxy
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
