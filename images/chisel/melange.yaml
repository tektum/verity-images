package:
  name: verity-chisel
  # yamllint disable-line rule:line-length
  version: "1.12.0"  # renovate: datasource=github-releases depName=jpillora/chisel extractVersion=^v(?<version>.+)$
  epoch: 0
  description: Fast TCP and UDP tunnel transported over HTTP and secured via SSH
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
      - wolfi-baselayout
  resources:
    cpu: "4"
    memory: 8Gi
  test-resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.27
      - python3
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jpillora/chisel
      tag: v${{package.version}}
      expected-commit: fe4f4fe7e6a849b4aa6d1b8ee47037e16033f42a

  - uses: go/remediate
    with:
      modroot: .
      packages: .

  - runs: |
      go build -mod=readonly -trimpath -buildvcs=true \
        -ldflags="-s -w -X github.com/jpillora/chisel/share.BuildVersion=${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/chisel" .
      go version -m "${{targets.destdir}}/usr/bin/chisel" \
        | awk '$1 == "mod" && $2 == "github.com/jpillora/chisel" { print $3 }' \
        | grep -Ex 'v${{package.version}}(\+dirty)?'
      install -Dm644 LICENSE \
        "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"

  - uses: strip

subpackages:
  - name: ${{package.name}}-build-metadata
    description: Resolved Go module metadata for the chisel build
    pipeline:
      - runs: |
          install -Dm644 go.mod "${{targets.subpkgdir}}/usr/share/chisel-build/go.mod"
          if [ -f go.sum ]; then
            install -Dm644 go.sum "${{targets.subpkgdir}}/usr/share/chisel-build/go.sum"
          fi

test:
  environment:
    contents:
      packages:
        - apk-tools
        - busybox
  pipeline:
    - runs: |
        chisel --version | grep -Fx '${{package.version}}'
        apk info --who-owns /usr/bin/chisel \
          | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license "${{package.name}}" | grep -Fx MIT

update:
  enabled: true
  github:
    identifier: jpillora/chisel
    strip-prefix: v
    tag-filter: v
    use-tag: true
