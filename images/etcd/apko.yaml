contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - busybox
    - ca-certificates-bundle
    - etcd-3.6@local
    - etcd-3.6-compat@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/etcd

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /var/lib/etcd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /usr/bin/etcd
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /usr/bin/etcdctl
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755
  - path: /usr/bin/etcdutl
    type: permissions
    uid: 0
    gid: 0
    permissions: 0o755

work-dir: /var/lib/etcd
