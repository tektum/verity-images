package:
  name: etcd-3.6
  version: "3.6.14"
  epoch: 1  # GHSA-9h8m-3fm2-qjrq
  description: A highly-available key value store for shared configuration and service discovery.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc
      - merged-usrsbin
      - wolfi-baselayout
    provides:
      - etcd=${{package.full-version}}
  resources:
    cpu: "3"
    memory: 7Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.26

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/etcd-io/etcd
      tag: v${{package.version}}
      expected-commit: fc04cf702b0a46c2fd85547a2be05705b100a496

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.44.0
      modroot: tests

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.44.0
      modroot: server

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.44.0

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.44.0
      modroot: etcdutl

  - uses: go/build
    with:
      packages: .
      modroot: ./etcdctl
      output: etcdctl
      go-package: go-1.26
      ldflags: >-
        -X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)
        -X go.etcd.io/etcd/etcdctl/v3/version.Version=${{package.version}}
      extra-args: "-buildvcs=false"

  - uses: go/build
    with:
      packages: .
      modroot: ./etcdutl
      output: etcdutl
      go-package: go-1.26
      ldflags: >-
        -X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)
      extra-args: "-buildvcs=false"

  - uses: go/build
    with:
      packages: .
      modroot: ./server
      output: etcd
      go-package: go-1.26
      ldflags: >-
        -X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)
        -X go.etcd.io/etcd/server/v3/version.Version=${{package.version}}
      extra-args: "-buildvcs=false"

  - name: Smoke built etcd runtime
    runs: |
      set -euo pipefail
      ETCD_BIN="${{targets.destdir}}/usr/bin/etcd"
      ETCDCTL_BIN="${{targets.destdir}}/usr/bin/etcdctl"
      ENDPOINT="http://127.0.0.1:12379"
      PEER_ENDPOINT="http://127.0.0.1:12380"
      DATA_DIR=$(mktemp -d)

      "$ETCD_BIN" --version | grep -F "etcd Version: ${{package.version}}"
      "$ETCD_BIN" \
        --name default \
        --data-dir "$DATA_DIR" \
        --listen-client-urls "$ENDPOINT" \
        --advertise-client-urls "$ENDPOINT" \
        --listen-peer-urls "$PEER_ENDPOINT" \
        --initial-advertise-peer-urls "$PEER_ENDPOINT" \
        --initial-cluster "default=$PEER_ENDPOINT" \
        > etcd-smoke.log 2>&1 &
      ETCD_PID=$!
      trap 'kill "$ETCD_PID" 2>/dev/null || true; wait "$ETCD_PID" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT

      for attempt in $(seq 1 30); do
        if "$ETCDCTL_BIN" --endpoints="$ENDPOINT" endpoint health; then
          break
        fi
        if ! kill -0 "$ETCD_PID" 2>/dev/null || [ "$attempt" -eq 30 ]; then
          cat etcd-smoke.log
          exit 1
        fi
        sleep 1
      done

      "$ETCDCTL_BIN" --endpoints="$ENDPOINT" put verity-smoke "Hello, etcd"
      test "$("$ETCDCTL_BIN" --endpoints="$ENDPOINT" get verity-smoke --print-value-only)" = "Hello, etcd"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility subpackage for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          install -d "${{targets.subpkgdir}}/usr/local/bin"
          ln -s ../../bin/etcd "${{targets.subpkgdir}}/usr/local/bin/etcd"
          ln -s ../../bin/etcd "${{targets.subpkgdir}}/usr/local/bin/etcd-${{package.version}}"
          ln -s ../../bin/etcdctl "${{targets.subpkgdir}}/usr/local/bin/etcdctl"
          ln -s ../../bin/etcdctl "${{targets.subpkgdir}}/usr/local/bin/etcdctl-${{package.version}}"
          ln -s ../../bin/etcdutl "${{targets.subpkgdir}}/usr/local/bin/etcdutl"
          ln -s ../../bin/etcdutl "${{targets.subpkgdir}}/usr/local/bin/etcdutl-${{package.version}}"
    test:
      pipeline:
        - runs: |
            test -L /usr/local/bin/etcd
            test -L /usr/local/bin/etcdctl
            test -L /usr/local/bin/etcdutl
            /usr/local/bin/etcd --version
            /usr/local/bin/etcdctl version
            /usr/local/bin/etcdutl version
            /usr/local/bin/etcdutl --help | grep -q hashkv

update:
  enabled: true
  github:
    identifier: etcd-io/etcd
    strip-prefix: v
    tag-filter-prefix: v3.6
    use-tag: true

test:
  pipeline:
    - name: Verify etcd version
      runs: |
        etcd --version | grep "etcd Version: ${{package.version}}"
        etcd --help
        etcdctl version
        etcdctl --help
        etcdutl version
        etcdutl --help
        # etcdutl-only subcommand: guards against etcdutl being built from
        # the etcdctl module (that regressed once; etcdctl has no hashkv).
        etcdutl --help | grep -q hashkv
    - name: Exercise etcd runtime
      runs: |
        set -euo pipefail
        ENDPOINT="http://127.0.0.1:12379"
        PEER_ENDPOINT="http://127.0.0.1:12380"
        DATA_DIR=$(mktemp -d)
        LOG_FILE=$(mktemp)

        etcd \
          --name default \
          --data-dir "$DATA_DIR" \
          --listen-client-urls "$ENDPOINT" \
          --advertise-client-urls "$ENDPOINT" \
          --listen-peer-urls "$PEER_ENDPOINT" \
          --initial-advertise-peer-urls "$PEER_ENDPOINT" \
          --initial-cluster "default=$PEER_ENDPOINT" \
          > "$LOG_FILE" 2>&1 &
        ETCD_PID=$!
        trap '
          kill "$ETCD_PID" 2>/dev/null || true
          wait "$ETCD_PID" 2>/dev/null || true
          rm -rf "$DATA_DIR" "$LOG_FILE"
        ' EXIT

        for attempt in $(seq 1 30); do
          if etcdctl --endpoints="$ENDPOINT" endpoint health; then
            break
          fi
          if ! kill -0 "$ETCD_PID" 2>/dev/null || [ "$attempt" -eq 30 ]; then
            cat "$LOG_FILE"
            exit 1
          fi
          sleep 1
        done

        etcdctl --endpoints="$ENDPOINT" put mykey "Hello, etcd"
        test "$(etcdctl --endpoints="$ENDPOINT" get mykey --print-value-only)" = "Hello, etcd"
