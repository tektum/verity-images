contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - verity-opentofu-1.12@local

accounts:
  run-as: 65532

entrypoint:
  command: /usr/bin/tofu

cmd: version

work-dir: /workspace

environment:
  PATH: /usr/bin:/bin
  CHECKPOINT_DISABLE: "1"

paths:
  - path: /workspace
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
