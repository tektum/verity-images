package:
  name: verity-opentofu-1.12
  version: "1.12.6"
  epoch: 4  # Go dependency floors
  description: OpenTofu, a Terraform-compatible infrastructure as code CLI.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "8"
    memory: 8Gi

vars:
  grpc-floor: v1.83.2  # renovate: datasource=go depName=google.golang.org/grpc
  ntlmssp-floor: v0.1.1  # renovate: datasource=go depName=github.com/Azure/go-ntlmssp

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}
      expected-commit: b4305e5a5dd2fb79a27897ae30784a181d3a26cb
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/tofu
  - runs: |
      ensure_floor() {
        module="$1"
        want="$2"
        current="$(go list -m -f '{{.Version}}' "$module")"
        if awk -v have="$current" -v want="$want" 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 < w[i] + 0) ? 0 : 1
          }
          exit (have ~ /-/) ? 0 : 1
        }'; then
          go get "$module@$want"
        fi
      }
      ensure_floor google.golang.org/grpc ${{vars.grpc-floor}}
      ensure_floor github.com/Azure/go-ntlmssp ${{vars.ntlmssp-floor}}
  - uses: go/build
    with:
      go-package: go-1.26
      modroot: .
      packages: ./cmd/tofu
      output: tofu
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
  - runs: |
      binary="${{targets.destdir}}/usr/bin/tofu"
      modules="$(go version -m "$binary")"
      require_floor() {
        module="$1"
        want="$2"
        actual="$(printf '%s\n' "$modules" \
          | awk -v module="$module" '$1 == "dep" && $2 == module { print $3 }')"
        if [ -z "$actual" ]; then
          echo "$module is not linked into $binary" >&2
          exit 1
        fi
        awk -v have="$actual" -v want="$want" 'BEGIN {
          split(substr(have, 2), h, /[.+-]/)
          split(substr(want, 2), w, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 != w[i] + 0) exit (h[i] + 0 > w[i] + 0) ? 0 : 1
          }
          exit (have ~ /-/) ? 1 : 0
        }' || {
          echo "$module version $actual is below required floor $want" >&2
          exit 1
        }
      }
      require_floor google.golang.org/grpc ${{vars.grpc-floor}}
      require_floor github.com/Azure/go-ntlmssp ${{vars.ntlmssp-floor}}
      "$binary" version | grep -F "${{package.version}}"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        tofu version | grep -F "${{package.version}}"
        tofu --help >/dev/null
        apk info --who-owns /usr/bin/tofu | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx MPL-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
