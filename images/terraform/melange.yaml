package:
  name: verity-opentofu-1.12
  version: "1.12.6"
  epoch: 2  # Go remediation
  description: OpenTofu, a Terraform-compatible infrastructure as code CLI.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "8"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
      - python3
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}
      expected-commit: b4305e5a5dd2fb79a27897ae30784a181d3a26cb
  - uses: go/remediate
    with:
      modroot: .
      packages: ./cmd/tofu
  - uses: go/build
    with:
      go-package: go-1.26
      modroot: .
      packages: ./cmd/tofu
      output: tofu
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
  - runs: |
      "${{targets.destdir}}/usr/bin/tofu" version | grep -F "${{package.version}}"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        tofu version | grep -F "${{package.version}}"
        tofu --help >/dev/null
        apk info --who-owns /usr/bin/tofu | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx MPL-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
