package:
  name: verity-opentofu-1.12
  version: "1.12.4"
  epoch: 0
  description: OpenTofu, a Terraform-compatible infrastructure as code CLI.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "8"
    memory: 8Gi

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - go-1.26
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}
      expected-commit: d5291190380d16aa5ef4590facbe0719d7fa165f
  - uses: go/bump
    with:
      deps: |-
        github.com/Azure/go-ntlmssp@v0.1.1
        github.com/aws/aws-sdk-go-v2/aws/protocol/eventstream@v1.7.8
        github.com/aws/aws-sdk-go-v2/service/s3@v1.97.3
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel@v1.44.0
        go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploghttp@v0.19.0
        go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp@v1.43.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.43.0
        go.opentelemetry.io/otel/metric@v1.44.0
        go.opentelemetry.io/otel/sdk@v1.44.0
        go.opentelemetry.io/otel/trace@v1.44.0
        golang.org/x/net@v0.55.0
        golang.org/x/text@v0.39.0
        google.golang.org/grpc@v1.82.1
        oras.land/oras-go/v2@v2.6.1
  - uses: go/build
    with:
      go-package: go-1.26
      modroot: .
      packages: ./cmd/tofu
      output: tofu
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
  - runs: |
      "${{targets.destdir}}/usr/bin/tofu" version | grep -F "${{package.version}}"
      install -Dm644 LICENSE "${{targets.destdir}}/usr/share/licenses/${{package.name}}/LICENSE"
  - uses: strip

test:
  environment:
    contents:
      packages:
        - apk-tools
  pipeline:
    - runs: |
        tofu version | grep -F "${{package.version}}"
        tofu --help >/dev/null
        apk info --who-owns /usr/bin/tofu | grep -F "${{package.name}}-${{package.full-version}}"
        apk info --license ${{package.name}} | grep -Fx MPL-2.0
        test -s /usr/share/licenses/${{package.name}}/LICENSE
