contents:
  repositories:
    - https://packages.wolfi.dev/os
    - "@local @LOCAL_REPOSITORY@"
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - "@LOCAL_KEY@"
  packages:
    - ca-certificates-bundle
    - sqlite
    - tini
    - verity-jupyterhub-k8s-hub@local

# Upstream images/hub/Dockerfile: user jovyan (uid and gid 1000) with home
# /home/jovyan, working directory /srv/jupyterhub, tini as entrypoint and the
# chart's config path as command. configurable-http-proxy runs in its own pod.
accounts:
  groups:
    - groupname: jovyan
      gid: 1000
  users:
    - username: jovyan
      uid: 1000
      gid: 1000
      homedir: /home/jovyan
  run-as: 1000

entrypoint:
  command: /usr/bin/tini --

cmd: jupyterhub --config /usr/local/etc/jupyterhub/jupyterhub_config.py

work-dir: /srv/jupyterhub

environment:
  HOME: /home/jovyan
  # The chart's config runs services such as `python3 -m jupyterhub_idle_culler`,
  # so the hub's virtual environment comes first.
  PATH: /opt/jupyterhub/bin:/usr/bin:/bin
  LANG: C.UTF-8

paths:
  - path: /srv/jupyterhub
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
  - path: /home/jovyan
    type: directory
    uid: 1000
    gid: 1000
    permissions: 0o755
