ignore:
  - vulnerability: GHSA-g857-hhfv-j68w
    package:
      name: zlib
      version: 1.3.2-r3
      type: apk
    reason: Advisory applies to RubyGems zlib, not Wolfi APK zlib.
  - vulnerability: CVE-2025-9624
    package:
      name: opensearch
      version: 2.19.7
      type: UnknownPackage
    reason: >-
      NVD records all OpenSearch before 3.3.0, but the fix was backported to 2.19.4
      (CVE text and GHSA-mw3v-mmfw-3x2g). Scoped to the scan-identity package
      declared by images/opensearch/2 (cpe amazon:opensearch) at 2.19.7.
  - vulnerability: CVE-2023-5341
    package:
      name: imagemagick
      version: 7.1.2-35
      type: UnknownPackage
    reason: >-
      NVD records ImageMagick before 7.1.2, and Grype orders 7.1.2-35 before 7.1.2 as a
      prerelease. The fix (coders/bmp.c, commit aa673b2e4defc7cad5bec16c4fc8324f71e531f1,
      referenced by the CVE) first shipped in 7.1.1-19 (upstream ChangeLog
      https://imagemagick.org/changelog/), and 7.1.2-35 contains it. Scoped to the
      scan-identity package declared by images/imagemagick (cpe imagemagick:imagemagick)
      at 7.1.2-35.
  - vulnerability: CVE-2014-9826
    package:
      name: imagemagick
      version: 7.1.2-35
      type: UnknownPackage
    reason: >-
      Wrong match: NVD's only configuration is cpe imagemagick:imagemagick:- with no version
      range, so Grype matches every version. The fix is ImageMagick-6 svn r17149 ("Fix error
      handling in sun file", the Debian patch 69490f5c cited by NVD), carried into ImageMagick 7
      as commit 76d045a787b16952e2111c248713e72de2f593da, an ancestor of 7.1.2-35 (first tag
      7.0.1-0). At the 7.1.2-35 tag coders/sun.c:323-326 throws CorruptImageError as fixed.
      Debian marks 8:7.1.2.35 fixed (https://security-tracker.debian.org/tracker/CVE-2014-9826).
      Scoped to the scan-identity package declared by images/imagemagick
      (cpe imagemagick:imagemagick) at 7.1.2-35.
  - vulnerability: CVE-2016-7538
    package:
      name: imagemagick
      version: 7.1.2-35
      type: UnknownPackage
    reason: >-
      Wrong match: NVD's only configuration is cpe imagemagick:imagemagick:- with no version
      range, so Grype matches every version. The fix (commit
      82e2049862a8b8a999e160734ad64fb6cc3b145f, referenced by the CVE, issue #148) is an
      ancestor of 7.1.2-35 (first tag 7.0.1-0). At the 7.1.2-35 tag
      RemoveICCProfileFromResourceBlock (coders/psd.c:3497-3552) bounds the memmove by the
      profile length. Debian marks 8:7.1.2.35 fixed
      (https://security-tracker.debian.org/tracker/CVE-2016-7538). Scoped to the scan-identity
      package declared by images/imagemagick (cpe imagemagick:imagemagick) at 7.1.2-35.
  - vulnerability: CVE-2017-5506
    package:
      name: imagemagick
      version: 7.1.2-35
      type: UnknownPackage
    reason: >-
      Wrong match: NVD's configuration is cpe imagemagick:imagemagick:* with no version range,
      so Grype matches every version. The fix (commit 9a069e0f2e027ec5138f998023cf9cb62c04889f,
      referenced by the CVE, issue #354) is an ancestor of 7.1.2-35 (first tag 7.0.4-4). At
      the 7.1.2-35 tag SyncExifProfile (MagickCore/profile.c:2542-2545) rejects offset < 0.
      Debian marks 8:7.1.2.35 fixed (https://security-tracker.debian.org/tracker/CVE-2017-5506).
      Scoped to the scan-identity package declared by images/imagemagick
      (cpe imagemagick:imagemagick) at 7.1.2-35.
  - vulnerability: CVE-2025-15366
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2025-15366.patch, upstream python/cpython commit
      71926d943c05bde79bd2a866933103541d91b6a2 (gh-143921, 3.13 branch, v3.13.15):
      imaplib now rejects NUL, CR and LF in commands. Scoped to the scan-identity
      package declared by images/python/3.12 (cpe python:python) at 3.12.16.
  - vulnerability: CVE-2025-15367
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2025-15367.patch, upstream python/cpython commit
      b234a2b67539f787e191d2ef19a7cbdce32874e7 (gh-143923, 3.15 branch, v3.15.0a6):
      poplib now rejects control characters in commands. Scoped to the scan-identity
      package declared by images/python/3.12 (cpe python:python) at 3.12.16.
  - vulnerability: CVE-2026-6019
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2026-6019.patch, upstream python/cpython commit
      3c59b8b53fc75c7f9578d16fb8201ceb43e8f76c (gh-90309, 3.13 branch, v3.13.14):
      Morsel.js_output() now base64-encodes the cookie. Scoped to the scan-identity
      package declared by images/python/3.12 (cpe python:python) at 3.12.16.
  - vulnerability: CVE-2026-3446
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2026-3446.patch, upstream python/cpython commit
      1f9958f909c1b41a4ffc0b613ef8ec8fa5e7c474 (gh-145264, 3.13 branch, v3.13.13): the
      Base64 decoder no longer drops data after the first padded quad. Scoped to the
      scan-identity package declared by images/python/3.12 (cpe python:python) at
      3.12.16.
  - vulnerability: CVE-2026-103995
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2026-103995-1.patch and CVE-2026-103995-2.patch, upstream python/cpython
      commit 2eb2af805c156ca52b316bb4ced5e0ab3971d0ae and
      9f52b443c002cccfb54bda0706a9276b6b4a109d (gh-150751, main only, no release yet):
      http.client now validates Content-Length and chunk-size against the RFC 9112
      grammar. Scoped to the scan-identity package declared by images/python/3.12 (cpe
      python:python) at 3.12.16.
  - vulnerability: CVE-2026-116566
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2026-116566.patch, upstream python/cpython commit
      131a3a66c5f400b588f9fd2732a5ed4e89623ee3 (gh-160898, main only, no release yet):
      socket.getaddrinfo() now rejects an embedded NUL in host and port. Scoped to the
      scan-identity package declared by images/python/3.12 (cpe python:python) at
      3.12.16.
  - vulnerability: CVE-2025-12781
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2025-12781.patch, upstream python/cpython commit
      1be80bec7960f5ccd059e75f3dfbd45fca302947 (gh-125346, 3.13 branch, v3.13.10):
      upstream fixed the stable branches with tests only, so b64decode() in 3.12.16
      already equals the fixed releases and the patch adds those tests. Scoped to the
      scan-identity package declared by images/python/3.12 (cpe python:python) at
      3.12.16.
  - vulnerability: CVE-2026-3479
    package:
      name: python
      version: 3.12.16
      type: UnknownPackage
    reason: >-
      NVD lists no fixed 3.12 release. The images/python/3.12 build applies
      CVE-2026-3479.patch, upstream python/cpython commit
      5af6ce3e7b643a30a02d22245c1e3f4a8bc0a1fe (gh-146121, 3.13 branch, v3.13.13):
      upstream resolved it by documenting the get_data() security model and reverted
      the code check, so the fixed releases change only Doc/library/pkgutil.rst, which
      the patch carries; pkgutil.py in 3.12.16 equals the fixed releases. Scoped to
      the scan-identity package declared by images/python/3.12 (cpe python:python) at
      3.12.16.
  - vulnerability: CVE-2022-38725
    package:
      name: syslog-ng
      version: 4.12.0
      type: UnknownPackage
    reason: >-
      NVD's fix version 7.0.32 is syslog-ng Premium Edition numbering. The CVE text
      limits the open source edition to 3.0 through 3.37, and the fix shipped in
      3.38.1 (GHSA-7932-4fc6-pvmc), so 4.12.0 is not affected. Scoped to the
      scan-identity package declared by images/syslog-ng (cpe oneidentity:syslog-ng,
      balabit:syslog-ng) at 4.12.0.
