package:
  name: gosu
  version: "1.19"
  epoch: 2
  description: Deterministic gosu build with patched golang.org/x/sys and github.com/moby/sys/user
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: Apache-2.0

vars:
  source-commit: 6456aaa0f3c854d199d0f037f068eb97515b7513
  go-version: go1.27.2
  x-sys-version: v0.44.0  # renovate: datasource=go depName=golang.org/x/sys
  moby-sys-user-version: v0.4.1  # renovate: datasource=go depName=github.com/moby/sys/user

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - wget

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/tianon/gosu/archive/${{vars.source-commit}}.tar.gz
      expected-sha256: 33d7537d588ea49458b9509bcf4554bdf5ceacc66da71e5caa1058ea3b689c3b
  - runs: |
      # The upstream Go release archive is pinned so the output stays byte-identical
      # to the reference build. Distribution toolchains of the same Go version embed
      # different build settings and produce different bytes.
      case "${{build.arch}}" in
        x86_64)
          toolchain=${{vars.go-version}}.linux-amd64.tar.gz
          toolchain_sha256=ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5
          expected=b0b82bb02e5d240534facd299ef1124ec0f220253e05ba4e1b7abfadc2d60d7a
          ;;
        aarch64)
          toolchain=${{vars.go-version}}.linux-arm64.tar.gz
          toolchain_sha256=94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8
          expected=4001b2743924e7dc43e68685712ab87899b065faaa76b961516a0f87db3c5ba1
          ;;
        *) exit 1 ;;
      esac
      wget -q -O "/tmp/$toolchain" "https://go.dev/dl/$toolchain"
      printf '%s  /tmp/%s\n' "$toolchain_sha256" "$toolchain" | sha256sum -c -
      tar -xzf "/tmp/$toolchain" -C /tmp
      export PATH=/tmp/go/bin:$PATH CGO_ENABLED=0 GOOS=linux GOTOOLCHAIN=local
      [ "$(go version | cut -d' ' -f3)" = "${{vars.go-version}}" ]
      [ "$(awk -F '"' '/^const Version = "/ { print $2 }' version.go)" = "${{package.version}}" ]
      go mod edit -require="golang.org/x/sys@${{vars.x-sys-version}}"
      go mod edit -require="github.com/moby/sys/user@${{vars.moby-sys-user-version}}"
      go mod tidy
      go build -mod=readonly -trimpath -buildvcs=false -ldflags '-d -w' -o gosu .
      printf '%s  gosu\n' "$expected" | sha256sum -c -
      install -m755 -D gosu "${{targets.destdir}}/usr/bin/gosu"
