package:
  name: openssl-fips-provider
  version: "3.1.2"
  epoch: 0
  description: OpenSSL FIPS provider build from certificate 4985 source inputs
  target-architecture:
    - x86_64
    - aarch64
  dependencies:
    runtime:
      - openssl
  copyright:
    - license: Apache-2.0

vars:
  source-commit: 17a2c5111864d8e016c5f2d29c40a3746b559e9d
  certificate: "4985"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://www.openssl.org/source/old/3.1/openssl-${{package.version}}.tar.gz
      expected-sha256: a0ce69b8b97ea6a35b96875235aa453b966ba3cba8af2de23657d8b6767d6539
  - runs: |
      ./Configure enable-fips
      make -j$(nproc)
      install -m755 -D providers/fips.so \
        "${{targets.destdir}}/usr/lib/ossl-modules/fips.so"
      install -m644 -D openssl-fips.cnf \
        "${{targets.destdir}}/etc/ssl/openssl-fips.cnf"
      ./util/wrap.pl apps/openssl fipsinstall \
        -module "${{targets.destdir}}/usr/lib/ossl-modules/fips.so" \
        -out "${{targets.destdir}}/etc/ssl/fipsmodule.cnf" \
        -pedantic -self_test_onload
      sed -i 's|^module = .*|module = /usr/lib/ossl-modules/fips.so|' \
        "${{targets.destdir}}/etc/ssl/fipsmodule.cnf"
      grep -q '^module-mac = .' "${{targets.destdir}}/etc/ssl/fipsmodule.cnf"
      ! grep -Eq '^install-(status|mac) =' "${{targets.destdir}}/etc/ssl/fipsmodule.cnf"
