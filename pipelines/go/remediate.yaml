name: Resolve Go vulnerabilities

needs:
  packages:
    - omnibump

inputs:
  modroot:
    description: Go module root relative to the checked-out source
    default: server
  packages:
    description: Space-separated application package patterns to scan and validate
    default: ./...

pipeline:
  - runs: |
      set -eu
      workspace=$(pwd -P)
      root=$(realpath "${{inputs.modroot}}")
      case "$root/" in
        "$workspace/"*) ;;
        *) printf 'error: module root escapes workspace: %s\n' "$root" >&2; exit 1 ;;
      esac
      packages='${{inputs.packages}}'
      set -f
      set -- $packages
      [ "$#" -gt 0 ] || { printf 'error: no Go package patterns configured\n' >&2; exit 1; }
      tool_dir=$(mktemp -d)
      trap 'rm -rf "$tool_dir"' EXIT
      GOBIN="$tool_dir" GOTOOLCHAIN=local GOWORK=off \
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      cat >"$tool_dir/remediate.py" <<'PYTHON'
      import json
      import os
      import re
      import selectors
      import shlex
      import subprocess
      import sys
      import tempfile
      from pathlib import Path

      TOOL_VERSION = "v1.7.0"
      PROTOCOL_VERSION = "v1.0.0"
      RESULT_EXIT_CODES = {0, 3}
      MESSAGE_TYPES = {"config", "progress", "SBOM", "osv", "finding"}
      MAX_OUTPUT_BYTES = 32 * 1024 * 1024
      MAX_REMEDIATION_PASSES = 8
      MODULE = re.compile(r"^(?=.{1,255}$)[A-Za-z0-9][A-Za-z0-9._~-]*(?:/[A-Za-z0-9._~+-]+)+$")
      VERSION = re.compile(
          r"^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          r"(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
      )

      class RemediationError(ValueError):
          pass

      def version_key(value):
          match = VERSION.fullmatch(value)
          if match is None:
              raise RemediationError(f"invalid module version: {value!r}")
          prerelease = match.group(4)
          identifiers = (
              tuple((0, f"{int(part):020d}") if part.isdecimal() else (1, part) for part in prerelease.split("."))
              if prerelease else ()
          )
          return int(match.group(1)), int(match.group(2)), int(match.group(3)), 0 if prerelease else 1, identifiers

      def compatible(module, version):
          if MODULE.fullmatch(module) is None:
              return False
          major = version_key(version)[0]
          suffix = re.search(r"/v([0-9]+)$", module)
          if module.startswith("gopkg.in/"):
              suffix = re.search(r"\.v([0-9]+)$", module)
              if suffix is None:
                  return False
          # Legacy module paths may use v2+ with +incompatible. Omnibump
          # canonicalizes an unsuffixed candidate before applying it.
          return suffix is None or int(suffix.group(1)) == major

      def parse_stream(raw):
          decoder = json.JSONDecoder()
          messages = []
          offset = 0
          while offset < len(raw):
              while offset < len(raw) and raw[offset].isspace():
                  offset += 1
              if offset == len(raw):
                  break
              try:
                  value, offset = decoder.raw_decode(raw, offset)
              except json.JSONDecodeError as error:
                  raise RemediationError(f"malformed govulncheck JSON: {error}") from error
              if (
                  not isinstance(value, dict)
                  or len(value) != 1
                  or next(iter(value)) not in MESSAGE_TYPES
                  or not isinstance(next(iter(value.values())), dict)
                  or ("config" in value and messages)
              ):
                  raise RemediationError("invalid govulncheck message")
              messages.append(value)
          if not messages:
              raise RemediationError("empty govulncheck output")
          config = messages[0].get("config")
          if not isinstance(config, dict):
              raise RemediationError("govulncheck output must begin with config")
          if config.get("protocol_version") != PROTOCOL_VERSION or config.get("scanner_name") != "govulncheck":
              raise RemediationError("unsupported govulncheck protocol")
          if config.get("scanner_version") != TOOL_VERSION:
              raise RemediationError("unexpected govulncheck version")
          return messages

      def scan(binary, root, packages, workspace=None):
          environment = dict(os.environ, GOTOOLCHAIN="local", GOWORK=str(workspace) if workspace else "off")
          environment.setdefault("GOVULNDB", "https://vuln.go.dev")
          with subprocess.Popen(
              [str(binary), "-json", *packages], cwd=root, env=environment,
              stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ) as process:
              if process.stdout is None or process.stderr is None:
                  raise RemediationError("failed to capture govulncheck output")
              streams = {process.stdout: ("stdout", bytearray()), process.stderr: ("stderr", bytearray())}
              selector = selectors.DefaultSelector()
              try:
                  for stream in streams:
                      selector.register(stream, selectors.EVENT_READ)
                  while selector.get_map():
                      for key, _ in selector.select():
                          stream = key.fileobj
                          chunk = os.read(stream.fileno(), 64 * 1024)
                          if not chunk:
                              selector.unregister(stream)
                              continue
                          name, buffer = streams[stream]
                          buffer.extend(chunk)
                          if len(buffer) > MAX_OUTPUT_BYTES:
                              process.kill()
                              raise RemediationError(f"govulncheck {name} exceeds 32 MiB")
              finally:
                  selector.close()
                  if process.poll() is None:
                      process.kill()
              returncode = process.wait()
              stdout = bytes(streams[process.stdout][1])
              stderr = bytes(streams[process.stderr][1]).decode(errors="replace").strip()
          if returncode not in RESULT_EXIT_CODES:
              raise RemediationError(f"unexpected govulncheck exit status {returncode}: {stderr or 'no stderr'}")
          try:
              messages = parse_stream(stdout.decode())
          except UnicodeDecodeError as error:
              raise RemediationError("malformed govulncheck UTF-8 output") from error
          if returncode == 3 and not any("finding" in message for message in messages):
              raise RemediationError("govulncheck findings exit contains no findings")
          return messages

      def minimum_fix(entry, module, current):
          candidates = []
          affected = entry.get("affected")
          if not isinstance(affected, list):
              raise RemediationError("invalid OSV affected records")
          for record in affected:
              if not isinstance(record, dict):
                  raise RemediationError("invalid OSV affected record")
              package = record.get("package")
              if not isinstance(package, dict) or not isinstance(package.get("name"), str):
                  raise RemediationError("invalid OSV package")
              if package["name"] != module:
                  continue
              ranges = record.get("ranges", [])
              if not isinstance(ranges, list):
                  raise RemediationError("invalid OSV ranges")
              for interval in ranges:
                  if not isinstance(interval, dict):
                      raise RemediationError("invalid OSV range")
                  if interval.get("type") != "SEMVER":
                      continue
                  events = interval.get("events")
                  if not isinstance(events, list):
                      raise RemediationError("invalid OSV events")
                  active = False
                  for event in events:
                      if not isinstance(event, dict):
                          raise RemediationError("invalid OSV event")
                      if "introduced" in event:
                          introduced = event["introduced"]
                          if not isinstance(introduced, str):
                              raise RemediationError("invalid introduced version")
                          active = introduced == "0" or (
                              version_key("v" + introduced.removeprefix("v")) <= version_key(current)
                          )
                      elif "fixed" in event:
                          fixed = event["fixed"]
                          if not isinstance(fixed, str):
                              raise RemediationError("invalid fixed version")
                          candidate = "v" + fixed.removeprefix("v")
                          if active and version_key(current) < version_key(candidate):
                              candidates.append(candidate)
                          active = False
                      else:
                          raise RemediationError("OSV event has no boundary")
          compatible_fixes = [candidate for candidate in candidates if compatible(module, candidate)]
          if compatible_fixes:
              return min(compatible_fixes, key=version_key), ""
          return "", "no-compatible-fix" if candidates else "no-fix"

      def run_go(arguments, cwd, capture=False, workspace=None, report=False):
          command = shlex.join(arguments)
          print("+ " + command, flush=True)
          environment = dict(os.environ, GOTOOLCHAIN="local", GOWORK=str(workspace) if workspace else "off")
          completed = subprocess.run(arguments, cwd=cwd, env=environment, check=False, text=True, capture_output=True)
          if completed.returncode:
              detail = completed.stderr.strip() or completed.stdout.strip() or "no output"
              raise RemediationError(f"command failed ({completed.returncode}): {command}: {detail}")
          if report:
              print(completed.stdout, end="", flush=True)
              print(completed.stderr, end="", file=sys.stderr, flush=True)
          return completed.stdout if capture else ""


      def language_directives(path):
          directives = {}
          for line in path.read_text(encoding="utf-8").splitlines():
              fields = line.split("//", 1)[0].split()
              if fields and fields[0] in {"go", "toolchain"}:
                  if len(fields) != 2 or fields[0] in directives:
                      raise RemediationError(f"invalid {path.name} directives")
                  directives[fields[0]] = line
          return directives


      def restore_language_directives(path, directives):
          content = path.read_text(encoding="utf-8")
          lines = content.splitlines()
          for name in ("go", "toolchain"):
              matches = [index for index, line in enumerate(lines) if line.split()[:1] == [name]]
              if matches:
                  if name in directives:
                      lines[matches[0]] = directives[name]
                      for index in reversed(matches[1:]):
                          del lines[index]
                  else:
                      for index in reversed(matches):
                          del lines[index]
              elif name in directives:
                  anchor = "go" if name == "toolchain" else "module"
                  index = next((index for index, line in enumerate(lines) if line.split()[:1] == [anchor]), -1)
                  lines.insert(index + 1, directives[name])
          path.write_text("\n".join(lines) + ("\n" if content.endswith("\n") else ""), encoding="utf-8")

      def selected_modules(root, workspace=None):
          return {
              fields[0]: fields[1]
              for line in run_go(
                  ["go", "list", "-mod=readonly", "-m", "-f", "{{.Path}} {{.Version}}", "all"],
                  root,
                  capture=True,
                  workspace=workspace,
              ).splitlines()
              if len(fields := line.split()) == 2
          }


      def derive_fixes(messages, selected):
          osvs = {}
          findings = []
          for message in messages[1:]:
              if "osv" in message:
                  entry = message["osv"]
                  if not isinstance(entry.get("id"), str):
                      raise RemediationError("invalid OSV record")
                  osvs[entry["id"]] = entry
              elif "finding" in message:
                  findings.append(message["finding"])
          updates = {}
          unresolved = set()
          detected = set()
          fixable = set()
          for finding in findings:
              osv_id = finding.get("osv")
              trace = finding.get("trace")
              if not isinstance(osv_id, str) or osv_id not in osvs or not isinstance(trace, list) or not trace:
                  raise RemediationError("finding cannot be correlated with OSV data")
              frame = trace[0]
              if not isinstance(frame, dict) or not isinstance(frame.get("module"), str):
                  raise RemediationError("finding lacks module identity")
              module = frame["module"]
              detected.add((osv_id, module))
              current = selected.get(module)
              if current is None or not compatible(module, current):
                  unresolved.add((osv_id, module, current or "unknown", "no-compatible-fix"))
                  continue
              fixed, reason = minimum_fix(osvs[osv_id], module, current)
              if not fixed:
                  unresolved.add((osv_id, module, current, reason))
                  continue
              fixable.add((osv_id, module))
              previous = updates.get(module)
              if previous is None or version_key(previous) < version_key(fixed):
                  updates[module] = fixed
          return updates, sorted(unresolved), detected, fixable

      def reconcile(workspace_root, root, packages, workspace):
          module_vendor = root.joinpath("vendor").is_dir()
          workspace_vendor = workspace_root.joinpath("vendor").is_dir() if workspace else False
          run_go(["go", "mod", "tidy"], root, workspace=workspace)
          if workspace:
              run_go(["go", "work", "sync"], workspace_root, workspace=workspace)
          if module_vendor:
              run_go(["go", "mod", "vendor"], root)
          if workspace_vendor:
              run_go(["go", "work", "vendor"], workspace_root, workspace=workspace)
          mode = "vendor" if workspace_vendor or (module_vendor and workspace is None) else "readonly"
          run_go(["go", "list", "-deps", f"-mod={mode}", *packages], root, workspace=workspace)
          with tempfile.TemporaryDirectory(prefix="go-remediate-build-") as output:
              run_go(["go", "build", f"-mod={mode}", "-o", output + "/", *packages], root, workspace=workspace)

      def main():
          binary, workspace_arg, root_arg, *packages = sys.argv[1:]
          workspace_root = Path(workspace_arg).resolve()
          root = Path(root_arg).resolve()
          if not packages or any(not package or package.startswith("-") for package in packages):
              raise RemediationError("invalid Go package patterns")
          try:
              root.relative_to(workspace_root)
          except ValueError as error:
              raise RemediationError("module root escapes workspace") from error
          workspace = workspace_root / "go.work" if workspace_root.joinpath("go.work").is_file() else None
          if workspace and root == workspace_root:
              raise RemediationError("module root cannot be the workspace root")
          messages = scan(Path(binary), root, packages, workspace)
          remediated = set()
          passes = 0
          reconciled = False
          while True:
              selected = selected_modules(root, workspace)
              updates, unresolved, detected, fixable = derive_fixes(messages, selected)
              persisted = remediated & detected
              if persisted:
                  details = " ".join(f"{osv_id}:{module}" for osv_id, module in sorted(persisted))
                  raise RemediationError(f"compatible vulnerability fixes remain after remediation: {details}")
              requested = [
                  (module, fixed)
                  for module, fixed in sorted(updates.items())
                  if version_key(selected[module]) < version_key(fixed)
              ]
              if not requested:
                  if not reconciled:
                      reconcile(workspace_root, root, packages, workspace)
                      reconciled = True
                      messages = scan(Path(binary), root, packages, workspace)
                      continue
                  for osv_id, module, current, reason in unresolved:
                      print(f"go remediation: continuing with {osv_id} in {module}@{current} ({reason})", flush=True)
                  return
              details = " ".join(f"{module}@{fixed}" for module, fixed in requested)
              if passes >= MAX_REMEDIATION_PASSES:
                  raise RemediationError(
                      f"go remediation pass limit reached after {MAX_REMEDIATION_PASSES} passes: {details}"
                  )
              module_directives = language_directives(root / "go.mod")
              workspace_directives = language_directives(workspace) if workspace else None
              print("go remediation: applying " + details, flush=True)
              try:
                  run_go(
                      [
                          "omnibump", "--language", "go", "--dir", str(root),
                          "--packages", details, "--tidy=false",
                      ],
                      root,
                      workspace=workspace,
                      report=True,
                  )
              finally:
                  restore_language_directives(root / "go.mod", module_directives)
                  if workspace_directives is not None:
                      restore_language_directives(workspace, workspace_directives)
              reconcile(workspace_root, root, packages, workspace)
              reconciled = True
              passes += 1
              remediated.update(fixable)
              if selected_modules(root, workspace) == selected:
                  raise RemediationError(f"go remediation pass made no module graph progress: {details}")
              messages = scan(Path(binary), root, packages, workspace)

      if __name__ == "__main__":
          try:
              main()
          except (OSError, RemediationError) as error:
              print(f"error: {error}", file=sys.stderr)
              raise SystemExit(1)
      PYTHON
      python3 "$tool_dir/remediate.py" "$tool_dir/govulncheck" "$workspace" "$root" "$@"
