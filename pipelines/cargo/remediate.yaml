name: Resolve Rust vulnerabilities

needs:
  packages:
    - omnibump
    - python3

inputs:
  crateroot:
    description: Cargo project root relative to the checked-out source
    default: .
  features:
    description: Space-separated Cargo features mirroring the build feature selection
    default: ""

pipeline:
  - runs: |
      set -eu
      workspace=$(pwd -P)
      root=$(realpath "${{inputs.crateroot}}")
      case "$root/" in
        "$workspace/"*) ;;
        *) printf 'error: cargo root escapes workspace: %s\n' "$root" >&2; exit 1 ;;
      esac
      tool_dir=$(mktemp -d)
      trap 'rm -rf "$tool_dir"' EXIT
      (cd "$tool_dir" && cargo install cargo-audit --version 0.22.2 --locked --root "$tool_dir")
      cat >"$tool_dir/remediate.py" <<'PYTHON'
      import json
      import os
      import re
      import selectors
      import shlex
      import subprocess
      import sys
      import tomllib
      from pathlib import Path

      TOOL_NAME = "cargo-audit"
      TOOL_VERSION = "0.22.2"
      RESULT_EXIT_CODES = {0, 1}
      MAX_OUTPUT_BYTES = 32 * 1024 * 1024
      MAX_REMEDIATION_PASSES = 8
      LOWER_BOUNDS = frozenset({">=", "^", "~", "=", "==", ""})
      CRATE = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$")
      VERSION = re.compile(
          r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          r"(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
      )
      PARTIAL = re.compile(
          r"^(0|[1-9][0-9]*)(?:\.(0|[1-9][0-9]*))?(?:\.(0|[1-9][0-9]*))?"
          r"(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$"
      )
      COMPARATOR = re.compile(r"^(?P<operator>>=|<=|==|=|>|<|\^|~)?\s*(?P<version>[0-9][0-9A-Za-z.+-]*)$")

      class RemediationError(ValueError):
          pass

      def version_key(value):
          match = VERSION.fullmatch(value)
          if match is None:
              raise RemediationError(f"invalid crate version: {value!r}")
          prerelease = match.group(4)
          identifiers = (
              tuple(
                  (0, f"{int(part):020d}") if part.isdecimal() else (1, part)
                  for part in prerelease.split(".")
              )
              if prerelease else ()
          )
          return int(match.group(1)), int(match.group(2)), int(match.group(3)), 0 if prerelease else 1, identifiers

      def bound_version(value):
          match = PARTIAL.fullmatch(value)
          if match is None:
              raise RemediationError(f"unsupported version bound: {value!r}")
          major, minor, patch, prerelease = match.groups()
          exact = f"{major}.{minor or 0}.{patch or 0}"
          return f"{exact}-{prerelease}" if prerelease else exact

      def requirement_floor(requirement):
          """Lowest exact version satisfying a requirement, and whether it is nameable."""
          if not isinstance(requirement, str) or not requirement.strip():
              raise RemediationError(f"invalid version requirement: {requirement!r}")
          floors = []
          exclusive = []
          uppers = []
          for raw in requirement.split(","):
              match = COMPARATOR.fullmatch(raw.strip())
              if match is None:
                  raise RemediationError(f"unsupported version requirement: {requirement!r}")
              operator = match.group("operator") or ""
              version = bound_version(match.group("version"))
              if operator in LOWER_BOUNDS:
                  floors.append(version)
              elif operator == ">":
                  exclusive.append(version)
              else:
                  uppers.append((operator, version))
          floor = max(floors, key=version_key) if floors else ""
          if exclusive and (not floor or version_key(floor) <= max(map(version_key, exclusive))):
              # A strict lower bound names no release, so no exact candidate exists.
              return "", False
          if not floor or any(
              version_key(floor) >= version_key(bound) if operator == "<" else version_key(floor) > version_key(bound)
              for operator, bound in uppers
          ):
              return "", True
          return floor, True

      def minimum_fix(entry, current):
          versions = entry.get("versions")
          if not isinstance(versions, dict):
              raise RemediationError("invalid cargo-audit version record")
          candidates = []
          nameable = True
          for field in ("patched", "unaffected"):
              requirements = versions.get(field, [])
              if not isinstance(requirements, list):
                  raise RemediationError(f"invalid cargo-audit {field} requirements")
              for requirement in requirements:
                  floor, resolvable = requirement_floor(requirement)
                  if not resolvable:
                      nameable = False
                  elif floor and version_key(current) < version_key(floor):
                      candidates.append(floor)
          if candidates:
              return min(candidates, key=version_key), ""
          return "", "no-fix" if nameable else "unnameable-fix"

      def parse_report(raw):
          try:
              report = json.loads(raw)
          except json.JSONDecodeError as error:
              raise RemediationError(f"malformed cargo-audit JSON: {error}") from error
          if not isinstance(report, dict):
              raise RemediationError("cargo-audit report must be an object")
          vulnerabilities = report.get("vulnerabilities")
          if not isinstance(vulnerabilities, dict):
              raise RemediationError("cargo-audit report has no vulnerabilities section")
          found = vulnerabilities.get("found")
          count = vulnerabilities.get("count")
          entries = vulnerabilities.get("list")
          if (
              not isinstance(found, bool)
              or not isinstance(count, int)
              or isinstance(count, bool)
              or not isinstance(entries, list)
              or count != len(entries)
              or found != bool(entries)
          ):
              raise RemediationError("invalid cargo-audit vulnerability summary")
          if not isinstance(report.get("warnings", {}), dict):
              raise RemediationError("invalid cargo-audit warnings")
          return report

      def read_stream(process):
          streams = {process.stdout: ("stdout", bytearray()), process.stderr: ("stderr", bytearray())}
          selector = selectors.DefaultSelector()
          try:
              for stream in streams:
                  selector.register(stream, selectors.EVENT_READ)
              while selector.get_map():
                  for key, _ in selector.select():
                      stream = key.fileobj
                      chunk = os.read(stream.fileno(), 64 * 1024)
                      if not chunk:
                          selector.unregister(stream)
                          continue
                      name, buffer = streams[stream]
                      buffer.extend(chunk)
                      if len(buffer) > MAX_OUTPUT_BYTES:
                          process.kill()
                          raise RemediationError(f"cargo-audit {name} exceeds 32 MiB")
          finally:
              selector.close()
              if process.poll() is None:
                  process.kill()
          return bytes(streams[process.stdout][1]), bytes(streams[process.stderr][1])

      def scan(binary, root, lockfile):
          with subprocess.Popen(
              [str(binary), "audit", "--json", "--color", "never", "--file", str(lockfile)],
              cwd=root, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          ) as process:
              if process.stdout is None or process.stderr is None:
                  raise RemediationError("failed to capture cargo-audit output")
              stdout, raw_stderr = read_stream(process)
              returncode = process.wait()
              stderr = raw_stderr.decode(errors="replace").strip()
          if returncode not in RESULT_EXIT_CODES:
              raise RemediationError(f"unexpected cargo-audit exit status {returncode}: {stderr or 'no stderr'}")
          try:
              report = parse_report(stdout.decode())
          except UnicodeDecodeError as error:
              raise RemediationError("malformed cargo-audit UTF-8 output") from error
          if bool(report["vulnerabilities"]["list"]) != (returncode == 1):
              raise RemediationError(f"cargo-audit exit status {returncode} contradicts its vulnerability list")
          return report

      def report_diagnostics(report):
          for kind, entries in sorted(report.get("warnings", {}).items()):
              if not isinstance(entries, list):
                  raise RemediationError("invalid cargo-audit warnings")
              for entry in entries:
                  package = entry.get("package") if isinstance(entry, dict) else None
                  if not isinstance(package, dict):
                      raise RemediationError("invalid cargo-audit warning record")
                  advisory = entry.get("advisory")
                  identifier = advisory.get("id") if isinstance(advisory, dict) else kind
                  print(
                      f"cargo remediation: diagnostic {kind} {identifier} in "
                      f"{package.get('name')}@{package.get('version')}",
                      flush=True,
                  )

      def derive_fixes(report, locked):
          updates = {}
          unresolved = set()
          detected = set()
          fixable = set()
          for entry in report["vulnerabilities"]["list"]:
              advisory = entry.get("advisory") if isinstance(entry, dict) else None
              package = entry.get("package") if isinstance(entry, dict) else None
              if not isinstance(advisory, dict) or not isinstance(package, dict):
                  raise RemediationError("invalid cargo-audit vulnerability record")
              identifier = advisory.get("id")
              crate = package.get("name")
              current = package.get("version")
              if not isinstance(identifier, str) or not identifier:
                  raise RemediationError("cargo-audit finding has no advisory id")
              if not isinstance(crate, str) or CRATE.fullmatch(crate) is None:
                  raise RemediationError(f"invalid crate name: {crate!r}")
              if not isinstance(current, str):
                  raise RemediationError(f"invalid crate version: {current!r}")
              if current not in locked.get(crate, ()):
                  raise RemediationError(f"cargo-audit reported {crate}@{current}, which Cargo.lock does not lock")
              detected.add((identifier, crate, current))
              fixed, reason = minimum_fix(entry, current)
              if reason == "unnameable-fix":
                  raise RemediationError(
                      f"cannot derive an exact patched version for {identifier} in {crate}@{current}"
                  )
              if not fixed:
                  unresolved.add((identifier, crate, current, reason))
                  continue
              fixable.add((identifier, crate, current))
              previous = updates.get(crate)
              if previous is None or version_key(previous) < version_key(fixed):
                  updates[crate] = fixed
          return updates, sorted(unresolved), detected, fixable

      def locked_versions(lockfile):
          try:
              document = tomllib.loads(lockfile.read_text(encoding="utf-8"))
          except (tomllib.TOMLDecodeError, UnicodeDecodeError) as error:
              raise RemediationError(f"malformed Cargo.lock: {error}") from error
          packages = document.get("package")
          if not isinstance(packages, list) or not packages:
              raise RemediationError("Cargo.lock locks no packages")
          locked = {}
          for entry in packages:
              if not isinstance(entry, dict):
                  raise RemediationError("invalid Cargo.lock package record")
              crate = entry.get("name")
              version = entry.get("version")
              if not isinstance(crate, str) or CRATE.fullmatch(crate) is None:
                  raise RemediationError(f"invalid locked crate name: {crate!r}")
              if not isinstance(version, str) or VERSION.fullmatch(version) is None:
                  raise RemediationError(f"invalid locked crate version: {version!r}")
              locked.setdefault(crate, set()).add(version)
          return {crate: tuple(sorted(versions, key=version_key)) for crate, versions in locked.items()}

      def reject_downgrades(before, after):
          downgraded = sorted(
              f"{crate}@{max(versions, key=version_key)}->{max(after[crate], key=version_key)}"
              for crate, versions in before.items()
              if crate in after
              and version_key(max(after[crate], key=version_key)) < version_key(max(versions, key=version_key))
          )
          if downgraded:
              raise RemediationError("cargo remediation downgraded locked crates: " + " ".join(downgraded))

      def run_command(arguments, cwd, capture=False, report=False):
          command = shlex.join(arguments)
          print("+ " + command, flush=True)
          completed = subprocess.run(arguments, cwd=cwd, check=False, text=True, capture_output=True)
          if completed.returncode:
              detail = completed.stderr.strip() or completed.stdout.strip() or "no output"
              raise RemediationError(f"command failed ({completed.returncode}): {command}: {detail}")
          if report:
              print(completed.stdout, end="", flush=True)
              print(completed.stderr, end="", file=sys.stderr, flush=True)
          return completed.stdout if capture else ""

      def verify_tool(binary):
          reported = run_command([str(binary), "--version"], None, capture=True).strip()
          if reported != f"{TOOL_NAME} {TOOL_VERSION}":
              raise RemediationError(f"unexpected cargo-audit version: {reported!r}")

      def verify(root):
          run_command(["cargo", "metadata", "--locked", "--format-version", "1"], root)
          run_command(["cargo", "fetch", "--locked"], root)

      def main():
          if len(sys.argv) != 4:
              raise RemediationError("usage: remediate.py CARGO_AUDIT CRATE_ROOT FEATURES")
          binary, root_argument, features_argument = sys.argv[1:]
          root = Path(root_argument).resolve()
          lockfile = root / "Cargo.lock"
          if not lockfile.is_file():
              raise RemediationError(f"no Cargo.lock in {root}")
          features = features_argument.split()
          verify_tool(binary)
          report = scan(binary, root, lockfile)
          remediated = set()
          passes = 0
          while True:
              report_diagnostics(report)
              locked = locked_versions(lockfile)
              updates, unresolved, detected, fixable = derive_fixes(report, locked)
              persisted = remediated & detected
              if persisted:
                  details = " ".join(
                      f"{identifier}:{crate}@{version}" for identifier, crate, version in sorted(persisted)
                  )
                  raise RemediationError(f"vulnerable crate versions remain after remediation: {details}")
              requested = [
                  (crate, fixed)
                  for crate, fixed in sorted(updates.items())
                  if any(version_key(version) < version_key(fixed) for version in locked[crate])
              ]
              if not requested:
                  for identifier, crate, version, reason in unresolved:
                      print(
                          f"cargo remediation: continuing with {identifier} in {crate}@{version} ({reason})",
                          flush=True,
                      )
                  verify(root)
                  return
              details = " ".join(f"{crate}@{fixed}" for crate, fixed in requested)
              if passes >= MAX_REMEDIATION_PASSES:
                  raise RemediationError(
                      f"cargo remediation pass limit reached after {MAX_REMEDIATION_PASSES} passes: {details}"
                  )
              print("cargo remediation: applying " + details, flush=True)
              arguments = [
                  "omnibump", "--language", "rust", "--dir", str(root),
                  "--packages", details, "--fail-on-unapplied-pins",
              ]
              if features:
                  arguments += ["--features", ",".join(features)]
              run_command(arguments, root, report=True)
              passes += 1
              remediated.update(fixable)
              updated = locked_versions(lockfile)
              reject_downgrades(locked, updated)
              if updated == locked:
                  raise RemediationError(f"cargo remediation pass made no lock graph progress: {details}")
              report = scan(binary, root, lockfile)

      if __name__ == "__main__":
          try:
              main()
          except (OSError, RemediationError) as error:
              print(f"error: {error}", file=sys.stderr)
              raise SystemExit(1)
      PYTHON
      python3 "$tool_dir/remediate.py" "$tool_dir/bin/cargo-audit" "$root" "${{inputs.features}}"
